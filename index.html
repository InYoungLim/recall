ky와 Thomas가 제시한 5개 접근 차원에 속하는 개념이므로, 이름이 비슷하여도 Gumas 브리프의 구성요소에는 포함되지 않습니다.", "concept": "p_gumas_components", "source": "228 Gumas, 2절 서론; 107 Access 1, 2절 나항"}, {"id": "p4w-02", "course": "pubh510", "week": "4w", "topic": "Continuity of care and why US duration is short", "importance": 3, "why": "미국 연속성 C등급의 원인", "type": "mc", "q": "In the Gumas et al. comparison, only 43% of US adults had kept the same regular doctor for five or more years, compared with 76% in the Netherlands. According to the lecture, what mainly explains the low US figure?", "options": ["Americans move house far more often than Europeans do", "Insurance is tied to employment, so a job change changes the plan and often forces a change of doctor", "US primary care physicians refuse to keep patients for long periods", "US patients are not allowed to choose their own regular doctor"], "answer": 1, "explain": "강의에서는 미국인이 유럽인보다 더 자주 이사하지는 않는다고 하면서, 실제 원인은 고용에 연계된 보험이 직장을 옮길 때 바뀌고 보험사가 모든 의사와 계약하지는 않는다는 점이라고 설명합니다. 이 때문에 미국의 진료 연속성(continuity) 수치가 낮고, 강의에서는 미국에 C등급을 부여하였습니다. 이사 때문이라는 보기는 그럴듯하지만 강의에서 명시적으로 부정한 설명입니다.", "concept": "p_gumas_components", "source": "228 Gumas, 4절 나항; 107 Access 1, 4절 나항"}, {"id": "p4w-03", "course": "pubh510", "week": "4w", "topic": "Social needs screening versus referral", "importance": 3, "why": "선별은 앞서나 의뢰는 어려움", "type": "mc", "q": "Gumas et al. found that US and German physicians were the most likely to screen patients for social needs such as housing and food insecurity (about one third). Which statement about what happens after screening is supported by the reading?", "options": ["US physicians were the most successful at referring patients and tracking the outcome of referrals", "Referral problems appeared only in countries with weak screening", "Screening was rarest in the US, so few US patients reached social services", "In every country surveyed, more than half of physicians had difficulty coordinating patients' care with social services"], "answer": 3, "explain": "사회적 필요의 선별에서는 미국과 독일이 앞서지만, 모든 나라에서 절반을 초과하는 의사가 환자 진료를 사회서비스와 연결하는 데 어려움을 겪는다고 답하였습니다. 사회서비스 기관이 임상 네트워크 밖에 있고 의뢰에 회신도 하지 않기 때문입니다. 그래서 강의에서는 미국에 선별 B+, 의뢰 B의 등급을 부여하여 두 단계를 구분합니다.", "concept": "p_gumas_components", "source": "228 Gumas, 4절 다항; 107 Access 1, 4절 라항"}, {"id": "p4w-04", "course": "pubh510", "week": "4w", "topic": "Home visits in the US", "importance": 2, "why": "왕진은 미국이 가장 낮음", "type": "tf", "q": "True or False: In Gumas et al., US primary care physicians were the most likely among the ten countries to report making home visits.", "options": ["True", "False"], "answer": 1, "explain": "왕진을 한다고 답한 의사의 비율은 미국이 29%로 가장 낮았고 독일과 네덜란드는 100%였으며, 독일의 비율이 높은 것은 의사가 법률에 따라 왕진 의무를 부담하기 때문입니다. 이 결과는 미국이 특수 필요에의 적응(accommodation) 차원에서 뒤처지는 사례입니다.", "concept": "p_gumas_components", "source": "228 Gumas, 4절 가항; 107 Access 1, 2절 나항 (5)"}, {"id": "p4w-05", "course": "pubh510", "week": "4w", "topic": "Acceptability and nurse practitioners", "importance": 3, "why": "수용성은 근거와 무관한 선호", "type": "mc", "q": "Strong evidence shows that nurse practitioners and physician assistants provide primary care as good as physicians do, yet patients in nearly every country prefer a physician. Which dimension of access does this preference affect most directly, and why?", "options": ["Availability, because NPs and PAs add to the supply of providers", "Accessibility, because NPs and PAs work in different places from physicians", "Affordability, because NP visits cost patients more", "Acceptability, because it concerns the access patients want to have, even when the preference is not evidence-based"], "answer": 3, "explain": "수용성은 환자가 원하는 형태의 접근을 의미하며, 근거와 무관한 주관적 선호가 작용한다는 점에서 5개 차원 가운데 가장 논쟁적입니다. 이 사례에서는 환자가 NP와 PA 같은 대체 제공자를 얼마나 받아들이는지에 따라 접근이 정해집니다. 가용성(availability)은 공급의 문제여서 NP가 공급을 늘린다는 점 때문에 정답으로 오인할 수 있으나, 이 사례에서 접근을 제한하는 요인은 환자의 선호입니다.", "concept": "p_five_dimensions", "source": "107 Access 1, 2절 나항 (6)"}, {"id": "p4w-06", "course": "pubh510", "week": "4w", "topic": "Dominant barrier differs by country (PAHO)", "importance": 3, "why": "지배적 장벽에 맞춘 정책", "type": "mc", "q": "PAHO data on unmet health needs show that almost all of Canada's unmet need is organizational, about 70% of Colombia's is acceptability, and about 80% of the US's is financial. Which policy pairing follows most directly from these dominant barriers?", "options": ["The same cost-sharing cut in all three countries, because cost is the main barrier everywhere", "A cost-sharing cut in Canada, a service reorganization in the US, and an acceptability campaign in Colombia", "Lower patient costs in the US, reorganized service delivery in Canada, and measures raising acceptability in Colombia", "An acceptability campaign in the US, lower patient costs in Colombia, and service reorganization in Canada"], "answer": 2, "explain": "접근을 가로막는 장벽의 크기는 나라마다 다르므로, 각 나라는 자국의 지배적 장벽을 대상으로 정책을 설계하여야 합니다. 미국은 재정 장벽, 캐나다는 조직 문제, 콜롬비아는 수용성 문제가 크므로, 미국에서는 환자 비용 인하, 캐나다에서는 서비스 조직 개편, 콜롬비아에서는 수용성 제고가 지배적 장벽을 직접 해소합니다. 따라서 같은 정책을 세 나라에 시행하여 같은 효과를 기대할 수는 없습니다.", "concept": "p_five_dimensions", "source": "107 Access 1, 2절 다항"}, {"id": "p4w-07", "course": "pubh510", "week": "4w", "topic": "Driedger: acceptability of screening among migrants", "importance": 2, "why": "이주민 선별 수용성의 핵심", "type": "mc", "q": "Driedger et al. synthesized qualitative reviews on infectious disease screening among migrants in the EU/EEA. Which factor did they find, with moderate confidence, to shape whether migrants accept screening and treatment?", "options": ["Cultural sensitivity and the migrant's relationship with the health care provider", "Travel distance to the nearest screening site", "The number of primary care providers per 1,000 people", "The size of the patient's annual deductible"], "answer": 0, "explain": "Driedger 등은 이주민이 선별검사와 치료를 받아들이는지가 문화 감수성과 의료인과 맺은 관계에 따라 크게 달라진다고 보며, 이 결과의 확신도는 중간 수준(moderate confidence)으로 평가되었습니다. 거리는 지리적 접근성의 요인이며 이 논문의 중심 결과가 아닙니다. 선별검사 접근에서는 수용성이 특징적인 차원입니다.", "concept": "p_five_dimensions", "source": "230 Driedger, 4절 다항·바항; 107 Access 1, 3절 다항"}, {"id": "p4w-08", "course": "pubh510", "week": "4w", "topic": "Compare King and Sommers: insurance is not enough", "importance": 3, "why": "두 읽기의 공통 결론 비교", "type": "mc", "q": "King et al. (cancer survivors' delayed care by race and ethnicity) and Sommers et al. (US adults after the ACA) use different data. What conclusion do the two readings share?", "options": ["Expanding insurance closes most of the racial and income gaps in access", "Insurance explains only part of the gaps, so organizational, transportation or social-determinant factors remain", "Racial gaps are larger than income gaps in both studies", "The gaps disappear in both studies once health status is controlled"], "answer": 1, "explain": "King 등은 조직 장벽과 교통 장벽에서 나타나는 격차 가운데 보험으로 설명되지 않는 비율이 크다고 보고, 보험 확대만으로는 격차가 해소되지 않는다고 결론짓습니다. Sommers 등은 소득에 따른 질 인식 격차 가운데 보험으로 설명되는 비율이 10-25%에 그친다고 봅니다. 이처럼 두 연구에 따르면 보험만으로는 접근 문제를 모두 해결할 수 없으며, 이 결론이 새로 제기된 4개 차원의 출발점입니다.", "concept": "p_beyond_insurance", "source": "229 King, 6절 다항·라항; 232 Sommers, 8절; 107 Access 1, 4절 가항"}, {"id": "p4w-09", "course": "pubh510", "week": "4w", "topic": "Insured people still delay care: reliable coverage", "importance": 3, "why": "보험 신뢰성 F등급의 근거", "type": "mc", "q": "After the ACA, US adults who put off care because of expected cost fell among the uninsured (about 8% to 3.5%) but stayed near 20% among insured people unsure what their plan covers. Which emergent dimension of access does this pattern point to, and what grade did the lecture give the US?", "options": ["Duration of provider relationships, grade C", "Addressing social determinants, grade B+", "Reliable insurance coverage, grade F", "Ongoing communication when chronically ill, grade A-"], "answer": 2, "explain": "보험이 있는 사람도 보장 여부와 예상 비용이 불확실하면 진료를 미루므로 이 현상은 보험 보장의 신뢰성 문제이며, 규제 없는 다수 보험자 체계를 운영하는 미국은 이 차원에서 F를 받았습니다. 보험 보장의 신뢰성 차원에서 문제되는 것은 비용의 예측 불가능성이며, 비용의 수준은 이 차원의 판단 대상이 아닙니다. 반면 관계 지속기간은 같은 의사를 5년 이상 유지하는 비율에 관한 차원이어서 이 사례에 해당하지 않습니다.", "concept": "p_beyond_insurance", "source": "107 Access 1, 2절 나항 (4), 4절 다항"}, {"id": "p4w-10", "course": "pubh510", "week": "4w", "topic": "Threshold for targeting: financial risk versus health need", "importance": 3, "why": "기준선이 분명한 지표와 흐린 지표", "type": "mc", "q": "A targeted program must decide where to draw the income cutoff. Why is that cutoff easier to defend when based on financial risk than when based on health need?", "options": ["Health need is concentrated in the bottom income quintile, while financial risk declines gradually across incomes", "Both measures drop sharply at the median income", "Financial risk is unrelated to income in most countries", "Catastrophic out-of-pocket spending is concentrated in the bottom quintile (about 60% versus 6-13% elsewhere), while poor self-rated health declines gradually across income levels"], "answer": 3, "explain": "본인부담 지출이 가구 예산의 10%를 초과하는 가구의 비율은 최하위 5분위에서 59.9%로 크게 높고 나머지 분위에서는 서로 비슷하여 기준선이 분명합니다. 반면 건강이 보통 이하라고 응답한 비율은 소득 분위가 높아질수록 22.8%에서 5.6%로 서서히 낮아져 선을 긋기 어려우므로, 건강 필요를 기준으로 하면 대상을 하위 2개 5분위 이상으로 넓게 정하게 됩니다. 첫째 보기는 두 지표를 거꾸로 설명한 것입니다.", "concept": "p_targeting_universal", "source": "108 Access 2, 2절 나항"}, {"id": "p4w-11", "course": "pubh510", "week": "4w", "topic": "Eligibility cliff and stable coverage", "importance": 3, "why": "자격 절벽은 보편 정책의 근거", "type": "mc", "q": "A worker's income rises slightly above a means-tested program's cutoff in the middle of cancer treatment, and he loses coverage. Which argument for universal rather than targeted policy does this best illustrate?", "options": ["Lower administrative costs", "Stable coverage, because an abrupt eligibility cliff can end benefits during treatment", "Protection of the middle class from being excluded", "Broader political support"], "answer": 1, "explain": "자격 기준에서 급여가 급격히 끊기는 구조에서는 사람들이 참여를 기피하고 치료 도중에 급여를 상실할 위험이 있으므로, 이 사례는 보편 정책의 이점 가운데 보장의 안정에 해당합니다. 반면 중산층 보호는 소득이 기준선 바로 위에 있어 처음부터 대상에서 제외되는 사람에 관한 논거이고, 이 사례는 이미 보장을 받던 사람이 치료 도중에 보장을 상실하는 경우이므로 중산층 보호와 다릅니다.", "concept": "p_targeting_universal", "source": "108 Access 2, 3절 나항"}, {"id": "p4w-12", "course": "pubh510", "week": "4w", "topic": "Return on public dollars of targeting", "importance": 2, "why": "선별 정책의 핵심 이점", "type": "tf", "q": "True or False: A targeted policy tends to give a higher return per public dollar because barriers bind more strongly on low-income groups, so removing them improves access by more.", "options": ["True", "False"], "answer": 0, "explain": "장벽이 더 강하게 작용하는 집단에서는 장벽을 제거할 때 접근이 개선되는 폭도 크므로 선별 정책은 공공 재원의 수익이 높습니다. 저소득층은 실질적인 선택의 폭이 좁아 선별 보조금이 선택 능력에 미치는 영향도 큽니다. 공공 재원의 수익이 높다는 점은 보편 정책의 행정비용 절감 등의 이점과 대비되는 선별 정책의 핵심 이점입니다.", "concept": "p_targeting_universal", "source": "108 Access 2, 2절 가항·3절 가항"}, {"id": "p4w-13", "course": "pubh510", "week": "4w", "topic": "Provide services versus cover costs", "importance": 3, "why": "직접 제공과 비용 보장의 고유 이점", "type": "mc", "q": "Low-income access can be expanded by providing services directly (community health centers) or by covering costs (Medicaid). Which advantage belongs specifically to covering costs rather than to direct provision?", "options": ["Co-locating several providers so that referrals and coordination are easier", "Setting the practice norms that providers follow", "Adjusting cost sharing for particular services to steer patients' use", "Deciding the mix of primary and specialty providers"], "answer": 2, "explain": "서비스 직접 제공의 이점은 제공자 구성(provider mix) 결정, 같은 장소 진료(co-location), 진료 규범(practice norms) 설정입니다. 비용 보장의 고유한 이점은 특정 서비스의 본인부담을 조정하여 환자의 이용을 유도할 수 있다는 점입니다. 나머지 세 보기는 모두 직접 제공 경로의 이점입니다.", "concept": "p_provision_vs_coverage", "source": "108 Access 2, 4절 나항; 234 Shin"}, {"id": "p4w-14", "course": "pubh510", "week": "4w", "topic": "Reaching the target population: two pathways, two limits", "importance": 3, "why": "경로마다 도달의 한계가 다름", "type": "mc", "q": "Both pathways miss part of the low-income target population, but for different reasons. Which pairing is correct?", "options": ["Medicaid: stigma keeps enrollment to about 60-65% of those eligible (an acceptability problem); community health centers: reach varies widely by state (an accessibility problem)", "Medicaid: uneven geographic distribution of sites (an accessibility problem); community health centers: stigma lowers enrollment (an acceptability problem)", "Both: the cost of verifying eligibility is the only reason people are missed", "Both: shortages of primary care physicians are the only reason people are missed"], "answer": 0, "explain": "Medicaid의 한계는 낙인 때문에 적격자의 약 60-65%만 등록한다는 수용성 문제이고, 지역보건센터의 한계는 센터가 진료하는 무보험 인구의 비율이 네바다 7%에서 버몬트 60%까지 주마다 다르다는 지리적 접근성 문제입니다. 두 번째 보기는 두 경로의 원인을 서로 반대로 짝지었습니다. 같은 저소득층이라도 정책 경로에 따라 접근을 제한하는 차원이 다릅니다.", "concept": "p_provision_vs_coverage", "source": "108 Access 2, 4절 다항; 234 Shin; 237 Grogan"}, {"id": "p4w-15", "course": "pubh510", "week": "4w", "topic": "Two kinds of Medicaid stigma", "importance": 3, "why": "의존 낙인과 집단 밖 낙인 구분", "type": "mc", "q": "Sparer describes Medicaid's early image as a stigmatized charity benefit, so many private-practice physicians shunned it because of low fees. Haeder and Moynihan find that non-Hispanic White respondents with high racial resentment more strongly support burdensome rules for these programs. Which pair of stigma types do the two readings illustrate?", "options": ["Out-group stigma (Sparer) and stigma of dependency (Haeder and Moynihan)", "Stigma of dependency (Sparer) and out-group stigma (Haeder and Moynihan)", "Stigma of dependency in both readings", "Administrative burden in both readings"], "answer": 1, "explain": "Sparer는 Medicaid가 공공부조 수급자를 위한 낙인찍힌 자선 급여로 여겨졌다고 설명하며, 이는 의존이라는 낙인에 해당합니다. Haeder와 Moynihan은 응답자가 수혜 집단을 자신과 다른 집단으로 인식할 때 생기는 집단 밖 낙인을 확인하였습니다. 첫째 보기는 두 유형을 거꾸로 짝지었습니다.", "concept": "p_stigma_contracting", "source": "108 Access 2, 3절 나항; 233 Sparer, 3절; 235 Haeder"}, {"id": "p4w-16", "course": "pubh510", "week": "4w", "topic": "Why Medicaid contracts with private plans", "importance": 3, "why": "민간 계약의 주된 근거는 낙인 감소", "type": "mc", "q": "According to the lecture, what is the main rationale for states contracting Medicaid with private managed care plans?", "options": ["To lower the federal matching rate that states receive", "To address the fact that Medicaid agencies cannot enroll people themselves", "To improve the geographic spread of community health centers", "To reduce stigma, since enrollees hold the same kind of insurance as everyone else (quality and access improvement are secondary aims)"], "answer": 3, "explain": "강의에서는 주가 민간 관리의료 계획과 Medicaid 계약을 체결하는 주된 근거를 낙인 감소로 설명합니다. 수급자가 다른 모든 사람과 같은 보험에 가입하면 낙인이 줄어들기 때문이며, 많은 주는 같은 목적으로 사업의 명칭도 변경하였습니다. 반면 질 향상(성과급 등 계약 조건)과 접근 개선(사회적 결정요인 요건)은 보조적 근거입니다.", "concept": "p_stigma_contracting", "source": "108 Access 2, 5절 나항"}, {"id": "p4w-17", "course": "pubh510", "week": "4w", "topic": "Grogan and Park's caution on destigmatization", "importance": 3, "why": "낙인 제거 노력의 역효과 가능성", "type": "mc", "q": "Grogan and Park report that about 20% of Americans see Medicaid as stigmatizing and that these people support it less. What caution do they draw about destigmatization efforts such as renaming programs or contracting with private plans?", "options": ["Such efforts may cause program confusion and lower support, even among people connected to Medicaid, so the Medicaid name should not be hidden", "Renaming always raises support, so it should be extended to every program", "Stigma is the main reason that people with no Medicaid connection oppose expansion", "Contracting with private plans has been shown to eliminate stigma completely"], "answer": 0, "explain": "Grogan과 Park은 낙인을 인식하는 사람이 약 20%로 적고 이들의 지지가 낮다고 보면서도, 이름 바꾸기와 관리의료 계약이 사업에 대한 혼란을 키워 Medicaid와 관계가 있는 사람의 지지까지 낮출 수 있다고 봅니다. 그래서 Medicaid라는 이름을 감추지 말라고 권고합니다. Grogan과 Park의 이 주장은 낙인 감소가 계약의 주된 근거라는 강의의 논리에 대한 경고로 이해할 수 있습니다.", "concept": "p_stigma_contracting", "source": "237 Grogan, 논의와 정책 시사점; 108 Access 2, 5절 나항"}, {"id": "p4w-18", "course": "pubh510", "week": "4w", "topic": "Racial information and burden tolerance", "importance": 2, "why": "인종 정보 제공은 지지를 바꾸지 못함", "type": "tf", "q": "True or False: In Haeder and Moynihan's survey experiment, telling respondents that administrative burdens fall harder on people of color made them less supportive of burdensome state policies.", "options": ["True", "False"], "answer": 1, "explain": "Haeder와 Moynihan의 실험에서 행정 부담이 인종별로 다르게 작용한다는 정보를 알려 주어도 응답자가 6개 유형의 부담을 지지하는 정도는 달라지지 않았습니다. 다만 인종적 반감이 높은 비히스패닉 백인은 부담을 부과하는 정책을 더 지지하였고, 부담이 불리한 집단에 다르게 작용한다고 이미 믿고 있던 응답자는 덜 부담스러운 대안을 선호하였습니다. 따라서 정보 제공의 효과와 응답자가 이전부터 믿고 있던 내용의 효과를 구분하여야 합니다.", "concept": "p_stigma_contracting", "source": "235 Haeder, 1절 초록; 108 Access 2, 3절 나항"}, {"id": "p5-01", "course": "pubh510", "week": "5w", "topic": "Three zones and policy goals", "importance": 2, "why": "구간별 정책 목표 짝짓기", "type": "mc", "q": "A health department wants guideline-based screening, avoidance of low-value care, and patient-centered communication to happen at essentially every visit. Which zone of the quality continuum and which goal does this describe?", "options": ["Left tail (unsafe care), never events", "Right tail (exemplary care), norm-changing actions", "Middle (typical care), always events", "Right tail (exemplary care), always events"], "answer": 2, "explain": "지침 충족, 낭비적 진료의 회피, 환자 중심 진료는 일반 진료 구간을 겨냥한 항상 이루어져야 하는 진료 요소(always events)입니다. 발생해서는 안 되는 사건(never events)은 왼쪽 꼬리, 규범 변화 행동(norm-changing actions)은 오른쪽 꼬리의 목표이므로 다른 보기는 구간과 목표가 맞지 않습니다.", "concept": "p_continuum", "source": "109 Quality and Safety 1, 3절 라항"}, {"id": "p5-02", "course": "pubh510", "week": "5w", "topic": "Where to focus on the continuum", "importance": 2, "why": "구간별 정책 중점의 근거", "type": "mc", "q": "A state finds that wealthy, well-connected patients travel to top hospitals while low-income patients receive only typical care. Which policy focus does the lecture's framework justify for this situation, and on what ground?", "options": ["Left tail: preventing care that leaves patients worse off is the most intuitive principle", "Right tail: access to exemplary providers is skewed toward high income and social capital, so more people should reach the best care", "Middle: a small gain in average quality reaches the largest number of people", "Middle: exemplary care is far better than average care in absolute terms, so the middle needs the most help"], "answer": 1, "explain": "우수 진료에 대한 접근이 소득과 사회적 자본이 높은 집단에 편중되어 있으므로, 오른쪽 꼬리에 정책 중점을 두어 접근 격차를 줄이는 방식이 이 상황에 맞습니다. 가운데 구간에 중점을 두는 근거는 영향을 받는 인구의 규모이며, 우수 진료가 평균 진료보다 절대적으로 크게 우수하다고 할 수는 없으므로 마지막 보기는 틀립니다.", "concept": "p_continuum", "source": "109 Quality and Safety 1, 2절 나항 (3)"}, {"id": "p5-03", "course": "pubh510", "week": "5w", "topic": "Definition of typical care", "importance": 2, "why": "일반 진료 구간의 정의", "type": "tf", "q": "In the lecture's normal-distribution model, the middle zone (typical care) is defined as the zone where average quality is already good in absolute terms.", "options": ["True", "False"], "answer": 1, "explain": "일반 진료는 정의상 가장 큰 구간이며 대부분의 진료 건과 임상의가 속하는 구간입니다. 이 모형은 가운데 구간의 평균 질이 절대적으로 좋은지 나쁜지를 규정하지 않으므로 이 진술은 틀립니다. 이 구간이 중요한 이유는 분포가 가장 조밀하여 평균 질을 높이면 가장 많은 사람에게 영향이 미친다는 점입니다.", "concept": "p_continuum", "source": "109 Quality and Safety 1, 2절 나항 (3)"}, {"id": "p5-04", "course": "pubh510", "week": "5w", "topic": "Why harm is higher in inpatient settings", "importance": 2, "why": "환경별 위해 비율의 원인", "type": "mc", "q": "In Panagioti et al., preventable harm is highest in intensive care (18%) and lowest in obstetrics (2%). According to the lecture, why are harmful errors more common in inpatient than outpatient settings?", "options": ["Inpatient clinicians are less skilled than outpatient clinicians", "Hospitals have fewer resources than clinics", "Hospitals follow guidelines less often than clinics", "Inpatients are sicker, more complex, more time-sensitive and closer to death, even though ICUs concentrate the most skilled clinicians and resources"], "answer": 3, "explain": "강의에서는 입원 환자가 더 아프고 복잡하고 시간에 민감하며 사망에 더 가깝기 때문에 오류가 해로운 결과로 연결될 가능성이 크다고 설명합니다. 중환자실은 가장 숙련된 임상의와 자원이 집중된 곳인데도 위해 비율이 가장 높으므로 임상의의 숙련도 부족은 원인이 아닙니다.", "concept": "p_preventable_harm", "source": "109 Quality and Safety 1, 3절 나항 / 239 Panagioti"}, {"id": "p5-05", "course": "pubh510", "week": "5w", "topic": "Zero harm is impossible", "importance": 3, "why": "zero harm 불가능의 근거", "type": "mc", "q": "Suppose a hospital system perfectly implements every known error-prevention measure. Using Panagioti et al.'s finding as presented in the lecture, what happens to total adverse events?", "options": ["They fall to nearly zero", "They fall by about 90%, because errors cause most harm", "About half remain, because they cannot be prevented with current knowledge", "Only the harm in intensive care remains"], "answer": 2, "explain": "예방 가능한 위해(오류)는 조사한 모든 환경에서 전체 유해 사건의 약 50%이고, 나머지 절반은 현재 지식으로 예방할 수 없습니다. 따라서 알려진 모든 지식을 완벽히 이행하여도 위해의 절반이 남으므로, 위해를 완전히 없애는 zero harm 목표는 불가능합니다.", "concept": "p_preventable_harm", "source": "109 Quality and Safety 1, 3절 나항과 다항 (3)"}, {"id": "p5-06", "course": "pubh510", "week": "5w", "topic": "Trust loss after non-preventable events", "importance": 2, "why": "예방 불가 사건도 신뢰 훼손", "type": "mc", "q": "Schlesinger and Grob compare trust after a single clear mistake with trust after a single problem that was not a mistake. Which pattern supports paying attention to non-preventable adverse events?", "options": ["Trust still falls substantially after non-mistake problems (48.4% vs 66.5% immediately), and perceived future risk is almost the same (57.5% vs 60.7%)", "Trust falls only after clear mistakes; non-mistake problems leave trust unchanged", "Trust falls more after non-mistake problems, because patients blame the whole system", "Trust falls in both cases but recovers within the first year"], "answer": 0, "explain": "실수가 아닌 문제를 겪은 환자에서도 신뢰가 직후에 하락한 비율이 48.4%, 지속적으로 하락한 비율이 43.0%로 실수를 겪은 환자의 66.5%와 57.7%에 근접하며, 앞으로의 위험에 관한 인식은 두 집단이 거의 같습니다. 따라서 예방 가능성만으로 환자의 피해와 신뢰 상실을 구별할 수 없습니다. 신뢰 하락은 1년 넘게 지속되므로 1년 안에 회복된다는 보기도 틀립니다.", "concept": "p_preventable_harm", "source": "109 Quality and Safety 1, 3절 다항 (5) / 244 Schlesinger and Grob"}, {"id": "p5-07", "course": "pubh510", "week": "5w", "topic": "Levine: trends in typical care", "importance": 2, "why": "일반 진료 추세의 불균등", "type": "mc", "q": "Levine et al. tracked guideline adherence, avoidance of low-value care, and patient experience in US outpatient care from 2002 to 2013. Which summary fits their findings?", "options": ["All three dimensions improved steadily", "Clinical quality improved evenly, while patient experience stagnated", "Avoidance of wasteful care improved sharply, while guideline adherence worsened", "Patient experience improved consistently (for example, communication from about 55% to 63%), while clinical quality improved unevenly and often stayed low"], "answer": 3, "explain": "Levine 등은 10여 년의 노력에도 외래 진료의 임상 질이 고르게 개선되지 않았고 환자 경험만 일관되게 개선되었다고 결론짓습니다. 낭비적 진료의 회피 비율은 거의 변하지 않았으므로 급격히 개선되었다는 보기는 틀립니다.", "concept": "p_typical_care", "source": "109 Quality and Safety 1, 3절 라항 / 238 Levine"}, {"id": "p5-08", "course": "pubh510", "week": "5w", "topic": "Park: income and value of care", "importance": 2, "why": "소득별 고가치ㆍ저가치 진료", "type": "mc", "q": "Park and Wadhera compared high-value and low-value care among US adults by income. Which description fits their results?", "options": ["Higher-income adults received more high-value care and less low-value care on every measure", "Higher-income adults received more high-value care (such as breast and colorectal cancer screening), but also used more antibiotics for upper respiratory infection and flu, which is low-value care", "Lower-income adults received more high-value care than higher-income adults", "There was no income difference in either high-value or low-value care"], "answer": 1, "explain": "고가치 진료는 소득이 높을수록 이용 비율이 높았지만, 저가치 진료는 항목에 따라 결과가 일정하지 않았으며 급성 상기도 감염과 인플루엔자에 대한 항생제는 고소득 집단에서 더 많이 사용되었습니다. 격차는 실재하지만 크지 않으며, 소득이 높은 집단이 저가치 진료를 일률적으로 피하지는 않습니다.", "concept": "p_typical_care", "source": "109 Quality and Safety 1, 3절 라항 (5) / 242 Park and Wadhera"}, {"id": "p5-09", "course": "pubh510", "week": "5w", "topic": "Burnout varies across countries", "importance": 2, "why": "소진의 국가 간 편차 해석", "type": "tf", "q": "The lecture reads the wide cross-country variation in primary care physician burnout (for example about 13% in the Netherlands versus 57% in New Zealand among physicians under 55) as evidence that burnout is mainly an individual problem.", "options": ["True", "False"], "answer": 1, "explain": "강의에서는 소진율의 국가 간 편차가 크다는 점을 근거로 소진의 원인이 구조적이라고 판단합니다. 소진율이 가장 낮은 네덜란드가 10%대 수준이라는 사실은 다른 나라에서도 소진을 줄일 수 있음을 의미합니다. 또한 개인 수준 개입은 대부분 효과가 작거나 일시적이었으며, 이러한 개입으로는 국가 간 편차를 설명할 수 없었습니다.", "concept": "p_prof_limits", "source": "109 Quality and Safety 1, 4절 나항"}, {"id": "p5-10", "course": "pubh510", "week": "5w", "topic": "Yang and Sage: filling vs bridging", "importance": 3, "why": "채우기와 다리 놓기의 구분", "type": "mc", "q": "A health system answers each new quality problem by adding another metric, checklist or documentation requirement, without redesigning payment or structure. In Yang and Sage's terms, this is best described as:", "options": ["Bridge building, because each added measure supports the others", "Serial abandonment, because attention keeps shifting from one goal to the next", "Filling the chasm with technical interventions, which accumulate without the structural integrity a bridge needs", "Radical reform of the profession's values"], "answer": 2, "explain": "Yang과 Sage는 기술, 측정, 규제를 질의 간극(chasm)에 계속 추가하는 방식을 채우기(filling)라고 부르며, 간극을 건너는 다리를 건설하려면 각 요소가 서로를 지지하는 구조적 온전함이 필요하다고 봅니다. 연쇄적 포기는 정책 관심의 대상이 낭비, 건강문화, 소진, 건강형평으로 잇달아 변경된 현상이어서 새 지표를 계속 추가하는 이 사례와 구별됩니다.", "concept": "p_prof_limits", "source": "110 Quality and Safety 2, 2절 가항 (3) / 243 Yang and Sage"}, {"id": "p5-11", "course": "pubh510", "week": "5w", "topic": "Asking more of burned-out clinicians", "importance": 3, "why": "소진된 임상의에게 추가 요구", "type": "mc", "q": "A regulator proposes again to rely on clinicians to carry out a new safety documentation requirement. Based on the burnout data in class 9 and on Yang and Sage, what should we predict for clinicians who are already burned out?", "options": ["They will comply readily, because safety is a professional norm", "Their care quality will be unaffected, because burnout and quality are unrelated", "They will gain the most, because they have the most room to improve", "They have little capacity to absorb new demands, so the extra requirement may worsen care rather than improve it"], "answer": 3, "explain": "소진을 경험한 임상의가 코로나19가 질과 안전을 심각하게 교란하였다고 답할 가능성은 소진을 경험하지 않은 임상의보다 평균 2-3배 높았으며, 이 결과는 10개국 모두에서 일관되었습니다. 따라서 이미 포화 상태인 임상의에게 요구를 추가하면 진료가 개선되기보다 악화되며, Yang과 Sage는 이 점을 주된 근거로 질 개선을 전문직에만 의존할 수 없다고 봅니다.", "concept": "p_prof_limits", "source": "110 Quality and Safety 2, 2절 다항 (2)"}, {"id": "p5-12", "course": "pubh510", "week": "5w", "topic": "Realistic ceiling of professional approach", "importance": 2, "why": "오류 감소와 전체 위해의 관계", "type": "mc", "q": "Preventable errors are about half of all adverse events, and the professionally driven approach reduced errors by about 25-30%. By how much does this reduce all adverse events?", "options": ["About 25-30%", "About 12-15%", "About 50%", "About 6%"], "answer": 1, "explain": "오류가 전체 유해 사건의 약 절반이므로 오류를 25-30% 줄여도 전체 유해 사건은 12-15%만 감소하며, 나머지 약 85%에는 전문직 기반 접근이 영향을 미치지 못합니다. 25-30%는 오류만의 감소 폭이므로 전체 유해 사건의 감소와 혼동하여서는 안 됩니다.", "concept": "p_prof_limits", "source": "110 Quality and Safety 2, 2절 다항 (1)"}, {"id": "p5-13", "course": "pubh510", "week": "5w", "topic": "Cream skimming in cardiac surgery", "importance": 3, "why": "공개 보고의 위험 선택 부작용", "type": "mc", "q": "Massachusetts cardiac surgery mortality fell from about 2.5% to about 1.2% by 2010 and then rose to about 1.7% by 2014, although reporting did not change. Which mechanism did the lecture present as policymakers' biggest concern about comparative performance measures?", "options": ["Patients using the report cards to move to higher-ranked surgeons", "Surgeons losing skill because they operated less often", "Hospitals withdrawing from public reporting altogether", "Providers avoiding high-risk patients (cream skimming) rather than improving their care"], "answer": 3, "explain": "외과의가 허약하거나 동반질환이 있는 환자를 고위험으로 분류하여 치료를 거부하면 가장 허약한 환자의 수술이 거듭 지연되고, 수술 전 사망은 외과의 성과 점수에 반영되지 않습니다. 환자가 심장수술을 어느 병원에서 받을지는 대부분 일차의료 의사가 정하였으므로 환자가 보고서를 보고 이동하였다는 설명은 맞지 않습니다.", "concept": "p_public_reporting", "source": "110 Quality and Safety 2, 3절 다항 (3)"}, {"id": "p5-14", "course": "pubh510", "week": "5w", "topic": "Three versions of public reporting", "importance": 2, "why": "공개 보고 3유형의 작용 원리", "type": "mc", "q": "Which pairing of reporting version and mechanism matches the lecture?", "options": ["Individual disclosure: the patient who experienced harm is told, and may then switch providers, be more careful, seek legal remedy and reach reconciliation", "Aggregate performance: hospital report cards let consumers avoid low-performing hospitals", "Provider performance: each patient is told about the harm in their own care", "Aggregate performance: national safety reports tell each affected patient what happened to them"], "answer": 0, "explain": "개별 공개는 유해 사건을 겪은 개별 환자에게 사건을 알리는 방식이며 환자가 이후 선택을 하고 화해에 도달하는 것이 목표입니다. 소비자가 병원 성과표를 보고 성과가 낮은 제공자를 피하는 것은 제공자별 성과 보고의 작용 원리이고, 전체 성과 보고는 국가 수준의 위험을 공중과 정책결정자에게 알리는 방식입니다.", "concept": "p_public_reporting", "source": "110 Quality and Safety 2, 3절 가항"}, {"id": "p5-15", "course": "pubh510", "week": "5w", "topic": "Why disclosure is rare", "importance": 2, "why": "낮은 공개율과 의료분쟁 책임", "type": "tf", "q": "Wu et al. conclude that the low rate of disclosing adverse events to patients is mainly explained by fear of malpractice liability under US-style law.", "options": ["True", "False"], "answer": 1, "explain": "Wu 등은 미국식 의료분쟁법이 없는 나라에서도 공개율이 동일하게 낮다고 지적합니다. 법적 책임이 다소 영향을 줄 수는 있으나 낮은 공개율을 설명하지 못하며, 공개의 어려움은 법적 상황과 무관한 거의 보편적 현상입니다. 공개를 법으로 의무화한 곳에서도 실제 공개는 30-40%에 그칩니다.", "concept": "p_public_reporting", "source": "110 Quality and Safety 2, 3절 라항 / 245 Wu"}, {"id": "p5-16", "course": "pubh510", "week": "5w", "topic": "Equity paradox of the right to know", "importance": 2, "why": "보편적 권리의 불균등 시행", "type": "mc", "q": "Why can a universal right to be told about harm widen existing patient-safety gaps, according to the lecture?", "options": ["Only patients with private insurance are covered by the right", "Disclosure laws forbid providers from informing low-income patients", "In practice the right is used more by higher-income, better-educated patients and chronically ill patients experienced with the system, so benefits are uneven", "Providers can disclose only to patients who file a formal complaint"], "answer": 2, "explain": "권리는 원칙적으로 보편적이지만 실제 효과는 소득과 학력이 높고 의료체계를 이용하여 본 경험이 많은 만성질환 환자에게 불균형하게 나타납니다. 따라서 형평을 높이려는 권리 기반 접근을 시행하면 오히려 기존의 안전 격차가 확대되는 역설이 발생합니다. 나머지 보기는 강의에서 설명하지 않은 제도 내용입니다.", "concept": "p_rights_safety", "source": "110 Quality and Safety 2, 4절 다항 (1)"}, {"id": "p5-17", "course": "pubh510", "week": "5w", "topic": "WHO framing of safety as a right", "importance": 2, "why": "안전을 권리로 보는 근거와 한계", "type": "mc", "q": "Why does the WHO frame patient safety as a right, and what limits the Patient Safety Rights Charter?", "options": ["WHO is a national government, so it can enforce the Charter through courts", "Because everyone has a right to health and health care itself is a major cause of harm, safety is part of that right; but WHO is an advisory body that can only recommend the Charter to member states", "Because 35 US states already require disclosure, WHO simply copied that law", "Because malpractice law requires safety, and the Charter replaces malpractice law"], "answer": 1, "explain": "유엔 체계에서 모든 인간은 건강에 대한 기본 권리가 있고 의료가 환자에게 해를 끼치는 주요 원인이므로, 건강권을 보장하려면 안전할 권리가 있어야 합니다. 다만 WHO는 자문 기구이고 국가 정부가 아니므로 권리를 집행할 수 없고 회원국에 권고할 수 있을 뿐입니다.", "concept": "p_rights_safety", "source": "110 Quality and Safety 2, 4절 가항"}, {"id": "p6-01", "course": "pubh510", "week": "6w", "topic": "Why the US is a cost outlier", "importance": 3, "why": "미국 초과 지출의 핵심 원인", "type": "mc", "q": "Using the Class 10 lecture together with Cutler and Shrank, which pair of causes best explains why the US is a health spending outlier among rich countries?", "options": ["Fraud and abuse in Medicare, and patients who expect too much from medicine", "Overuse of MRI and CT scanners, and excess spending on end-of-life care", "Excessive prices (drugs and procedure-based specialist fees), and administrative costs", "Too little spending on social services, and too much government insurance"], "answer": 2, "explain": "강의에서는 미국이 의료비 지출의 이상치가 된 두 가지 핵심 원인을 과도한 가격과 행정비용으로 정리하고, 저가치 진료나 과잉 이용만으로는 이 이상치를 설명할 수 없다고 하였습니다. 장비 과잉과 임종기 진료, 환자 기대, 정부 보험, 사회서비스 부족은 강의에서 반증한 통념이므로 이를 원인으로 든 보기는 오답입니다.", "concept": "p_price_admin", "source": "112 Costs 1, 4절 라항"}, {"id": "p6-02", "course": "pubh510", "week": "6w", "topic": "Shrank's waste domains", "importance": 2, "why": "낭비 영역별 규모 비교", "type": "tf", "q": "Shrank et al. estimate that the single largest domain of waste in US health care is failure of care delivery (for example, preventive care that is not adopted).", "options": ["True", "False"], "answer": 1, "explain": "Shrank 등의 추정에서 진료 제공 실패로 인한 낭비는 연 1,024억에서 1,657억 달러이고, 가장 큰 영역은 행정 복잡성(2,656억 달러), 두 번째로 큰 영역은 가격 실패(약 2,307억에서 2,405억 달러)입니다. 예방 진료 미채택이 단일 항목으로는 크더라도 진료 제공 실패 영역의 합계는 행정 복잡성과 가격 실패보다 작습니다.", "concept": "p_price_admin", "source": "249 Shrank, 4절 및 5절"}, {"id": "p6-03", "course": "pubh510", "week": "6w", "topic": "Hospital administrative costs: US vs Canada", "importance": 3, "why": "행정비용의 구조적 원인 적용", "type": "mc", "q": "A US hospital manager notices that her billing office is about twice as large, relative to hospital costs, as a Canadian hospital's. Which structural explanation fits the eight-nation study discussed in class?", "options": ["Many insurers with different rules make billing and claims work more complex for hospitals and clinicians, while a single payer simplifies it", "US hospitals treat sicker patients, so every admission needs more paperwork", "US physicians are paid higher fees, and billing staff are paid in proportion", "Canadian hospitals under-report administrative work because they are publicly owned"], "answer": 0, "explain": "병원 행정비용은 미국이 병원 비용의 25.32%, 캐나다가 12.42%입니다. 강의에서는 보험자가 여러 곳인 체계에서 병원과 임상의의 업무 복잡성이 높아지고 단일 지불자 체계에서는 행정비용이 낮다고 설명하였습니다. 강의에서는 환자 중증도나 수가 수준을 이 차이의 원인으로 설명하지 않았습니다.", "concept": "p_price_admin", "source": "112 Costs 1, 4절 다항 (2)"}, {"id": "p6-04", "course": "pubh510", "week": "6w", "topic": "Misconception: love of technology", "importance": 3, "why": "기술 통념 반증 논리", "type": "mc", "q": "Someone argues that the US spends about 18% of GDP on health care because Americans love technology such as MRI and CT scanners. Which fact from the lecture best undermines this claim?", "options": ["US MRI and CT counts per million people more than doubled between 2000 and 2015", "The US has more MRI machines per million people than the OECD median", "OECD countries also increased their MRI and CT numbers over the same years", "Japan has more MRI and CT machines than the US yet spends only about 7% of GDP on health care"], "answer": 3, "explain": "일본은 MRI 51.7대와 CT 107.2대로 미국보다 장비가 많은데도 GDP의 약 7%만 지출하므로 장비 밀도는 국가의 의료 지출을 예측하지 못합니다. 나머지 보기의 내용은 장비 수에 관한 사실뿐이므로 장비와 지출 사이의 연관성을 반박하는 근거가 되지 못합니다.", "concept": "p_myths", "source": "112 Costs 1, 6절 나항"}, {"id": "p6-05", "course": "pubh510", "week": "6w", "topic": "Misconception: patients expect too much", "importance": 3, "why": "국가 비교로 수요 가설 검증", "type": "mc", "q": "How does the lecture rebut the claim that US spending is high because patients expect too much from medicine (34% of Americans, 27% of Canadians and 11% of Germans believed modern medicine can cure almost any illness)?", "options": ["Germans hold the highest expectations, yet Germany spends the least", "Canadians' expectations are close to Americans' and far above Germans', so Canada should out-spend Germany if demand set spending; instead Canada spends less than both the US and Germany", "Older Americans hold lower expectations than younger Americans, so total demand is actually low", "Surveys show that no country's patients believe medicine can cure nearly everything"], "answer": 1, "explain": "환자 수요가 지출을 결정한다면 기대 수준이 미국과 비슷한 캐나다가 더 회의적인 독일보다 많이 지출하여야 합니다. 실제로 캐나다는 미국과 독일보다 적게 지출하므로 기대 수준은 지출 수준을 예측하지 못합니다. 독일의 기대 수준이 가장 높다는 보기는 수치와 반대입니다.", "concept": "p_myths", "source": "112 Costs 1, 6절 마항"}, {"id": "p6-06", "course": "pubh510", "week": "6w", "topic": "Aldridge: whom to target to cut costs", "importance": 3, "why": "임종기 통념과 표적 개입", "type": "mc", "q": "Aldridge and Kelley find that only 11% of the top 5% of spenders in 2011 were in their last year of life. What follows for a policy meant to reduce total spending?", "options": ["Target people with a single discrete high-cost event, since they are 49% of the top spenders and their spending is largely inappropriate", "Target only people in the last year of life, because they are almost all among the top spenders", "Target people with chronic conditions and functional limitations who stay high-cost for years, because an end-of-life-only intervention reaches a small group with little time to save money", "Do not target any group, because spending is spread evenly across the population"], "answer": 2, "explain": "고비용 인구의 40%는 만성질환과 기능 제한으로 여러 해 동안 높은 비용을 유지하며, 이 집단에 개입하면 여러 해에 걸쳐 비용을 줄일 여지가 있습니다. 개별 고비용 사건 인구(49%)는 대부분 회복하므로 비용을 줄일 여지가 상대적으로 적고, 임종기 인구는 규모가 작고 비용을 줄일 수 있는 기간이 짧습니다.", "concept": "p_cost_burden", "source": "250 Aldridge, 4절 및 7절"}, {"id": "p6-07", "course": "pubh510", "week": "6w", "topic": "Spending level vs income-based access gaps", "importance": 2, "why": "총지출과 격차의 비기계적 관계", "type": "mc", "q": "New Zealand spends about 9.1% of GDP on health and Switzerland over 11%, yet New Zealand has a larger cost-related access gap between income groups. What does the lecture conclude from this comparison?", "options": ["There is no simple mechanical link between a country's total spending and its income-based access gap; how patients' cost sharing is designed (for example income-linked caps) matters", "Higher national spending always produces a larger gap, as Cutler's argument predicts", "Countries that spend less always have larger gaps, so cutting spending is harmful", "Switzerland's data are unreliable, so the comparison tells us nothing"], "answer": 0, "explain": "Cutler의 논증이 단순하게 성립한다면 지출이 많은 스위스에서 소득 집단 간 격차가 더 커야 하지만 실제로는 뉴질랜드의 격차가 더 큽니다. 강의에서는 미국이 이상치인 이유를 소득에 연동된 본인부담 상한이 없다는 점으로 설명하였으므로, 총지출 수준만으로는 격차를 설명하지 못하며 본인부담의 설계가 중요합니다.", "concept": "p_cost_burden", "source": "112 Costs 1, 3절 다항 (2)"}, {"id": "p6-08", "course": "pubh510", "week": "6w", "topic": "Cutler: raising the eligibility age", "importance": 2, "why": "겉보기 중립 정책의 역진성", "type": "tf", "q": "Cutler argues that raising the Medicare and Social Security eligibility age would be roughly neutral across income groups, because life expectancy at 65 has risen about equally for everyone.", "options": ["True", "False"], "answer": 1, "explain": "Cutler는 이 제안을 매우 역진적이라고 평가합니다. 2001년부터 2014년까지 소득 최상위의 기대여명은 2년에서 3년 늘었으나 최하위 부근은 6개월 이하만 늘어, 수급 개시 연령을 올리면 저소득층의 급여 수급 연수가 훨씬 크게 줄어들기 때문입니다.", "concept": "p_cost_burden", "source": "248 Cutler, 4절 라항"}, {"id": "p6-09", "course": "pubh510", "week": "6w", "topic": "Why price cuts alone may not cut spending", "importance": 3, "why": "가격 협상과 이용량 통제의 관계", "type": "mc", "q": "A government cuts the fee for a physician service by 20%. According to Class 11 (Gusmano et al.), why might total spending fall by much less than 20%?", "options": ["Insurers respond by raising premiums by the same amount", "Patients switch to private insurers that pay higher fees", "Physicians retire early, which reduces the supply of services", "Clinicians with an income to protect increase the volume of services to make up for lost revenue, so price cuts work best alongside budget caps or volume controls"], "answer": 3, "explain": "지출은 가격과 이용량의 곱이므로 가격만 낮추면 제공자가 이용량을 늘려 줄어든 수입을 보전합니다. 강의에서는 연 15만에서 20만 달러를 버는 임상의가 가격이 20% 인하되면 이용량을 늘려 대응하는 사례를 들었으며, 따라서 가격 협상의 효과는 예산 상한이나 이용량 통제를 병행하는지에 달려 있습니다.", "concept": "p_price_volume", "source": "113 Costs 2, 5절 나항"}, {"id": "p6-10", "course": "pubh510", "week": "6w", "topic": "France, Germany, Japan: price vs volume control", "importance": 3, "why": "세 나라의 제도 비교", "type": "mc", "q": "Gusmano et al. compare how France, Germany and Japan manage price and volume under fee-for-service. Which description of Japan is correct?", "options": ["Prices are negotiated aggressively, but volume is left largely uncontrolled", "The same document that sets fees also sets conditions on billable volume and on which hospitals, clinics or doctors may provide certain services, so price and volume are managed together", "Budget caps are placed on sickness funds and physician associations, which then enforce volume control themselves", "Fees are set by competing private insurers, with no national fee schedule"], "answer": 1, "explain": "일본은 협상 수가를 정한 문서에 서비스 제공 조건을 함께 정하여 항목별 청구 가능한 제공량과 서비스를 제공할 수 있는 기관과 의사를 제한하므로 가격과 제공량이 함께 관리됩니다. 첫째 보기는 프랑스, 셋째 보기는 독일의 방식이며, 일본에는 1958년부터 단일 수가표가 있으므로 넷째 보기도 틀립니다.", "concept": "p_price_volume", "source": "252 Gusmano, 7절"}, {"id": "p6-11", "course": "pubh510", "week": "6w", "topic": "Is fee-for-service the problem?", "importance": 2, "why": "행위별수가 자체가 원인인가", "type": "tf", "q": "Because France, Germany and Japan keep fee-for-service yet spend less than the US, Gusmano et al. conclude that fee-for-service itself is the main reason US spending is so high.", "options": ["True", "False"], "answer": 1, "explain": "세 나라는 행위별수가를 유지하면서 수가를 표준화하고 지출 제약 안에서 협상하여 가격과 지출을 낮게 유지합니다. 따라서 Gusmano 등은 미국의 높은 지출을 행위별수가 자체만으로 설명하기 어렵다고 보며, 핵심은 수가 결정 절차와 지출 제약입니다.", "concept": "p_price_volume", "source": "252 Gusmano, 8절"}, {"id": "p6-12", "course": "pubh510", "week": "6w", "topic": "Reading gaps in the evidence", "importance": 3, "why": "근거 부재와 무효과의 구별", "type": "mc", "q": "Stadhouders et al. found no qualifying evaluation for 21 of the 41 cost-containment policy groups, including fee schedules and price negotiations. How should this finding be read?", "options": ["As a gap in research: absence of evaluation is different from evidence that the policies have no effect", "As proof that these policies do not reduce spending", "As proof that these policies shift costs to patients", "As a sign that these policies work only in single-payer systems"], "answer": 0, "explain": "평가가 없는 21개 정책군은 문헌고찰의 검색과 포함 기준으로 근거를 확보하지 못한 범주이며 효과가 없다는 평가 결과와 구별하여야 합니다. 이 결과는 강의에서 설명한 효능의 역설, 곧 효과가 있어 보이는 정책이 오히려 문헌에서 적게 연구된다는 문제와도 연결됩니다.", "concept": "p_policy_choice", "source": "253 Stadhouders, 5절 나항"}, {"id": "p6-13", "course": "pubh510", "week": "6w", "topic": "Catalytic events", "importance": 3, "why": "정책 선택 요인 적용", "type": "mc", "q": "The list price of a Humalog insulin vial rose from about $26 in the 1990s to over $300 in the mid-2010s with no change in the product, which drew public attention and led to the 2022 Inflation Reduction Act's drug price rules for Medicare. Which factor shaping cost-constraint choices does this illustrate?", "options": ["Historical legacies", "Changing international policy norms", "Catalytic events", "The paradox of efficacy"], "answer": 2, "explain": "강의에서는 비용 제약 정책 선택에 영향을 주는 세 요인으로 역사적 유산, 촉발 사건, 국제적으로 변하는 정책 규범을 설명하고, 인슐린 가격 인상을 주목할 만한 가격 사건의 사례로 들었습니다. 기존 기술에 변화가 없었는데도 가격 인상만으로 정책 결정자와 대중과 언론의 관심이 집중되었다는 점에서 이 사례는 촉발 사건에 해당합니다.", "concept": "p_policy_choice", "source": "113 Costs 2, 4절 나항 및 라항"}, {"id": "p6-14", "course": "pubh510", "week": "6w", "topic": "Caveat on cost sharing", "importance": 3, "why": "본인부담의 효과와 한계", "type": "mc", "q": "Stadhouders et al. found good-quality evidence that cost sharing reduces spending. Which caveat do they attach to it?", "options": ["It works only for drugs and has no effect on hospital care", "It increases administrative costs because insurers must collect payments", "It cannot be evaluated because no randomized trial exists", "It shifts costs to patients, cuts necessary as well as unnecessary care, and can hurt access for low-income groups"], "answer": 3, "explain": "저자들은 본인부담이 필요한 진료와 불필요한 진료를 함께 줄일 수 있고 저소득 집단의 접근에 더 크게 영향을 주며 비용을 환자에게 이전하므로 총 의료비 효과가 제한된다고 지적합니다. 1974년 RAND 건강보험 실험에서 무작위 대조시험으로 지출 억제 효과가 확인되었으므로 평가가 불가능하다는 보기는 틀립니다.", "concept": "p_policy_choice", "source": "253 Stadhouders, 6절"}, {"id": "p6-15", "course": "pubh510", "week": "6w", "topic": "Value-based care: US vs Canada", "importance": 3, "why": "중간시험 출제 비교 문항", "type": "mc", "q": "Farahati et al. compare value-based care in the US and Canada. Which statement best captures the contrast in how it is financed and organized?", "options": ["Canada relies on shared-savings contracts among many insurers, while the US uses population-based public funding", "The US relies on contracts among many payers with performance incentives (shared savings, bundled payments, pay-for-performance), while Canada relies on public financing with population-level planning and outcome-based funding", "Both countries rely mainly on a single national payer that sets bundled prices", "The US relies on global budgets for whole provinces, while Canada relies on private capitation plans"], "answer": 1, "explain": "미국은 다수 지불자의 성과 연동 상환과 위험 분담 계약으로 제공자의 유인을 조정하고, 캐나다는 주 단위 공적 재정과 인구 단위 계획 및 성과 기반 재정을 사용합니다. 첫째 보기는 두 나라의 방식을 반대로 서술한 것이고, 미국에는 단일 지불자가 없으므로 셋째 보기도 틀립니다.", "concept": "p_vbp_pooling", "source": "254 Farahati, 1절 및 3절"}, {"id": "p6-16", "course": "pubh510", "week": "6w", "topic": "Reading country indicators causally", "importance": 3, "why": "국가 지표를 인과로 읽는 오류", "type": "mc", "q": "A student writes: Canada's 30-day readmission rate (8.4%) is lower than the US rate (15.2%), which proves that Canada's value-based care models work better. How does Farahati's own design limit this inference?", "options": ["The indicators describe whole systems and are not causal estimates for particular value-based care programs; the authors did not estimate causal effects and used non-systematic searches", "The inference is valid, because the figures come from OECD and CIHI data", "The inference is invalid because readmission is not a quality indicator", "The inference is invalid because Canada has no value-based care programs"], "answer": 0, "explain": "Farahati 등은 국가별 비용과 임상 지표를 체계 전체를 비교하는 자료로 제시하고, 이 지표를 개별 가치 기반 진료 사업의 인과 효과 추정치로 해석하여서는 안 된다고 밝힙니다. 저자들의 문헌 검색도 PRISMA를 따르지 않은 표적 비체계적 검색이어서 단일한 최적 모형을 선별하는 비교가 아닙니다.", "concept": "p_vbp_pooling", "source": "254 Farahati, 5절 및 6절"}, {"id": "p6-17", "course": "pubh510", "week": "6w", "topic": "Pooled health and social care budgets", "importance": 3, "why": "예산 통합의 실제 효과", "type": "mc", "q": "A health minister expects England's Better Care Fund, which pooled health and social care budgets, to cut hospital use within a year. What did Stokes et al. find?", "options": ["Emergency admissions fell sharply in every local area, with the largest drop among healthy patients", "Hospital costs fell in the short term but rose again in the second year", "No overall effect on any of the seven hospital indicators; among patients with multimorbidity, bed-days rose slightly, which the authors read as pooling stimulating extra integrated care activity", "Delayed discharges were eliminated, but outpatient visits increased"], "answer": 2, "explain": "7개 지표 모두에서 5% 수준의 전체 효과가 없었고, 여러 질환을 함께 앓는 환자(multimorbidity)의 단기 재원일수가 그렇지 않은 환자보다 0.164일 더 늘었습니다. 저자들은 이 증가를 의도한 방향은 아니지만 예산 통합이 통합진료 활동을 자극한 흔적으로 해석하며, 병원 이용이나 비용의 감소는 확인되지 않았습니다.", "concept": "p_vbp_pooling", "source": "256 Stokes, 4절 및 5절"}, {"id": "p6-18", "course": "pubh510", "week": "6w", "topic": "National de-adoption guidance and local policy", "importance": 2, "why": "전국 지침과 지역 이행", "type": "tf", "q": "In Conefrey et al.'s analysis of England's Evidence-based Interventions programme, local commissioning policies matched the national recommendations more often for the do-not-do procedures (72%) than for the restricted-access procedures (43%).", "options": ["True", "False"], "answer": 0, "explain": "중단 대상 시술의 지역 정책은 61개 중 44개(72%)가, 제한 접근 시술은 245개 중 106개(43%)가 국가 권고와 일치하였습니다. 법정 지침이었는데도 전체 일치율은 49%에 그쳤으며, 이는 정책 문서가 권고와 일치하는지를 분석한 결과이므로 수술 시행 감소의 인과효과로 해석할 수 없습니다.", "concept": "p_vbp_pooling", "source": "255 Conefrey, 1절 다항 및 4절"}, {"id": "p7-01", "course": "pubh510", "week": "7w", "topic": "Success is invisible", "importance": 3, "why": "예방 성공은 눈에 보이지 않음", "type": "mc", "q": "Measles has been eliminated in the US, and many clinicians have never seen a case, so the threat feels remote and vaccination seems less urgent. Which of Fineberg's obstacles to prevention does this best illustrate?", "options": ["Long time delay between the intervention and its benefit", "Success is invisible", "Changing circumstances require constant adaptation", "Benefits do not accrue to the payer"], "answer": 1, "explain": "예방이 성공하면 질병이 발생하지 않으므로 예방의 성과로 제시할 사례가 없고, 시간이 경과하면 사람들은 위협이 있었다는 사실도 잊습니다. 시간 지연은 접종 시점과 편익이 나타나는 시점 사이의 간격에 관한 장애요인이므로, 임상의가 홍역 환자를 본 적이 없어 위협을 느끼지 못하는 이 사례의 핵심이 아닙니다.", "concept": "p_fineberg_barriers", "source": "114 Keeping People Healthy, 1절 가항; 258 Fineberg, 3절 나항"}, {"id": "p7-02", "course": "pubh510", "week": "7w", "topic": "Consistent vs US-specific obstacles", "importance": 3, "why": "국가 공통 요인과 미국 특유 요인", "type": "mc", "q": "The lecture said three of Fineberg's 12 obstacles act in every country regardless of income or health situation, while four are especially strong in the US. Which of the following is one of the consistent obstacles rather than a US-specific one?", "options": ["Corporate campaign financing", "Individualism", "Long time delay before benefits appear", "Emphasis on choice and high social mobility"], "answer": 2, "explain": "Fineberg의 장애요인 가운데 모든 국가에서 일관되게 작용하는 요인은 긴 시간 지연, 성공이 보이지 않음, 변화하는 상황에 대한 지속적 적응의 세 가지입니다. 반면 기업의 선거자금, 개인주의, 선택 중시와 높은 사회적 이동성은 보이지 않는 위협의 낮은 현저성과 함께 미국에서 특히 강한 네 요인에 속합니다.", "concept": "p_fineberg_barriers", "source": "114 Keeping People Healthy, 1절 가항ㆍ나항"}, {"id": "p7-03", "course": "pubh510", "week": "7w", "topic": "Patients-in-waiting", "importance": 2, "why": "선별의 불확실한 결과", "type": "tf", "q": "In Timmermans and Buchbinder's study of expanded newborn screening, most positive screens ended with repeat testing confirming a serious, well-established disease.", "options": ["True", "False"], "answer": 1, "explain": "Timmermans와 Buchbinder의 연구에서 재검사로 위양성이 확인된 사례가 90퍼센트를 넘었고 분명한 질병이 확인된 가족은 1퍼센트 미만이었으며, 나머지 일부 사례는 질병 여부가 확정되지 않아 대기 환자(patients-in-waiting)로 남았습니다. 따라서 대부분의 양성 결과가 재검사에서 심각한 질병으로 확인되었다는 진술은 틀립니다.", "concept": "p_uspstf_screening", "source": "260 Timmermans, 5절 다항"}, {"id": "p7-04", "course": "pubh510", "week": "7w", "topic": "Cost-effective vs cost-saving", "importance": 3, "why": "절감 기준이면 좋은 예방도 탈락", "type": "mc", "q": "The NHS reviewed 200 candidate prevention interventions: 30 saved money, 150 improved health at modest cost without saving money, and about 20 did neither. What follows if a policymaker insists that a good prevention intervention must save money?", "options": ["Only about 30 would pass, so about 150 health-improving interventions would be classed as failures", "Most of the 200 would pass, because prevention usually saves money", "Only the 20 that did neither would be rejected", "All 200 would be rejected, because none improved health"], "answer": 0, "explain": "정책결정자가 비용 절감을 기준으로 삼으면 비용을 절감한 약 30개 개입만 통과하고 건강을 개선한 150개 개입은 실패로 분류됩니다. 치료도 비용을 절감하는 경우가 거의 없어 건강 개선과 비용만큼의 가치를 기준으로 평가받으므로, 예방도 같은 기준으로 평가하여야 합니다.", "concept": "p_prevention_value", "source": "114 Keeping People Healthy, 1절 나항"}, {"id": "p7-05", "course": "pubh510", "week": "7w", "topic": "Smoking cessation and health spending", "importance": 2, "why": "성과가 좋아도 의료비는 늘 수 있음", "type": "mc", "q": "Interventions that cut smoking rates were excellent public health successes, yet they raised health spending in every country. Which mechanism links the fall in smoking to higher spending?", "options": ["Anti-smoking campaigns are expensive to run", "Quitting raises the number of screening tests", "Fewer smokers means less tax revenue to pay for care", "Smoking kills people quickly, so with fewer smokers people survive longer and use care for more years"], "answer": 3, "explain": "흡연은 사람을 빨리 사망하게 하므로 흡연이 감소하면 사람들이 더 오래 생존하면서 더 오랜 기간 의료를 이용하므로 장기적으로 의료비가 증가합니다. 다만 금연은 사람들이 건강한 상태로 계속 일할 수 있게 하여 큰 사회적 편익을 가져오므로, 정책결정자는 비용 외에 어떤 성과를 중시하는지도 함께 검토하여야 합니다.", "concept": "p_prevention_value", "source": "114 Keeping People Healthy, 1절 나항"}, {"id": "p7-06", "course": "pubh510", "week": "7w", "topic": "Double standard", "importance": 3, "why": "예방과 치료의 평가 기준이 다름", "type": "tf", "q": "Fineberg describes a double standard: a new treatment is expected only to offer better value, whereas a prevention intervention is expected to be effective and cost-effective and also to produce net savings.", "options": ["True", "False"], "answer": 0, "explain": "Fineberg가 지적한 이중 잣대는 새 치료에는 비용만큼의 가치만 기대하면서 예방 개입에는 효과와 비용 대비 효과에 더하여 순절감까지 기대하는 태도를 의미합니다. 따라서 이 진술은 맞고, 치료에 순절감을 요구한다고 보는 설명은 이중 잣대의 방향을 반대로 이해한 것입니다.", "concept": "p_prevention_value", "source": "258 Fineberg, 3절 카항; 114, 1절 가항"}, {"id": "p7-07", "course": "pubh510", "week": "7w", "topic": "Education vs taxation and the SES gradient", "importance": 3, "why": "개입 유형별 격차의 방향", "type": "mc", "q": "After smoking campaigns began in the late 1960s, smoking fell sharply among college graduates but hardly changed among people with a high school education or less. Taxes on harmful products, by contrast, changed behavior most among low-income households. Which explanation fits both findings?", "options": ["Both interventions work mainly through information, so uptake follows education level", "Taxes are enforced more strictly on low-income households", "Campaign uptake differs by education level, while a price rise changes the behavior of those who cannot afford to keep buying", "Campaigns were designed to target college graduates"], "answer": 2, "explain": "공공 교육 캠페인은 집단마다 수용 정도가 달라 교육 수준이 높은 집단에서만 큰 효과를 거둡니다. 반면 유해 제품에 조세를 부과하면 가격이 상승하여 소득이 낮은 집단은 유해 행동을 지속할 여력이 없으므로 이 집단이 가장 큰 건강 편익을 얻고, 고소득자는 세금만 부담할 뿐 행동을 바꾸지 않습니다.", "concept": "p_prevention_equity", "source": "114 Keeping People Healthy, 2절 나항ㆍ다항"}, {"id": "p7-08", "course": "pubh510", "week": "7w", "topic": "Galea: three conditions", "importance": 3, "why": "Galea의 미국 예방 실패 세 조건", "type": "mc", "q": "Galea notes that construction, manufacturing and warehouse workers and bus drivers accounted for a large share of COVID-19 deaths. Which of his three conditions behind the US failure does this best illustrate?", "options": ["Social and economic structures that could not support the changes the virus required, such as working from home", "Poor pre-pandemic health that was unevenly distributed", "Decades of reduced investment in public health structures", "A lack of self-reflection within prevention science"], "answer": 0, "explain": "재택근무는 소득 상위 집단에서만 가능하였으므로 전파를 차단하는 효과가 재택근무가 가능한 사람에게 집중되었고, 일을 계속하여야 하는 노동자의 사망이 많았습니다. 따라서 이 사례는 재택근무처럼 바이러스 대응에 필요한 변화를 감당하지 못한 사회경제 구조의 문제에 해당합니다. 나머지 두 조건은 기저질환의 불균등과 공중보건 투자 감소이며, 자기성찰은 세 조건에 포함되지 않고 향후 예방 의제 가운데 하나입니다.", "concept": "p_prevention_equity", "source": "257 Galea, 2절"}, {"id": "p7-09", "course": "pubh510", "week": "7w", "topic": "Undiscovered chronic disease", "importance": 3, "why": "미발견 만성질환으로 격차가 커짐", "type": "mc", "q": "According to the lecture on Galea, why did many people with serious conditions such as COPD fail to seek care at their first COVID-19 symptoms?", "options": ["They ignored public health messages out of carelessness", "They did not know they were at high risk, because lacking insurance or stable coverage had kept them out of the health system and their conditions were never diagnosed", "They distrusted vaccines promoted by the MAHA movement", "Clinicians had told them COPD carried no extra risk"], "answer": 1, "explain": "건강보험이 없거나 보험 가입이 불안정한 사람은 의료체계를 이용하지 않아 기저질환을 몰랐고 스스로 건강하다고 믿었으므로, 첫 증상이 나타났을 때 진료를 받지 않은 행동을 부주의로 볼 수 없습니다. 이처럼 발견되지 않은 만성질환은 경제적 취약 집단과 인종적 소수 집단에 집중되어 있었으므로 코로나19의 결과에서 집단 간 격차가 커졌습니다.", "concept": "p_prevention_equity", "source": "114 Keeping People Healthy, 5절 가항"}, {"id": "p7-10", "course": "pubh510", "week": "7w", "topic": "USPSTF grades and ACA coverage", "importance": 3, "why": "A/B는 보장의 하한", "type": "mc", "q": "Siu and colleagues stress that the ACA ties coverage to USPSTF grades. Which statement about this link is correct?", "options": ["A grade I (insufficient evidence) means insurers may not cover the service", "The Task Force decides which services insurers must cover, weighing cost", "Grades A and B set a floor for no-cost-sharing coverage, but insurers or legislators may still cover C or I services", "The ACA prohibits coverage of services graded C or D"], "answer": 2, "explain": "ACA는 A와 B 등급 서비스를 본인부담 없이 보장하도록 의무화할 뿐이고, 이 의무는 보장의 하한이므로 보험자나 입법자는 C 등급이나 I 등급 서비스도 보장할 수 있습니다. 또한 USPSTF는 과학적 효과만 평가하고 보장 여부를 권고하지 않으며, I 등급은 근거가 불충분하다는 선언이므로 보험자가 그 서비스를 보장할 수 없다는 의미로 해석할 수 없습니다.", "concept": "p_uspstf_screening", "source": "259 Siu, 1절"}, {"id": "p7-11", "course": "pubh510", "week": "7w", "topic": "Which service is free", "importance": 3, "why": "등급에 따른 본인부담 차이", "type": "mc", "q": "Under the PPACA, which of the following services must be covered with no cost sharing for every insured patient?", "options": ["Support and counseling for breastfeeding for pregnant women and new mothers (grade B)", "Diet and physical activity counseling for adults without known cardiovascular risk (grade C)", "Multifactorial fall-prevention interventions for adults 65 and older (grade C)", "Vitamin D supplementation for fall prevention in people without a known deficiency (grade D)"], "answer": 0, "explain": "PPACA에 따라 A 또는 B 등급 서비스만 본인부담 없이 보장되며, 모유 수유 지원은 B 등급입니다. C 등급 서비스는 일부 환자에게만 적절하다는 권고여서 본인부담 없는 보장 대상에 포함되지 않으므로 환자가 비용을 분담하고, D 등급은 임상의가 권고하지 않아야 하는 서비스입니다.", "concept": "p_uspstf_screening", "source": "114 Keeping People Healthy, 2절 라항"}, {"id": "p7-12", "course": "pubh510", "week": "7w", "topic": "Artiga and Hinton's categories", "importance": 3, "why": "HRSN 다섯 범주", "type": "mc", "q": "Besides health care itself, which set lists the five categories of health-related social needs in the Artiga and Hinton framework used in the lecture?", "options": ["Economic stability; physical environment; education; food; health insurance", "Economic stability; employment; education; food; community and social context", "Economic stability; physical environment; education; health care system; community and social context", "Economic stability; physical environment; education; food; community and social context"], "answer": 3, "explain": "Artiga와 Hinton의 분류에서 건강 관련 사회적 필요의 다섯 범주는 경제적 안정, 물리적 환경, 교육, 식품, 지역사회와 사회적 맥락이며, 두 저자는 보건의료를 이 다섯 범주와 별도의 정책 영역으로 구분합니다. 따라서 보험이나 보건의료 체계를 다섯 범주에 포함하거나 물리적 환경이나 식품을 다른 항목으로 대체한 선택지는 틀립니다.", "concept": "p_policy_silos", "source": "115 Integrating Social Determinants, 1절 가항; 261 Artiga, 3절"}, {"id": "p7-13", "course": "pubh510", "week": "7w", "topic": "Why silos arise", "importance": 3, "why": "전문화와 예산 경쟁에 따른 정책 칸막이", "type": "mc", "q": "Policy silos are said to arise in all governments, not only in market-oriented countries such as the US. What is the lecture's explanation?", "options": ["Legislatures deliberately prevent ministries from sharing data", "Ministries specialize in expert fields and compete for limited annual budgets, so they use different language and may not reveal their programs", "Only countries with a single insurer avoid specialization", "Health ministries refuse on principle to fund housing and food programs"], "answer": 1, "explain": "각 부처는 전문 지식이 필요한 프로그램을 운영하고 한정된 연간 예산을 확보하려고 서로 경쟁하므로, 관심 범위가 자기 분야로 좁아지고 부처마다 사용하는 용어가 다르며 예산을 빼앗길 우려 때문에 사업을 공개하지 않으려는 유인도 있습니다. 이러한 정책 칸막이는 시장 지향 국가인 미국에 국한되지 않고 모든 정부에서 나타납니다.", "concept": "p_policy_silos", "source": "115 Integrating Social Determinants, 1절 나항"}, {"id": "p7-14", "course": "pubh510", "week": "7w", "topic": "Kennedy and the pesticide case", "importance": 2, "why": "부처별 이해관계로 협력이 실패", "type": "mc", "q": "HHS Secretary Kennedy pushed to cut agricultural pesticide use under the MAHA agenda, but in cabinet discussion the Agriculture Secretary's emphasis on output and profit prevailed. Which idea from the lecture does this case best show?", "options": ["Health impact assessments were skipped", "Medicaid managed care contracts cannot cover pesticide exposure", "Departments follow their own stakeholders and agendas, so cooperation can fail even when one agency head wants it", "Congressional committees blocked the proposal before it reached the cabinet"], "answer": 2, "explain": "각 부처는 고유한 이해관계자와 의제를 따르므로, 보건복지부 장관이 농약 사용 감소를 주장하였어도 내각 논의에서는 생산량과 수익을 중시하는 농무부 장관의 입장이 우세하였습니다. 이 사례에서 협력이 실패한 원인은 행정부 내부의 정책 칸막이이며, 의회 위원회나 건강영향평가와는 관련이 없습니다.", "concept": "p_policy_silos", "source": "115 Integrating Social Determinants, 1절 나항; 114, 5절 나항"}, {"id": "p7-15", "course": "pubh510", "week": "7w", "topic": "Doty: variation in coordination", "importance": 3, "why": "Doty 장벽 3가지로 편차 설명 불가", "type": "mc", "q": "Doty et al. found that primary care physicians' frequent coordination of social and community services ranged from 12% in Sweden to 74% in Germany, and listed three barriers: no referral system, too few staff to refer, and too few staff to track whether patients received services. Which finding in the lecture shows these barriers do not explain the variation?", "options": ["Countries with a single insurer all coordinated at high rates", "The US reported barriers similar to Germany's yet coordinated far less often (40% vs. 74%)", "Sweden, the lowest, reported far fewer barriers than the US", "The UK reported far fewer staff shortages than Germany but coordinated less"], "answer": 1, "explain": "미국은 장벽 응답이 독일과 비슷한데도 조정 비율이 낮았고, 영국은 인력 부족 응답이 독일보다 훨씬 많은데도 조정 비율이 비슷하였으며, 가장 낮은 스웨덴은 미국과 장벽 응답이 거의 같았습니다. 단일보험자 체계인지 국가보건서비스인지와도 일관된 관계가 없었습니다.", "concept": "p_policy_silos", "source": "115 Integrating Social Determinants, 2절 가항; 262 Doty, 4절 다항"}, {"id": "p7-16", "course": "pubh510", "week": "7w", "topic": "HiAP and HIA in practice", "importance": 3, "why": "HiAP의 정의와 도구", "type": "mc", "q": "A state transportation department must assess how a proposed highway would affect the health of nearby residents before the plan is approved. Which approach is this?", "options": ["A place-based initiative such as the Harlem Children's Zone", "Medicaid health homes", "Health in All Policies, using a health impact assessment", "Screening and referral through Accountable Health Communities"], "answer": 2, "explain": "‘모든 정책에 건강을’(Health in All Policies, HiAP)은 여러 부문의 의사결정에 건강 고려를 포함하는 접근이고, 건강영향평가는 새 고속도로 건설처럼 정책이 주민 건강에 미칠 영향을 구조화하여 평가하는 도구입니다. 반면 장소 기반 사업은 건강 결과가 나쁜 지역에서 여러 부문의 전략을 시행하는 사업이어서, 고속도로 계획을 승인하기 전에 건강 영향을 평가하는 이 사례와 다릅니다.", "concept": "p_hiap", "source": "115 Integrating Social Determinants, 4절 가항ㆍ다항; 261 Artiga, 4절 가항; 263 Maybank, 3절"}, {"id": "p7-17", "course": "pubh510", "week": "7w", "topic": "Maybank vs Fineberg", "importance": 3, "why": "두 읽을거리의 장애요인 연결", "type": "mc", "q": "The lecture said one of Maybank's barriers to Health in All Policies is the same problem as one of Fineberg's 12 obstacles to prevention. Which one?", "options": ["Ignorance: public health and other agencies do not know the approach", "Time horizons and leadership: officials believe medical care is the main determinant of health", "Corporate campaign financing of elected officials", "Lack of a compelling narrative: treatment has dramatic life-saving stories while prevention's success goes unseen"], "answer": 3, "explain": "치료에는 생명을 극적으로 구하는 서사가 있으나 예방은 성과가 드러나지 않으므로 보건 외 부처가 참여하여도 성과를 인정받기 어렵고, Maybank가 제시한 이 설득력 있는 서사의 부재는 Fineberg의 장애요인 가운데 성공이 보이지 않는다는 문제와 같습니다. 인식 부족과 시간 범위ㆍ지도력은 Maybank의 나머지 두 가설이며 Fineberg의 목록과 직접 대응하지 않습니다.", "concept": "p_hiap", "source": "115 Integrating Social Determinants, 4절 나항; 258 Fineberg, 3절"}, {"id": "p7-18", "course": "pubh510", "week": "7w", "topic": "What HIAs miss", "importance": 3, "why": "HIA는 단기 측정 영향만 포착", "type": "mc", "q": "A city adds traffic near a school. A health impact assessment can readily capture crashes and noise. According to the lecture, which impact is it most likely to miss?", "options": ["Injuries from traffic crashes", "Lower educational attainment decades later, because noise disrupted children's sleep and concentration", "Real-time noise levels outside the school", "Short-term changes in traffic volume"], "answer": 1, "explain": "건강영향평가는 교통사고와 소음처럼 단기에 실시간으로 발생하는 영향은 측정할 수 있으나, 소음이 아동의 수면과 학업 집중을 해쳐 교육 수준을 낮추는 영향은 20~30년 뒤에 나타나고 그 크기도 추정하기 어렵습니다. 가장 중대한 영향일수록 단기에 측정하기 어려우므로 건강영향평가는 불완전해질 가능성이 큽니다.", "concept": "p_hiap", "source": "115 Integrating Social Determinants, 4절 다항"}, {"id": "p7-19", "course": "pubh510", "week": "7w", "topic": "Matching needs to providers", "importance": 2, "why": "필요의 지속 기간과 수준에 따른 배정", "type": "mc", "q": "One patient cannot prepare meals for a month after hospital discharge. Another repeatedly runs short of food every month because income is too low. Following the lecture's discussion of where to place social-needs work, who fits best?", "options": ["Primary care for the first patient and the hospital for the second", "The hospital for both, because it has a wide catchment area", "Hospital-arranged meal delivery for the first patient, and a primary care clinician who knows the patient for the second, given the stigma of poverty", "Primary care for both, because it is the first point of contact"], "answer": 2, "explain": "퇴원 후 한 달 동안의 단기 식품 불안정은 병원이 식사 배달을 연계하여 해결할 수 있습니다. 반면 소득 부족으로 반복되는 식품 불안정에 대응할 때에는 빈곤에 따르는 낙인을 고려하여야 하므로, 환자와 신뢰 관계가 있는 일차의료 임상의가 대응하는 편이 적합할 수 있습니다. 이 배정은 수업에서 논의한 판단 기준에 따른 것이며, 읽을거리에 정해진 정답은 없습니다.", "concept": "p_sdoh_targeting", "source": "115 Integrating Social Determinants, 2절 다항"}, {"id": "p7-20", "course": "pubh510", "week": "7w", "topic": "Most needy vs most clarity", "importance": 3, "why": "표적화의 상충관계", "type": "mc", "q": "Among Medicare beneficiaries, about half reported no health-related social need and about a quarter reported exactly one. Which argument supports prioritizing the one-need majority over the many-needs minority?", "options": ["Related needs such as financial strain and food and housing insecurity can be solved together by one intervention such as income stabilization", "It helps the most desperate people first", "Complex interactions among needs raise the return on investment", "The intervention point and causal factor are clear, there are no complex interactions among needs, and more people are reached"], "answer": 3, "explain": "필요가 하나인 집단을 우선하면 더 많은 사람에게 도달할 수 있고 개입 지점과 인과 요인이 명확하여 투자수익이 클 수 있습니다. 연관된 필요를 한 개입으로 함께 해소할 수 있다는 점과 가장 절실한 사람을 먼저 지원한다는 점은 필요가 많은 집단을 우선하는 논거이고, 필요 사이의 복잡한 상호작용은 오히려 필요가 많은 집단에 대한 개입을 어렵게 하는 요인입니다. 두 선택 모두 정당화할 수 있으므로 정책결정자는 상충관계에 직면합니다.", "concept": "p_sdoh_targeting", "source": "115 Integrating Social Determinants, 3절 나항"}, {"id": "p7-21", "course": "pubh510", "week": "7w", "topic": "Reading average ROI", "importance": 2, "why": "평균 ROI는 개별 기대값이 아님", "type": "tf", "q": "Nikpay and colleagues found an average ROI of 85% for food-insecurity programs, so a newly designed food program can be expected to return about 85% in health care savings.", "options": ["True", "False"], "answer": 1, "explain": "85퍼센트는 Nikpay 등이 ROI를 계산할 수 있었던 연구 7편의 평균이고, 개별 연구의 ROI는 1퍼센트에서 287퍼센트까지 분포하였으며 한 편은 음의 값(-31퍼센트)이었습니다. 이 평균은 보건의료 부문의 수익만 반영하고 분석 대상 연구의 절반 가까이가 개입 전후를 단순 비교한 연구이므로, 새로 설계한 식품 프로그램에서 기대할 수익으로 해석하기 어렵습니다.", "concept": "p_sdoh_targeting", "source": "264 Nikpay, 4절ㆍ5절"}, {"id": "p7-22", "course": "pubh510", "week": "7w", "topic": "EITC access in recessions", "importance": 2, "why": "근로 연동 지원의 접근 불형평", "type": "mc", "q": "Finkelstein et al. note that work-linked tax credits such as the EITC protect families poorly in recessions, and that Black families are more exposed. Which mechanism links the program's design to this inequity?", "options": ["The EITC requires employment, and Black families face higher unemployment, so they lose eligibility when the safety net is most needed", "The EITC pays lower amounts to Black families by law", "TANF sanctions automatically replace the EITC in recessions", "Black families are less likely to file taxes because the IRS lacks their data"], "answer": 0, "explain": "EITC는 취업을 자격 요건으로 하므로 가족이 EITC를 받을 수 있는지는 노동시장의 강도에 따라 달라지며, 실업률이 더 높은 흑인 가족은 안전망이 가장 필요한 경기 침체기에 수급 자격을 상실할 가능성이 큽니다. 세금 미신고는 이와 별개의 접근 장벽이고, 국세청은 필요한 자료를 이미 보유하고 있으므로 자료 부족을 원인으로 볼 수 없습니다.", "concept": "p_sdoh_targeting", "source": "265 Finkelstein, 5절"}];
const CONCEPTS = [{"id": "c_mi", "title": "Meaningful involvement", "kor": "실질적 참여의 4요건", "week": "7w", "oneline": "EPA는 영향을 받는 지역사회의 의견이 결정에 영향을 미칠 수 있어야 실질적 참여로 정의한다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Opportunity to take part"}, {"t": "Input can influence the decision", "k": 1}, {"t": "Concerns are considered"}, {"t": "Decision makers seek out the affected people"}], "note": "EPA: four conditions of meaningful involvement"}, {"type": "table", "head": ["", "Public relations", "Public participation"], "rows": [["What it does", "Tell the public, explain decisions", "Involve people, weigh their input"], ["Listening session with no response", "Counts", "Does not count"]]}], "points": ["홍보(public relations)는 공중에게 알리는 일이고, 참여는 의견을 받아 결정에 반영하는 일이다.", "응답과 후속 조치가 없는 청취 회의는 실질적 참여에 해당하지 않는다.", "EPA의 정의는 웹사이트에만 게시되어 법적 구속력이 없다."], "terms": [["meaningful involvement", "실질적 참여"], ["listening session", "청취 회의"], ["announce and defend", "먼저 발표하고 방어하는 방식"]], "course": "ehs544"}, {"id": "c_cercla", "title": "CERCLA and cooperation", "kor": "CERCLA와 협력의 유인", "week": "7w", "oneline": "Love Canal 주민 운동의 결과로 1980년에 제정된 CERCLA의 엄격책임과 연대책임은 책임 있는 민간이 정화에 협력할 이유가 된다.", "diagram": [{"type": "flow", "items": [{"t": "Love Canal", "s": "mothers' movement"}, {"t": "CERCLA 1980", "s": "Superfund", "k": 1}, {"t": "Win-win", "s": "liable parties have a reason to help clean up"}]}, {"type": "grid", "items": [{"t": "Current owners"}, {"t": "Former owners"}, {"t": "Arrangers"}, {"t": "Transporters"}], "note": "Liable parties. Liability is strict, joint and several."}], "points": ["책임 당사자는 현재와 과거의 소유자, 폐기물 처리를 위탁한 자, 운반자이다.", "교수는 현 행정부에서도 슈퍼펀드 사업의 지역사회 참여가 서로 이익이 된다고 설명하였다."], "terms": [["strict, joint and several liability", "엄격책임, 연대책임"], ["arranger", "폐기물 처리를 맡긴 자"]], "course": "ehs544"}, {"id": "c_eo", "title": "Executive orders", "kor": "행정명령 12898호에서 14173호까지", "week": "8w", "oneline": "1994년 12898호와 2023년 14096호는 2025년에 모두 철회되었으며, 어느 철회 명령이 어느 명령을 대상으로 하였는지가 핵심이다.", "diagram": [{"type": "timeline", "items": [{"d": "1994", "t": "EO 12898", "s": "Minority and low-income populations"}, {"d": "2023", "t": "EO 14096", "s": "Adds climate risk and cumulative impacts"}, {"d": "2025", "t": "EO 14148", "s": "Rescinds EO 14096"}, {"d": "2025", "t": "EO 14173", "s": "Rescinds EO 12898", "k": 1}]}, {"type": "table", "head": ["Rescinding order", "Order rescinded"], "rows": [["EO 14148", "EO 14096 (2023)"], ["EO 14173", "EO 12898 (1994)"]]}], "points": ["14148호는 14096호를, 14173호는 12898호를 철회하였다.", "14096호는 부족 소속, 장애, 기후 위험, 누적 영향을 정의에 추가하였다."], "terms": [["rescind", "철회하다"], ["cumulative impacts", "누적 영향"]], "course": "ehs544"}, {"id": "c_hbg", "title": "Hidden but not Gone", "kor": "불균형 영향 요인 6가지", "week": "8w", "oneline": "행정명령이 철회되어도 6가지 요인은 의사결정의 증거로 유효하며, 심리사회적 스트레스는 6가지 모두에 작용한다.", "diagram": [{"type": "grid", "items": [{"t": "Proximity and exposure"}, {"t": "Cumulative impacts"}, {"t": "Physical infrastructure"}, {"t": "Susceptible populations"}, {"t": "Unique exposure pathways"}, {"t": "Participating in decision making"}], "note": "Six disproportionate impact factors"}, {"type": "flow", "items": [{"t": "Psycho-social stressors", "s": "act on all six factors", "k": 1}], "note": "Revoked orders hid these factors. They still count as evidence."}], "points": ["암기 대상은 6개 요인의 목록과 모든 요인에 작용하는 요인 1개이다.", "의사결정 참여도 6개 요인에 포함된다."], "terms": [["disproportionate impact factors", "불균형 영향 요인"], ["psycho-social stressors", "심리사회적 스트레스 요인"]], "course": "ehs544"}, {"id": "c_epa21", "title": "EPA 2021 report", "kor": "EPA 2021년 보고서의 옥외 노동 수치", "week": "8w", "oneline": "EPA 2021년 보고서의 기후 영향 6가지 가운데 극한 기온과 노동이 옥외 노동자 논거와 연결된다.", "diagram": [{"type": "flow", "items": [{"t": "Outdoor-exposed industries", "s": "construction, farming"}, {"t": "Higher share of Hispanic and Latino workers"}, {"t": "43% more likely", "s": "to live where labor hours fall most at 2°C", "k": 1}], "note": "EPA 2021, Climate Change and Social Vulnerability"}], "points": ["2°C 상
