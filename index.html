const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const daysLeft=c=>Math.max(0,Math.round((new Date(examOf(c)+'T00:00').getTime()-t0())/DAY));
// 간격: 기본 1·2·4·7일, 시험까지 남은 기간의 25%를 넘지 않게 줄인다
const gap=(c,box)=>{const dl=daysLeft(c);return Math.max(1,Math.min(BASE[box],dl>0?Math.round(dl*0.25):1))};

let cur={course:'ehs544',tab:'today',concept:null}, run=null;
const due=c=>itemsOf(c).filter(isDue).sort((a,b)=>b.importance-a.importance);
const fresh=c=>itemsOf(c).filter(isNew).sort((a,b)=>b.importance-a.importance||parseInt(a.week)-parseInt(b.week));
function pick(c,only){
  if(only)return shuffle(itemsOf(c).filter(x=>x.concept===only));
  const d=due(c).slice(0,SESSION), n=fresh(c).slice(0,Math.max(0,Math.min(NEWMAX,SESSION-d.length)||NEWMAX));
  return shuffle(d.concat(n)).slice(0,SESSION);
}
function side(){
  const s=document.getElementById('side');s.textContent='';
  s.append(el('div',{class:'t'},'복습'));
  const l=el('div',{class:'list'});
  COURSES.forEach(c=>{const n=itemsOf(c.id).length,k=due(c.id).length+(n?Math.min(NEWMAX,fresh(c.id).length):0);
    l.append(el('a',{class:(cur.course===c.id?'on ':'')+(n?'':'empty'),href:'#',onclick:e=>{e.preventDefault();go(c.id,'today')}},el('span',{},c.name),el('span',{},n?k+'문제':'준비 중')))});
  s.append(l);
  s.append(el('div',{class:'foot'},el('button',{onclick:exp},'내보내기'),' · ',el('button',{onclick:()=>document.getElementById('imp').click()},'가져오기'),
    el('input',{id:'imp',type:'file',accept:'.json',style:'display:none',onchange:imp})));
}
function go(c,tab,concept){cur={course:c,tab,concept:concept||null};run=null;render();window.scrollTo(0,0)}
function render(){
  side();const app=document.getElementById('app');app.textContent='';
  const c=course(cur.course), all=itemsOf(c.id);
  app.append(el('h1',{},c.name+(c.full?' · '+c.full:'')));
  if(!all.length){app.append(el('p',{class:'sub'},'문제 준비 중'));return}
  app.append(el('p',{class:'sub'},`문제 ${all.length}개 · 복습 ${due(c.id).length} · 새 문제 ${fresh(c.id).length}`));
  const tabs=el('div',{class:'tabs'});
  [['today','오늘'],['map','개념 지도'],['log','기록']].forEach(([k,l])=>tabs.append(el('button',{class:cur.tab===k?'on':'',onclick:()=>go(c.id,k)},l)));
  app.append(tabs);
  ({today:today,map:map,log:log})[cur.tab](app,c);
}
function today(app,c){
  if(!run){
    const list=pick(c.id,cur.concept);
    if(!list.length){app.append(el('p',{},'오늘 복습을 마쳤습니다.'));return}
    const cc=cur.concept&&CONCEPTS.find(x=>x.id===cur.concept);
    app.append(el('h2',{},cc?cc.title:'오늘의 복습'),el('p',{class:'sub'},`${list.length}문제`),
      el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>{run={q:list.map(x=>x.id),i:0,ok:0,miss:new Set(),done:false,asked:new Set()};render()}},'시작')));
    return;
  }
  if(run.i>=run.q.length)return end(app,c);
  const x=DATA.find(d=>d.id===run.q[run.i]);
  app.append(el('div',{class:'eyebrow'},`${run.i+1} / ${run.q.length} · ${x.week} · ${x.topic}`),el('p',{class:'q'},x.q));
  const b=el('div',{class:'opts'});
  x.options.forEach((o,i)=>b.append(el('button',{class:'opt','data-i':i,onclick:()=>ans(x,i)},(x.type==='tf'?'':el('span',{class:'k'},'ABCD'[i])),el('span',{},o))));
  app.append(b,el('div',{id:'fb'}));
}
function ans(x,i){
  if(run.done)return;run.done=true;
  const ok=i===x.answer;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const j=+b.dataset.i;if(j===x.answer)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  if(!run.asked.has(x.id)){
    run.asked.add(x.id);
    const s=S(x.id)||{box:-1,seen:0,wrong:0};s.seen++;
    if(ok){s.box=Math.min(BASE.length-1,s.box+1);run.ok++}else{s.box=0;s.wrong++;run.miss.add(x.id);run.q.splice(Math.min(run.q.length,run.i+4),0,x.id)}
    if(s.box<0)s.box=0;s.due=t0()+gap(x.course,s.box)*DAY;store.items[x.id]=s;save();
  }
  const fb=document.getElementById('fb');
  fb.append(el('p',{class:'res'},ok?'정답':'오답'),el('p',{class:'exp'},x.explain));
  const cc=CONCEPTS.find(k=>k.id===x.concept), last=run.i===run.q.length-1;
  fb.append(el('div',{class:'bar'},el('button',{id:'next',class:'primary',onclick:nxt},last?'결과':'다음'),cc?el('button',{onclick:()=>go(cur.course,'map',cc.id)},'개념 보기'):''));
  document.getElementById('next').focus();side();
}
function nxt(){run.i++;run.done=false;render();window.scrollTo(0,0)}
function end(app,c){
  app.append(el('h2',{},`${run.asked.size}문제 중 ${run.ok}문제 정답`));
  const cs=[...new Set([...run.miss].map(id=>DATA.find(d=>d.id===id).concept))].filter(Boolean);
  if(cs.length)app.append(el('p',{class:'sub'},'틀린 개념'));
  cs.forEach(id=>{const k=CONCEPTS.find(z=>z.id===id);if(k)app.append(el('p',{},el('button',{onclick:()=>go(c.id,'map',id)},k.title)))});
  app.append(el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>{run=null;render()}},'이어서 풀기')));
}
function map(app,c){
  const all=CONCEPTS.filter(k=>k.course===c.id);
  const list=cur.concept?all.filter(k=>k.id===cur.concept):all;
  if(cur.concept)app.append(el('p',{},el('button',{onclick:()=>go(c.id,'map')},'전체 개념')));
  list.forEach(k=>{
    const n=DATA.filter(d=>d.concept===k.id).length;
    const card=el('section',{class:'card'},el('div',{class:'eyebrow'},k.week),el('h2',{},k.title),el('p',{class:'kor'},k.kor));
    if(Array.isArray(k.diagram))k.diagram.forEach(b=>card.append(block(b)));
    else if(k.diagram)card.append(el('div',{class:'dgm',html:k.diagram}));
    card.append(el('p',{class:'one'},k.oneline));
    if(k.points&&k.points.length)card.append(el('ul',{},k.points.map(p=>el('li',{},p))));
    if(k.terms&&k.terms.length){const t=el('div',{class:'terms'});k.terms.forEach(([a,b])=>t.append(el('b',{},a),el('span',{},b)));card.append(t)}
    if(n)card.append(el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>go(c.id,'today',k.id)},`문제 ${n}개 풀기`)));
    app.append(card)});
}
/* 도식: 모든 과목이 같은 다섯 가지 형식과 같은 스타일을 쓴다 */
const ARROW='<svg viewBox="0 0 22 12"><line x1="0" y1="6" x2="16" y2="6" stroke="#3F4A5A" stroke-width="1.5"/><path d="M15 1 L22 6 L15 11 Z" fill="#3F4A5A"/></svg>';
function bx(it,num){return el('div',{class:'bx'+(it.k?' k':'')},num?el('div',{class:'n'},num):'',el('div',{},it.t),it.s?el('div',{class:'s'},it.s):'')}
function block(b){
  const w=el('div',{class:'dgm'});
  if(b.type==='flow'){const f=el('div',{class:'flow'});b.items.forEach((it,i)=>{if(i){f.append(b.rel?el('div',{class:'rel'},b.rel[i-1]||''):el('div',{class:'ar',html:ARROW}))}f.append(bx(it))});w.append(f)}
  else if(b.type==='grid'){const g=el('div',{class:'grid'});b.items.forEach((it,i)=>g.append(bx(it,b.numbered?String(i+1):'')));w.append(g)}
  else if(b.type==='table'){w.append(el('table',{},el('thead',{},el('tr',{},b.head.map(h=>el('th',{},h)))),el('tbody',{},b.rows.map(r=>el('tr',{},r.map(x=>el('td',{},x)))))))}
  else if(b.type==='timeline'){const t=el('div',{class:'tl'});b.items.forEach(it=>t.append(el('div',{class:'row'+(it.d?'':' nod')},it.d?el('div',{class:'d'},it.d):'',bx(it))));w.append(t)}
  else if(b.type==='chart'){w.append(el('div',{class:'chart',html:chart(b)}))}
  if(b.note)w.append(el('p',{class:'note'},b.note));
  return w;
}
function chart(b){
  const W=Math.min(480,Math.max(300,innerWidth-36)),H=Math.round(W*(b.h||0.62)),L=40,R=12,T=16,B=44,pw=W-L-R,ph=H-T-B;
  const X=v=>L+v*pw,Y=v=>T+(1-v)*ph,esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let s=`<svg viewBox="0 0 ${W} ${H}" font-family="inherit" font-size="16">`;
  s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#3F4A5A" stroke-width="1.5"/><line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="#3F4A5A" stroke-width="1.5"/>`;
  s+=`<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" fill="#3F4A5A">${esc(b.x)}</text><text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" fill="#3F4A5A">${esc(b.y)}</text>`;
  const P=b.points;
  if(b.line)s+=`<polyline points="${P.map(p=>X(p.x)+','+Y(p.y)).join(' ')}" fill="none" stroke="#3F4A5A" stroke-width="1.5"/>`;
  if(b.hull){const[a,c]=b.hull;s+=`<line x1="${X(P[a].x)}" y1="${Y(P[a].y)}" x2="${X(P[c].x)}" y2="${Y(P[c].y)}" stroke="#3F4A5A" stroke-width="1.5"/>`}
  P.forEach(p=>{if(!p.l)return;s+=`<rect x="${X(p.x)-5}" y="${Y(p.y)-5}" width="10" height="10" fill="${p.k?'#00356B':'#fff'}" stroke="#00356B" stroke-width="1.5"/>`;
    const pos=p.pos||'r';let tx=X(p.x)+12,ty=Y(p.y)+5,an='start';
    if(pos==='l'){tx=X(p.x)-12;an='end'}if(pos==='b'){tx=X(p.x);ty=Y(p.y)+26;an='middle'}if(pos==='t'){tx=X(p.x);ty=Y(p.y)-14;an='middle'}
    s+=`<text x="${tx}" y="${ty}" text-anchor="${an}" fill="#1D2430">${esc(p.l)}</text>`});
  return s+'</svg>';
}
function log(app,c){
  const rows=itemsOf(c.id).map(x=>({x,s:S(x.id)})).sort((a,b)=>((b.s?b.s.wrong:-1)-(a.s?a.s.wrong:-1))||b.x.importance-a.x.importance);
  const tb=el('tbody');rows.forEach(({x,s})=>tb.append(el('tr',{},el('td',{},x.topic),el('td',{},x.week),el('td',{class:'num'},s?s.seen:0),el('td',{class:'num'},s?s.wrong:0),el('td',{class:'num'},!s?'미응시':s.due<=t0()?'오늘':Math.round((s.due-t0())/DAY)+'일 뒤'))));
  app.append(el('table',{},el('thead',{},el('tr',{},['주제','주차'].map(h=>el('th',{},h)),['푼 횟수','오답','다음 복습'].map(h=>el('th',{class:'num'},h)))),tb));
  app.append(el('div',{class:'set'},el('label',{for:'ex'},'시험일'),el('input',{id:'ex',type:'date',value:examOf(c.id),onchange:e=>{store.exams[c.id]=e.target.value;save();render()}}),
    el('span',{},`${daysLeft(c.id)}일 남음 · 간격 ${BASE.map((b,i)=>gap(c.id,i)).join('·')}일`)));
  app.append(el('p',{class:'src'},'간격을 둔 복습은 보건의료 전문직의 지식 점수를 높였고(Martinengo 2024, Cochrane 방법론 체계적 문헌고찰, 23개 연구, SMD 0.32), 시험 형식의 복습은 다시 읽기보다 장기 기억에 유리하다(Rowland 2014, g=0.50. Adesope 2017, g=0.70). 최적 간격은 시험까지 남은 기간에 비례하므로(Cepeda 2006, 2008) 시험일에 맞추어 간격을 줄인다. 틀린 문제는 같은 날 한 번 더 출제한다.'));
}
function exp(){const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'})),download:'recall-progress.json'});document.body.append(a);a.click();a.remove()}
function imp(e){const f=e.target.files[0];if(f)f.text().then(t=>{store=JSON.parse(t);save();render()})}
document.addEventListener('keydown',e=>{
  if(cur.tab!=='today'||!run||run.i>=run.q.length)return;
  if(!run.done&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(run.done&&e.key==='Enter'){const n=document.getElementById('next');if(n&&document.activeElement!==n)n.click()}
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
