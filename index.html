<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00356B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>복습</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&display=swap");
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
:root{--yale:#00356B;--yale2:#286DC0;--wash:#EEF3F9;--ink:#1D2430;--ink2:#3F4A5A;--rule:#C9D4E2;--accent:#E8833A;--ok:#1d5e2a;--okbg:#e6f4e6;--no:#b3261e;--nobg:#fbe9e9;
  --serif:'YaleNew','Libre Caslon Text',Georgia,Pretendard,'Malgun Gothic',serif;--head:'Yale 2024','YaleNew','Libre Caslon Text',Georgia,Pretendard,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{display:flex;min-height:100vh;background:#fff;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--yale);color:#fff}
:focus-visible{outline:2px solid var(--yale2);outline-offset:2px}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--yale);border-radius:0;padding:8px 18px;cursor:pointer;min-height:44px}
button:hover{background:var(--wash)}
button.primary{background:var(--yale);color:#fff}
button.primary:hover{background:#0a4a8f}
button:disabled{cursor:default}
#side{width:230px;flex:none;background:var(--yale);color:#fff;padding:36px 22px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .t{font-family:var(--head);font-size:22px;line-height:1.15;margin-bottom:22px}
#side .t small{display:block;font-family:var(--serif);font-size:12px;letter-spacing:.06em;margin-top:6px;color:#c9d9ee}
#side a{display:flex;justify-content:space-between;gap:8px;color:#c9d9ee;padding:7px 0;text-decoration:none;border-bottom:1px solid #1d4f86;cursor:pointer;font-variant-numeric:tabular-nums}
#side a.on{color:#fff;font-weight:700}
#side a.empty{color:#7f9cc4}
#side .foot{margin-top:22px;font-size:12px;color:#c9d9ee;line-height:1.7}
#side .foot button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:0;min-height:0;font-size:12px}
#app{flex:1;min-width:0;max-width:820px;padding:36px 44px 120px}
h1{font-family:var(--head);font-weight:400;color:var(--yale);font-size:28px;line-height:1.15;margin-bottom:6px;text-wrap:balance}
h2{font-family:var(--head);font-weight:400;color:var(--yale);font-size:20px;line-height:1.2;margin:0 0 8px}
.sub{color:var(--ink2);margin-bottom:20px;font-size:14px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;min-height:44px;background:none;color:var(--ink2)}
.tabs button.on{color:var(--yale);border-bottom-color:var(--yale);font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--yale2);border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.q{font-size:18px;line-height:1.6;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:11px 14px;line-height:1.55;border-color:var(--rule);background:#fff}
.opt .k{flex:none;width:16px;color:var(--yale2);font-weight:700}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.opt:disabled:not(.right):not(.wrong){color:#8591a3}
.res{font-weight:700;margin-bottom:4px}.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.exp{max-width:62ch;margin-bottom:6px}
.tag{font-size:13px;color:var(--ink2);margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--ink2);margin-top:14px}
.card{border-top:2px solid var(--yale);padding:14px 0 22px;margin-bottom:8px}
.card .kor{color:var(--ink2);font-size:14px;margin-bottom:8px}
.card .dg{overflow-x:auto;margin:10px 0 12px;scrollbar-width:thin}.card svg{width:100%;height:auto;display:block;background:#fff}.dgh{display:none;font-size:12px;color:var(--ink2)}
.card .one{font-size:17px;margin-bottom:8px;max-width:60ch}
.card ul{padding-left:20px;margin:0 0 10px;max-width:62ch}
.card li{margin-bottom:3px}
.terms{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:14px;margin:8px 0 12px}
.terms b{font-weight:400;color:var(--yale)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
th{border-top:2px solid var(--yale);background:var(--wash);color:var(--yale);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0;font-size:14px}
.set input{font:inherit;border:1px solid var(--rule);padding:6px 8px;border-radius:0;min-height:40px}
.sched{width:100%;font-size:13px}
.src{font-size:12px;color:var(--ink2);max-width:62ch;margin-top:18px}
@media (max-width:760px){
  body{display:block}
  #side{width:auto;height:auto;position:static;padding:14px 18px 8px;display:block}
  #side .t{font-size:18px;margin-bottom:8px}#side .t small{display:none}
  #side .list{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}#side .list::-webkit-scrollbar{display:none}.card svg{min-width:600px}.dgh{display:block}#app{overflow-x:hidden}
  #side a{border:0;padding:6px 0;flex:none}
  #side .foot{display:none}
  #app{padding:20px 18px 100px}
  h1{font-size:24px}
  .q{font-size:17px}
}
</style>
</head>
<body>
<nav id="side" aria-label="과목"></nav>
<main id="app"></main>
<script>
const DATA = [{"id": "w7-01", "course": "ehs544", "week": "7w", "topic": "Meaningful involvement (EPA)", "importance": 3, "why": "시험 2 범위 · 모든 회차의 기준", "type": "mc", "q": "Under EPA's definition of environmental justice, which of the following is one of the conditions of \"meaningful involvement\"?", "options": ["The public's contribution can influence the regulatory agency's decision.", "The agency announces its decision first and then explains it to the public.", "The community must first prove that it has been harmed before it may take part.", "Industry and community members receive the same number of speaking slots."], "answer": 0, "explain": "공중의 기여가 기관의 결정에 영향을 줄 수 있어야 한다는 것이 실질적 참여의 요건입니다. 결정을 먼저 발표하고 설명하는 방식(announce and defend)은 연방 지침이 벗어나려 한 옛 방식입니다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-02", "course": "ehs544", "week": "7w", "topic": "Listening session vs. engagement", "importance": 3, "why": "교수 강조 · 조별 과제 연결", "type": "mc", "q": "A state agency holds a two-hour listening session on a proposed landfill expansion. Residents speak and staff take notes, but the agency gives no written response and takes no follow-up step. Which assessment matches the class discussion?", "options": ["It is meaningful engagement, because residents were able to speak at a public meeting.", "It is not meaningful engagement, because there was no agency response, follow-up, or accountability.", "It is meaningful engagement, because any public meeting satisfies Executive Order 12898.", "It is not meaningful engagement, because listening sessions are banned under 40 CFR Part 25."], "answer": 1, "explain": "청취 회의는 듣기만 하고 응답과 후속 조치가 없으면 실질적 참여가 아닙니다. 발언 기회가 곧 영향력은 아닙니다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 1절 가항"}, {"id": "w7-03", "course": "ehs544", "week": "7w", "topic": "Public relations vs. participation", "importance": 3, "why": "EPA 정의 슬라이드의 핵심 구별", "type": "tf", "q": "Under EPA's framework, public relations (public information) and public participation are the same activity, because both mean giving information to the public.", "options": ["True", "False"], "answer": 1, "explain": "거짓입니다. 홍보는 알리는 일이고 참여는 의견을 받아 결정에 반영하는 일입니다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 다항ㆍ라항"}, {"id": "w7-04", "course": "ehs544", "week": "7w", "topic": "Legal force of EPA's EJ definition", "importance": 2, "why": "교수가 법적 지위를 짚음", "type": "mc", "q": "EPA's definition of environmental justice appears only on its website and has never been put in a rule or guidance. What follows from this?", "options": ["It is binding on all federal agencies as a regulation.", "It is binding only on states that run authorized permit programs.", "It has no binding authority.", "It became binding when Executive Order 12898 was signed."], "answer": 2, "explain": "EPA 정의는 웹사이트에만 있어 구속력이 없습니다. 행정명령이 환경정의를 요구한 것과 정의 문구에 효력이 있는 것은 다른 문제입니다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-05", "course": "ehs544", "week": "7w", "topic": "EO 14096 vs. EPA definition", "importance": 3, "why": "행정명령 흐름의 출발점", "type": "mc", "q": "Compared with EPA's definition of environmental justice, what does Executive Order 14096 add?", "options": ["English proficiency as a newly protected category beside race, color, and income", "Tribal affiliation and disability, plus protection from climate risks and cumulative impacts", "Only a change in wording from \"fair\" to \"equal\" treatment, with no new groups named", "The removal of the meaningful participation element, keeping only fair treatment"], "answer": 1, "explain": "14096호는 부족 소속, 장애, 기후 위험, 누적 영향을 더했습니다. 영어 능력을 보호 범주로 넣은 것은 아니어서 첫째 보기가 함정입니다.", "concept": "c_eo", "source": "113_7w_meaningful-community-engagement, 2절 나항"}, {"id": "w7-08", "course": "ehs544", "week": "7w", "topic": "Part 25/124 are binding", "importance": 3, "why": "Grab and Go 표지 항목", "type": "tf", "q": "The statement of basis and the response to comments required in permit proceedings under 40 CFR Parts 25 and 124 are binding regulatory requirements, even if agencies may often ignore them now.", "options": ["True", "False"], "answer": 0, "explain": "Part 25와 124의 요건은 지켜지지 않는 일이 많아도 법적으로 구속력이 있습니다. 지침이나 권고와 다른 점입니다.", "concept": "c_part", "source": "113_7w_meaningful-community-engagement, 2절 라항"}, {"id": "w7-09", "course": "ehs544", "week": "7w", "topic": "CERCLA liability and community engagement", "importance": 3, "why": "교수가 상생이라고 설명", "type": "mc", "q": "Why did the class describe community engagement at Superfund sites as a win-win even under the current administration?", "options": ["Executive Order 14096 still requires agencies to run engagement at every Superfund site", "CERCLA's strict, joint and several liability gives responsible private parties a reason to cooperate", "NEJAC's guidance is legally binding on the parties responsible for each contaminated site", "Congress created a mandatory community engagement office for each Superfund site"], "answer": 1, "explain": "CERCLA의 엄격책임과 연대책임이 오염 책임자에게 협력할 이유를 줍니다. 행정명령 14096호는 2025년에 철회되어 근거가 되지 못합니다.", "concept": "c_cercla", "source": "113_7w_meaningful-community-engagement, 4절 다항"}, {"id": "w8-01", "course": "ehs544", "week": "8w", "topic": "Executive order trajectory", "importance": 3, "why": "슬라이드 p.4 핵심 도표", "type": "mc", "q": "Which statement correctly describes the federal executive actions on disproportionate impact?", "options": ["EO 14096 (2023) revoked EO 12898 (1994), and EO 14148 later reinstated it.", "EO 12898 (1994) came first; EO 14096 (2023) followed; in 2025 EO 14148 rescinded 14096 and EO 14173 rescinded 12898.", "EO 12898 (1994) came first; in 2025 EO 14173 rescinded 14096 and EO 14148 rescinded 12898.", "EO 14096 (2023) came first and EO 12898 (1994) followed as an amendment."], "answer": 1, "explain": "순서는 12898호, 14096호이고 2025년에 14148호가 14096호를, 14173호가 12898호를 철회했습니다. 두 철회 명령의 대상을 서로 바꾼 보기가 함정입니다.", "concept": "c_eo", "source": "114_8w_engagement-and-evidence-based-decision-making, 2절 가항"}, {"id": "w8-02", "course": "ehs544", "week": "8w", "topic": "Hidden but not Gone", "importance": 3, "why": "8회차 제목 슬라이드 개념", "type": "tf", "q": "When Executive Orders 12898 and 14096 were revoked, the disproportionate impact factors lost their value as evidence for decision-making.", "options": ["True", "False"], "answer": 1, "explain": "거짓입니다. 행정명령이 철회되어도 요인들은 의사결정의 증거로 계속 쓸 수 있습니다. 숨겨졌으나 사라지지 않았다는 뜻입니다.", "concept": "c_hbg", "source": "114_8w, 도입부 및 2절 다항"}, {"id": "w8-03", "course": "ehs544", "week": "8w", "topic": "Cross-cutting factor", "importance": 3, "why": "슬라이드 p.7 표시 항목", "type": "mc", "q": "Which factor on the \"Hidden but not Gone\" slide acts across all six disproportionate impact factors?", "options": ["Cumulative impacts", "Physical infrastructure", "Psycho-social stressors", "Unique exposure pathways"], "answer": 2, "explain": "심리사회적 스트레스 요인이 여섯 요인 모두에 작용합니다. 나머지 세 보기는 여섯 요인 안의 항목입니다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-04", "course": "ehs544", "week": "8w", "topic": "Six disproportionate impact factors", "importance": 3, "why": "6요인 목록은 출제 1순위", "type": "mc", "q": "Which of the following is NOT one of the six disproportionate impact factors on the class 8 slide?", "options": ["Proximity and exposure", "Susceptible populations", "Participating in decision making", "Municipal property tax base"], "answer": 3, "explain": "여섯 요인은 근접성과 노출, 누적 영향, 물리적 기반시설, 취약 인구, 고유한 노출 경로, 의사결정 참여입니다. 지방세 기반은 목록에 없습니다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-05", "course": "ehs544", "week": "8w", "topic": "EPA 2021 social vulnerability report", "importance": 3, "why": "조별 과제의 옥외 노동자 근거", "type": "mc", "q": "In EPA's 2021 report on climate change and social vulnerability, at 2°C of global warming, Hispanic and Latino individuals are 43% more likely to live in areas where which impact is projected to be greatest?", "options": ["Loss of labor hours in weather-exposed work", "New childhood asthma diagnoses", "Deaths from extreme temperature", "Property damage from inland flooding"], "answer": 0, "explain": "보고서는 히스패닉과 라틴계가 2°C에서 노동시간이 가장 크게 줄 지역에 살 가능성이 43% 더 높다고 합니다. 천식과 극한 기온 사망 수치는 다른 집단에 대해 제시된 수치입니다.", "concept": "c_epa21", "source": "114_8w, 2절 라항"}, {"id": "w8-06", "course": "ehs544", "week": "8w", "topic": "Lived experience as evidence", "importance": 3, "why": "8회차 p.10-11 원칙", "type": "mc", "q": "Which statement best matches how class 8 treats lived experience expertise and Indigenous knowledge?", "options": ["They are used only when no scientific data exist.", "They are replaced by screening tool scores once a tool is available.", "They count only if a recognized institution has documented them.", "They are forms of expertise that count as evidence alongside academic knowledge."], "answer": 3, "explain": "생활경험과 원주민 지식은 학문적 지식과 함께 의사결정의 근거가 됩니다. 선별 도구 점수가 이를 대체하지 않습니다.", "concept": "c_lived", "source": "114_8w, 2절 마항ㆍ바항"}, {"id": "w8-07", "course": "ehs544", "week": "8w", "topic": "40 CFR Part 25 vs. Part 124", "importance": 3, "why": "슬라이드에 Grab and Go 표지", "type": "mc", "q": "Which statement correctly describes the relationship between 40 CFR Part 25 and Part 124?", "options": ["Part 25 sets EPA's permit decision procedures; Part 124 sets the general framework for public participation.", "Part 25 applies only to the Clean Air Act; Part 124 applies only to the Clean Water Act.", "Part 25 is the framework for why and how the public participates; Part 124 governs EPA's individual permit decisions.", "Part 25 governs state agencies only; Part 124 governs EPA staff only."], "answer": 2, "explain": "Part 25는 공중이 왜 어떻게 참여하는지의 체계이고 Part 124는 EPA의 개별 허가 절차입니다. 첫째 보기는 두 역할을 서로 바꿔 놓았습니다.", "concept": "c_part", "source": "114_8w, 3절 라항ㆍ마항"}, {"id": "w8-08", "course": "ehs544", "week": "8w", "topic": "Responsiveness Summary (§25.8)", "importance": 3, "why": "청취 회의와 참여를 가르는 장치", "type": "mc", "q": "Under 40 CFR § 25.8, what must a Responsiveness Summary include?", "options": ["A count of the comments received, with the names and affiliations of every commenter", "A certification by the agency that every comment was read and considered in good faith", "The agency's final cost-benefit analysis comparing the proposed action with all alternatives", "The activities held, the significant public comments, and the agency's specific responses or reasons for rejection"], "answer": 3, "explain": "응답 요약서에는 수행한 활동, 중요한 의견, 기관의 구체적 응답이나 거부 이유가 들어갑니다. 의견 수나 명단만 적는 것은 응답이 아닙니다.", "concept": "c_part", "source": "114_8w, 3절 라항 (5)"}, {"id": "w8-09", "course": "ehs544", "week": "8w", "topic": "Petition for review (Part 124)", "importance": 3, "why": "지역사회가 쓰는 실제 수단", "type": "mc", "q": "Under 40 CFR Part 124, who may file a petition for review of a final RCRA, UIC, NPDES, or PSD permit decision?", "options": ["Any resident of the state, whether or not they took part earlier", "Only the permit applicant", "Anyone who read the statement of basis", "A person who filed comments on the draft permit or took part in the public hearing"], "answer": 3, "explain": "허가 초안에 의견을 냈거나 공청회에 참여한 사람이 심사 청구를 할 수 있습니다. 의견 기간에 쟁점을 모두 내지 않으면 나중에 다투기 어렵습니다.", "concept": "c_part", "source": "114_8w, 3절 마항 (2)"}, {"id": "w8-11", "course": "ehs544", "week": "8w", "topic": "First state to define EJ communities", "importance": 3, "why": "8회차 중심 사례", "type": "mc", "q": "According to the class 8 discussion, Connecticut was the first state to do what?", "options": ["Adopt an environmental equity policy", "Ban new permits in environmental justice communities", "Define environmental justice communities in a statute", "Create a state environmental protection agency"], "answer": 2, "explain": "코네티컷은 환경정의 지역사회를 법률로 정의한 첫 주입니다. 1993년 환경 형평 정책은 법률이 아니어서 첫째 보기는 틀립니다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)ㆍ(4)"}, {"id": "w8-12", "course": "ehs544", "week": "8w", "topic": "Public Act 20-6 notice rules", "importance": 3, "why": "교수가 요건을 구체적으로 설명", "type": "mc", "q": "Which requirement applies to a permit applicant under Connecticut's Public Act 20-6 (effective November 1, 2020)?", "options": ["Hold the public meeting in the state capital within 30 days of filing the application", "Obtain the municipality's written consent to the application before it is filed with the state", "Give notice in English and in any language used by 15% or more of residents within a half mile", "Publish a single notice in the legal-notice section of a newspaper with local circulation"], "answer": 2, "explain": "개정법은 영어와 반경 0.5마일 주민의 15% 이상이 쓰는 언어로 공고하도록 요구합니다. 법정 공고란에 한 번 싣는 방식은 하트포드에서 주민이 공고를 놓친 원인입니다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-13", "course": "ehs544", "week": "8w", "topic": "Law vs. real protection", "importance": 3, "why": "교수가 반복해 짚은 사례", "type": "mc", "q": "A New Haven tank terminal signed a community benefit agreement worth $49,000 that allowed its VOC emissions to triple. What did the class use this case to show?", "options": ["Community benefit agreements are prohibited under Connecticut law.", "Benefit amounts are set by statute and cannot be negotiated.", "The state screening tool underestimates pollution burdens.", "Having a law does not by itself guarantee meaningful protection."], "answer": 3, "explain": "법의 요건을 지킨 협약도 배출 증가를 허용했습니다. 법이 있다는 사실만으로 실질적 보호가 보장되지는 않는다는 예입니다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-14", "course": "ehs544", "week": "8w", "topic": "Title VI leverage in Hartford", "importance": 3, "why": "Pestana 발표의 핵심 수단", "type": "mc", "q": "According to Edith Pestana, why did the federal civil rights (Title VI) investigation in Hartford change the state agency's behavior?", "options": ["A state court issued an injunction closing the landfill.", "EPA completed a new rulemaking on landfill odors.", "The city council voted to withdraw the permit.", "An agency found to discriminate could lose federal funding."], "answer": 3, "explain": "차별한 기관은 연방 자금을 잃을 수 있다는 점이 압력이었습니다. 법원 명령이나 시의회 철회는 이 사례의 설명이 아닙니다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)"}, {"id": "w8-15", "course": "ehs544", "week": "8w", "topic": "CT EJ screening tool", "importance": 2, "why": "근거 방법의 한계", "type": "mc", "q": "What does Connecticut's environmental justice screening tool do?", "options": ["It models each resident's actual exposure dose and personal health risk.", "It automatically approves or denies permit applications based on the score.", "It ranks census tracts by indicator on a 1-to-10 scale, without modeling actual exposure.", "It publishes the names and addresses of residents who live near facilities."], "answer": 2, "explain": "선별 도구는 구역별 지표를 1에서 10으로 순위화할 뿐 실제 노출량은 모형화하지 않습니다. 허가 승인은 도구가 아니라 기관이 결정합니다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (5)"}, {"id": "w9-01", "course": "ehs544", "week": "9w", "topic": "Reversing the brownfield model", "importance": 3, "why": "9회차 통합 사례의 핵심 주장", "type": "mc", "q": "According to Suzi Ruhl, how does Mount Growmore reverse the traditional brownfield model?", "options": ["EPA designs the project first and then asks the community to approve it.", "A private developer proposes the plan and the city grants the permits.", "Government resources and authority are applied to the community's own vision.", "The state legislature decides the reuse and funds it through a bond."], "answer": 2, "explain": "전통 모델에서는 지역사회가 남의 설계에 끼워 들어가지만 Mount Growmore에서는 정부의 자원과 권한이 지역사회의 비전에 적용됩니다.", "concept": "c_flip", "source": "115_9w_mount-growmore-and-resilience, 7절"}, {"id": "w9-02", "course": "ehs544", "week": "9w", "topic": "Two framings of TBLJ", "importance": 3, "why": "법 문언과 Elevate 설명의 구별", "type": "mc", "q": "In the Connecticut special act, Triple Bottom Line Justice (TBLJ) is defined as the integration of which three elements?", "options": ["Health justice, environmental justice, and economic justice", "Evidence-based practice, rule of law, and meaningful community engagement", "Assessment, vision, and recommendations", "Law, science, and finance"], "answer": 1, "explain": "특별법은 TBLJ를 근거 기반 실천, 법치, 지역사회 참여의 통합으로 정의합니다. 건강, 환경, 경제 정의는 Elevate의 설명이어서 첫째 보기가 함정입니다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 1절 가항; 115_9w, 3절 가항"}, {"id": "w9-03", "course": "ehs544", "week": "9w", "topic": "B2H core method", "importance": 3, "why": "9회차 방법론 · 특별법 정의", "type": "mc", "q": "What are the two core elements of the Brownfields to Healthfields (B2H) method described in the class 9 podcast?", "options": ["A community-led diagnosis of what is wrong and the community's vision of a healthy community", "An EPA risk ranking of the site and a cost-benefit analysis of reuse options", "A liability allocation among polluters and a numeric cleanup standard", "A state grant application and a signed agreement with a developer"], "answer": 0, "explain": "B2H는 지역사회 주도의 진단과 건강한 지역사회에 대한 비전으로 이루어집니다. EPA 위험 순위 같은 외부 기준과 다릅니다.", "concept": "c_flip", "source": "115_9w, 3절 다항; 104_2w, 1절 나항"}, {"id": "w9-04", "course": "ehs544", "week": "9w", "topic": "CJET", "importance": 3, "why": "출연자가 새 비법으로 강조", "type": "mc", "q": "What is the main function of Civic Justice Engagement Teaching (CJET)?", "options": ["It gives residents grants that allow them to buy contaminated land from private owners.", "It produces a cumulative screening score for each census tract and posts it online.", "It gives burdened communities a rule-of-law framework to use the laws and resources meant for them.", "It is a court-approved settlement process that runs between polluters and residents."], "answer": 2, "explain": "CJET는 부담이 큰 지역사회가 자신을 위한 법과 자원을 쓸 수 있도록 법치의 틀을 가르칩니다. 점수 산출이나 토지 구입 지원이 아닙니다.", "concept": "c_flip", "source": "115_9w, 3절 라항"}, {"id": "w9-05", "course": "ehs544", "week": "9w", "topic": "Breaking Bread", "importance": 2, "why": "협력 설계에 참고", "type": "mc", "q": "What is the purpose of the \"Breaking Bread\" process used by Elevate and the East End NRZ?", "options": ["A one-time public hearing required by 40 CFR Part 25 before any permit is issued", "A mediation procedure for disputes that begins after a lawsuit has been filed in court", "An annual awards event that recognizes community leaders and their long-term partners", "A weekly check-in among residents, governments, business, funders and academics to keep momentum"], "answer": 3, "explain": "Breaking Bread는 여러 부문이 매주 확인 회의를 열어 추진력을 유지하는 대화 과정입니다. 법이 요구하는 공청회가 아닙니다.", "concept": "c_flip", "source": "115_9w, 3절 마항"}, {"id": "w9-08", "course": "ehs544", "week": "9w", "topic": "Role of local government", "importance": 3, "why": "토론 질문 3", "type": "mc", "q": "How did Bill Coleman describe the City of Bridgeport's role in Mount Growmore?", "options": ["To lead the vision for the campus and choose its main uses", "To hold title to the land and design the buildings on it", "To give technical support and resources while the community sets the agenda", "To regulate EPA's cleanup schedule and review its site reports"], "answer": 2, "explain": "시는 기술적 뒷받침과 자원을 제공하고 의제는 지역사회가 정했습니다. 비전을 이끄는 일은 시의 역할이 아니었습니다.", "concept": "c_roles", "source": "115_9w, 5절 가항"}, {"id": "w9-09", "course": "ehs544", "week": "9w", "topic": "Start of the public response", "importance": 3, "why": "토론 질문 3의 결정 지점", "type": "mc", "q": "Which action marked the start of the formal public response at the Mount Trashmore site?", "options": ["EPA completed a full site assessment, including a review of hydrology.", "Congress amended RCRA to cover construction debris sites such as this one.", "The city and state acquired the site from the private owners responsible for the contamination.", "The legislature passed the TBLJ special act and funded a demonstration program."], "answer": 2, "explain": "시와 주가 오염을 일으킨 민간 소유자에게서 부지를 취득한 일이 공식 대응의 시작입니다. 특별법은 훨씬 뒤인 2026년에 나왔습니다.", "concept": "c_roles", "source": "115_9w, 1절 나항; 4절 라항"}, {"id": "w9-10", "course": "ehs544", "week": "9w", "topic": "EPA Region 1 contributions", "importance": 3, "why": "토론 질문 1과 3", "type": "mc", "q": "Which action by EPA Region 1 most directly built community capacity at Mount Growmore?", "options": ["Writing plain-language summaries and cheat sheets together with the NRZ", "Designing and constructing the campus buildings on the site", "Lobbying the state legislature for the TBLJ bill", "Taking over the operation of the East End market"], "answer": 0, "explain": "EPA는 NRZ와 함께 쉬운 말의 자료와 요약표를 만들어 지역사회 역량을 키웠습니다. 건물 건설과 시장 운영은 EPA의 일이 아닙니다.", "concept": "c_roles", "source": "115_9w, 4절 라항"}, {"id": "w9-11", "course": "ehs544", "week": "9w", "topic": "Noise example (lived experience)", "importance": 3, "why": "생활경험 원칙의 사례", "type": "mc", "q": "At an NRZ meeting, outsiders assumed \"noise pollution\" meant interstate highway traffic, but residents meant gunshots. What did Suzi Ruhl draw from this?", "options": ["Community concerns should be translated into the experts' definitions before they are recorded.", "Noise should be excluded from environmental analysis.", "Trust and respect come from responding to the community's own definition of its concerns, with learning running both ways.", "Traffic noise data are more reliable than residents' reports."], "answer": 2, "explain": "지역사회 자신의 정의에 대응해야 신뢰를 얻고 양방향으로 배울 수 있습니다. 전문가의 틀로 먼저 번역하는 방식은 반대입니다.", "concept": "c_lived", "source": "115_9w, 8절 나항"}, {"id": "w9-12", "course": "ehs544", "week": "9w", "topic": "Campus status", "importance": 2, "why": "과제에서 틀리기 쉬운 사실", "type": "tf", "q": "As of the class 9 podcast, the Mount Growmore hydroponic center and wellness center have been built and are operating.", "options": ["True", "False"], "answer": 1, "explain": "정화는 끝났지만 수경 재배 센터와 웰니스 센터는 아직 세워지지 않았습니다. 사례를 인용할 때 완료와 계획을 구분해야 합니다.", "concept": "c_roles", "source": "115_9w, 6절ㆍ7절"}, {"id": "c-01", "course": "ehs544", "week": "6w", "topic": "CERCLA identification", "importance": 2, "why": "중간시험 복습 문항", "type": "mc", "q": "A review item describes an abandoned hazardous waste site with no responsible owner, where arrangers and transporters of hazardous substances and current and former facility owners can be held liable for cleanup costs. Which law does it describe?", "options": ["Resource Conservation and Recovery Act (RCRA)", "Toxic Substances Control Act (TSCA)", "Emergency Planning and Community Right-to-Know Act (EPCRA)", "CERCLA (Superfund)"], "answer": 3, "explain": "통제되지 않은 폐기 부지의 책임 구조는 CERCLA입니다. RCRA는 현재의 폐기물 관리를 다룹니다.", "concept": "c_cercla", "source": "112_6w_midterm-review, 2절 나항"}, {"id": "c-02", "course": "ehs544", "week": "6w", "topic": "Part 124 permit coverage", "importance": 2, "why": "6회차 허가와 8회차 참여를 연결", "type": "mc", "q": "Part 124 sets decision-making procedures for which of the following sets of EPA permits?", "options": ["RCRA, UIC, PSD, and NPDES permits", "NEPA categorical exclusion determinations only", "FOIA responses and Privacy Act notices", "Title VI complaint determinations"], "answer": 0, "explain": "Part 124는 RCRA, UIC, PSD, NPDES 허가의 절차를 정합니다. 나머지 보기는 허가가 아닙니다.", "concept": "c_part", "source": "114_8w, 3절 마항; 112_6w, 3절"}, {"id": "c-03", "course": "ehs544", "week": "2w", "topic": "Final special act duties", "importance": 3, "why": "원안과 최종 법의 차이", "type": "mc", "q": "What does the final Special Act No. 26-13 (from HB 5241) require?", "options": ["A TBLJ demonstration program in every city with over 148,000 residents by January 1, 2027", "The Commissioner of Public Health convenes a working group on a B2H-related TBLJ program and reports by July 1, 2027", "A 20% ICD-10 Z code usage rate in insurance claims by 2030, with annual progress reports", "An annual cost-benefit audit of every brownfield grant the state has awarded"], "answer": 1, "explain": "최종 특별법은 공중보건국장의 작업반과 2027년 7월 1일 보고서만 남겼습니다. 시범 사업과 Z 코드 20% 목표는 원안에만 있었습니다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 2절 가항ㆍ나항"}];
const CONCEPTS = [{"id": "c_mi", "title": "Meaningful involvement", "kor": "실질적 참여는 4가지 요건이고, 청취 회의만으로는 부족합니다", "week": "7w", "oneline": "EPA는 영향을 받는 지역사회의 참여를 4가지 요건으로 정의합니다. 핵심은 입력이 결정에 영향을 줄 수 있느냐입니다.", "diagram": "<svg viewBox=\"0 0 640 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;height:auto;display:block\"><defs><marker id=\"ahg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#3F4A5A\"/></marker><marker id=\"aha\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#E8833A\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"150\" height=\"104\" fill=\"#EEF3F9\" stroke=\"#C9D4E2\" stroke-width=\"1\"/><text x=\"12\" y=\"22\" font-size=\"14\" text-anchor=\"start\" fill=\"#286DC0\" font-weight=\"700\" font-family=\"inherit\">1</text><text x=\"75\" y=\"48\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"400\" data-max=\"138\" font-family=\"inherit\">Opportunity</text><text x=\"75\" y=\"68\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"400\" data-max=\"138\" font-family=\"inherit\">to take part</text><rect x=\"163\" y=\"0\" width=\"150\" height=\"104\" fill=\"#fff\" stroke=\"#E8833A\" stroke-width=\"2.5\"/><text x=\"175\" y=\"22\" font-size=\"14\" text-anchor=\"start\" fill=\"#E8833A\" font-weight=\"700\" font-family=\"inherit\">2</text><text x=\"238\" y=\"48\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"400\" data-max=\"138\" font-family=\"inherit\">Input can</text><text x=\"238\" y=\"68\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"400\" data-max=\"138\" font-family=\"inherit\">influence the</text><text x=\"238\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"400\" data-max=\"138\" font-family=\"inherit\">decision</text><rect x=\"326\ const BASE=[1,2,4,7], DAY=864e5, SESSION=10, NEWMAX=6, KEY='recall.v3';
let store=JSON.parse(localStorage.getItem(KEY)||'{}'); store.items=store.items||{}; store.cfg=store.cfg||{exam:'2026-12-15'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(store));
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const itemsOf=c=>DATA.filter(x=>x.course===c);
const S=id=>store.items[id];
const isDue=x=>S(x.id)&&S(x.id).due<=t0();
const isNew=x=>!S(x.id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='html')e.innerHTML=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(n,v)}k.flat().forEach(c=>e.append(c.nodeType?c:document.createTextNode(c)));return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const daysLeft=()=>Math.max(0,Math.round((new Date(store.cfg.exam+'T00:00').getTime()-t0())/DAY));
// 간격: 기본 1·2·4·7일, 시험까지 남은 기간의 25%를 넘지 않도록 줄임
const gap=box=>{const dl=daysLeft();return Math.max(1,Math.min(BASE[box],dl>0?Math.round(dl*0.25):1))};

let cur={course:'ehs544',tab:'today',concept:null}, run=null;
const due=c=>itemsOf(c).filter(isDue).sort((a,b)=>b.importance-a.importance);
const fresh=c=>itemsOf(c).filter(isNew).sort((a,b)=>b.importance-a.importance||parseInt(a.week)-parseInt(b.week));
function pick(c,only){
  let pool=only?itemsOf(c).filter(x=>x.concept===only):null;
  if(pool) return shuffle(pool);
  const d=due(c).slice(0,SESSION), n=fresh(c).slice(0,Math.max(0,Math.min(NEWMAX,SESSION-d.length)||NEWMAX));
  return shuffle(d.concat(n)).slice(0,SESSION);
}
function side(){
  const s=document.getElementById('side');s.textContent='';
  s.append(el('div',{class:'t'},'복습',el('small',{},'YALE SCHOOL OF PUBLIC HEALTH')));
  const l=el('div',{class:'list'});
  COURSES.forEach(c=>{const n=itemsOf(c.id).length,k=due(c.id).length+(n?Math.min(NEWMAX,fresh(c.id).length):0);
    l.append(el('a',{class:(cur.course===c.id?'on ':'')+(n?'':'empty'),href:'#',onclick:e=>{e.preventDefault();go(c.id,'today')}},el('span',{},c.name),el('span',{},n?k+'문제':'준비 중')))});
  s.append(l);
  s.append(el('div',{class:'foot'},'진행 기록은 이 기기에만 저장됩니다.',el('br'),el('button',{onclick:exp},'내보내기'),' · ',el('button',{onclick:()=>document.getElementById('imp').click()},'가져오기'),
    el('input',{id:'imp',type:'file',accept:'.json',style:'display:none',onchange:imp})));
}
function go(c,tab,concept){cur={course:c,tab,concept:concept||null};run=null;render();window.scrollTo(0,0)}
function render(){
  side();const app=document.getElementById('app');app.textContent='';
  const c=COURSES.find(x=>x.id===cur.course), all=itemsOf(c.id);
  app.append(el('h1',{},c.name+(c.full?' · '+c.full:'')));
  if(!all.length){app.append(el('p',{class:'sub'},'아직 문제가 없습니다.'),el('p',{},'시험 범위와 교수님이 강조한 부분을 먼저 고르고, 개념 도식과 문제를 같은 방식으로 만듭니다.'));return}
  app.append(el('p',{class:'sub'},`문제 ${all.length}개 · 오늘 복습 ${due(c.id).length} · 새 문제 ${fresh(c.id).length}`));
  const tabs=el('div',{class:'tabs'});
  [['today','오늘'],['map','개념 지도'],['log','기록']].forEach(([k,l])=>tabs.append(el('button',{class:cur.tab===k?'on':'',onclick:()=>go(c.id,k)},l)));
  app.append(tabs);
  ({today:today,map:map,log:log})[cur.tab](app,c);
}
/* 오늘 */
function today(app,c){
  if(!run){
    const list=pick(c.id,cur.concept);
    if(!list.length&&!cur.concept){app.append(el('p',{},'오늘 풀 문제를 모두 풀었습니다. 내일 다시 오세요.'),el('p',{class:'hint'},'지금 더 풀고 싶으면 개념 지도에서 개념별로 풀 수 있습니다.'));return}
    if(!run){
      const cc=cur.concept&&CONCEPTS.find(x=>x.id===cur.concept);
      app.append(el('h2',{},cc?cc.title+' 문제':'오늘의 복습'),
        el('p',{class:'sub'},`${list.length}문제 · 약 ${Math.max(3,Math.round(list.length*0.6))}분 · 틀린 문제는 오늘 한 번 더 나옵니다.`),
        el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>{run={q:list.map(x=>x.id),i:0,ok:0,miss:new Set(),done:false,asked:new Set(),again:{}};render()}},'시작')));
      app.append(settings());return;
    }
  }
  if(run.i>=run.q.length)return end(app,c);
  const x=DATA.find(d=>d.id===run.q[run.i]);
  app.append(el('div',{class:'eyebrow'},`${run.i+1} / ${run.q.length} · ${x.week} · ${x.topic}`));
  app.append(el('p',{class:'q'},x.q));
  const b=el('div',{class:'opts'});
  x.options.forEach((o,i)=>b.append(el('button',{class:'opt','data-i':i,onclick:()=>ans(x,i)},(x.type==='tf'?'':el('span',{class:'k'},'ABCD'[i])),el('span',{},o))));
  app.append(b,el('div',{id:'fb'}),el('p',{class:'hint'},'키보드 1~4로 고르고 Enter로 넘어갑니다.'));
}
function ans(x,i){
  if(run.done)return;run.done=true;
  const ok=i===x.answer;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const j=+b.dataset.i;if(j===x.answer)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  const first=!run.asked.has(x.id);run.asked.add(x.id);
  if(first){
    const s=S(x.id)||{box:-1,seen:0,wrong:0};s.seen++;
    if(ok){s.box=Math.min(BASE.length-1,s.box+1)}else{s.box=0;s.wrong++;run.miss.add(x.id)}
    if(s.box<0)s.box=0;s.due=t0()+gap(s.box)*DAY;store.items[x.id]=s;save();if(ok)run.ok++;
    if(!ok){const at=Math.min(run.q.length,run.i+4);run.q.splice(at,0,x.id)}   // 오늘 한 번 더
  }
  const fb=document.getElementById('fb');
  const s=S(x.id);
  fb.append(el('p',{class:'res '+(ok?'ok':'no')},ok?'정답':'오답'),el('p',{class:'exp'},x.explain),
    el('p',{class:'tag'},`중요도 ${x.importance}/3 · ${x.why}`+(first?` · 다음 복습 ${gap(s.box)}일 뒤`:' · 한 번 더 확인')));
  const cc=CONCEPTS.find(k=>k.id===x.concept);
  const last=run.i===run.q.length-1;
  fb.append(el('div',{class:'bar'},el('button',{id:'next',class:'primary',onclick:nxt},last?'결과':'다음'),
    cc?el('button',{onclick:()=>openConcept(cc.id)},'개념 보기'):''));
  document.getElementById('next').focus();side();
}
function openConcept(id){const keep=run;go(cur.course,'map',id);}
function nxt(){run.i++;run.done=false;render();window.scrollTo(0,0)}
function end(app,c){
  const n=run.asked.size;
  app.append(el('h2',{},`${n}문제 중 ${run.ok}문제 정답`),
    el('p',{class:'sub'},run.miss.size?'틀린 문제는 내일 다시 나옵니다. 아래 개념을 한 번 더 보세요.':'모두 맞혔습니다.'));
  const cs=[...new Set([...run.miss].map(id=>DATA.find(d=>d.id===id).concept))].filter(Boolean);
  cs.forEach(id=>{const k=CONCEPTS.find(z=>z.id===id);if(k)app.append(el('p',{},el('button',{onclick:()=>go(c.id,'map',id)},k.title)))});
  app.append(el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>{run=null;render()}},'이어서 풀기')));
}
function settings(){
  const w=el('div',{class:'set'},el('label',{for:'ex'},'시험 예상일'),el('input',{id:'ex',type:'date',value:store.cfg.exam,onchange:e=>{store.cfg.exam=e.target.value;save();render()}}),
    el('span',{class:'hint',style:'margin:0'},`${daysLeft()}일 남음 · 복습 간격 ${BASE.map((b,i)=>gap(i)).join('·')}일`));
  return w;
}
/* 개념 지도 */
function map(app,c){
  const list=cur.concept?CONCEPTS.filter(k=>k.id===cur.concept):CONCEPTS;
  if(cur.concept)app.append(el('p',{},el('button',{onclick:()=>go(c.id,'map')},'전체 개념')));
  list.forEach(k=>{
    const n=DATA.filter(d=>d.concept===k.id).length;
    const card=el('section',{class:'card'},el('div',{class:'eyebrow'},k.week),el('h2',{},k.title),el('p',{class:'kor'},k.kor));
    if(k.diagram)card.append(el('div',{class:'dg',html:k.diagram}),el('p',{class:'dgh'},'도식은 좌우로 밀어서 볼 수 있습니다.'));
    card.append(el('p',{class:'one'},k.oneline));
    if(k.points&&k.points.length)card.append(el('ul',{},k.points.map(p=>el('li',{},p))));
    if(k.terms&&k.terms.length){const t=el('div',{class:'terms'});k.terms.forEach(([a,b])=>t.append(el('b',{},a),el('span',{},b)));card.append(t)}
    if(n)card.append(el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>go(c.id,'today',k.id)},`이 개념 문제 ${n}개 풀기`)));
    app.append(card)});
}
/* 기록 */
function log(app,c){
  const rows=itemsOf(c.id).map(x=>({x,s:S(x.id)})).sort((a,b)=>((b.s?b.s.wrong:-1)-(a.s?a.s.wrong:-1))||b.x.importance-a.x.importance);
  const tb=el('tbody');rows.forEach(({x,s})=>tb.append(el('tr',{},el('td',{},x.topic),el('td',{},x.week),el('td',{class:'num'},s?s.seen:0),el('td',{class:'num'},s?s.wrong:0),el('td',{class:'num'},!s?'미응시':s.due<=t0()?'오늘':Math.round((s.due-t0())/DAY)+'일 뒤'))));
  app.append(el('table',{},el('thead',{},el('tr',{},['주제','주차'].map(h=>el('th',{},h)),['푼 횟수','오답','다음 복습'].map(h=>el('th',{class:'num'},h)))),tb),el('p',{class:'hint'},'오답이 많은 문제가 위에 옵니다.'));
  app.append(settings());
  app.append(el('p',{class:'src'},'설계 근거: 간격을 둔 복습은 보건의료 전문직 교육에서 지식 점수를 높였습니다(Martinengo 2024, Cochrane 방법론 체계적 문헌고찰, 23개 연구, SMD 0.32). 시험 보기가 다시 읽기보다 장기 기억에 낫다는 메타분석(Rowland 2014, g=0.50. Adesope 2017, g=0.70)에 따라 읽기보다 문제 풀이를 중심에 두었습니다. 최적의 복습 간격은 시험까지 남은 기간에 비례하므로(Cepeda 2006, 2008) 시험일을 넣으면 간격이 자동으로 줄어듭니다. 틀린 문제는 정답을 확인한 뒤 같은 날 다시 묻습니다.'));
}
function exp(){const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'})),download:'recall-progress.json'});document.body.append(a);a.click();a.remove()}
function imp(e){const f=e.target.files[0];if(f)f.text().then(t=>{store=JSON.parse(t);save();render()})}
document.addEventListener('keydown',e=>{
  if(cur.tab!=='today'||!run||run.i>=run.q.length)return;
  if(!run.done&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(run.done&&e.key==='Enter'){const n=document.getElementById('next');if(n&&document.activeElement!==n)n.click()}
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
