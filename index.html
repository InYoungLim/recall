e budget?", "options": ["One that saves money and adds some benefit", "One with the lowest cost", "One with the largest effect", "One with the highest ratio"], "answer": 0, "explain": "비용을 아끼면서 효과도 있는 사업은 자원을 쓰지 않으므로 예산과 무관하게 고른다.", "concept": "h_budget", "source": "217 Incremental CEA, 3절"}, {"id": "h-32", "course": "hpm570", "week": "9w", "topic": "The last program funded", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What does the cost-effectiveness ratio of the last program funded represent?", "options": ["The opportunity cost of resources, which changes with the budget", "A fixed threshold for all decisions", "The average ratio of all funded programs", "The ratio of the cheapest program"], "answer": 0, "explain": "한계 비용효과비는 예산에 따라 달라지는 값이며 고정된 기준값이 아니다.", "concept": "h_budget", "source": "217 Incremental CEA, 5절과 14절"}, {"id": "h-33", "course": "hpm570", "week": "9w", "topic": "Average versus incremental ratio", "importance": 3, "why": "9주차 읽을거리 · 반례", "type": "mc", "q": "M1 costs $100,000 for 10 QALYs. M2 costs $10,000 more and adds 0.001 QALY. What is the incremental ratio of M2?", "options": ["$10,000,000 per QALY", "$10,999 per QALY", "$1,000 per QALY", "$100,000 per QALY"], "answer": 0, "explain": "증분비는 10,000 / 0.001이다. 평균비 $10,999만 보면 M2가 유리해 보이지만 판단은 증분비로 한다.", "concept": "h_budget", "source": "217 Incremental CEA, 8절"}, {"id": "h-34", "course": "hpm570", "week": "9w", "topic": "Assumptions of the budget rule", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "The rule of funding programs in order of incremental ratio until the budget is spent assumes:", "options": ["Perfect divisibility and constant returns to scale", "Equal costs for all programs", "Mutually exclusive programs only", "A fixed willingness to pay set by law"], "answer": 0, "explain": "규모를 줄여도 비용효과가 변하지 않는다는 두 가정이 성립하지 않으면 더 복잡한 접근이 필요하다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 6절"}, {"id": "h-35", "course": "hpm570", "week": "9w", "topic": "Shadow price", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What is the shadow price implied by a budget?", "options": ["The most the decision maker is willing to pay per unit of effect, implied by the budget size", "A price found by the analysis from data", "The cost of the cheapest program", "The average cost per QALY"], "answer": 0, "explain": "잠재가격은 예산 크기가 함의하는 지불 한도이며 자료에서 구한 값이 아니다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 8절"}, {"id": "h9b-01", "course": "hpm570", "week": "9w", "topic": "Which alternative to remove", "importance": 3, "why": "9회차 수업 예제", "type": "mc", "q": "In the three-programs example, Strategy 1's incremental ratios are A1 10, B1 25, C1 50, D1 33. Which alternative should be removed?", "options": ["D1, because its ratio fell below C1's", "C1, because it lies above the line joining B1 and D1", "B1, because the cheaper option A1 exists", "E1, because its ratio of 100 is the highest"], "answer": 1, "explain": "증분비의 하락은 증상이고 원인은 프런티어 안쪽의 C1이다. C1이 D1을 실제보다 좋아 보이게 하므로 제거 대상은 C1이다.", "concept": "h_upgrade", "source": "110_9w_cost-effectiveness-analysis-ii, 1절 나항"}, {"id": "h9b-02", "course": "hpm570", "week": "9w", "topic": "Recalculating after removal", "importance": 3, "why": "9회차 수업 예제", "type": "mc", "q": "After C1 is removed, what is D1's incremental ratio compared with B1 (B1: cost 200, effect 14; D1: cost 400, effect 19)?", "options": ["33", "25", "50", "40"], "answer": 3, "explain": "D1을 새 이웃 B1과 비교하면 ΔC 200, ΔE 5이므로 비는 40이다.", "concept": "h_upgrade", "source": "110_9w, 1절 나항"}, {"id": "h9b-03", "course": "hpm570", "week": "9w", "topic": "Reading an upgrade", "importance": 2, "why": "9회차 슬라이드 10", "type": "mc", "q": "In the upgrade table, what does the row 'B1 (−A1)' mean?", "options": ["Moving patients who received A1 up to B1", "Removing B1 from the efficient set", "Giving both A1 and B1 to the same patient", "Replacing B1 with the Do Nothing option"], "answer": 0, "explain": "B1(-A1)은 A1을 받던 환자를 B1으로 올리는 상향 단계이다. 그래서 Group 1에서 D1까지 투자한 총액은 D1의 전체 비용 $400과 같다.", "concept": "h_upgrade", "source": "110_9w, 1절 다항"}, {"id": "h9b-04", "course": "hpm570", "week": "9w", "topic": "Allocating $600", "importance": 3, "why": "9회차 슬라이드 13", "type": "mc", "q": "With a budget of $600 and partial implementation allowed, what is the optimal allocation?", "options": ["A1, F2, K3, and G2 (−F2) at 50%", "B1, F2, and a 50/50 split of K3 and M3, total effect 34.5", "B1, F2, and L3, total effect 34", "D1, F2, and K3, total effect 36"], "answer": 1, "explain": "$500까지 B1(-A1)을 모두 사고 다음 단계인 M3(-K3)를 50% 시행하면 누적 비용 600에서 총효과 34.5를 얻는다.", "concept": "h_upgrade", "source": "110_9w, 1절 라항"}, {"id": "h9b-05", "course": "hpm570", "week": "9w", "topic": "The Do Nothing assumption", "importance": 2, "why": "9회차 슬라이드 4", "type": "mc", "q": "The first incremental ratios for A1, F2 and K3 rest on which critical assumption?", "options": ["Returns to scale fall as intensity rises", "A patient can receive two alternatives from one group", "Each group has a Do Nothing option with zero cost and zero effect", "The budget is at least $850"], "answer": 2, "explain": "첫 대안의 증분비는 비용 0, 효과 0인 무처치와 비교한 값이다. 무처치가 선택지에 없으면 가장 저렴한 대안이 기준 대안이 된다.", "concept": "h_upgrade", "source": "110_9w, 1절 가항"}, {"id": "h9b-06", "course": "hpm570", "week": "9w", "topic": "All or nothing at $600", "importance": 3, "why": "9회차 슬라이드 15", "type": "mc", "q": "If partial implementation is not allowed at a $600 budget, what happens?", "options": ["The allocation is unchanged", "The dominated program L3 returns and total effect falls from 34.5 to 34", "The budget must rise to $850", "Group 3 receives no treatment"], "answer": 1, "explain": "모든 환자에게 같은 강도를 주어야 하면 남은 예산에 정확히 맞는 L3가 다시 선택된다. 총효과는 0.5만큼 줄어든다.", "concept": "h_equity", "source": "110_9w, 1절 마항"}, {"id": "h9b-07", "course": "hpm570", "week": "9w", "topic": "Pricing equity", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "What does the three-programs example show about equity constraints?", "options": ["They cost nothing when all programs are efficient", "They always raise total effect", "Their cost can be expressed in units of health effect given up", "They require a Do Nothing option in every group"], "answer": 2, "explain": "형평 제약을 부과하면 효율 손실이 발생하고, 이 손실은 포기한 효과의 단위로 나타낼 수 있다.", "concept": "h_equity", "source": "110_9w, 1절 마항"}, {"id": "h9b-08", "course": "hpm570", "week": "9w", "topic": "Setting the threshold", "importance": 3, "why": "9회차 Part 2", "type": "mc", "q": "Why must a decision maker set a maximum willingness to pay apart from the cost-effectiveness analysis?", "options": ["Because ICERs are always negative", "Because QALYs cannot be measured", "Because league tables list only drugs", "Because CEA results alone cannot decide how much to spend"], "answer": 3, "explain": "비용효과분석의 결과만으로는 지출 규모를 정할 수 없다. 예산이 정해지면 리그 표의 누적 비용이 예산에 도달하는 위치에 선이 그어진다.", "concept": "h_oregon", "source": "110_9w, 2절 가항"}, {"id": "h9b-09", "course": "hpm570", "week": "9w", "topic": "Oregon's first list", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "Why did dental pulp exposure rank above surgery for ectopic pregnancy on Oregon's first list?", "options": ["Dental care had a lower cost per case", "The list compared total benefit per dollar across the population, and pulp exposure is very common", "Ectopic pregnancy surgery was excluded by federal law", "Commissioners gave dental care a higher subjective score"], "answer": 1, "explain": "순위는 인구 수준의 달러당 편익 총량을 비교하여 나왔고, 1건 대 1건의 비교가 아니었다. 치수 노출이 매우 흔하여 총 QALY 이득이 커졌다.", "concept": "h_oregon", "source": "110_9w, 2절 나항"}, {"id": "h9b-10", "course": "hpm570", "week": "9w", "topic": "Rule of rescue", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "Which value conflict with pure cost-effectiveness ranking does the Baby Jessica example illustrate?", "options": ["The rule of rescue", "The shadow price", "Constant returns to scale", "Extended dominance"], "answer": 0, "explain": "비용효과분석은 울타리를 권하지만 사람들은 우물에 빠진 특정 개인의 구조에 더 크게 반응하며, 이러한 반응을 구조의 규칙이라 한다.", "concept": "h_oregon", "source": "110_9w, 2절 다항"}, {"id": "h9b-11", "course": "hpm570", "week": "9w", "topic": "Test cost and the ICER", "importance": 3, "why": "9회차 Part 3", "type": "mc", "q": "In the routine HIV testing analysis, why did the ICER barely change when the test cost was doubled, quadrupled or cut to $1?", "options": ["Test costs were already built into the discount rate", "The model assumed zero prevalence", "The program cost is mostly the ART it triggers, so the ICER converges to that of ART", "Screening was cost-saving at every prevalence"], "answer": 2, "explain": "선별의 비용은 양성 결과가 유발하는 치료 경로 전체의 비용을 포함한다. 어떤 개입도 그 개입이 유발하는 개입보다 비용효과적일 수 없다.", "concept": "h_hiv", "source": "110_9w, 3절 나항 (4)"}, {"id": "h9b-12", "course": "hpm570", "week": "9w", "topic": "A new comparator", "importance": 3, "why": "9회차 Part 3", "type": "mc", "q": "Branded ART versus No ART had an ICER of $25,200/QALY. Once generic ART was added, branded versus generic ART was $114,800/QALY. Which principle does this show?", "options": ["Adding a comparator can make an existing option less cost-effective", "Generic drugs always dominate branded drugs", "ICERs fall when more options are compared", "Discounting changes the ranking of strategies"], "answer": 0, "explain": "더 저렴한 대안이 추가되면 기존 대안은 그 대안과 비교되어 덜 비용효과적으로 평가된다. 세 치료사업 예제에서 C1이 D1의 비를 왜곡한 것과 같은 원리이다.", "concept": "h_hiv", "source": "110_9w, 3절 라항 (2)"}, {"id": "h9b-13", "course": "hpm570", "week": "9w", "topic": "Southwest quadrant", "importance": 2, "why": "9회차 슬라이드 57~59", "type": "mc", "q": "Why is a result in the southwest quadrant (lower cost, less health) harder to discuss?", "options": ["Its ICER cannot be calculated", "It names losers explicitly, savings may leave health, and WTA exceeds WTP", "It is always strongly dominated", "It applies only to low-income countries"], "answer": 1, "explain": "제3사분면에서는 손실을 보는 사람을 명시적으로 검토하게 되고, 절감액이 보건 밖으로 전용될 수 있으며, 수용의사가 지불의사보다 크게 관찰된다.", "concept": "h_hiv", "source": "110_9w, 3절 라항 (3)"}, {"id": "h9b-14", "course": "hpm570", "week": "9w", "topic": "PEPFAR long division", "importance": 2, "why": "9회차 슬라이드 64~66", "type": "mc", "q": "In the PEPFAR analysis, what does $153 per life-year represent?", "options": ["The cost of ART per patient-year in South Africa", "The US willingness to pay per QALY", "The cost of HIV screening per test", "US savings divided by South African life-years lost"], "answer": 3, "explain": "$2.3 billion의 절감액을 1,500만 손실 생존연수로 나눈 값이다. 국내 기준 $50,000과 비교하면 이미 내려지던 가치판단이 드러난다.", "concept": "h_hiv", "source": "110_9w, 3절 마항 (3)"}, {"id": "h10b-01", "course": "hpm570", "week": "10w", "topic": "Why Markov models", "importance": 2, "why": "10회차 슬라이드 3", "type": "mc", "q": "Why does a decision tree become impractical for chronic conditions with recurrence?", "options": ["Its probabilities cannot be below 0.5", "Branches multiply each cycle when an event can happen more than once", "It cannot include costs", "It requires a steady state"], "answer": 1, "explain": "사건이 한 번 이상 일어날 수 있으면 확률나무와 결정나무는 주기마다 가지가 곱절로 늘어난다. 이 한계 때문에 Markov 모형을 도입한다.", "concept": "h_markov", "source": "111_10w, 1절"}, {"id": "h10b-02", "course": "hpm570", "week": "10w", "topic": "Markovian assumption", "importance": 3, "why": "10회차 슬라이드 30", "type": "mc", "q": "What does the Markovian (memoryless) assumption state?", "options": ["Transition probabilities depend only on the current state", "Every patient eventually dies", "Each state lasts exactly one cycle", "Transition probabilities rise with age"], "answer": 0, "explain": "이행확률은 현재 상태에만 의존하고 그 상태에 도달한 경로는 영향을 미치지 않는다. 따라서 예후에 필요한 이력은 상태의 정의에 포함하여야 한다.", "concept": "h_markov", "source": "111_10w, 4절 나항"}, {"id": "h10b-03", "course": "hpm570", "week": "10w", "topic": "Memoryless Danny", "importance": 2, "why": "10회차 수업", "type": "mc", "q": "Danny has been sick for one week or for three weeks. Under the Markov assumption, his chance of recovering next week is:", "options": ["Higher after three weeks", "Lower after three weeks", "The same, 50%", "Zero after three weeks"], "answer": 2, "explain": "Danny가 1주째 감염되어 있든 3주째 감염되어 있든 다음 주에 회복할 확률은 똑같이 50%이다. 귀 감염에는 비현실적인 가정이지만 다른 질병에서는 현실에 맞을 수 있다.", "concept": "h_markov", "source": "111_10w, 4절 나항"}, {"id": "h10b-04", "course": "hpm570", "week": "10w", "topic": "Tunnel states", "importance": 2, "why": "10회차 슬라이드 35", "type": "mc", "q": "Which describes a tunnel state?", "options": ["A state that cannot be left once entered", "A state occupied for only one cycle in a fixed sequence", "A state with no transition probabilities", "A state that averages two other states"], "answer": 1, "explain": "터널 상태는 정해진 순서에 따라 한 주기만 머물다 다음 상태로 이행한다. 수술 후 기간을 상태로 나누면 사망 위험이 낮아지는 경과를 Markov 가정을 어기지 않고 표현할 수 있다.", "concept": "h_markov", "source": "111_10w, 4절 마항"}, {"id": "h10b-05", "course": "hpm570", "week": "10w", "topic": "Absorbing states", "importance": 2, "why": "10회차 슬라이드 34", "type": "mc", "q": "In a Well–Sick–Dead model, why does Dead return to itself with probability 1.0?", "options": ["It is an absorbing state that cannot be left", "It is a tunnel state", "It keeps the row sums below 1", "It is the steady state of Well"], "answer": 0, "explain": "흡수 상태는 일단 이행하면 다른 상태로 이행할 수 없다. 부활을 모형에 넣지 않는 한 사망한 사람은 계속 사망 상태에 머문다.", "concept": "h_markov", "source": "111_10w, 4절 라항"}, {"id": "h10b-06", "course": "hpm570", "week": "10w", "topic": "Two weeks from well", "importance": 3, "why": "10회차 슬라이드 4~8", "type": "mc", "q": "Danny is well this week. P(W→W) = .8 and P(S→W) = .5. What is the probability he is well in two weeks?", "options": [".64", ".74", ".65", ".80"], "answer": 1, "explain": "건강하게 머무는 경로 .8 × .8 = .64와 한 주 앓은 뒤 회복하는 경로 .2 × .5 = .10을 더한 .74이다. .64는 둘째 경로를 빠뜨린 흔한 오답이다.", "concept": "h_matrix", "source": "111_10w, 2절 가항"}, {"id": "h10b-07", "course": "hpm570", "week": "10w", "topic": "Matrix multiplication", "importance": 2, "why": "10회차 슬라이드 20~22", "type": "mc", "q": "How is the two-step matrix P² obtained in class 10?", "options": ["P¹ + P¹", "P¹ × P¹", "P¹ divided by 2", "By transposing P¹"], "answer": 1, "explain": "2단계 행렬은 1단계 행렬을 자기 자신과 곱한 P² = P¹ × P¹이다. 이 계산은 나무에서 두 경로의 확률을 곱하여 더한 계산과 같다.", "concept": "h_matrix", "source": "111_10w, 3절 가항"}, {"id": "h10b-08", "course": "hpm570", "week": "10w", "topic": "Steady state", "importance": 3, "why": "10회차 슬라이드 28", "type": "mc", "q": "In the long run, what does each steady-state probability represent?", "options": ["The chance of death in the first cycle", "The proportion of time spent in that state", "The cost per cycle", "The probability of the starting state"], "answer": 1, "explain": "장기적으로 상태 사이의 이동은 계속되지만 초기 상태의 영향은 사라진다. 이때 이행확률은 각 상태에 머무는 시간의 비율을 의미한다.", "concept": "h_matrix", "source": "111_10w, 3절 다항"}, {"id": "h10b-09", "course": "hpm570", "week": "10w", "topic": "Muffin Mania", "importance": 1, "why": "10회차 슬라이드 36~40", "type": "mc", "q": "In Muffin Mania you never pick yesterday's muffin. What are the long-run probabilities of the three muffins?", "options": ["½, ¼, ¼", "0, ½, ½", "About ⅓ each", "1, 0, 0"], "answer": 2, "explain": "1단계 행렬은 대각선이 0이고 나머지 칸이 ½이다. 세 머핀이 대칭이어서 10단계 행렬에서는 모든 칸이 약 ⅓이 된다.", "concept": "h_matrix", "source": "111_10w, 5절"}, {"id": "h10b-10", "course": "hpm570", "week": "10w", "topic": "Cutting incidence", "importance": 3, "why": "10회차 슬라이드 42~45", "type": "mc", "q": "A drug cuts Danny's incidence of infection by 50% (P(W→S) from .2 to .1). His long-run time sick falls from 28.6% to:", "options": ["14.3%", "16.7%", "21.1%", "28.6%"], "answer": 1, "explain": "Sick 비율은 P_WS / (P_WS + P_SW)이므로 .1 / (.1 + .5) = 16.7%이다. 분자와 함께 분모도 줄어 절반까지는 줄지 않는다.", "concept": "h_interv", "source": "111_10w, 6절 가항"}, {"id": "h10b-11", "course": "hpm570", "week": "10w", "topic": "Speeding recovery", "importance": 2, "why": "10회차 슬라이드 46~49", "type": "mc", "q": "Why does speeding recovery by 50% lower time sick less than cutting incidence by 50%?", "options": ["Recovery affects only people already sick, so only the denominator grows", "Recovery drugs raise mortality", "Incidence has no effect on the steady state", "The matrix rows no longer sum to 1"], "answer": 0, "explain": "회복을 빠르게 하는 약은 분자 .2를 그대로 둔 채 분모만 .7에서 .95로 늘려 Sick 비율이 21.1%가 된다. 감염 발생을 줄이는 약은 분자 자체를 절반으로 낮춘다.", "concept": "h_interv", "source": "111_10w, 6절 나항"}, {"id": "h10b-12", "course": "hpm570", "week": "10w", "topic": "When everyone dies", "importance": 2, "why": "10회차 슬라이드 50~53", "type": "mc", "q": "In a model with an absorbing Dead state, why is the long-run matrix not useful by itself?", "options": ["Everyone ends in Dead, so it says nothing about life expectancy or time in each state", "It cannot be computed", "It always equals P¹", "It gives only costs"], "answer": 0, "explain": "장기 행렬의 D 열은 모두 1이 된다. 따라서 기대여명, 무증상 생존, 질보정 기대여명, 기대비용을 따로 계산하여야 한다.", "concept": "h_cohort", "source": "111_10w, 7절ㆍ8절"}, {"id": "h10b-13", "course": "hpm570", "week": "10w", "topic": "Life expectancy from a cohort", "importance": 3, "why": "10회차 수업", "type": "mc", "q": "In a cohort simulation of 100,000 people, how is life expectancy computed?", "options": ["Read the cycle in which the last person dies", "Sum the patient-cycles in Well and Sick and divide by 100,000", "Multiply P¹ by 100,000", "Average the transition probabilities"], "answer": 1, "explain": "각 상태의 환자-주기를 모두 더하여 시작 인원으로 나눈다. 마지막 주기를 읽으면 가장 오래 산 사람의 수명이 되므로 틀린 답이다.", "concept": "h_cohort", "source": "111_10w, 9절 가항 (2)"}, {"id": "h10b-14", "course": "hpm570", "week": "10w", "topic": "Monte Carlo simulation", "importance": 2, "why": "10회차 슬라이드 66~67", "type": "mc", "q": "What does Monte Carlo simulation give that a cohort simulation does not give easily?", "options": ["A point estimate only", "Variances or distributions from many individual runs", "The transition probabilities", "A steady state"], "answer": 1, "explain": "몬테카를로 모사는 한 사람씩 난수로 이행시키는 과정을 여러 번 반복하므로 점추정치와 함께 분산이나 분포를 준다. 코호트 모형에서도 분산을 구할 수 있으나 계산이 복잡하다.", "concept": "h_cohort", "source": "111_10w, 9절 나항"}, {"id": "h10b-15", "course": "hpm570", "week": "10w", "topic": "LE versus QALE", "importance": 2, "why": "10회차 슬라이드 63~65", "type": "mc", "q": "In the Well–Sick–Dead strategy table, which statement is correct?", "options": ["Drug B has lower life expectancy than doing nothing but higher quality-adjusted life expectancy", "Drug A lies on the efficiency frontier", "Drug C has the lowest cost", "Drug B dominates Drug C"], "answer": 0, "explain": "Drug B의 기대여명은 2.45로 무처치의 2.62보다 짧지만 질보정 기대여명은 2.40으로 더 길다. 효과를 어느 지표로 측정하는지에 따라 전략의 순서가 달라진다.", "concept": "h_cohort", "source": "111_10w, 9절 가항 (3)"}, {"id": "e-01", "course": "ehs502", "week": "1w", "topic": "ORS and SGLT1", "importance": 3, "why": "1주와 4주에 반복된 공중보건 사례", "type": "mc", "q": "Why does an oral rehydration solution contain glucose as well as salt?", "options": ["Glucose and sodium are absorbed together by SGLT1, which raises water absorption", "Glucose is toxic to Vibrio cholerae and shortens the infection", "Glucose replaces the potassium lost in diarrheal stool", "Glucose slows intestinal motility and so reduces stool volume"], "answer": 0, "explain": "소장의 나트륨-포도당 공동수송체 1(SGLT1)은 나트륨과 포도당을 함께 흡수하고, 이 흡수가 물의 흡수를 증가시킨다. 경구수액염은 세균을 제거하지 못하므로 포도당의 역할은 흡수 촉진이다.", "concept": "e_ors", "source": "_wiki/104_4w 14절 바, 101_1w 4절 마"}, {"id": "e-02", "course": "ehs502", "week": "1w", "topic": "ORS and SGLT1", "importance": 3, "why": "교수가 두 회차에서 강조", "type": "tf", "q": "Oral rehydration solution cures cholera by clearing the bacteria from the gut.", "options": ["True", "False"], "answer": 1, "explain": "ORS는 콜레라균을 치료하지 못하며, 설사가 진행되는 동안 수분 손실을 보충하여 중증도와 사망을 줄인다. 회복에 필요한 시간을 확보하는 것이 ORS의 효과이다.", "concept": "e_ors", "source": "_wiki/101_1w 4절 마, 104_4w 14절 바"}, {"id": "e-03", "course": "ehs502", "week": "1w", "topic": "ORS delivery", "importance": 2, "why": "공중보건 보급 전략 사례", "type": "mc", "q": "How did Bangladesh spread the ORS recipe during 1993-1994?", "options": ["By mailing sealed ORS packets made by WHO to every household", "By printing the recipe on every letter handled by the postal system", "By requiring pharmacies to sell ORS at a fixed low price", "By adding salt and sugar to the public water supply"], "answer": 1, "explain": "방글라데시는 우체국 체계로 모든 편지에 조리법을 인쇄하여 보급하였다. 가정과 지역사회가 기억한 조리법은 기업이 공급하는 봉지보다 오래 지속되었다.", "concept": "e_ors", "source": "_wiki/101_1w 4절 마"}, {"id": "e-04", "course": "ehs502", "week": "2w", "topic": "Skin barrier lipids", "importance": 3, "why": "피부 장벽 기능의 핵심", "type": "mc", "q": "In the stratum corneum, what plays the role of the \"mortar\" between the corneocyte \"bricks\"?", "options": ["Keratin filaments inside each corneocyte", "Melanin granules transferred from melanocytes", "Lipids from lamellar bodies: ceramides, fatty acids and cholesterol", "Collagen and elastin fibers from the dermis"], "answer": 2, "explain": "각질형성세포가 분비하는 층판소체(lamellar body)의 지질이 각질세포 사이를 채우며, 세라마이드, 지방산, 콜레스테롤의 조성이 장벽 기능을 결정한다. 콜라겐과 엘라스틴은 진피의 구조 단백질이다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 나"}, {"id": "e-05", "course": "ehs502", "week": "2w", "topic": "Routes of skin exposure", "importance": 3, "why": "노출 경로의 공중보건 의미", "type": "mc", "q": "A chemical reaches deeper skin layers by passing along hair follicles, sebaceous glands and sweat ducts. Which route is this?", "options": ["Intracellular route", "Intercellular route", "Transvascular route", "Transappendageal route"], "answer": 3, "explain": "모낭, 피지샘, 땀관을 경유하는 경로는 부속기 경로(transappendageal route)이다. 세포간 경로는 각질세포 사이의 지질 기질을 경유한다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 라"}, {"id": "e-06", "course": "ehs502", "week": "2w", "topic": "Barrier repair", "importance": 2, "why": "장벽 손상 뒤 연쇄 반응", "type": "tf", "q": "When the skin barrier is breached, the granular layer releases most of its lamellar body stores within minutes.", "options": ["True", "False"], "answer": 0, "explain": "상처가 생기면 과립층이 층판소체 저장분의 80%를 몇 분 안에 분비하여 틈을 채운다. 이 반응은 경표피 수분 손실과 칼슘 기울기 소실이 촉발한다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 나ㆍ라"}, {"id": "e-07", "course": "ehs502", "week": "2w", "topic": "Vitamin D pathway", "importance": 3, "why": "일광 노출 역설의 핵심 기전", "type": "mc", "q": "Where does the second hydroxylation that forms active vitamin D (1α,25(OH)2D3) take place?", "options": ["Kidney", "Liver", "Small intestine", "Skin"], "answer": 0, "explain": "비타민 D3는 간에서 25-수산화효소로 25(OH)D3가 된 뒤 신장에서 1α-수산화효소로 활성형이 된다. 부갑상선 호르몬이 신장의 이 단계를 조절한다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 마"}, {"id": "e-08", "course": "ehs502", "week": "2w", "topic": "UVA and UVB", "importance": 3, "why": "자외선 구분은 반복 출제 유형", "type": "mc", "q": "Which statement about UVA and UVB matches the lecture?", "options": ["UVA drives vitamin D synthesis in the dermis", "UVB reaches only the epidermis and drives vitamin D synthesis", "UVB breaks down dermal collagen over decades", "Both are equally available year-round at northern latitudes"], "answer": 1, "explain": "UVB는 표피까지만 침투하여 비타민 D 합성을 유발하고, UVA는 진피까지 침투하여 수십 년에 걸쳐 콜라겐과 엘라스틴을 분해한다. 북위도의 겨울에는 UVB가 거의 없다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 나"}, {"id": "e-09", "course": "ehs502", "week": "2w", "topic": "Skin type and vitamin D", "importance": 3, "why": "형평 관점의 공중보건 쟁점", "type": "mc", "q": "Estimated UVB time needed for 1,000 IU of vitamin D per day rises from about 5 minutes (skin type 1) to about 25 minutes (type 6). Why?", "options": ["Darker skin has fewer keratinocytes in the spinous layer", "Darker skin lacks 7-dehydrocholesterol", "Melanin absorbs UVB and lowers synthesis per minute of exposure", "The liver hydroxylates vitamin D more slowly in darker skin"], "answer": 2, "explain": "멜라닌이 UVB를 흡수하여 같은 노출 시간의 합성량을 줄이므로 짙은 피부일수록 더 긴 노출이 필요하다. 7-디하이드로콜레스테롤과 간의 수산화 반응은 피부색과 관계없이 동일하게 진행된다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 마(2)"}, {"id": "e-10", "course": "ehs502", "week": "2w", "topic": "Sweat rate and sodium", "importance": 3, "why": "열 손상과 전해질 보충", "type": "mc", "q": "Why does sodium loss in sweat rise when the sweat rate is high?", "options": ["High sweat rates activate sodium pumps that secrete more sodium", "Sweat glands switch from eccrine to apocrine secretion", "Aldosterone falls during heavy sweating", "The duct has less time to reabsorb sodium and chloride"], "answer": 3, "explain": "땀관은 분비 속도에 맞추어 나트륨과 염소를 재흡수하므로, 분비가 빠르면 재흡수 시간이 짧아 손실이 증가한다. 따라서 땀이 많은 활동에서는 전해질 보충이 필요하다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(2)"}, {"id": "e-11", "course": "ehs502", "week": "2w", "topic": "Sweat gland recruitment", "importance": 2, "why": "증발 냉각의 조절 순서", "type": "mc", "q": "How does the body first raise sweat output when heat load increases?", "options": ["By recruiting more sweat glands, then raising output per gland", "By raising output per gland only", "By converting sebaceous glands into sweat glands", "By lowering skin blood flow to concentrate sweat"], "answer": 0, "explain": "처음에는 많은 땀샘을 동원하여 땀의 양을 빠르게 늘리고, 그 뒤에 땀샘마다 분비량을 늘린다. 사람에게는 외분비 땀샘이 200만~400만 개 있다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(1)"}, {"id": "e-12", "course": "ehs502", "week": "2w", "topic": "Heat acclimatization", "importance": 3, "why": "적응과 가소성 주제의 사례", "type": "tf", "q": "In heat-acclimatized people, sweat ducts conserve more sodium and chloride.", "options": ["True", "False"], "answer": 0, "explain": "열에 적응한 사람은 시간당 2~3 L의 땀을 분비하면서도 땀관이 나트륨과 염소를 보존한다. 이 변화는 1주차의 적응과 가소성 주제에 해당한다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(2)"}, {"id": "e-13", "course": "ehs502", "week": "3w", "topic": "Ectopic fat", "importance": 3, "why": "지방조직의 질 개념", "type": "mc", "q": "Under the \"glass full\" model of subcutaneous fat, where is extra fat stored once subcutaneous capacity is reached?", "options": ["Only in brown adipose tissue", "First in visceral fat, then in ectopic sites such as liver, muscle and pancreas", "In bone marrow before any other site", "It is excreted in bile as cholesterol"], "answer": 1, "explain": "피하 저장 용량이 소진되면 지방은 먼저 내장에, 이어 간, 근육, 췌장 같은 이소성 부위에 축적된다. 이소성 지방은 이상지질혈증과 인슐린 저항성을 동반한다.", "concept": "e_fat", "source": "_wiki/103_3w 5절 나"}, {"id": "e-14", "course": "ehs502", "week": "3w", "topic": "Ectopic fat", "importance": 2, "why": "용량 모형의 근거", "type": "mc", "q": "Thiazolidinedione (TZD) diabetes drugs support the capacity model because they:", "options": ["Destroy visceral adipocytes", "Block fat absorption in the small intestine", "Induce adipocyte hyperplasia and shift fat from visceral to subcutaneous depots", "Convert white adipose tissue into muscle"], "answer": 2, "explain": "티아졸리딘디온은 지방세포 증식을 유도하여 지방을 내장에서 피하로 이동시켰다. PPAR-감마 결함이 피하 저장을 제한하여 내장과 이소성 축적을 증가시키는 것도 같은 모형의 근거이다.", "concept": "e_fat", "source": "_wiki/103_3w 5절 나"}, {"id": "e-15", "course": "ehs502", "week": "6w", "topic": "NAFLD progression", "importance": 3, "why": "간 대사 모듈의 질환 연결", "type": "mc", "q": "What is the order of progression in non-alcoholic fatty liver disease?", "options": ["Fibrosis, steatosis, steatohepatitis, insulin resistance", "Insulin resistance, steatosis, steatohepatitis, fibrosis", "Steatohepatitis, insulin resistance, fibrosis, steatosis", "Steatosis, fibrosis, insulin resistance, steatohepatitis"], "answer": 1, "explain": "진행 순서는 인슐린 저항성, 지방증(steatosis), 지방간염(steatohepatitis), 섬유화, 간경변이다. 단순 지방증이 반드시 다음 단계로 진행하는 것은 아니다.", "concept": "e_fat", "source": "_wiki/106_6w 8절 라"}, {"id": "e-16", "course": "ehs502", "week": "6w", "topic": "NAFLD progression", "importance": 3, "why": "예방 시점 판단의 근거", "type": "mc", "q": "According to the lecture, which stage of fatty liver disease is no longer reversible once established?", "options": ["Simple steatosis", "Insulin-resistant adipose tissue", "Compensated steatosis", "Fibrosis"], "answer": 3, "explain": "앞 단계의 변화는 되돌릴 수 있으나 섬유화가 고착되면 흉터 조직은 재생되지 않는다. 따라서 중재는 섬유화 이전 단계에서 효과가 크다.", "concept": "e_fat", "source": "_wiki/106_6w 8절 라"}, {"id": "e-17", "course": "ehs502", "week": "3w", "topic": "Size principle", "importance": 3, "why": "근육 모듈의 공중보건 질문", "type": "mc", "q": "Why does the lecture argue that resistance exercise matters for public health in older adults?", "options": ["Heavy efforts recruit type II fibers, which aging loses most", "Daily activities already recruit all fiber types fully", "Resistance exercise raises the number of muscle fibers formed after birth", "Type I fibers cannot adapt to any training"], "answer": 0, "explain": "걷기와 청소 같은 일상 활동에는 대부분 type I 섬유가 동원되므로 type II 섬유는 큰 힘을 내는 활동에서만 동원된다. 노화에서 주로 소실되는 운동신경이 type II이므로 저항운동이 필요하다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 나"}, {"id": "e-18", "course": "ehs502", "week": "3w", "topic": "Fiber types", "importance": 2, "why": "훈련 적응의 기초", "type": "mc", "q": "Which muscle fiber type shows the greatest plasticity, adapting toward either endurance or power with training?", "options": ["Type I", "Type IIa", "Type IIx", "Type IIb"], "answer": 1, "explain": "Type IIa는 훈련 자극에 따라 유산소 쪽이나 순발력 쪽으로 적응하여 가소성이 가장 크다. Type I은 피로에 강한 유산소 섬유이다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 가"}, {"id": "e-19", "course": "ehs502", "week": "3w", "topic": "Organophosphate poisoning", "importance": 3, "why": "직업ㆍ환경 노출과 근육 취약성", "type": "mc", "q": "How do organophosphate pesticides disrupt skeletal muscle?", "options": ["They block calcium release from the sarcoplasmic reticulum", "They destroy motor neuron cell bodies in the spinal cord", "They inhibit acetylcholinesterase, so acetylcholine builds up and muscle keeps firing", "They block glucose uptake into type I fibers"], "answer": 2, "explain": "유기인계는 아세틸콜린에스터레이스를 억제하여 아세틸콜린이 분해되지 않고 축적되므로 근육이 계속 발화하고 이완하지 못한다. 연간 사망자 대부분은 자살이므로 중재는 접근 통제와 자살 예방을 포함하여야 한다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 바"}, {"id": "e-20", "course": "ehs502", "week": "3w", "topic": "Motor units", "importance": 2, "why": "운동단위 구조", "type": "tf", "q": "For fine control such as eye movement, one motor neuron innervates thousands of muscle fibers.", "options": ["True", "False"], "answer": 1, "explain": "눈 근육처럼 정교한 조절이 필요한 곳은 운동신경과 근섬유의 비율이 일대일에 가깝다. 한 운동신경이 많은 섬유를 지배하는 구조는 큰 힘을 내는 동작에 해당한다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 나"}, {"id": "e-21", "course": "ehs502", "week": "4w", "topic": "Gastric acid and emptying", "importance": 3, "why": "위장관 모듈의 조절 원리", "type": "mc", "q": "What does a protein-rich meal do in the stomach?", "options": ["Lowers acid secretion and speeds gastric emptying", "Lowers acid secretion and slows emptying", "Has no effect on acid but speeds emptying", "Raises acid secretion and slows gastric emptying"], "answer": 3, "explain": "단백질과 펩타이드는 G 세포의 가스트린 분비를 자극하고 완충 작용으로 pH를 올려 산 분비를 높이며, 동시에 위 배출을 늦춘다. 음식이 위에 체류하는 시간이 길어져 병원체 방어가 강화된다.", "concept": "e_acid", "source": "_wiki/104_4w 10절 다, 11절 라"}, {"id": "e-22", "course": "ehs502", "week": "4w", "topic": "Gastric emptying and blood glucose", "importance": 3, "why": "위장관과 혈당 조절의 연결", "type": "mc", "q": "Why does the rate of gastric emptying matter for the post-meal rise in blood glucose?", "options": ["The small intestine can absorb glucose only as fast as the stomach delivers it", "The stomach absorbs most dietary glucose", "Gastric acid converts starch directly into glucose", "Insulin is secreted by the stomach wall"], "answer": 0, "explain": "소장은 위가 배출하는 만큼만 포도당을 흡수하므로 탄수화물이 십이지장에 도착하는 속도가 혈당 상승 속도의 상한이 된다. 지질, 단백질, 섬유가 배출을 늦추면 혈당 반응이 완만해진다.", "concept": "e_acid", "source": "_wiki/104_4w 11절 라"}, {"id": "e-23", "course": "ehs502", "week": "4w", "topic": "Intestinal phase hormones", "importance": 2, "why": "장 단계의 되먹임", "type": "mc", "q": "Which hormones released by the duodenum slow gastric emptying when acid, carbohydrate or lipid arrive?", "options": ["Insulin, glucagon and leptin", "CCK, GIP and secretin", "Gastrin, histamine and acetylcholine", "Cortisol, epinephrine and aldosterone"], "answer": 1, "explain": "십이지장에 산, 탄수화물, 지질이 도착하면 콜레시스토키닌(CCK), 위억제 펩타이드(GIP), 시크레틴이 분비되어 위 운동성과 위산 분비를 억제한다. 가스트린과 히스타민은 위산 분비를 자극하는 신호이다.", "concept": "e_acid", "source": "_wiki/104_4w 11절 라"}, {"id": "e-24", "course": "ehs502", "week": "5w", "topic": "Lipid route", "importance": 3, "why": "강의 노트의 강조 표시(★)", "type": "mc", "q": "Why can fat-soluble toxins eaten with food reach the systemic circulation without first passing through the liver?", "options": ["They are absorbed in the stomach directly into the hepatic vein", "The portal vein carries them around the liver", "Chylomicrons enter lacteals and reach the blood via the thoracic duct", "Bile carries them straight into the bloodstream"], "answer": 2, "explain": "킬로미크론은 모세혈관에 유입되지 못하고 암죽관과 림프를 거쳐 흉관에서 정맥 순환에 합류하므로 문맥과 간의 첫 처리를 우회한다. 지용성 비타민, 콜레스테롤, 지용성 독소가 모두 이 경로로 운반된다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 마"}, {"id": "e-25", "course": "ehs502", "week": "5w", "topic": "Enterohepatic circulation", "importance": 3, "why": "담즙의 경제적 재사용", "type": "mc", "q": "About what share of secreted bile is reabsorbed and returned to the liver each cycle?", "options": ["About 5%", "About 50%", "100%", "About 95%"], "answer": 3, "explain": "분비된 담즙의 95%는 회장의 능동 수송과 대장의 수동 수송으로 흡수되어 문맥을 거쳐 간으로 돌아간다. 대변으로 배설되는 5%는 콜레스테롤과 지용성 독소의 배설 경로이다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 다"}, {"id": "e-26", "course": "ehs502", "week": "5w", "topic": "Enterohepatic circulation", "importance": 2, "why": "담즙 순환의 구조", "type": "tf", "q": "Bile acids are synthesized fresh for each meal and are fully excreted afterward.", "options": ["True", "False"], "answer": 1, "explain": "담즙 풀 3 g은 하루 4~12회 순환하며 재사용되고, 새로 합성되는 양은 하루 0.2~0.6 g이다. 이 순환을 담즙의 장간 순환이라고 한다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 다"}, {"id": "e-27", "course": "ehs502", "week": "5w", "topic": "Acetaminophen toxicity", "importance": 3, "why": "해독 균형의 대표 사례", "type": "mc", "q": "What causes liver injury after an acetaminophen overdose?", "options": ["Glutathione stores are depleted, so the reactive intermediate NAPQI accumulates", "Sulfate conjugation stops completely", "The drug is excreted unchanged in bile", "Glucuronide conjugates become toxic"], "answer": 0, "explain": "과량 복용 시 글루타티온(GSH)이 고갈되어 CYP2E1이 생성한 반응성 중간체 NAPQI가 축적되어 간을 손상시킨다. 황산 포합은 이미 최대 속도이므로 추가 처리를 감당하지 못한다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 아"}, {"id": "e-28", "course": "ehs502", "week": "5w", "topic": "Phase I reactions", "importance": 3, "why": "강의 노트의 강조 표시(★)", "type": "tf", "q": "Phase I detoxification reactions always make a compound less toxic.", "options": ["True", "False"], "answer": 1, "explain": "1상 반응은 반응성이 높거나 독성이 있는 중간체를 생성할 수 있다. 천연 물질이라는 이유로 안전하다고 판단할 수 없다는 점이 강의의 강조점이다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 가"}, {"id": "e-29", "course": "ehs502", "week": "5w", "topic": "Policy response", "importance": 2, "why": "생리 지식을 정책에 적용한 사례", "type": "mc", "q": "What did the US FDA announce in January 2014 to reduce acetaminophen liver injury?", "options": ["A ban on all over-the-counter acetaminophen", "An end to prescribing combination products with more than 325 mg acetaminophen per unit", "A requirement that acetaminophen be taken with glutathione", "A limit of one bottle per purchase"], "answer": 1, "explain": "FDA는 한 단위당 아세트아미노펜 325 mg 초과 복합 처방 진통제를 더 이상 처방하지 말라고 발표하였다. 아세트아미노펜은 급성 간부전의 가장 많은 원인이다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 아"}, {"id": "e-30", "course": "ehs502", "week": "6w", "topic": "Hepatic glucose output", "importance": 3, "why": "간 대사 모듈의 핵심", "type": "mc", "q": "Overnight and before breakfast, which hepatic process rises to its peak as glycogen stores fall?", "options": ["Glycogenolysis", "Glycogen synthesis", "Gluconeogenesis", "Lipogenesis"], "answer": 2, "explain": "글리코젠 분해는 빠르지만 풀이 한정되어 밤사이 감소하고, 포도당 신생합성이 증가하여 아침 식사 전에 정점을 이룬다. 포도당 신생합성은 에너지가 많이 드는 과정이다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라"}, {"id": "e-31", "course": "ehs502", "week": "6w", "topic": "Hepatic glucose output", "importance": 3, "why": "식후 대사 조절", "type": "mc", "q": "After a meal, what is the main signal that stops the liver from releasing glucose?", "options": ["Glucagon", "Cortisol", "Epinephrine", "Insulin"], "answer": 3, "explain": "식이 포도당이 공급되는 동안 간이 포도당을 생성하면 연료가 중복되므로 두 과정이 억제되어야 하며, 인슐린이 간의 포도당 방출을 차단하는 주된 신호이다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라"}, {"id": "e-32", "course": "ehs502", "week": "6w", "topic": "Gluconeogenesis substrates", "importance": 2, "why": "장기 간 대사 연결", "type": "mc", "q": "Which of these is NOT a substrate for hepatic gluconeogenesis?", "options": ["Free fatty acids", "Alanine", "Glycerol from lipolysis", "Lactate"], "answer": 0, "explain": "포도당 신생합성의 재료는 피루브산, 알라닌, 젖산, 지방분해에서 유래한 글리세롤이다. 유리지방산은 근육의 연료로 쓰이거나 간에서 VLDL 중성지방으로 재조립된다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라, 7절 가"}, {"id": "p1-01", "course": "pubh510", "week": "1w", "topic": "Fineberg four criteria", "importance": 3, "why": "기준 적용 문제", "type": "mc", "q": "A state health department proposes a new priority that would affect many people severely, but no leader, funding source, or implementation strategy has been named. Which of Fineberg's four criteria does this priority fail most clearly?", "options": ["Importance", "Feasibility and scalability", "Value", "Acceptability"], "answer": 1, "explain": "Fineberg는 지도부와 충분한 재원과 집행 전략이 지정되지 않은 우선순위를 빈 몸짓(empty gesture)이라고 부르며, 이 결함은 실현 및 확장 가능성 기준을 충족하지 못한 것입니다. 반면 많은 사람에게 심각한 영향을 미친다는 점은 중요성 기준을 충족하고, 가치는 건강 편익이 비용을 초과하는지를, 수용성은 정치권과 지역사회가 그 우선순위를 수용하는지를 판단하는 기준이므로 이 사례의 결함과 관련이 없습니다.", "concept": "p_priority", "source": "201 Fineberg, 4절 다항"}, {"id": "p1-02", "course": "pubh510", "week": "1w", "topic": "Fineberg five classes", "importance": 2, "why": "범주는 순위가 아님", "type": "tf", "q": "In Fineberg's framework, the five classes of candidates for public health intervention (burden of disease, lifestyle and behavior, collective actions, underlying conditions, institutional capacities) are numbered in order of priority, so Class 1 should be funded first.", "options": ["True", "False"], "answer": 1, "explain": "다섯 범주는 후보를 구분한 분류 체계이며, 범주 번호는 중요도의 순위를 의미하지 않습니다. 같은 범주 안에서는 후보를 비교하기 쉬우나 서로 다른 범주에 속한 후보 가운데에서 선정하기는 어려우므로, 그 선정에 중요성ㆍ실현 및 확장 가능성ㆍ가치ㆍ수용성이라는 네 기준이 필요합니다.", "concept": "p_priority", "source": "201 Fineberg, 3절 가항"}, {"id": "p1-03", "course": "pubh510", "week": "1w", "topic": "Data plus value judgments", "importance": 3, "why": "가치판단이 효과성으로 위장", "type": "mc", "q": "Two legislators read the same data on maternal health. One wants to fund it as protection of women's rights, the other as prevention of fetal deaths, and each says the other's approach is less effective. Which difficulty in Fineberg's discussion of priority setting does this best illustrate?", "options": ["Public health funding is constantly constrained and prevention's results are invisible", "The attainability of the needed change is under-considered", "Choosing between a large but declining burden and a small but growing threat", "Data and analysis must be combined with value judgments, and value differences masquerade as arguments about effectiveness"], "answer": 3, "explain": "두 의원은 같은 자료를 보고도 각자 앞세우는 가치에 따라 다른 정책을 주장하고, 가치판단의 차이는 서로 다른 접근의 효과성에 관한 논쟁으로 위장되어 나타납니다. 재원 제약이나 달성 가능성, 규모는 크지만 감소하는 부담과 작지만 증가하는 위협 사이의 선택은 이 사례에서 문제가 된 대립이 아닙니다.", "concept": "p_priority", "source": "201 Fineberg, 2절 나항"}, {"id": "p1-04", "course": "pubh510", "week": "1w", "topic": "Preparedness vs political capacity", "importance": 3, "why": "준비도 순위의 한계", "type": "mc", "q": "Kavanagh and Singh compare the top 35 countries on the Global Health Security Index. Korea, the US and the UK all began with a few cases in mid-February, but by May 1 Korea's cumulative cases were about 10% of the UK's and 1% of the US's, and deaths per 100,000 were under 1 in Korea versus 19 in the US and 40 in the UK. What do the authors conclude?", "options": ["Preparedness indexes capture resources and stability but omit the political capacity needed to mobilize them", "The index was accurate, and the gap is mainly luck in when the virus arrived", "Authoritarian governments are better at mobilizing capacity than democracies", "Korea simply had more laboratory capacity and health workers than the US and UK"], "answer": 0, "explain": "두 저자는 같은 준비도 범주에 속한 나라들의 결과가 크게 달랐던 이유를 지표에 정치적 요인이 포함되지 않았다는 점에서 찾고, 국가가 보유한 역량은 정치 과정을 거쳐 동원되어야 한다고 봅니다. 또한 한국은 민주주의 국가이므로 한국의 성과를 권위주의 체제의 우위로 설명할 수 없고, 두 저자는 준비도 순위가 부유한 나라에 유리하게 치우쳤다고 비판합니다.", "concept": "p_capacity", "source": "204 Kavanagh, 2절 라ㆍ마항; 101 4절 나항"}, {"id": "p1-05", "course": "pubh510", "week": "1w", "topic": "Political identity vs speed", "importance": 3, "why": "성패를 결정한 변수", "type": "mc", "q": "In Wallace-Wells's account of Baldwin, conservative governments (US, Brazil) and socialist governments (Sweden, Netherlands) both resisted lockdowns, while authoritarian China and Saudi Arabia and liberal New Zealand and Germany all imposed strong restrictions. What does this pattern imply about what separated successful from unsuccessful responses?", "options": ["Authoritarian regimes were more effective because they could enforce compliance", "The ideology of the governing party largely determined the response", "Political identity had only a passing relationship to the approach chosen; speed of reaction after the third death mattered more", "Citizens in the US were unusually disobedient compared with other countries"], "answer": 2, "explain": "Baldwin은 각국 정부의 정치적 정체성이 그 정부가 선택한 접근이나 대응의 성패와 부수적인 관계에 그쳤고, 세 번째 사망자가 나온 시점에 정부가 얼마나 빨리 반응하였는지가 더 중요하였다고 봅니다. 미국 시민이 유난히 불복종하였다는 가설은 휴대전화 이동 자료와 마스크 착용 자료로 반증됩니다.", "concept": "p_capacity", "source": "202 Wallace-Wells, 2절 다항 (2)(3)"}, {"id": "p1-06", "course": "pubh510", "week": "1w", "topic": "Trust as leaders' assumption", "importance": 3, "why": "한국ㆍ대만 vs 미국", "type": "mc", "q": "Korea and Taiwan, both democracies, acted as fast as China. According to Wallace-Wells's account of Baldwin, what did their leaders assume that US leaders largely did not?", "options": ["That citizens would obey only if soldiers enforced the rules", "That citizens would tolerate drastic limits on personal freedom once authorities moved to suppress the outbreak, an expression of trust in the people", "That asymptomatic transmission was rare, so voluntary measures would be enough", "That a federal system would coordinate state responses automatically"], "answer": 1, "explain": "한국의 통치자는 당국이 유행 억제에 나서면 시민이 극단적인 자유 제약도 감내하리라고 전제하였고, 이는 정치 지도자가 국민을 신뢰하였다는 표현입니다. 반면 미국에서는 그러한 신뢰가 거의 없어서 공직자들이 집에 머물라고 완곡하게 권고하는 데 그쳤습니다. 무증상 전파가 드물다는 전제는 오히려 자발주의 전략의 결함으로 지적됩니다.", "concept": "p_capacity", "source": "202 Wallace-Wells, 3절 나ㆍ다항"}, {"id": "p1-07", "course": "pubh510", "week": "1w", "topic": "Canada long-term care failure", "importance": 2, "why": "단일지불자의 한계", "type": "mc", "q": "Canada's single-payer system helped people comply with public health measures because testing and treatment cost nothing out of pocket. Yet by the end of May 2020, 81% of Canada's COVID-19 deaths were linked to long-term care, the highest among 17 OECD countries with data. According to Fafard et al., which feature best explains this?", "options": ["The federal government invoked the Emergencies Act and overrode provincial plans", "A national shortage of diagnostic reagents ended testing altogether", "Emergency income benefits were too low for workers to self-isolate", "Single-payer coverage extends only to physician and hospital expenses, leaving long-term care to differently financed and regulated provincial systems with understaffing"], "answer": 3, "explain": "단일지불자 체계는 의사와 병원 비용까지만 포괄하였고, 노인 장기요양은 주마다 재원 조달과 규제 방식이 달랐으며 예산 제약 때문에 인력이 부족하고 직원이 여러 시설에서 동시에 근무하였습니다. 연방정부는 비상사태법(Emergencies Act)을 발동하지 않았고 진단 시약 부족은 3월 중순에 해소되었으므로, 두 사정으로는 장기요양 사망을 설명할 수 없습니다.", "concept": "p_capacity", "source": "203 Fafard, 4절 나항 (3)"}, {"id": "p1-08", "course": "pubh510", "week": "1w", "topic": "Partisanship mediates health system", "importance": 2, "why": "체계가 작동할 조건", "type": "mc", "q": "Bollyky et al. found that more physicians, more health spending per capita and a lower uninsured rate were associated with higher vaccination only in states that voted for the Democratic candidate in 2020. How do the authors interpret this?", "options": ["A strong health system worked best where the public was willing to use it", "Republican-voting states had too few doctors for vaccination to be possible", "Public health spending is ineffective and should be reduced", "The governor's party determined state death rates"], "answer": 0, "explain": "저자들은 대중이 보건체계를 이용할 의사가 있는 주에서 강한 보건체계의 효과가 가장 컸다고 요약합니다. 즉 자원이 있더라도 그 자원이 이용되는지는 신뢰와 정파성에 따라 달라집니다. 또한 주지사의 정당과 누적 사망률 사이에는 통계적 연관이 확인되지 않았고, 저자들은 이 결과에서 공중보건 지출이 무용하다는 결론을 도출하지 않도록 주의를 당부하였습니다.", "concept": "p_capacity", "source": "206 Bollyky, 3절 다항, 4절 다항"}, {"id": "p1-09", "course": "pubh510", "week": "1w", "topic": "Deliberative component of democracy", "importance": 3, "why": "어떤 민주주의가 효과적인가", "type": "mc", "q": "Jain et al. test five V-Dem component indices of democratic governance against excess mortality in 78 countries. Which component was the only one significantly associated with fewer excess deaths, and what does it capture?", "options": ["Electoral: whether elections are free, fair and regular", "Egalitarian: whether rights and resources are equally protected", "Deliberative: whether decisions follow public reasoning and the common good rather than emotional appeals, parochial interests or coercion", "Participatory: how much citizens take part in politics"], "answer": 2, "explain": "선거, 자유, 평등, 참여 지수는 유의하지 않았고 심의 지수만 유의하였습니다. 따라서 초과사망 감소와 연관된 것은 의사결정이 감정적 호소, 편협한 이해관계, 강압을 배제하고 공적 논증과 공동선에 따라 이루어지는지라는 과정의 특성이며, 민주주의의 다른 구성 요소와 초과사망 사이에는 유의한 연관이 확인되지 않았습니다. 저자들은 이 과정이 보건의료체계 거버넌스와 회복력에 반영된다고 해석합니다.", "concept": "p_democracy", "source": "205 Jain, 4절 마항, 5절 라항"}, {"id": "p1-10", "course": "pubh510", "week": "1w", "topic": "Endogeneity and excess mortality", "importance": 3, "why": "자료 선택에 따라 달라지는 결론", "type": "mc", "q": "Kavanagh and Singh warn that comparing reported COVID-19 cases across regime types is hard to interpret because few reported cases could reflect reality or a lack of transparency. How does Jain et al.'s choice of outcome address this problem?", "options": ["It uses vaccination rates, which every government reports accurately", "Excess mortality (all-cause deaths minus expected deaths) depends less on testing capacity and cause-of-death recording, and also captures indirect deaths", "It restricts the sample to authoritarian countries, where reporting is uniform", "It measures democracy in 2019, so deaths cannot influence the democracy score"], "answer": 1, "explain": "확진 수는 검사 역량과, 체제 유형에 결부된 투명성에 따라 달라지므로 체제와 집계 투명성이 얽히는 내생성 문제가 발생합니다. 초과사망은 전체 사망에서 예상 사망을 뺀 값으로 검사 역량과 사망 원인 기록에 덜 의존하여 그 문제를 완화하고, 의료 이용 감소로 발생한 간접 사망도 포함합니다. 민주주의를 2019년 시점에 측정한 것은 사망이 민주주의 점수에 영향을 미치는 시점 문제에 대응한 설계이며 집계 투명성 문제를 해결하지는 못합니다.", "concept": "p_democracy", "source": "204 Kavanagh, 3절 바항; 205 Jain, 5절 바항"}, {"id": "p1-11", "course": "pubh510", "week": "1w", "topic": "Pathways beyond transmission and vaccination", "importance": 2, "why": "연관의 해석", "type": "tf", "q": "In Jain et al., adjusting for the case rate made the negative association between democracy and excess mortality larger, and adjusting for vaccination coverage made it smaller but still significant. This suggests the association is not explained by transmission control or vaccination alone.", "options": ["True", "False"], "answer": 0, "explain": "확진율을 보정하면 계수가 -2.18에서 -2.59로 커지고, 접종률을 보정하면 -2.05로 줄지만 유의성이 유지됩니다. 따라서 전파 억제와 접종 밖의 경로, 예를 들어 보건의료 제공 교란을 견디는 체계의 회복력이 함께 작용한다고 볼 수 있습니다. 다만 Jain et al.의 분석은 관찰 연구이므로 이 결과로 인과관계를 증명할 수는 없습니다.", "concept": "p_democracy", "source": "205 Jain, 4절 라항, 5절 다항"}, {"id": "p2-01", "course": "pubh510", "week": "2w", "topic": "Negative rights in practice", "importance": 3, "why": "소극적 권리 사례 분류", "type": "mc", "q": "Gostin et al. describe Vietnam's motorcycle helmet law. In the lecture's classification, what kind of right does this law protect?", "options": ["A positive right, because the government must hand out helmets free of charge", "A negative (natural) right, because the government protects people from a threat to health", "A positive right, because it promotes health and well-being through new services", "A moral right only, because Vietnam is a low-income country"], "answer": 1, "explain": "헬멧 의무는 정부가 건강에 대한 위협에서 사람을 보호하는 조치이므로 소극적 권리(자연권)의 사례입니다. 적극적 권리는 정부가 재화와 서비스를 제공하여야 하는 권리인데, 이 법은 정부가 자원을 제공하지 않고 위험 행동을 규제하는 법입니다.", "concept": "p_neg_pos", "source": "103 Social Institutions & Rights, 3절 나항"}, {"id": "p2-02", "course": "pubh510", "week": "2w", "topic": "Positive vs negative rights", "importance": 3, "why": "적극적 권리는 누가 비용을 내는가", "type": "mc", "q": "Which of the following is the clearest example of a POSITIVE right to health?", "options": ["Banning phone use while driving", "Plain packaging of tobacco products", "Guaranteeing that a person with no money can still be treated, with the cost borne by the party responsible for the right", "Capping artificial trans fat in processed foods"], "answer": 2, "explain": "적극적 권리는 돈이 없어도 진료를 받을 권리처럼 책임 기구가 자원을 제공하여야 하는 권리이며, 의사와 병원이 무상으로 일할 수 없으므로 비용을 누군가 부담하여야 합니다. 운전 중 휴대전화 사용 금지, 담배 무지 포장, 트랜스지방 상한은 위협을 방지하는 규제여서 소극적 권리에 속합니다.", "concept": "p_neg_pos", "source": "103 Social Institutions & Rights, 3절 가항"}, {"id": "p2-03", "course": "pubh510", "week": "2w", "topic": "Scope and depth", "importance": 2, "why": "권리의 실제 크기를 정하는 두 변수", "type": "tf", "q": "For a positive right, 'scope' means how much coverage is given for each service, and 'depth' means how many services are covered.", "options": ["True", "False"], "answer": 1, "explain": "이 진술에서는 범위와 깊이의 정의가 서로 반대로 되어 있으며, 적극적 권리에서 범위(scope)는 몇 가지 서비스를 대상으로 하는지를, 깊이(depth)는 서비스마다 얼마나 많이 보장하는지를 의미합니다.", "concept": "p_neg_pos", "source": "103 Social Institutions & Rights, 3절 다항"}, {"id": "p2-04", "course": "pubh510", "week": "2w", "topic": "Forman's three tiers", "importance": 3, "why": "3단계 구분 적용", "type": "mc", "q": "A country's law says hospitals may not turn away or screen out patients who cannot pay, but it says nothing about the quality of care patients then receive. Using the three-tier framework (Forman), which tier is this?", "options": ["A natural right (protection from threats)", "The right to health care (content and quality of care)", "The right to health (including social determinants)", "The right of access to health care"], "answer": 3, "explain": "이 법은 병원이 지불 능력을 이유로 환자를 배제하지 못하게 할 뿐 접근한 뒤의 돌봄의 질이나 내용은 보장하지 않으므로 1단계인 의료 접근권에 해당합니다. 권리가 돌봄의 내용과 질까지 정하면 2단계인 의료에 대한 권리가 되고, 주거와 영양 같은 비의료 요소까지 포함하면 3단계인 건강에 대한 권리가 됩니다.", "concept": "p_tiers", "source": "103 Social Institutions & Rights, 3절 라항 (1)(2)"}, {"id": "p2-05", "course": "pubh510", "week": "2w", "topic": "Why right to health is rare", "importance": 3, "why": "건강권이 구현되기 어려운 이유", "type": "mc", "q": "Which statement best explains why almost no country has fully embodied a right to health?", "options": ["Most variation in health comes from non-medical social determinants that sit under separate ministries with their own agendas, and addressing all of them would cost more than US health care spending", "No international document recognizes health as a human right", "Courts in every country have ruled that such a right cannot be enforced", "High-income countries already provide universal medical care, so they see no need for the right"], "answer": 0, "explain": "건강 변이의 60~80%가 의료와 무관하고, 주거ㆍ교통ㆍ식품 등을 관할하는 부처마다 각자의 우선순위가 있으며, 사회적 결정요인을 모두 개선하는 비용이 미국의 연간 의료비 3조 달러보다 크다는 점이 그 이유입니다. 세계인권선언 등에 건강권이 규정되어 있으므로 국제 문서가 없다는 설명은 틀립니다.", "concept": "p_tiers", "source": "103 Social Institutions & Rights, 3절 마항"}, {"id": "p2-06", "course": "pubh510", "week": "2w", "topic": "US programs as implied rights", "importance": 3, "why": "미국의 암묵적 의료 권리의 한계", "type": "mc", "q": "Which US program does the lecture describe as closest to a genuine legal right to health care, and what limits it?", "options": ["Medicare, because every citizen over 65 qualifies automatically", "EMTALA, but the entitlement ends once the patient is stabilized", "Medicaid, because it covers all low-income people without conditions", "Veterans Affairs, because veterans can use it for any condition"], "answer": 1, "explain": "EMTALA는 병원이 불안정한 상태의 모든 사람을 안정될 때까지 치료하도록 규정하여 진정한 법적 권리에 가장 가깝지만, 그 권리는 환자가 안정된 시점에 끝납니다. Medicare는 Medicare 세금이 부과된 고용 연수에 따라 자격이 정해지고, 일부 주의 Medicaid에는 근로 요건이 있으며, VA의 권리는 군 복무와 관련된 장애와 부상에만 인정됩니다.", "concept": "p_tiers", "source": "103 Social Institutions & Rights, 4절 나항"}, {"id": "p2-07", "course": "pubh510", "week": "2w", "topic": "Diffused responsibility", "importance": 3, "why": "책임 분산은 곧 무책임", "type": "mc", "q": "DeCamp et al. spread responsibility for the right to health across physicians, patients, institutions and government agencies. What problem does the lecture identify?", "options": ["Assigning responsibility to many actors is the same as assigning it to none, so no single actor is finally accountable; government should be the starting point", "It gives too much power to physicians, who then control the allocation of resources", "It makes the right depend on taxes paid, so non-workers lose the right", "It limits the right to emergencies, so care ends when the patient is stabilized"], "answer": 0, "explain": "사회제도의 둘째 기능은 핵심 행위자에게 책임을 부여하는 것인데, 책임을 여러 주체에 분산하면 최종적으로 책임질 단일 행위자가 없어집니다. 강의에서는 다른 주체가 정부를 보완할 수 있으나 대체할 수는 없으므로 정부가 출발점이 되어야 한다고 설명합니다.", "concept": "p_duties", "source": "103 Social Institutions & Rights, 2절 라항"}, {"id": "p2-08", "course": "pubh510", "week": "2w", "topic": "Behavioral duties and surcharges", "importance": 3, "why": "외부효과가 있으면 벌칙을 정당화하기 쉬움", "type": "mc", "q": "Some countries add a surcharge to smokers' insurance premiums. By the lecture's logic, which behavior is the EASIEST to justify penalizing?", "options": ["Smoking alone in a closet at home", "Cycling without a helmet", "Skydiving", "Smoking next to non-smokers, causing secondhand smoke harm"], "answer": 3, "explain": "간접흡연처럼 외부효과가 있는 행동은 행위자 본인 외의 사람도 그 비용을 부담하므로 할증료나 벌칙을 정당화하기 쉽습니다. 집에서 혼자 하는 흡연, 헬멧 없는 자전거 타기, 스카이다이빙은 해가 본인에게 한정되어 벌칙을 정당화할 도덕적 한계선을 긋기가 더 어렵습니다.", "concept": "p_duties", "source": "103 Social Institutions & Rights, 5절 다항"}, {"id": "p2-09", "course": "pubh510", "week": "2w", "topic": "Policy metaphor", "importance": 2, "why": "은유는 부분적 비교", "type": "tf", "q": "According to the lecture's use of the policy-metaphor argument (Schlesinger and Lau), 'health care is a right' holds in the US as a partial metaphor, not literally.", "options": ["True", "False"], "answer": 0, "explain": "은유는 부분적 비교이므로, 줄리엣이 태양이라는 말이 빛과 온기에서만 참이듯 의료는 어떤 면에서 권리와 비슷하지만 권리 사고로 모두 환원되지 않으며, 미국에서 의료가 권리라는 명제는 문자 그대로 성립하지 않습니다.", "concept": "p_duties", "source": "103 Social Institutions & Rights, 2절 라항"}, {"id": "p2-10", "course": "pubh510", "week": "2w", "topic": "Which care fits the market", "importance": 3, "why": "시장 적합도 시나리오 적용", "type": "mc", "q": "A new resident of New Haven faces four needs. Which one fits market-style choice WORST, and why?", "options": ["Choosing an optometrist, because glasses are expensive", "Managing diabetes with a new primary care doctor, because chronic disease is emotionally frightening", "Getting a possibly broken arm imaged after a bike fall, because pain and urgency leave no time or clear judgment to compare providers", "Choosing glasses, because comparative data on optometrists are abundant"], "answer": 2, "explain": "골절이 의심되는 환자는 급성 통증 때문에 진료가 급하고 판단 능력이 떨어지며 제공자를 비교할 기회가 없으므로, 이 상황이 시장 선택에 가장 맞지 않습니다. 당뇨병 관리와 안경 선택은 급하지 않고 표준화되어 있거나 자료가 풍부하여 시장 선택에 잘 맞습니다.", "concept": "p_market_fit", "source": "104 Markets, 3절 다항"}, {"id": "p2-11", "course": "pubh510", "week": "2w", "topic": "Quality data and rare conditions", "importance": 2, "why": "희귀 질환은 질 자료가 부족", "type": "mc", "q": "Why are comparative quality data less reliable for providers treating a rare condition than for diabetes care?", "options": ["Too few cases to produce reliable statistics, and providers often do some tasks very well and others poorly, so quality cannot be generalized from unrelated measures", "Rare conditions are always treated in emergencies, so no data are collected", "Patients with rare conditions have no interest in comparing providers", "Diabetes providers are required by law to publish all their outcomes"], "answer": 0, "explain": "당뇨병은 환자가 많아 제공자마다 환자와의 상호작용이 많으므로 신뢰할 만한 통계를 산출할 수 있습니다. 반면 희귀 질환은 사례가 부족하고, 제공자가 업무마다 잘하는 정도가 달라 관련 없는 항목의 질 측정 결과로 그 질환 진료의 질을 일반화할 수 없습니다.", "concept": "p_market_fit", "source": "104 Markets, 3절 나항 (1)"}, {"id": "p2-12", "course": "pubh510", "week": "2w", "topic": "Switching costs in chronic care", "importance": 2, "why": "만성 돌봄 관계의 양면성", "type": "mc", "q": "A long relationship with a primary care doctor can improve diabetes care. How can the same relationship weaken the market's discipline on quality?", "options": ["It makes quality data harder to publish", "It reduces the number of providers in the area", "It makes standardized products unavailable", "It creates switching costs, so patients hesitate to leave even a mediocre provider"], "answer": 3, "explain": "환자와 일차의료 의사의 관계가 장기간 지속되면 돌봄의 질은 높아지지만, 환자가 평범한 제공자도 떠나기를 꺼리게 되는 전환 비용이 발생합니다. 선택에 기대하는 효과는 소비자가 실제로 제공자를 전환할 수 있어야 실현되므로, 전환 비용은 시장의 장점을 약화합니다.", "concept": "p_market_fit", "source": "104 Markets, 3절 나항 (1)"}, {"id": "p2-13", "course": "pubh510", "week": "2w", "topic": "Choice as equity protection needs competition", "importance": 3, "why": "선택의 형평 보호는 경쟁이 전제", "type": "mc", "q": "One anticipated virtue of choice is that people receiving poor or disrespectful care can leave for a better provider. Which government role does this mechanism logically depend on?", "options": ["Setting minimum safety and efficacy standards for drugs", "Maintaining competition through antitrust policy so that several providers exist", "Producing a national price list for all services", "Taxing providers who deliver poor care"], "answer": 1, "explain": "질이 낮거나 무례한 돌봄을 받은 사람이 떠나서 다른 제공자를 찾으려면 제공자가 여럿 있어야 하고, 독점 시장에서는 소비자가 실제로 전환할 수 없으므로 정부가 독점 금지 정책으로 합병을 막아 경쟁을 유지하는 것이 이 기전의 전제입니다. 반면 최소 기준 설정은 치명적인 선택지를 없애는 별개의 역할입니다.", "concept": "p_market_gov", "source": "104 Markets, 2절 나항 (3)과 다항 (3)"}, {"id": "p2-14", "course": "pubh510", "week": "2w", "topic": "Three anticipated virtues of choice", "importance": 3, "why": "선택의 세 가지 장점 구별", "type": "mc", "q": "Which statement matches 'choice as empowerment' (as opposed to 'choice as its own virtue')?", "options": ["Choice is good regardless of outcomes, since health is personal and no one should impose a provider on another", "Choice protects groups likely to be mistreated, since they can walk away from poor care", "Choice matters because it gives people more authority over decisions about their own lives, not because choosing is inherently good", "Choice lowers costs because consumers compare prices"], "answer": 2, "explain": "선택을 역량 부여로 보는 관점에서 선택이 중요한 이유는 사람들에게 자기 삶에 관한 의사결정 권한을 더 많이 부여하기 때문이며, 선택하는 행위 자체를 본래의 미덕으로 보지 않습니다. 첫 번째 보기는 선택 자체의 미덕을, 두 번째 보기는 형평 보호를, 네 번째 보기는 비용 억제를 근거로 한 논거이므로 역량 부여와 다른 항목입니다.", "concept": "p_market_gov", "source": "104 Markets, 2절 나항 (3)"}, {"id": "p2-15", "course": "pubh510", "week": "2w", "topic": "Comparative quality information", "importance": 2, "why": "질 정보 부족 현실", "type": "tf", "q": "By 2015, most Americans who needed a new physician could find quality information about physicians (Schlesinger et al.).", "options": ["True", "False"], "answer": 1, "explain": "2015년에도 의사 질 자료를 찾은 사람은 약 25%에 그쳐, 4분의 3은 제공자를 전환하면 질이 개선되는지 알지 못한 채 선택한 셈입니다. 병원 질 자료는 Medicare가 공개한 뒤 개선되었으나 의사 질 자료는 오랫동안 개선되지 않았습니다.", "concept": "p_market_gov", "source": "104 Markets, 2절 다항 (3)"}, {"id": "p2-16", "course": "pubh510", "week": "2w", "topic": "Bounded rationality and equity", "importance": 3, "why": "선택의 이익이 불평등하게 배분되는 이유", "type": "mc", "q": "Using bounded rationality, which explanation is correct for why disadvantaged consumers benefit less from provider choice?", "options": ["They are less motivated to find good providers", "They have lower intelligence on average, so they compare worse", "They reject choice as a principle more often than educated people", "Choosing well is a structurally harder task for them because of less time and costlier information, independent of motivation or intelligence"], "answer": 3, "explain": "제한된 합리성은 정보를 얻는 비용이 크거나 처리할 시간이 부족한 집단의 합리성이 더 제한된다는 개념이며 동기나 지능과 무관합니다. 오히려 학력이 낮은 사람이 선택 기회에 더 긍정적으로 반응하였으므로 선택을 거부한다는 설명도 맞지 않습니다.", "concept": "p_bounded", "source": "104 Markets, 5절 가항과 나항"}, {"id": "p2-17", "course": "pubh510", "week": "2w", "topic": "US cost-sharing vs other countries", "importance": 3, "why": "미국과 타국의 비용 억제 방식 비교", "type": "mc", "q": "In the 1990s and 2000s US spending was the highest in the world without matching health outcomes. How did the US response differ from most other countries?", "options": ["The US pushed deductibles and cost-sharing onto consumers, while most other countries imposed global budgets", "The US adopted global budgets, while most other countries used high deductibles", "Both used global budgets, but the US set a larger one", "Both used cost-sharing, but other countries applied it only to high earners"], "answer": 0, "explain": "대부분의 나라는 의료비로 얼마를 지출할지 집합적으로 정하는 총액 예산으로 대응한 반면, 미국은 소비자가 청구액 일부를 부담하여 비용을 의식하게 하는 방식을 택하였습니다. 그 결과 미국에서는 공제액이 커져 환자가 적시에 진료를 받기 어려워졌고, 이 재정적 제약이 소비자가 겪는 정보와 시간의 제약에 추가되었습니다.", "concept": "p_bounded", "source": "104 Markets, 4절 라항 (1)"}, {"id": "p2-18", "course": "pubh510", "week": "2w", "topic": "Vertical mergers and choice", "importance": 3, "why": "합병이 선택의 전제를 없앰", "type": "mc", "q": "Yale New Haven Hospital bought nearly all physician practices in southern Connecticut. Which kind of merger is this, and why does it matter for a market built on choice?", "options": ["Horizontal merger; it joins two hospitals but leaves patients with the same number of options", "Vertical merger; hospitals acquiring physician practices removes alternatives, so patients cannot switch away", "Vertical merger; it improves quality information, which strengthens choice", "Horizontal merger; it lowers deductibles, which raises access"], "answer": 1, "explain": "Yale New Haven Hospital처럼 병원이 의사 진료소를 인수하는 것은 진료 단계 전반을 포괄하는 수직 합병이고, 병원 둘이 결합하는 것은 수평 합병입니다. 합병으로 대안이 사라지면 소비자가 실제로 다른 제공자로 전환할 수 없으므로, 정부가 경쟁을 유지하는 역할이 필요해집니다.", "concept": "p_market_gov", "source": "104 Markets, 2절 다항 (3)"}, {"id": "p3-01", "course": "pubh510", "week": "3w", "topic": "What professional status signals", "importance": 3, "why": "전문직 지위가 신호하는 4가지", "type": "mc", "q": "The lecture's psychic-association example says a 'professional' label signals four things. A new association of 'certified wellness coaches' says its members never share a client's disclosures with relatives and openly say when they cannot judge a situation. Which of the four signals does this describe?", "options": ["Competence and expertise", "Experience validated by paying clients", "Ethical expectations", "Authority granted by the association"], "answer": 2, "explain": "고객의 비밀을 유지하고 판단할 수 없는 한계를 솔직히 밝히는 것은 역량과 별도로 고객을 대하는 행동 규범이므로 넷째 신호인 윤리적 기대에 해당합니다. 반면 역량과 전문성은 동료가 시행하는 자격 시험 같은 것이고, 대가를 지불하는 고객의 검증은 고객이 계속 돈을 낸다는 사실이며, 권위는 협회 자체가 부여하는 것이어서 세 신호는 이 사례에 해당하지 않습니다.", "concept": "p_prof_obligation", "source": "105 Professionalism, 2절 가항"}, {"id": "p3-02", "course": "pubh510", "week": "3w", "topic": "Three levels of professional obligation", "importance": 3, "why": "대인 의무와 사회적 의무의 충돌", "type": "mc", "q": "Hall et al. divide professional obligation into intrapersonal, interpersonal and societal levels. A physician's duty to the single patient in the room conflicts with a duty to avoid wasting health resources that serve the wider population. Which pair of levels is in tension?", "options": ["Interpersonal and societal", "Intrapersonal and interpersonal", "Intrapersonal and societal", "Competence and expertise"], "answer": 0, "explain": "대인 단계는 개별 고객과 맺는 이자(二者) 관계에 관한 기대이고, 사회적 단계는 이자 관계에 한정되지 않는 더 넓은 기대입니다. 강의에서는 이 두 단계의 상충이 학기 내내 반복되는 주제라고 설명하였습니다. 개인 내적 단계는 전문가 자신의 동기와 행동 성향이어서 이 충돌의 당사자가 아니고, 역량과 전문성은 ABIM이 나눈 두 범주로서 의무의 단계에 속하지 않습니다.", "concept": "p_prof_obligation", "source": "105 Professionalism, 2절 다항 (2)"}, {"id": "p3-03", "course": "pubh510", "week": "3w", "topic": "Do no harm and trust", "importance": 3, "why": "해를 끼치지 않는다는 표현의 역효과", "type": "mc", "q": "The lecture argues that telling patients clinicians 'do no harm' undermines trust and helps explain COVID-19 vaccine refusal. What is the mechanism?", "options": ["Clinicians billed for the vaccine, so people read their advice as a conflict of interest", "Vaccine guidelines were outdated and inconsistent with one another", "Burned-out clinicians gave patients less counselling about vaccines", "A promise of harm-free care makes any unavoidable harm count twice: the harm itself and the loss of trust in care that was said to be harmless"], "answer": 3, "explain": "해가 전혀 없는 의료는 없으므로 ‘해를 끼치지 않는다’는 표현을 들은 환자는 사실과 다른 기대를 하게 되고, 환자가 불가피한 해를 입으면 해 자체와 신뢰 상실이라는 이중의 피해가 발생합니다. 그래서 코로나19 백신 접종 뒤 심장 합병증으로 인한 사망 2~3건도 백신을 거부하는 사유가 됩니다. 한편 강의에서는 의사가 백신 비용을 청구하지 않으므로 이해충돌로는 백신 거부를 설명하기 어렵다고 지적하였습니다.", "concept": "p_prof_obligation", "source": "105 Professionalism, 2절 다항 (4)"}, {"id": "p3-04", "course": "pubh510", "week": "3w", "topic": "Why guidelines fail to change practice", "importance": 3, "why": "지침이 행동을 못 바꾸는 이유", "type": "mc", "q": "Timmermans and Mauck find that even authoritative, evidence-based guidelines often change clinician behaviour little (average adherence about 54.5% across conditions). What does their sociological reading say is the missing variable?", "options": ["Clinicians rarely hear of guidelines because professional societies do not publish them", "The assumption that good clinicians automatically follow the best evidence overlooks professional autonomy and discretion, so guidelines are treated as options", "Guidelines are too few, so most clinical situations have no recommendation", "Payers prohibit clinicians from following guidelines"], "answer": 1, "explain": "근거 기반 지침의 지지자와 반대자는 모두 최선의 근거를 모으면 좋은 임상의가 그 근거를 따르리라고 전제하면서, 전문직의 핵심 특징인 자율과 재량을 고려하지 않았습니다. 전문직 종사자는 지침을 여러 선택지 가운데 하나로 취급하고, 전문가 단체도 지침 준수를 강제하지 않습니다. 또한 지침은 해마다 1,000건을 초과하여 작성되어 오히려 너무 많은 것이 문제이므로, 지침이 부족하다는 설명은 맞지 않습니다.", "concept": "p_ebm_guidelines", "source": "222 Timmermans, 4절 다항 (2)"}, {"id": "p3-05", "course": "pubh510", "week": "3w", "topic": "Multifaceted implementation", "importance": 3, "why": "다면적 이행이 성공한 이유", "type": "mc", "q": "The Royal Children's Hospital (Victoria) reached a 95.5% success rate in the first three months of switching asthma care to inhalers with spacers, far above typical guideline uptake. According to Timmermans and Mauck, what mainly explains this?", "options": ["The guideline was one step in a multifaceted effort: a multidisciplinary team, staff workshops, pharmacists and parents informed, and weekly chart review with feedback", "The hospital enforced the guideline with financial penalties for non-compliant physicians", "The national board made adherence a condition of specialty certification", "The hospital replaced physicians with less skilled staff who followed the protocol"], "answer": 0, "explain": "병원은 영향을 받는 부서의 간호사와 의사로 팀을 구성하고 지역 이해당사자의 의견을 반영하였으며, 직원 워크숍, 약사와 가족에 대한 안내, 매주 진료기록 검토와 피드백으로 변화를 뒷받침하였습니다. 저자들은 강제를 더 앞세울 필요가 없고 의료 업무의 협력적 성격을 활용하여야 한다고 주장합니다. 숙련도가 낮은 인력으로 의사를 대체하는 방식은 오히려 비판자들이 우려한 시나리오입니다.", "concept": "p_ebm_guidelines", "source": "222 Timmermans, 5절 다항"}, {"id": "p3-06", "course": "pubh510", "week": "3w", "topic": "Share of evidence-based care", "importance": 2, "why": "근거 기반 진료 비율 30~40%", "type": "tf", "q": "True or False: According to the lecture, the share of delivered care that meets a high evidence standard (about 30 to 40%) is much lower in the United States than in other high-income countries.", "options": ["True", "False"], "answer": 1, "explain": "강의에서는 높은 근거 기준을 충족하는 진료가 약 30~40%이고, 이 비율은 미국과 전 세계 고소득 국가에서 같다고 설명하였습니다. 근거 기반이 아닌 진료가 많은 원인은 기술 변화, 허가 외 처방, 수술과 시술 개입이며, 이러한 원인은 미국에만 있는 것이 아닙니다.", "concept": "p_ebm_guidelines", "source": "105 Professionalism, 3절 나항"}, {"id": "p3-07", "course": "pubh510", "week": "3w", "topic": "Why task shifting is not enough", "importance": 3, "why": "업무 이전만으로는 소진 해결 불가", "type": "mc", "q": "A hospital moves chart documentation from physicians to scribes and in-basket messages to nurse practitioners to reduce burnout. Why do Rotenstein, Berwick and Cassel regard shifting alone as inadequate?", "options": ["Scribes and nurse practitioners are not allowed to do this work", "Shifting only helps if every team member also receives a pay raise", "Relieving one group can raise another group's workload and expectations, so the total workload must be reduced or automated through redesign", "Well-being cannot be measured once tasks are moved between roles"], "answer": 2, "explain": "어떤 구성원의 부담을 덜면 다른 구성원의 업무량과 기대가 증가할 수 있으므로, 문서 작업을 줄이거나 자동화하고 팀 기반 진료를 도입하여 전체 업무량을 줄이는 재설계가 필요합니다. Rotenstein 등은 임금을 넷째 요건에서 별도로 검토하며, 임금 인상을 업무 이전의 조건으로 보지 않습니다.", "concept": "p_system_trust_wellbeing", "source": "221 Rotenstein, 3절 다항"}, {"id": "p3-08", "course": "pubh510", "week": "3w", "topic": "Systems view of professionalism", "importance": 3, "why": "체계 관점이 요구하는 개혁 방향", "type": "mc", "q": "Lesser et al. treat health care as a complex adaptive system in which professional behaviour is shaped by its context. A hospital leader wants more professional behaviour from clinicians. Which approach follows from their view?", "options": ["Select medical students with stronger innate character", "Offer resilience training to individual clinicians and leave the work environment unchanged", "Pay physicians a bonus tied to each patient's outcome", "Build individual competence and also adjust organizational and external conditions (payment methods, culture, leadership) so they support professional behaviour"], "answer": 3, "explain": "전문직업적 행동은 조직과 환경의 영향을 크게 받으므로 개인의 회복탄력성과 역량을 높이는 것만으로는 부족하고, 지불 방식, 문화, 리더십 같은 외부 여건도 그 행동을 뒷받침하도록 조정하여야 합니다. 저자들은 개별 환자 결과에 연동한 성과급보다 총비용과 결과에 초점을 둔 지불 방식을 제안합니다. 다만 체계 관점에서도 개인의 책임은 면제되지 않습니다.", "concept": "p_system_trust_wellbeing", "source": "218 Lesser, 5절"}, {"id": "p3-09", "course": "pubh510", "week": "3w", "topic": "Trust in science is not a uniform crisis", "importance": 2, "why": "신뢰 위기 통념과 실제 자료", "type": "mc", "q": "A news article claims science faces a worldwide collapse of public trust. Which reading best fits the Nature editorial and the lecture's trust data?", "options": ["The claim is correct, because scientists rank below most occupations in surveys", "The claim oversimplifies: trust in scientists is mostly moderate to high, but it has fallen in particular groups (for example US Republicans) and on particular topics such as vaccines", "The claim is wrong, because trust has risen in every group since COVID-19", "The claim is correct, because a single survey question about trusting science shows a steady decline"], "answer": 1, "explain": "Ipsos 32개국 조사에서 과학자를 신뢰한다는 응답은 56%로 의사 58%에 이어 높았고, 신뢰의 하락은 미국 공화당 지지자 같은 특정 집단과 백신 같은 특정 주제에 집중되어 있습니다. 강의의 미국 자료에서도 의사에 대한 신뢰는 2021년 67%에서 2024년 53%로 하락하였지만 여전히 5위입니다. 또한 Nature 편집진은 사설에서 과학 신뢰를 묻는 단일 문항으로는 무엇을 측정하는지 불명확하다고 지적하였습니다.", "concept": "p_system_trust_wellbeing", "source": "220 Nature, 2절; 105 Professionalism, 2절 라항"}, {"id": "p3-10", "course": "pubh510", "week": "3w", "topic": "Match bonding, bridging, linking to cases", "importance": 3, "why": "결속, 가교, 정치ㆍ제도 연결 구분", "type": "mc", "q": "Match Ogden et al.'s three forms of social capital to the cases. (i) In the IMAGE study, women who built trust in Sisters for Life groups re-examined gender norms that tolerated violence. (ii) A group of sexual and reproductive health doctors was connected with a group of HIV doctors to improve both services. (iii) South Africa's Treatment Action Campaign used coalitions and litigation to cut the price of HIV treatment and then pressed the government to expand access.", "options": ["(i) bridging; (ii) bonding; (iii) linking", "(i) bonding; (ii) linking; (iii) bridging", "(i) linking; (ii) bridging; (iii) bonding", "(i) bonding; (ii) bridging; (iii) linking"], "answer": 3, "explain": "(i)은 같은 처지의 여성들이 집단 내부에서 신뢰를 쌓고 규범을 재검토하였으므로 결속입니다. (ii)는 서로 다른 두 의사 집단 사이에 약한 연결을 형성하였으므로 가교 연결입니다. (iii)은 활동가 연합이 약값과 정부 정책을 좌우하는 결정권자에게 영향을 미쳤으므로 정치ㆍ제도 연결입니다.", "concept": "p_social_capital", "source": "225 Ogden, 7~9절; 106 Communities, 2절 나~라항"}, {"id": "p3-11", "course": "pubh510", "week": "3w", "topic": "Why linking fails without will", "importance": 3, "why": "결속만 있고 연결 의지가 없을 때", "type": "mc", "q": "A South African project built strong bonding within a group of female caregivers, but the group's capacity did not last. What reason do Ogden et al. give?", "options": ["Politicians and local men were unwilling to connect the group to power, so linking never formed", "The group lacked internal trust, so bonding itself failed", "The group connected with too many outside groups, which diluted its norms", "The project skipped bridging, the only form that creates political influence"], "answer": 0, "explain": "이 사업에서는 집단 내부의 결속이 충실히 형성되었으나 정치인과 지역 남성에게 집단을 권력과 연계해 줄 의지가 없어 역량이 지속되지 못하였습니다. 결속과 가교 연결은 별다른 투입 없이 형성되지만 정치ㆍ제도 연결은 장치와 의지가 있어야 작동합니다. 정치적 영향력을 형성하는 것은 정치ㆍ제도 연결이므로, 가교 연결이 정치적 영향력을 형성하는 유일한 형태라는 보기는 틀립니다.", "concept": "p_social_capital", "source": "225 Ogden, 14절; 106 Communities, 2절 라항"}, {"id": "p3-12", "course": "pubh510", "week": "3w", "topic": "The exclusivity problem of bonding", "importance": 2, "why": "결속의 한계가 가교의 배경", "type": "mc", "q": "Which statement describes the harm of strong bonding that motivated the idea of bridging social capital?", "options": ["Members lose trust in one another as the group grows", "Bonded groups cannot influence budget decisions at all, which is what bridging adds", "Tight-knit communities tend to look inward, so outsiders cannot reach the information and support held inside", "Bonding forces every member to adopt unhealthy norms"], "answer": 2, "explain": "결속이 강하면 배타성이 생겨 외부인이 공동체 안의 자원에 접근하기 어렵고, 이 한계가 가교 연결 개념의 배경이 되었습니다. 예산 결정권자에게 미치는 영향력은 정치ㆍ제도 연결에 관한 문제입니다. 또한 결속된 집단의 사회 규범은 건강을 해치는 방향으로도 작용할 수 있지만, 결속이 모든 구성원에게 해로운 규범을 강요하는 것은 아닙니다.", "concept": "p_social_capital", "source": "106 Communities, 2절 나항"}, {"id": "p3-13", "course": "pubh510", "week": "3w", "topic": "Linking does not form automatically", "importance": 2, "why": "정치ㆍ제도 연결은 장치가 필요", "type": "tf", "q": "True or False: Ogden et al. say bonding and bridging form with little deliberate input, but linking works only when systems, incentives and political will exist; without them the process stops at the bridging step.", "options": ["True", "False"], "answer": 0, "explain": "Ogden 등은 모형을 적용할 때 가장 큰 어려움이 정치ㆍ제도 연결을 형성하고 체계화할 장치가 없다는 점이라고 설명하며, 능동적으로 접근하지 않으면 사회자본의 형성 과정이 가교 단계에서 멈춘다고 봅니다. 따라서 세 형태가 저절로 차례대로 형성된다는 이해는 틀립니다.", "concept": "p_social_capital", "source": "225 Ogden, 14절"}, {"id": "p3-14", "course": "pubh510", "week": "3w", "topic": "Connectedness to participation to outcomes", "importance": 3, "why": "연결성이 건강에 작용하는 원리", "type": "mc", "q": "The lecture says that what matters for health is how tight-knit a community is, not whether it is geographic, affiliative, ascriptive or traditional. What mechanism links tight connectedness to better outcomes?", "options": ["Tight-knit communities have more physicians per resident", "Residents participate more in using available resources and public programs, so the same program reaches more people", "Tight-knit communities pay lower taxes, which raises household income", "Tight-knit communities select their members, so healthier people join"], "answer": 1, "explain": "공동체의 연결성이 높을수록 구성원이 정책 집행과 공공 사업 이용에 더 많이 참여하며, 공동체가 건강 결과에 영향을 미치는 주요 작용 원리는 이 참여입니다. 사업이 있고 재원이 충분하여도 주민이 이용하지 않으면 효과가 없으므로, 공동체 안의 연결이 사업 이용을 촉진하여야 합니다. 반면 의사 수나 세금은 강의에서 설명한 경로가 아닙니다.", "concept": "p_community_participation", "source": "106 Communities, 1절 나항 (1)(2)"}, {"id": "p3-15", "course": "pubh510", "week": "3w", "topic": "Longitudinality of community exposure", "importance": 2, "why": "공동체 노출의 시간과 장기성", "type": "mc", "q": "The lecture says newly arrived Yale students show little health effect from the New Haven community, and that employers underinvest in workers' long-term health because average job tenure is 3 to 4 years. What do the two cases share?", "options": ["Both are ascriptive identities that others assign", "Both show that larger organizations always invest more", "A short expected stay limits both the health benefit and the investment, because community effects build with long exposure", "Both show that geographic communities matter less than affiliative ones"], "answer": 2, "explain": "공동체에 짧게 노출되면 건강 이익이 미미하고, 건강 결과를 결정하는 것은 장기적 연결성입니다. 2년 뒤에 떠날 것을 아는 학생은 공동체에 적게 투자하고 공동체도 그 학생에게 적게 투자하며, 근속 기간이 짧으면 고용주도 근로자의 장기 건강에 투자할 유인이 작습니다. Umberson and Montez도 아동기 노출과 세대 간 효과를 근거로 같은 결론을 뒷받침합니다.", "concept": "p_community_participation", "source": "106 Communities, 1절 나항 (3), 4절 나항; 224 Umberson, 8절"}, {"id": "p3-16", "course": "pubh510", "week": "3w", "topic": "Independent vs coalition strategy", "importance": 3, "why": "독립 전략과 연합 전략 구별", "type": "mc", "q": "A county health department privately coordinates its agenda with a community-based organization, but in public each approaches legislators separately: the department argues for effective use of limited tax money, the organization argues for what the community needs. Which strategy in Iton et al. (2026) is this?", "options": ["Coalition strategy", "Base building", "Co-governance", "Independent strategy"], "answer": 3, "explain": "독립 전략은 공공기관과 지역사회 기반 조직(CBO)이 결정권자에게 각각 접근하되 조용히 의제를 조율하는 방식으로, 겉으로는 독립적이지만 비밀리에 조율되어 있을 수 있습니다. 반면 연합 전략은 두 주체가 공개적으로 연합하여 통일된 전선으로 자원을 요구하는 방식이어서 이 사례와 다릅니다.", "concept": "p_community_power", "source": "106 Communities, 2절 라항; 227 Iton 2026"}, {"id": "p3-17", "course": "pubh510", "week": "3w", "topic": "Technocratic vs democratic approach", "importance": 3, "why": "지역사회 권력 중심 재원 배분", "type": "mc", "q": "A foundation wants to reduce racial health disparities in a city. Following Iton, Ross and Tamber (2022), which change in its funding follows from their argument?", "options": ["Fund power-building organizations over longer periods instead of short grants tied to one disease", "Fund more individual-behaviour campaigns on smoking and diet", "Fund new clinics to expand access to care only", "Concentrate grants in health-sector organizations with a narrow disease focus"], "answer": 0, "explain": "저자들은 개인 행동, 유전, 의료 접근에 중점을 두는 기술관료적(technocratic) 전략이 구조적 불형평을 해소하지 못하였다고 보고, 정책 개혁과 지역사회 권력을 중심에 두는 민주적(democratic) 접근을 제안합니다. 따라서 재단은 권력 형성 조직에 재원을 배분하고 지원 기간도 장기화하여야 합니다. 나머지 선택지는 모두 저자들이 한계를 지적한 방식입니다.", "concept": "p_community_power", "source": "226 Iton 2022, 3절, 11절"}, {"id": "p3-18", "course": "pubh510", "week": "3w", "topic": "Community power is not always beneficial", "importance": 2, "why": "지역사회 권력의 부정 결과와 한계", "type": "tf", "q": "True or False: Iton et al. conclude that building community power always improves health outcomes and carries no costs for community members.", "options": ["True", "False"], "answer": 1, "explain": "지역사회 권력에 관한 연구의 전체 결론은 권력을 보유한 지역사회가 자기 건강을 보호하고 개선한다는 것이지만, 의도한 결과에 거의 영향이 없었거나 구성원이 소진되고 갈등을 겪었다고 보고한 연구도 있습니다. 또한 Iton 등은 2026년 글에서 역량이 작은 지역사회는 운동의 부담 때문에 오히려 피해를 입을 수 있다고 지적합니다.", "concept": "p_community_power", "source": "226 Iton 2022, 7절; 227 Iton 2026, 17절"}, {"id": "p4w-01", "course": "pubh510", "week": "4w", "topic": "Gumas four components of primary care", "importance": 3, "why": "Gumas 비교의 4개 구성요소", "type": "mc", "q": "Gumas et al. compare primary care in the US and nine other countries using four core components of high-quality primary care. Which of the following is NOT one of them?", "options": ["First contact", "Comprehensiveness of care", "Affordability of care", "Coordination of care"], "answer": 2, "explain": "Gumas 등이 일차의료를 비교하는 데 사용한 4가지 구성요소는 첫 접점(first contact), 진료 연속성(continuity), 진료 포괄성(comprehensiveness), 진료 조정(coordination)입니다. 경제적 부담 가능성(affordability)은 Penchans
