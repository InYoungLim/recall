<!doctype html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Review (26-F) · Yale School of Public Health</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap");
:root{--yale:#00356B;--yale2:#286DC0;--wash:#EEF3F9;--ink:#1D2430;--ink2:#3F4A5A;--rule:#C9D4E2;
  --serif:'Noto Serif KR',Georgia,serif;--head:'Yale 2024','YaleNew','Libre Caslon Text','Noto Serif KR',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{display:flex;min-height:100vh;background:#fff;color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--yale);color:#fff}
:focus-visible{outline:2px solid var(--yale2);outline-offset:2px}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--yale);border-radius:0;padding:7px 16px;cursor:pointer;min-height:38px}
button:hover{background:var(--wash)}
button.primary{background:var(--yale);color:#fff}
button.primary:hover{background:#0a4a8f}
#side{width:250px;flex:none;background:var(--yale);color:#fff;padding:36px 22px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
#side .brand img{width:36px;height:auto;flex:none}
#side .brand .y{font-family:var(--head);font-size:18px;line-height:1.3}
#side .brand .sc{font-size:12px;line-height:1.4;color:#dbe5f1;white-space:nowrap;letter-spacing:.02em}
#side .term{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid #1d4f86;padding-top:10px;margin-bottom:18px}
#side .term a,#side .term span{border:0;padding:0;display:inline}
#side .term .on{color:#fff;font-weight:700}
#side a{display:flex;justify-content:space-between;gap:8px;color:#c9d9ee;padding:7px 0;text-decoration:none;border-bottom:1px solid #1d4f86;cursor:pointer;font-variant-numeric:tabular-nums}
#side a.on{color:#fff;font-weight:700}
#side a.empty{color:#7f9cc4}
#side .foot{margin-top:22px;color:#c9d9ee}
#side .foot button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:0;min-height:0;font:inherit}
#app{flex:1;min-width:0;max-width:980px;padding:36px 44px 120px}
h1{font-family:var(--head);font-weight:400;color:var(--yale);font-size:18px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
h2{font-family:var(--serif);font-weight:700;color:var(--yale);font-size:14px;line-height:1.6;margin:0 0 4px}
.sub{color:var(--ink2);margin-bottom:20px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;background:none;color:var(--ink2)}
.tabs button.on{color:var(--yale);border-bottom-color:var(--yale);font-weight:700}
.eyebrow{color:var(--yale2);border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.q{font-weight:700;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:11px 14px;border-color:var(--rule);background:#fff}
.opt .k{flex:none;width:16px;color:var(--yale2);font-weight:700}
.opt.right{background:var(--yale);border-color:var(--yale);color:#fff}
.opt.right .k{color:#fff}
.opt.wrong{background:var(--rule);border-color:var(--ink2);color:var(--ink);text-decoration:line-through}
.opt:disabled:not(.right):not(.wrong){color:#8591a3}
.res{font-weight:700;margin-bottom:4px;color:var(--yale)}
.exp{}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.card{border-top:2px solid var(--yale);padding:14px 0 22px;margin-bottom:8px}
.card .kor{color:var(--ink2);margin-bottom:8px}
.dgm{margin:14px 0 6px}
.dgm .note{color:var(--ink2);margin-top:6px}
.bx{background:var(--wash);border:1px solid var(--rule);padding:8px 10px;text-align:center}
.bx.k{background:var(--yale);border-color:var(--yale);color:#fff}
.bx .s{color:var(--ink2)}
.bx.k .s{color:#dbe5f1}
.bx .n{color:var(--yale);font-weight:700}
.bx.k .n{color:#fff}
.flow{display:flex;align-items:stretch;gap:0}
.flow .bx{flex:1 1 0;display:flex;flex-direction:column;justify-content:center}
.flow .ar{flex:none;width:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.flow .ar svg{width:22px;height:12px}
.flow .rel{flex:none;padding:0 10px;display:flex;align-items:center;color:var(--ink2)}
.grid{display:flex;flex-direction:column;gap:6px}.grid .bx{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 12px}.grid .bx .n{flex:none;min-width:12px}
.tl{border-left:1px solid var(--rule);margin-left:6px}
.tl .row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;padding:4px 0 4px 14px;position:relative}
.tl .row::before{content:'';position:absolute;left:-4px;top:50%;width:7px;height:7px;margin-top:-4px;background:var(--yale)}
.tl .row.nod{grid-template-columns:1fr}
.tl .d{color:var(--yale);font-variant-numeric:tabular-nums}
.tl .bx{text-align:left;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:7px 12px}
.chart{max-width:440px}
.chart svg{width:100%;height:auto;display:block}
.dgm table td:first-child{color:var(--yale)}
.card .one{margin:18px 0 8px}
.card ul{padding-left:20px;margin:0 0 10px}
.card li{margin-bottom:3px}
.terms{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;margin:8px 0 12px}
.terms b{font-weight:400;color:var(--yale)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
th{border-top:2px solid var(--yale);background:var(--wash);color:var(--yale);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.set input{font:inherit;border:1px solid var(--rule);padding:6px 8px;border-radius:0;min-height:40px}
.src{color:var(--ink2);margin-top:18px}
#side .crow{display:flex;align-items:center;gap:4px;border-bottom:1px solid #1d4f86}
#side .crow a{flex:1;border:0}
#side a.cur{color:#fff}
#side .chev{background:none;border:0;padding:0;min-height:0;width:16px;height:28px;color:#c9d9ee;display:flex;align-items:center;justify-content:center;cursor:pointer}
#side .chev::before{content:'';border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;transition:transform .15s}
#side .chev.closed::before{transform:rotate(-90deg)}
#side .chev:hover{background:none;color:#fff}
#side .chev-sp{width:16px;flex:none}
#side .weeks{padding:2px 0 6px 20px;border-bottom:1px solid #1d4f86}
#side .weeks a{border:0;padding:3px 0;color:#c9d9ee}
#side .weeks a.on{color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 18px}
.chips button{min-height:30px;padding:3px 12px;border-color:var(--rule)}
.chips button.on{background:var(--yale);border-color:var(--yale);color:#fff}
.wgroup{border-top:2px solid var(--yale);padding:10px 0 18px}
.whead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.whead h2{margin:0}
.whead button{min-height:32px;padding:4px 12px}
.irow{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
.irow:hover{background:var(--wash)}
.irow .it{color:var(--yale);font-weight:700;flex:none}
.irow .ik{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px}
.pager button{max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im{color:var(--ink2);font-weight:400;white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
.im.full{color:var(--yale);font-weight:700}
.whead h2 .im{margin-left:0}
details.qb{border-bottom:1px solid var(--rule);padding:8px 0}
details.qb summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline}
details.qb summary::-webkit-details-marker{display:none}
details.qb .qm{flex:none;color:var(--ink2);font-variant-numeric:tabular-nums}
details.qb[open] summary{font-weight:700}
details.qb > div{padding:8px 0 4px}
@media (max-width:760px){
  body{display:block}
  #side{width:auto;height:auto;position:static;padding:14px 18px 8px;display:block}
  #side .brand{margin-bottom:8px}#side .brand img{width:30px}#side .term{margin-bottom:6px}
  #side .list{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #side .list::-webkit-scrollbar{display:none}
  #side a{border:0;padding:6px 0;flex:none}
  #side .foot{display:none}
  #side .weeks,#side .chev,#side .chev-sp{display:none}
  #side .crow{border:0;flex:none}
  .irow{flex-direction:column;gap:0}
  .irow .im{margin-left:0}
  details.qb summary{flex-direction:column;gap:0}
  .irow .ik{white-space:normal}
  .pager button{max-width:100%}
  #app{padding:20px 18px 100px;overflow-x:hidden}
  .flow{flex-direction:column}
  .flow .ar{width:auto;height:28px}
  .flow .ar svg{transform:rotate(90deg)}
  .flow .rel{padding:4px 0;justify-content:center}
  .tl .row{grid-template-columns:52px 1fr;gap:8px}

  .dgm th,.dgm td{padding:8px 6px;overflow-wrap:anywhere}
}
</style>
</head>

<script>
const DATA = [{"id": "w7-01", "course": "ehs544", "week": "7w", "topic": "Meaningful involvement (EPA)", "importance": 3, "why": "시험 2 범위 · 모든 회차의 기준", "type": "mc", "q": "Under EPA's definition of environmental justice, which of the following is one of the conditions of \"meaningful involvement\"?", "options": ["The public's contribution can influence the regulatory agency's decision.", "The agency announces its decision first and then explains it to the public.", "The community must first prove that it has been harmed before it may take part.", "Industry and community members receive the same number of speaking slots."], "answer": 0, "explain": "공중의 기여가 기관의 결정에 영향을 미칠 수 있어야 실질적 참여가 성립한다. 결정을 먼저 발표하고 방어하는 방식(announce and defend)은 연방 지침이 벗어나려 한 기존 방식이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-02", "course": "ehs544", "week": "7w", "topic": "Listening session vs. engagement", "importance": 3, "why": "교수 강조 · 조별 과제 연결", "type": "mc", "q": "A state agency holds a two-hour listening session on a proposed landfill expansion. Residents speak and staff take notes, but the agency gives no written response and takes no follow-up step. Which assessment matches the class discussion?", "options": ["It is meaningful engagement, because residents were able to speak at a public meeting.", "It is not meaningful engagement, because there was no agency response, follow-up, or accountability.", "It is meaningful engagement, because any public meeting satisfies Executive Order 12898.", "It is not meaningful engagement, because listening sessions are banned under 40 CFR Part 25."], "answer": 1, "explain": "청취 회의에서 의견을 듣기만 하고 응답과 후속 조치가 없으면 실질적 참여에 해당하지 않는다. 발언 기회가 있어도 결정에 영향을 미치지 못하면 참여로 인정되지 않는다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 1절 가항"}, {"id": "w7-03", "course": "ehs544", "week": "7w", "topic": "Public relations vs. participation", "importance": 3, "why": "EPA 정의 슬라이드의 핵심 구별", "type": "tf", "q": "Under EPA's framework, public relations (public information) and public participation are the same activity, because both mean giving information to the public.", "options": ["True", "False"], "answer": 1, "explain": "홍보는 공중에게 알리는 일이고 참여는 공중의 의견을 받아 결정에 반영하는 일이므로 두 개념은 같지 않다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 다항ㆍ라항"}, {"id": "w7-04", "course": "ehs544", "week": "7w", "topic": "Legal force of EPA's EJ definition", "importance": 2, "why": "교수가 법적 지위를 짚음", "type": "mc", "q": "EPA's definition of environmental justice appears only on its website and has never been put in a rule or guidance. What follows from this?", "options": ["It is binding on all federal agencies as a regulation.", "It is binding only on states that run authorized permit programs.", "It has no binding authority.", "It became binding when Executive Order 12898 was signed."], "answer": 2, "explain": "EPA의 정의는 웹사이트에만 게시되어 법적 구속력이 없다. 행정명령이 환경정의를 요구한다는 사실과 정의 문구에 효력이 있다는 판단은 별개이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-05", "course": "ehs544", "week": "7w", "topic": "EO 14096 vs. EPA definition", "importance": 3, "why": "행정명령 흐름의 출발점", "type": "mc", "q": "Compared with EPA's definition of environmental justice, what does Executive Order 14096 add?", "options": ["English proficiency as a newly protected category beside race, color, and income", "Tribal affiliation and disability, plus protection from climate risks and cumulative impacts", "Only a change in wording from \"fair\" to \"equal\" treatment, with no new groups named", "The removal of the meaningful participation element, keeping only fair treatment"], "answer": 1, "explain": "행정명령 14096호는 부족 소속, 장애, 기후 위험, 누적 영향을 정의에 추가하였다. 영어 능력은 추가된 보호 대상에 포함되지 않는다.", "concept": "c_eo", "source": "113_7w_meaningful-community-engagement, 2절 나항"}, {"id": "w7-08", "course": "ehs544", "week": "7w", "topic": "Part 25/124 are binding", "importance": 3, "why": "Grab and Go 표지 항목", "type": "tf", "q": "The statement of basis and the response to comments required in permit proceedings under 40 CFR Parts 25 and 124 are binding regulatory requirements, even if agencies may often ignore them now.", "options": ["True", "False"], "answer": 0, "explain": "Part 25와 124의 요건은 기관이 지키지 않는 일이 많아도 법적 구속력이 있는 규제 요건이다. 지침이나 권고와 구별되는 점이다.", "concept": "c_part", "source": "113_7w_meaningful-community-engagement, 2절 라항"}, {"id": "w7-09", "course": "ehs544", "week": "7w", "topic": "CERCLA liability and community engagement", "importance": 3, "why": "교수가 상생이라고 설명", "type": "mc", "q": "Why did the class describe community engagement at Superfund sites as a win-win even under the current administration?", "options": ["Executive Order 14096 still requires agencies to run engagement at every Superfund site", "CERCLA's strict, joint and several liability gives responsible private parties a reason to cooperate", "NEJAC's guidance is legally binding on the parties responsible for each contaminated site", "Congress created a mandatory community engagement office for each Superfund site"], "answer": 1, "explain": "CERCLA의 엄격책임과 연대책임은 오염을 일으킨 민간 책임자가 정화에 협력할 이유가 된다. 행정명령 14096호는 2025년에 철회되어 근거로 삼을 수 없다.", "concept": "c_cercla", "source": "113_7w_meaningful-community-engagement, 4절 다항"}, {"id": "w8-01", "course": "ehs544", "week": "8w", "topic": "Executive order trajectory", "importance": 3, "why": "슬라이드 p.4 핵심 도표", "type": "mc", "q": "Which statement correctly describes the federal executive actions on disproportionate impact?", "options": ["EO 14096 (2023) revoked EO 12898 (1994), and EO 14148 later reinstated it.", "EO 12898 (1994) came first; EO 14096 (2023) followed; in 2025 EO 14148 rescinded 14096 and EO 14173 rescinded 12898.", "EO 12898 (1994) came first; in 2025 EO 14173 rescinded 14096 and EO 14148 rescinded 12898.", "EO 14096 (2023) came first and EO 12898 (1994) followed as an amendment."], "answer": 1, "explain": "순서는 1994년 12898호, 2023년 14096호이며, 2025년에 14148호가 14096호를, 14173호가 12898호를 철회하였다. 두 철회 명령의 대상을 서로 바꾸면 오답이 된다.", "concept": "c_eo", "source": "114_8w_engagement-and-evidence-based-decision-making, 2절 가항"}, {"id": "w8-02", "course": "ehs544", "week": "8w", "topic": "Hidden but not Gone", "importance": 3, "why": "8회차 제목 슬라이드 개념", "type": "tf", "q": "When Executive Orders 12898 and 14096 were revoked, the disproportionate impact factors lost their value as evidence for decision-making.", "options": ["True", "False"], "answer": 1, "explain": "행정명령이 철회되어도 불균형 영향 요인은 의사결정의 증거로 계속 활용할 수 있다. 숨겨졌으나 사라지지 않았다는 것이 이 슬라이드의 요지이다.", "concept": "c_hbg", "source": "114_8w, 도입부 및 2절 다항"}, {"id": "w8-03", "course": "ehs544", "week": "8w", "topic": "Cross-cutting factor", "importance": 3, "why": "슬라이드 p.7 표시 항목", "type": "mc", "q": "Which factor on the \"Hidden but not Gone\" slide acts across all six disproportionate impact factors?", "options": ["Cumulative impacts", "Physical infrastructure", "Psycho-social stressors", "Unique exposure pathways"], "answer": 2, "explain": "심리사회적 스트레스 요인은 여섯 요인 모두에 작용한다. 나머지 셋은 여섯 요인에 속하는 개별 항목이다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-04", "course": "ehs544", "week": "8w", "topic": "Six disproportionate impact factors", "importance": 3, "why": "6요인 목록은 출제 1순위", "type": "mc", "q": "Which of the following is NOT one of the six disproportionate impact factors on the class 8 slide?", "options": ["Proximity and exposure", "Susceptible populations", "Participating in decision making", "Municipal property tax base"], "answer": 3, "explain": "여섯 요인은 근접성과 노출, 누적 영향, 물리적 기반시설, 취약 인구, 고유한 노출 경로, 의사결정 참여이다. 지방세 기반은 이 목록에 없다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-05", "course": "ehs544", "week": "8w", "topic": "EPA 2021 social vulnerability report", "importance": 3, "why": "조별 과제의 옥외 노동자 근거", "type": "mc", "q": "In EPA's 2021 report on climate change and social vulnerability, at 2°C of global warming, Hispanic and Latino individuals are 43% more likely to live in areas where which impact is projected to be greatest?", "options": ["Loss of labor hours in weather-exposed work", "New childhood asthma diagnoses", "Deaths from extreme temperature", "Property damage from inland flooding"], "answer": 0, "explain": "보고서에 따르면 히스패닉과 라틴계는 2°C 상승 시 노동시간이 가장 크게 줄어드는 지역에 거주할 가능성이 43% 더 높다. 천식과 극한 기온 사망 수치는 다른 영향 항목에서 나온다.", "concept": "c_epa21", "source": "114_8w, 2절 라항"}, {"id": "w8-06", "course": "ehs544", "week": "8w", "topic": "Lived experience as evidence", "importance": 3, "why": "8회차 p.10-11 원칙", "type": "mc", "q": "Which statement best matches how class 8 treats lived experience expertise and Indigenous knowledge?", "options": ["They are used only when no scientific data exist.", "They are replaced by screening tool scores once a tool is available.", "They count only if a recognized institution has documented them.", "They are forms of expertise that count as evidence alongside academic knowledge."], "answer": 3, "explain": "생활경험과 원주민 지식은 학문적 지식과 함께 의사결정의 근거가 된다. 선별 도구 점수는 이를 대체하지 못한다.", "concept": "c_lived", "source": "114_8w, 2절 마항ㆍ바항"}, {"id": "w8-07", "course": "ehs544", "week": "8w", "topic": "40 CFR Part 25 vs. Part 124", "importance": 3, "why": "슬라이드에 Grab and Go 표지", "type": "mc", "q": "Which statement correctly describes the relationship between 40 CFR Part 25 and Part 124?", "options": ["Part 25 sets EPA's permit decision procedures; Part 124 sets the general framework for public participation.", "Part 25 applies only to the Clean Air Act; Part 124 applies only to the Clean Water Act.", "Part 25 is the framework for why and how the public participates; Part 124 governs EPA's individual permit decisions.", "Part 25 governs state agencies only; Part 124 governs EPA staff only."], "answer": 2, "explain": "Part 25는 공중이 왜 어떻게 참여하는지에 관한 기본 체계이고, Part 124는 EPA의 개별 허가 결정 절차이다. 두 부의 역할을 반대로 서술한 설명은 오답이다.", "concept": "c_part", "source": "114_8w, 3절 라항ㆍ마항"}, {"id": "w8-08", "course": "ehs544", "week": "8w", "topic": "Responsiveness Summary (§25.8)", "importance": 3, "why": "청취 회의와 참여를 가르는 장치", "type": "mc", "q": "Under 40 CFR § 25.8, what must a Responsiveness Summary include?", "options": ["A count of the comments received, with the names and affiliations of every commenter", "A certification by the agency that every comment was read and considered in good faith", "The agency's final cost-benefit analysis comparing the proposed action with all alternatives", "The activities held, the significant public comments, and the agency's specific responses or reasons for rejection"], "answer": 3, "explain": "응답 요약서는 수행한 활동, 중요한 의견, 의견에 대한 기관의 구체적 응답이나 거부 이유를 기재한다. 의견 수나 참석자 명단만으로는 기관의 응답으로 인정되지 않는다.", "concept": "c_part", "source": "114_8w, 3절 라항 (5)"}, {"id": "w8-09", "course": "ehs544", "week": "8w", "topic": "Petition for review (Part 124)", "importance": 3, "why": "지역사회가 쓰는 실제 수단", "type": "mc", "q": "Under 40 CFR Part 124, who may file a petition for review of a final RCRA, UIC, NPDES, or PSD permit decision?", "options": ["Any resident of the state, whether or not they took part earlier", "Only the permit applicant", "Anyone who read the statement of basis", "A person who filed comments on the draft permit or took part in the public hearing"], "answer": 3, "explain": "허가 초안에 의견을 제출하였거나 공청회에 참여한 사람이 심사 청구를 할 수 있다. 의견 기간에 쟁점을 모두 제출하지 않으면 나중에 다투기 어렵다.", "concept": "c_part", "source": "114_8w, 3절 마항 (2)"}, {"id": "w8-11", "course": "ehs544", "week": "8w", "topic": "First state to define EJ communities", "importance": 3, "why": "8회차 중심 사례", "type": "mc", "q": "According to the class 8 discussion, Connecticut was the first state to do what?", "options": ["Adopt an environmental equity policy", "Ban new permits in environmental justice communities", "Define environmental justice communities in a statute", "Create a state environmental protection agency"], "answer": 2, "explain": "코네티컷은 환경정의 지역사회를 법률로 정의한 첫 번째 주이다. 1993년의 환경 형평 정책은 법률이 아니므로 첫 입법으로 볼 수 없다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)ㆍ(4)"}, {"id": "w8-12", "course": "ehs544", "week": "8w", "topic": "Public Act 20-6 notice rules", "importance": 3, "why": "교수가 요건을 구체적으로 설명", "type": "mc", "q": "Which requirement applies to a permit applicant under Connecticut's Public Act 20-6 (effective November 1, 2020)?", "options": ["Hold the public meeting in the state capital within 30 days of filing the application", "Obtain the municipality's written consent to the application before it is filed with the state", "Give notice in English and in any language used by 15% or more of residents within a half mile", "Publish a single notice in the legal-notice section of a newspaper with local circulation"], "answer": 2, "explain": "공고 대상 언어는 영어와 반경 0.5마일 안 주민의 15% 이상이 사용하는 언어이다. 법정 공고란에 한 번 게재하는 방식은 하트포드에서 주민이 공고를 놓친 원인이었다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-13", "course": "ehs544", "week": "8w", "topic": "Law vs. real protection", "importance": 3, "why": "교수가 반복해 짚은 사례", "type": "mc", "q": "A New Haven tank terminal signed a community benefit agreement worth $49,000 that allowed its VOC emissions to triple. What did the class use this case to show?", "options": ["Community benefit agreements are prohibited under Connecticut law.", "Benefit amounts are set by statute and cannot be negotiated.", "The state screening tool underestimates pollution burdens.", "Having a law does not by itself guarantee meaningful protection."], "answer": 3, "explain": "법의 요건을 지킨 협약도 배출 증가를 허용하였다. 법이 있어도 실질적 보호가 보장되지 않는다는 사례이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-14", "course": "ehs544", "week": "8w", "topic": "Title VI leverage in Hartford", "importance": 3, "why": "Pestana 발표의 핵심 수단", "type": "mc", "q": "According to Edith Pestana, why did the federal civil rights (Title VI) investigation in Hartford change the state agency's behavior?", "options": ["A state court issued an injunction closing the landfill.", "EPA completed a new rulemaking on landfill odors.", "The city council voted to withdraw the permit.", "An agency found to discriminate could lose federal funding."], "answer": 3, "explain": "주 기관에 압력이 된 것은 차별한 기관이 연방 자금을 잃을 수 있다는 점이다. 법원 명령이나 시의회의 철회는 이 사례의 설명에 해당하지 않는다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)"}, {"id": "w8-15", "course": "ehs544", "week": "8w", "topic": "CT EJ screening tool", "importance": 2, "why": "근거 방법의 한계", "type": "mc", "q": "What does Connecticut's environmental justice screening tool do?", "options": ["It models each resident's actual exposure dose and personal health risk.", "It automatically approves or denies permit applications based on the score.", "It ranks census tracts by indicator on a 1-to-10 scale, without modeling actual exposure.", "It publishes the names and addresses of residents who live near facilities."], "answer": 2, "explain": "선별 도구는 구역별 지표를 1에서 10으로 순위화할 뿐 실제 노출량을 모형화하지 않는다. 허가 승인의 결정 주체는 기관이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (5)"}, {"id": "w9-01", "course": "ehs544", "week": "9w", "topic": "Reversing the brownfield model", "importance": 3, "why": "9회차 통합 사례의 핵심 주장", "type": "mc", "q": "According to Suzi Ruhl, how does Mount Growmore reverse the traditional brownfield model?", "options": ["EPA designs the project first and then asks the community to approve it.", "A private developer proposes the plan and the city grants the permits.", "Government resources and authority are applied to the community's own vision.", "The state legislature decides the reuse and funds it through a bond."], "answer": 2, "explain": "전통 모델은 지역사회가 외부의 설계에 참여하는 구조이다. Mount Growmore는 정부의 자원과 권한을 지역사회의 비전에 적용한다.", "concept": "c_flip", "source": "115_9w_mount-growmore-and-resilience, 7절"}, {"id": "w9-02", "course": "ehs544", "week": "9w", "topic": "Two framings of TBLJ", "importance": 3, "why": "법 문언과 Elevate 설명의 구별", "type": "mc", "q": "In the Connecticut special act, Triple Bottom Line Justice (TBLJ) is defined as the integration of which three elements?", "options": ["Health justice, environmental justice, and economic justice", "Evidence-based practice, rule of law, and meaningful community engagement", "Assessment, vision, and recommendations", "Law, science, and finance"], "answer": 1, "explain": "특별법은 TBLJ를 근거 기반 실천, 법치, 지역사회 참여의 통합으로 정의한다. 건강, 환경, 경제 정의는 Elevate가 설명한 목표이다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 1절 가항; 115_9w, 3절 가항"}, {"id": "w9-03", "course": "ehs544", "week": "9w", "topic": "B2H core method", "importance": 3, "why": "9회차 방법론 · 특별법 정의", "type": "mc", "q": "What are the two core elements of the Brownfields to Healthfields (B2H) method described in the class 9 podcast?", "options": ["A community-led diagnosis of what is wrong and the community's vision of a healthy community", "An EPA risk ranking of the site and a cost-benefit analysis of reuse options", "A liability allocation among polluters and a numeric cleanup standard", "A state grant application and a signed agreement with a developer"], "answer": 0, "explain": "B2H는 지역사회가 주도하는 진단과 건강한 지역사회에 대한 비전으로 구성된다. EPA 위험 순위와 같은 외부 기준에서 출발하지 않는다.", "concept": "c_flip", "source": "115_9w, 3절 다항; 104_2w, 1절 나항"}, {"id": "w9-04", "course": "ehs544", "week": "9w", "topic": "CJET", "importance": 3, "why": "출연자가 새 비법으로 강조", "type": "mc", "q": "What is the main function of Civic Justice Engagement Teaching (CJET)?", "options": ["It gives residents grants that allow them to buy contaminated land from private owners.", "It produces a cumulative screening score for each census tract and posts it online.", "It gives burdened communities a rule-of-law framework to use the laws and resources meant for them.", "It is a court-approved settlement process that runs between polluters and residents."], "answer": 2, "explain": "CJET는 부담이 큰 지역사회가 자신을 위한 법과 자원을 활용하도록 법치의 체계를 교육한다. 점수 산출이나 토지 구입 지원 기능은 없다.", "concept": "c_flip", "source": "115_9w, 3절 라항"}, {"id": "w9-05", "course": "ehs544", "week": "9w", "topic": "Breaking Bread", "importance": 2, "why": "협력 설계에 참고", "type": "mc", "q": "What is the purpose of the \"Breaking Bread\" process used by Elevate and the East End NRZ?", "options": ["A one-time public hearing required by 40 CFR Part 25 before any permit is issued", "A mediation procedure for disputes that begins after a lawsuit has been filed in court", "An annual awards event that recognizes community leaders and their long-term partners", "A weekly check-in among residents, governments, business, funders and academics to keep momentum"], "answer": 3, "explain": "Breaking Bread는 여러 부문이 매주 확인 회의를 열어 추진력을 유지하는 대화 과정이다. 법이 요구하는 공청회와 다르다.", "concept": "c_flip", "source": "115_9w, 3절 마항"}, {"id": "w9-08", "course": "ehs544", "week": "9w", "topic": "Role of local government", "importance": 3, "why": "토론 질문 3", "type": "mc", "q": "How did Bill Coleman describe the City of Bridgeport's role in Mount Growmore?", "options": ["To lead the vision for the campus and choose its main uses", "To hold title to the land and design the buildings on it", "To give technical support and resources while the community sets the agenda", "To regulate EPA's cleanup schedule and review its site reports"], "answer": 2, "explain": "시는 기술적 지원과 자원을 제공하고 의제는 지역사회가 정하였다. 비전을 주도하는 일은 시의 역할이 아니었다.", "concept": "c_roles", "source": "115_9w, 5절 가항"}, {"id": "w9-09", "course": "ehs544", "week": "9w", "topic": "Start of the public response", "importance": 3, "why": "토론 질문 3의 결정 지점", "type": "mc", "q": "Which action marked the start of the formal public response at the Mount Trashmore site?", "options": ["EPA completed a full site assessment, including a review of hydrology.", "Congress amended RCRA to cover construction debris sites such as this one.", "The city and state acquired the site from the private owners responsible for the contamination.", "The legislature passed the TBLJ special act and funded a demonstration program."], "answer": 2, "explain": "시와 주가 오염을 일으킨 민간 소유자에게서 부지를 취득한 것이 공식 대응의 출발이다. 특별법은 훨씬 뒤인 2026년에 제정되었다.", "concept": "c_roles", "source": "115_9w, 1절 나항; 4절 라항"}, {"id": "w9-10", "course": "ehs544", "week": "9w", "topic": "EPA Region 1 contributions", "importance": 3, "why": "토론 질문 1과 3", "type": "mc", "q": "Which action by EPA Region 1 most directly built community capacity at Mount Growmore?", "options": ["Writing plain-language summaries and cheat sheets together with the NRZ", "Designing and constructing the campus buildings on the site", "Lobbying the state legislature for the TBLJ bill", "Taking over the operation of the East End market"], "answer": 0, "explain": "EPA는 NRZ와 함께 쉬운 말의 자료와 요약표를 작성하여 지역사회의 역량을 높였다. 건물 건설과 시장 운영은 EPA의 업무가 아니다.", "concept": "c_roles", "source": "115_9w, 4절 라항"}, {"id": "w9-11", "course": "ehs544", "week": "9w", "topic": "Noise example (lived experience)", "importance": 3, "why": "생활경험 원칙의 사례", "type": "mc", "q": "At an NRZ meeting, outsiders assumed \"noise pollution\" meant interstate highway traffic, but residents meant gunshots. What did Suzi Ruhl draw from this?", "options": ["Community concerns should be translated into the experts' definitions before they are recorded.", "Noise should be excluded from environmental analysis.", "Trust and respect come from responding to the community's own definition of its concerns, with learning running both ways.", "Traffic noise data are more reliable than residents' reports."], "answer": 2, "explain": "지역사회가 스스로 정의한 문제에 대응해야 신뢰를 얻고 양방향으로 학습할 수 있다. 전문가의 분석 체계에 맞추어 먼저 번역하는 방식은 이와 반대이다.", "concept": "c_lived", "source": "115_9w, 8절 나항"}, {"id": "w9-12", "course": "ehs544", "week": "9w", "topic": "Campus status", "importance": 2, "why": "과제에서 틀리기 쉬운 사실", "type": "tf", "q": "As of the class 9 podcast, the Mount Growmore hydroponic center and wellness center have been built and are operating.", "options": ["True", "False"], "answer": 1, "explain": "정화는 완료되었으나 수경 재배 센터와 웰니스 센터는 아직 건립되지 않았다. 사례를 인용할 때 완료된 사실과 계획 단계를 구별하여야 한다.", "concept": "c_roles", "source": "115_9w, 6절ㆍ7절"}, {"id": "c-01", "course": "ehs544", "week": "6w", "topic": "CERCLA identification", "importance": 2, "why": "중간시험 복습 문항", "type": "mc", "q": "A review item describes an abandoned hazardous waste site with no responsible owner, where arrangers and transporters of hazardous substances and current and former facility owners can be held liable for cleanup costs. Which law does it describe?", "options": ["Resource Conservation and Recovery Act (RCRA)", "Toxic Substances Control Act (TSCA)", "Emergency Planning and Community Right-to-Know Act (EPCRA)", "CERCLA (Superfund)"], "answer": 3, "explain": "통제되지 않은 폐기 부지의 정화 책임은 CERCLA가 규정한다. RCRA는 현재 진행 중인 폐기물 관리를 규율한다.", "concept": "c_cercla", "source": "112_6w_midterm-review, 2절 나항"}, {"id": "c-02", "course": "ehs544", "week": "6w", "topic": "Part 124 permit coverage", "importance": 2, "why": "6회차 허가와 8회차 참여를 연결", "type": "mc", "q": "Part 124 sets decision-making procedures for which of the following sets of EPA permits?", "options": ["RCRA, UIC, PSD, and NPDES permits", "NEPA categorical exclusion determinations only", "FOIA responses and Privacy Act notices", "Title VI complaint determinations"], "answer": 0, "explain": "Part 124는 RCRA, UIC, PSD, NPDES 허가의 결정 절차를 규정한다. 나머지 선택지는 허가에 해당하지 않는다.", "concept": "c_part", "source": "114_8w, 3절 마항; 112_6w, 3절"}, {"id": "c-03", "course": "ehs544", "week": "2w", "topic": "Final special act duties", "importance": 3, "why": "원안과 최종 법의 차이", "type": "mc", "q": "What does the final Special Act No. 26-13 (from HB 5241) require?", "options": ["A TBLJ demonstration program in every city with over 148,000 residents by January 1, 2027", "The Commissioner of Public Health convenes a working group on a B2H-related TBLJ program and reports by July 1, 2027", "A 20% ICD-10 Z code usage rate in insurance claims by 2030, with annual progress reports", "An annual cost-benefit audit of every brownfield grant the state has awarded"], "answer": 1, "explain": "최종 특별법은 공중보건국장이 소집하는 작업반과 2027년 7월 1일까지 제출할 보고서만 규정한다. 시범 사업과 Z 코드 20% 사용 목표는 원안에만 있었다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 2절 가항ㆍ나항"}, {"id": "w9b-01", "course": "ehs544", "week": "9w", "topic": "Arc of injustice", "importance": 3, "why": "9회차 수업", "type": "mc", "q": "In the class 9 'arc of injustice', which denial comes first, so that the later denials depend on it?", "options": ["Denial of accountability", "Denial of pollution", "Denial of disproportionate burden", "Denial of responsive wellness care"], "answer": 1, "explain": "6단계는 오염의 부정에서 시작한다. 오염이 부정되면 노출, 영향, 불균형 부담, 책임, 돌봄도 차례로 인정되지 않는다.", "concept": "c_knot", "source": "116_9w_leveraging-climate-change-policy-methods, 1절 나항"}, {"id": "w9b-02", "course": "ehs544", "week": "9w", "topic": "Untying the knot", "importance": 3, "why": "9회차 수업", "type": "mc", "q": "Why does the class 9 lecture split decision data into hazard, exposure trajectory and health impact?", "options": ["To show that one facility causes most local pollution", "To replace community data with agency monitoring data", "To untangle the knot that lets responsible parties avoid accountability", "To rank health impacts by their treatment cost"], "answer": 2, "explain": "자료와 의사결정의 문제가 한데 얽히면 책임을 회피할 기회가 발생한다. 세 단계로 나누면 단계마다 책임을 물을 수 있다.", "concept": "c_knot", "source": "116_9w, 1절 라항"}, {"id": "w9b-03", "course": "ehs544", "week": "9w", "topic": "Pathway and route", "importance": 2, "why": "9회차 슬라이드 6", "type": "mc", "q": "Which pair correctly matches the two parts of the exposure trajectory on slide 6?", "options": ["Pathway: air, land, water; route: inhalation, ingestion, dermal", "Pathway: physical, mental; route: stationary, mobile, ambient", "Pathway: inhalation, ingestion, dermal; route: air, land, water", "Pathway: stationary, ambient; route: physical, mental"], "answer": 0, "explain": "매체 경로(pathway)는 대기, 토지, 물이고 체내 유입 경로(route)는 흡입, 섭취, 피부이다. 신체적ㆍ정신적 영향은 건강 영향의 구분이다.", "concept": "c_knot", "source": "116_9w, 1절 라항"}, {"id": "w9b-04", "course": "ehs544", "week": "9w", "topic": "Myths against pollution reduction", "importance": 2, "why": "9회차 슬라이드 5", "type": "mc", "q": "A facility argues that its emissions are only a small share of total pollution, so it bears no responsibility. In class 9, this is an example of:", "options": ["A guardrail consideration for data", "A myth used against pollution reduction", "A Healthy People 2030 objective", "A BRFSS state-added question"], "answer": 1, "explain": "슬라이드 5가 든 오염 저감 반대 신화 5개 가운데 하나이다. 오염원이 많다는 사실도 책임 회피의 근거로 사용된다.", "concept": "c_knot", "source": "116_9w, 1절 다항"}, {"id": "w9b-05", "course": "ehs544", "week": "9w", "topic": "Healthy People without the word climate", "importance": 3, "why": "9회차 수업", "type": "mc", "q": "Why does class 9 call Healthy People 2030 a policy method that still works under the current administration?", "options": ["It names climate change as a national priority area", "It is enforced through EPA permits", "It includes climate-related metrics such as air quality and heat-related illness", "It was replaced in 2025 by a new CDC climate module"], "answer": 2, "explain": "Healthy People 2030은 기후변화라는 표현 없이 기후 관련 지표를 포함하고 있다. 따라서 기후라는 표현을 사용하지 않고도 기후 정책을 추진할 수 있다.", "concept": "c_hp2030", "source": "116_9w, 3절 바항"}, {"id": "w9b-06", "course": "ehs544", "week": "9w", "topic": "Healthy People initiative", "importance": 2, "why": "9회차 슬라이드 12~13", "type": "mc", "q": "Which statement about the Healthy People initiative is correct?", "options": ["HHS has issued it every ten years since 1980, and 2030 is the fifth iteration", "EPA has issued it every five years since 1990, and 2030 is the third iteration", "CDC issues it each year, with a new set of goals for every state", "Congress enacts it every ten years as binding federal standards"], "answer": 0, "explain": "보건복지부(HHS)가 1980년부터 10년마다 발표하며 Healthy People 2030은 다섯째 판이다.", "concept": "c_hp2030", "source": "116_9w, 3절 가항ㆍ나항"}, {"id": "w9b-07", "course": "ehs544", "week": "9w", "topic": "Time to act now", "importance": 3, "why": "9회차 수업", "type": "mc", "q": "Why does the lecture call 2026 a critical opportunity for Healthy People?", "options": ["Healthy People 2030 data collection ends in 2026", "Development of Healthy People 2040 begins in 2026, so broader views of health must join now", "States must adopt their own Healthy People plans by 2026", "The 10 Essential Public Health Services expire in 2026"], "answer": 1, "explain": "2040 목표 개발이 2026년에 시작된다. 일부 이해관계자만 참여하면 2040 목표가 건강을 좁게 보는 관점을 반영하게 된다.", "concept": "c_hp2030", "source": "116_9w, 3절 사항"}, {"id": "w9b-08", "course": "ehs544", "week": "9w", "topic": "Essential services and TBLJ", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "In class 9, the 10 Essential Public Health Services are matched to TBLJ. Which service corresponds to the rule of law?", "options": ["Assess and monitor population health", "Utilize legal and regulatory actions", "Strengthen, support, and mobilize communities and partnerships", "Build a diverse and skilled workforce"], "answer": 1, "explain": "정책ㆍ계획ㆍ법률의 수립과 법적ㆍ규제적 조치의 활용은 법치에 대응한다. 지역사회와 파트너십의 강화는 실질적 참여에, 평가 기능은 근거 기반 의사결정에 대응한다.", "concept": "c_hp2030", "source": "116_9w, 2절 다항"}, {"id": "w9b-09", "course": "ehs544", "week": "9w", "topic": "Opening in BRFSS", "importance": 3, "why": "9회차 수업", "type": "mc", "q": "Which part of the BRFSS questionnaire gives outside organizations the clearest opening to add climate questions?", "options": ["The fixed core", "The rotating core", "State-added questions", "The demographic section"], "answer": 2, "explain": "주 추가 문항은 외부 기관이 제안하고 옹호할 수 있으며 인지 검사를 거친다. 고정 핵심과 순환 핵심은 모든 주가 공통으로 사용한다.", "concept": "c_brfss", "source": "116_9w, 4절 나항"}, {"id": "w9b-10", "course": "ehs544", "week": "9w", "topic": "Kansas environmental questions", "importance": 2, "why": "9회차 슬라이드 24~25", "type": "mc", "q": "What did Kansas add to its BRFSS starting in 2005?", "options": ["A climate change module required by CDC", "Six environmental questions on outdoor air quality, health and outdoor activity", "A vision module for adults aged 50 and older", "Questions on data centers and electricity use"], "answer": 1, "explain": "캔자스주는 2005년부터 환경 요인 문항 6개를 추가하였다. 시각 모듈은 2005년 5개 주가 사용한 선택 모듈의 사례이다.", "concept": "c_brfss", "source": "116_9w, 4절 다항ㆍ라항"}, {"id": "w9b-11", "course": "ehs544", "week": "9w", "topic": "Climate gap in BRFSS", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "According to class 9, what is true of climate questions in BRFSS?", "options": ["Every state has used a climate module since 2022", "Climate questions were removed from the fixed core in 2025", "Only federal agencies may propose climate questions", "CDC's 2025 module list has no climate module, and the gap predates the current administration"], "answer": 3, "explain": "2025년 BRFSS 모듈 분류에는 기후변화 모듈이 없고, 이 공백은 현 행정부 이전부터 있었다. 따라서 정치적 억압만으로 설명할 수 없다.", "concept": "c_brfss", "source": "116_9w, 4절 마항"}, {"id": "w9b-12", "course": "ehs544", "week": "9w", "topic": "HPSA in NEPA mitigation", "importance": 3, "why": "9회차 수업 사례", "type": "mc", "q": "How was HPSA data used in the Keystone Pipeline NEPA review described in class 9?", "options": ["To rank the pipeline route by lifetime cancer risk", "To have the operator check shortage status and, if short, use federal health center programs", "To replace the environmental impact statement with a health impact assessment", "To designate the affected counties as medically underserved areas"], "answer": 1, "explain": "완화 계획이 100마일 떨어진 병원을 대응 시설로 지정하자, HPSA 확인과 연방 보건센터 제도 접근이 EIS 수정 사항으로 채택되었다.", "concept": "c_hrsa", "source": "116_9w, 5절 다항"}, {"id": "w9b-13", "course": "ehs544", "week": "9w", "topic": "Designations as signals", "importance": 2, "why": "9회차 수업", "type": "mc", "q": "Bridgeport's East End was designated an HPSA but not an MUA. What lesson does class 9 draw from this?", "options": ["MUA status always overrides HPSA status", "The community should stop using HRSA data", "Such designations are directional signals that call for further review", "HPSA scores measure exposure to air toxics"], "answer": 2, "explain": "주가 지정을 판단할 때 추가 지표를 적용하므로 지정만으로 결론을 내리기 어렵다. 지정은 올바른 질문으로 이끄는 방향 신호이다.", "concept": "c_hrsa", "source": "116_9w, 5절 라항"}, {"id": "w9b-14", "course": "ehs544", "week": "9w", "topic": "Legal basis for health centers", "importance": 2, "why": "9회차 슬라이드 33", "type": "mc", "q": "What gives health centers legal authority to address air and water quality issues affecting their patients?", "options": ["Section 330 of the Public Health Service Act", "The Safe Drinking Water Act", "40 CFR Part 25", "The CMS Framework for Healthy Communities"], "answer": 0, "explain": "공중보건서비스법 제330조가 보건센터의 기후 대응에 관한 법치의 근거이다. 같은 조항은 UDS의 법적 근거이기도 하다.", "concept": "c_hrsa", "source": "116_9w, 5절 가항ㆍ마항"}, {"id": "w9b-15", "course": "ehs544", "week": "9w", "topic": "Guardrail considerations", "importance": 3, "why": "9회차 슬라이드 39", "type": "mc", "q": "Which list matches the five guardrail considerations for data on slide 39?", "options": ["Hazard, pathway, route, impact, and mitigation", "Sources, gaps, sources of bias, uses, and policy implications", "Assessment, policy development, assurance, equity, and workforce", "Cost, effect, ratio, budget, and threshold"], "answer": 1, "explain": "슬라이드 39는 출처, 공백, 편향의 원천, 용도, 정책적 함의를 든다. 코끼리 그림은 한 부분만 보면 전체를 잘못 판단한다는 비유이다.", "concept": "c_guard", "source": "116_9w, 7절 나항"}, {"id": "w9b-16", "course": "ehs544", "week": "9w", "topic": "Preserving public data", "importance": 2, "why": "9회차 수업 질의", "type": "mc", "q": "Which response to lost access to published federal data was called a good policy recommendation in class 9?", "options": ["Asking agencies to stop publishing data online", "Replacing federal surveys with private polling", "Moving all data to state health departments", "Submitting public data each year to the Library of Congress"], "answer": 3, "explain": "자료가 있어도 접근할 수 없으면 없는 것과 같다. 해마다 공개 자료를 의회도서관에 제출하여 기록으로 보존하자는 제안이 나왔다.", "concept": "c_guard", "source": "116_9w, 7절 가항"}, {"id": "w10b-01", "course": "ehs544", "week": "10w", "topic": "Fee for service", "importance": 2, "why": "10회차 슬라이드 8", "type": "mc", "q": "Which payment model pays only for the quantity and type of services provided, by complexity?", "options": ["Value-based care", "Fee for service", "Population-based global budget", "Shared savings"], "answer": 1, "explain": "행위별 수가제(FFS)는 복잡도에 따라 제공된 서비스의 양과 종류에만 지급한다. 가치기반 의료는 진료의 질, 제공자의 성과, 환자 경험에 중점을 둔다.", "concept": "c_vbc", "source": "117_10w, 2절 가항 (1)"}, {"id": "w10b-02", "course": "ehs544", "week": "10w", "topic": "Legal basis of VBC", "importance": 3, "why": "10회차 슬라이드 10", "type": "mc", "q": "Why does class 10 treat value-based care as a route that lasts across administrations?", "options": ["It was created by an executive order in 2025", "It rests on laws such as MIPPA, the ACA, PAMA and MACRA", "It is run only by private insurers", "It is funded entirely by the states"], "answer": 1, "explain": "권한이 구속력 있는 법률과 규정에 근거하여야 정권이 바뀌어도 유지된다. 가치기반 프로그램은 MIPPA(2008), ACA(2010), PAMA(2014), MACRA(2015)에 근거한다.", "concept": "c_vbc", "source": "117_10w, 2절 가항 (2)"}, {"id": "w10b-03", "course": "ehs544", "week": "10w", "topic": "CMMI", "importance": 2, "why": "10회차 슬라이드 11", "type": "mc", "q": "Which body is described as the federal government's primary testing ground for new payment and delivery models in Medicare, Medicaid and CHIP?", "options": ["NCHS", "HRSA", "CMMI", "NIEHS"], "answer": 2, "explain": "메디케어ㆍ메디케이드 혁신센터(CMMI)가 가치기반 의료를 운영하며 지불과 서비스 제공 모형의 혁신을 시험한다.", "concept": "c_vbc", "source": "117_10w, 2절 가항 (3)"}, {"id": "w10b-04", "course": "ehs544", "week": "10w", "topic": "Cobra effect", "importance": 3, "why": "10회차 수업", "type": "mc", "q": "In class 10, the 'cobra effect' illustrates which limit of value-based care?", "options": ["Payers cannot measure cost at all", "You get what you measure, so a cost metric yields cost cutting", "Diabetes has no clear biomarker", "The President can repeal value-based programs"], "answer": 1, "explain": "서비스 건수로 지급하면 건수가 늘고 비용 절감을 지표로 삼으면 비용 절감이 나타난다. 코브라를 잡아 오는 대로 지급하자 코브라를 사육하는 사람이 생긴 사례가 이 문제의 비유이다.", "concept": "c_vbc", "source": "117_10w, 2절 가항 (5) (다)"}, {"id": "w10b-05", "course": "ehs544", "week": "10w", "topic": "Diabetes as proof of concept", "importance": 2, "why": "10회차 수업", "type": "mc", "q": "Why was diabetes proposed as the first proof of concept for linking value-based care to climate?", "options": ["It has a clear biomarker such as A1C and is linked to pollution such as PM2.5", "It is the only disease covered by Medicaid", "It has no link to environmental exposure", "It is excluded from value-based programs"], "answer": 0, "explain": "이상적인 가치기반 의료에 가까운 사례는 당화혈색소(A1C)처럼 생체지표가 분명한 분야에 한정된다. 당뇨병은 PM2.5와 내분비계 교란물질 같은 오염과 기후에도 깊이 관련되어 있다.", "concept": "c_vbc", "source": "117_10w, 2절 가항 (5) (다)"}, {"id": "w10b-06", "course": "ehs544", "week": "10w", "topic": "Authority of 1115 waivers", "importance": 3, "why": "10회차 슬라이드 16", "type": "mc", "q": "Why can the President not abolish Section 1115 waivers?", "options": ["They are binding congressional authority in the Social Security Act", "They are written into state constitutions", "They are protected by court orders", "They are funded only by private grants"], "answer": 0, "explain": "1115 면제는 Social Security Act 제1115조에 근거한 구속력 있는 의회 권한이다. 이 조항에 따라 보건복지부 장관이 일정한 연방 Medicaid 요건을 면제할 수 있다.", "concept": "c_1115", "source": "117_10w, 2절 나항 (2)"}, {"id": "w10b-07", "course": "ehs544", "week": "10w", "topic": "CMS test for 1115 proposals", "importance": 2, "why": "10회차 슬라이드 16", "type": "mc", "q": "What must CMS determine before approving a state's Section 1115 proposal?", "options": ["That the state legislature has approved it", "That it is 'likely to assist in promoting objectives' of Medicaid", "That every state has adopted it", "That it covers only adults aged 65 and older"], "answer": 1, "explain": "CMS는 주의 제안이 Medicaid 프로그램의 목적 증진에 도움이 될 가능성이 높다고 판단하여야 한다. 주는 이 면제로 자격, 급여, 진료 제공 방식을 시험한다.", "concept": "c_1115", "source": "117_10w, 2절 나항 (2)"}, {"id": "w10b-08", "course": "ehs544", "week": "10w", "topic": "Oregon precedent", "importance": 3, "why": "10회차 슬라이드 23", "type": "mc", "q": "Which state was first to bring climate change explicitly into an approved Medicaid 1115 demonstration?", "options": ["Texas", "Connecticut", "Oregon", "New York"], "answer": 2, "explain": "오리건주가 처음이며 에어컨, 공기 정화 장치, 난방기, 약품 보관용 소형 냉장고, 의료기기용 휴대 전원 장치를 보장한다.", "concept": "c_1115", "source": "117_10w, 2절 나항 (7)"}, {"id": "w10b-09", "course": "ehs544", "week": "10w", "topic": "Adaptation, not mitigation", "importance": 3, "why": "10회차 슬라이드 23", "type": "mc", "q": "According to class 10, what do Oregon's climate-related Medicaid benefits address?", "options": ["Mitigation only", "Adaptation to climate risks; no state yet targets mitigation", "Mitigation and adaptation equally", "Neither; they cover only hospital stays"], "answer": 1, "explain": "오리건주의 서비스는 기후 관련 위험에 대비하고 대응하는 적응 조치에 한정되었다. 현재 Medicaid 시범사업으로 기후변화 완화를 대상으로 하는 주는 없다.", "concept": "c_1115", "source": "117_10w, 2절 나항 (7)"}, {"id": "w10b-10", "course": "ehs544", "week": "10w", "topic": "HRSN changes for mitigation", "importance": 2, "why": "10회차 슬라이드 25", "type": "mc", "q": "Which change to a health-related social needs benefit would reduce emissions from transportation?", "options": ["Buying gas generators for patients", "Contracting non-emergency rides with providers that have electric vehicles", "Ending non-emergency transport", "Paying patients mileage for private cars"], "answer": 1, "explain": "비응급 환자 이송의 온실가스를 줄이려면 전기 차량을 보유한 제공자와 비응급 이송을 계약한다. 주거에서는 에너지 효율적 기기를 구매하고, 식품 지원에서는 식사의 일정 비율을 식물성이나 지역산 재료로 구성한다.", "concept": "c_1115", "source": "117_10w, 2절 나항 (8)"}, {"id": "w10b-11", "course": "ehs544", "week": "10w", "topic": "Billable Z codes", "importance": 3, "why": "10회차 슬라이드 31", "type": "mc", "q": "Which statement about Z codes in class 10 is correct?", "options": ["All Z codes are non-billable", "Header codes such as Z77.11 are non-billable, but specific codes such as Z77.110 are billable", "Only public health agencies may use Z codes", "Z codes are already used in most visits"], "answer": 1, "explain": "최상위 코드는 비특이적이어서 청구할 수 없지만 하위 코드는 청구할 수 있다. 대기오염 Z77.110, 수질오염 Z77.111, 토양오염 Z77.112 노출 코드가 이에 해당한다.", "concept": "c_zcode", "source": "117_10w, 2절 다항 (3)"}, {"id": "w10b-12", "course": "ehs544", "week": "10w", "topic": "A highway with no cars", "importance": 2, "why": "10회차 수업", "type": "mc", "q": "What does the image of 'a highway with no cars' refer to in class 10?", "options": ["ICD-11 will remove the highway", "Z codes exist, but only about 1.6–1.9% of cases use them", "Hospitals have no billing system", "Z codes cannot be matched to SDOH data"], "answer": 1, "explain": "코드 체계에는 많은 자금이 투입되었으나 Z 코드의 활용률은 1.6퍼센트에서 1.9퍼센트에 그친다. 그래서 비유는 Z 코드의 고속도로에 차가 없다는 표현으로 정정되었다.", "concept": "c_zcode", "source": "117_10w, 2절 다항 (1)"}, {"id": "w10b-13", "course": "ehs544", "week": "10w", "topic": "Using Z codes", "importance": 2, "why": "10회차 슬라이드 30", "type": "mc", "q": "Which order matches the CMS steps from SDOH data to better outcomes?", "options": ["Collect, document, map, use, report", "Map, collect, report, document, use", "Report, use, collect, map, document", "Document, report, collect, use, map"], "answer": 0, "explain": "진료팀이 SDOH 자료를 수집하여 기록하고, 공식 지침에 따라 Z 코드에 대응시킨 뒤, 사회적 위험을 확인하여 의뢰에 활용하고 경영진과 이사회에 보고한다.", "concept": "c_zcode", "source": "117_10w, 2절 다항 (2)"}, {"id": "w10b-14", "course": "ehs544", "week": "10w", "topic": "Preferred framing", "importance": 2, "why": "10회차 슬라이드 26", "type": "mc", "q": "Under the preferred framing on slide 26, a housing intervention is presented as:", "options": ["Housing equity", "Asthma and COPD prevention", "Fewer missed appointments", "Diabetes prevention and management"], "answer": 1, "explain": "주거 개입은 주거 형평에서 천식과 COPD 예방으로 표현이 바뀐다. 식품 프로그램은 당뇨병 예방과 관리로, 교통 지원은 진료 예약 불참 감소로 바뀐다.", "concept": "c_reframe", "source": "117_10w, 2절 나항 (9)"}, {"id": "w10b-15", "course": "ehs544", "week": "10w", "topic": "HRSN as the working term", "importance": 2, "why": "10회차 수업", "type": "mc", "q": "Which term does class 10 advise using for what a waiver can cover under the current administration?", "options": ["Environmental justice", "Social determinants of health", "Health-related social needs (HRSN)", "Whole-person care"], "answer": 2, "explain": "현 행정부에서는 건강 관련 사회적 필요(HRSN)가 면제로 보장할 수 있는 대상을 가리키는 용어이다. 같은 목표를 향해 상황에 맞는 용어를 선택하는 방식은 할로윈 의상을 바꿔 입는 것에 비유되었다.", "concept": "c_reframe", "source": "117_10w, 2절 나항 (5)ㆍ(9)"}, {"id": "w11b-01", "course": "ehs544", "week": "11w", "topic": "Judicial independence", "importance": 2, "why": "11회차 사전 강의", "type": "mc", "q": "How does Article III protect the independence of federal judges?", "options": ["Judges are elected every six years", "Judges hold office during good behavior and their pay is set by Article III", "The President may remove judges at will", "Congress reappoints judges each term"], "answer": 1, "explain": "연방 법관은 선량하게 행동하는 동안(good behavior) 직위를 유지하므로 사실상 종신직이고, 제3조는 법관의 보수도 정한다. 이 구조는 사법부의 독립을 보장하려는 보호 장치이다.", "concept": "c_art3", "source": "118_11w, 1절 가항"}, {"id": "w11b-02", "course": "ehs544", "week": "11w", "topic": "Limited federal jurisdiction", "importance": 2, "why": "11회차 사전 강의", "type": "mc", "q": "Which case is NOT one of the four types that federal courts hear under Article III?", "options": ["Questions of federal law", "Cases between states", "Cases where the U.S. is a party", "A state contract dispute between two citizens of the same state"], "answer": 3, "explain": "연방법원의 관할은 연방법 문제, 주 사이의 사건, 미국이 당사자인 사건, 주와 외국 정부 또는 외국 시민 사이의 사건의 네 가지로 제한된다. 같은 주 시민 사이의 주법상 계약 분쟁은 여기에 해당하지 않는다.", "concept": "c_art3", "source": "118_11w, 2절"}, {"id": "w11b-03", "course": "ehs544", "week": "11w", "topic": "Source of judicial review", "importance": 3, "why": "11회차 사전 강의", "type": "mc", "q": "Where does the power of courts to review legislative and executive acts come from?", "options": ["It is written out in the text of Article III", "It was created by the Administrative Procedure Act", "It was established by Marbury v. Madison (1803)", "It comes from the Tenth Amendment"], "answer": 2, "explain": "입법ㆍ행정 조치에 대한 사법심사는 헌법에 명시되어 있지 않고, 마버리 대 매디슨(1803)이 법이 무엇인지 말하는 것은 사법부의 고유한 영역이자 의무라고 판시하여 확립하였다. 이 권한은 제3조와 제6조에서 도출된다.", "concept": "c_art3", "source": "118_11w, 5절 가항"}, {"id": "w11b-04", "course": "ehs544", "week": "11w", "topic": "Three elements of standing", "importance": 3, "why": "11회차 슬라이드 4-5", "type": "mc", "q": "Which is NOT one of the three elements a plaintiff must prove for Article III standing?", "options": ["A concrete and particularized injury-in-fact", "An injury traceable to the defendant's challenged conduct", "An injury redressable by a favorable decision", "Proof that the political process has already failed"], "answer": 3, "explain": "원고는 구체적이고 개별적인 사실상의 손해, 피고의 위법하다고 주장되는 행위로 소급할 수 있는 손해, 유리한 판결로 구제될 가능성의 세 요건을 증명하여야 한다. 원고적격은 연방법상 청구의 관할 요건이다.", "concept": "c_standing", "source": "119_11w, 1절 나항 (1)"}, {"id": "w11b-05", "course": "ehs544", "week": "11w", "topic": "Why Juliana and Lighthiser failed", "importance": 3, "why": "11회차 슬라이드 20, 26", "type": "mc", "q": "In Juliana and Lighthiser, injury was recognized. Why did the youth plaintiffs still fail?", "options": ["Ordering a national climate plan was beyond the power of the courts, so the injury was not redressable", "The plaintiffs were too young to sue", "Climate change was found not to cause any harm", "The cases were filed after the statute of limitations"], "answer": 0, "explain": "Lighthiser 사건에서 법원은 손해와 인과관계를 인정하였으나, 전국적 기후변화 계획을 명하는 구제는 권력분립과 제3조의 한계 때문에 사법부의 권한을 초과한다고 판단하였다. Juliana 사건에서도 제9순회구 항소법원은 연방법원이 구제할 수 없으므로 원고적격이 없다고 판단하였다.", "concept": "c_standing", "source": "119_11w, 1절 라항 (2), 바항 (1)"}, {"id": "w11b-06", "course": "ehs544", "week": "11w", "topic": "Held v. Montana", "importance": 3, "why": "11회차 슬라이드 28-30", "type": "mc", "q": "On what basis did the Montana Supreme Court rule for the youth plaintiffs in Held v. Montana?", "options": ["The Commerce Clause", "The state constitution's right to a clean and healthful environment", "Title VI of the Civil Rights Act", "The federal Endangerment Finding"], "answer": 1, "explain": "몬태나주 대법원은 6 대 1로 주 헌법의 깨끗하고 건강한 환경에 대한 권리를 근거로 원고적격을 인정하고, 환경 검토에서 온실가스 분석을 금지한 법률을 위헌으로 판단하였다. 헌법에 환경 보호 규정을 둔 다른 주에서 비슷한 소송을 제기할 모델이 된다.", "concept": "c_standing", "source": "119_11w, 1절 바항 (2)"}, {"id": "w11b-07", "course": "ehs544", "week": "11w", "topic": "Massachusetts v. EPA", "importance": 2, "why": "11회차 슬라이드 19, 24", "type": "mc", "q": "Why is Massachusetts v. EPA (2007) a landmark for climate litigation?", "options": ["It ended Chevron deference", "It held that climate cases are political questions", "It recognized a state's concrete climate harm, such as sea-level rise, as a valid injury and treated greenhouse gases as air pollutants", "It dismissed all state climate suits"], "answer": 2, "explain": "연방대법원은 매사추세츠주에 영향을 미치는 해수면 상승처럼 구체적 손해를 증명한 주에게 원고적격을 인정하였다. 또 온실가스가 대기청정법상 대기오염물질에 해당한다고 판시하였고, 그 뒤 EPA는 2009년 위해성 판단을 발표하였다.", "concept": "c_standing", "source": "119_11w, 1절 라항 (1), 마항 (2)"}, {"id": "w11b-08", "course": "ehs544", "week": "11w", "topic": "Arbitrary-or-capricious factors", "importance": 3, "why": "11회차 슬라이드 9", "type": "mc", "q": "Under APA §706(2)(A), which question is NOT one of the factors a court checks?", "options": ["Did the agency consider all relevant factors?", "Did the agency offer a reasoned explanation?", "Did the agency rest its decision on substantial evidence?", "Was the agency's reading of the statute reasonable, so the court must defer to it?"], "answer": 3, "explain": "자의ㆍ변덕 심사의 요소는 관련된 모든 요소의 고려, 합리적인 설명, 실질적 증거, 법이 허용하지 않은 요소에 의존하지 않았는지의 네 가지이다. 합리적이면 기관의 해석을 존중하던 셰브런 존중은 Loper Bright 판결로 폐기되었다.", "concept": "c_apa706", "source": "119_11w, 1절 나항 (3), 사항"}, {"id": "w11b-09", "course": "ehs544", "week": "11w", "topic": "Loper Bright", "importance": 3, "why": "11회차 슬라이드 31", "type": "mc", "q": "What did Loper Bright Enterprises v. Raimondo change?", "options": ["Courts must interpret statutes independently instead of deferring to an agency's reasonable reading", "Agencies now receive more deference than before", "Citizen suits were abolished", "Agencies may no longer issue regulations"], "answer": 0, "explain": "Loper Bright 판결은 40년 된 셰브런 존중을 폐기하였다. 법원은 기관의 법률 해석을 맹목적으로 존중하지 말고 헌법의 한계 안에서 독자적으로 법률을 해석하여 의회의 의사를 실현하여야 한다.", "concept": "c_apa706", "source": "119_11w, 1절 사항"}, {"id": "w11b-10", "course": "ehs544", "week": "11w", "topic": "Preliminary injunction test", "importance": 2, "why": "11회차 슬라이드 10", "type": "mc", "q": "Which is NOT one of the four showings for a preliminary injunction?", "options": ["Likely to succeed on the merits", "Likely to suffer irreparable harm without relief", "Money damages have already been paid", "The injunction is in the public interest"], "answer": 2, "explain": "원고는 본안 승소 가능성, 회복할 수 없는 손해의 가능성, 형평의 비교가 원고에게 유리하다는 점, 금지명령이 공익에 부합한다는 점을 증명하여야 한다. 금지명령은 금전 배상으로 충분하지 않을 때 쓰는 형평법상 구제이다.", "concept": "c_apa706", "source": "119_11w, 1절 나항 (4)"}, {"id": "w11b-11", "course": "ehs544", "week": "11w", "topic": "Alexander v. Sandoval", "importance": 3, "why": "11회차 사전 강의", "type": "mc", "q": "What did Alexander v. Sandoval (2001) hold about Title VI disparate-impact rules?", "options": ["They apply only to private companies", "They do not create a private right of action", "They were declared unconstitutional", "They require proof of injury-in-fact only"], "answer": 1, "explain": "Sandoval 판결은 차별적 영향을 금지하는 기관 규칙이 사적 소권을 만들지 않는다고 판시하였다. 민권법에 근거한 소송이 어려워져 EPA 같은 행정기관에 진정을 제기하는 방식이 주된 구제 수단이 되었다.", "concept": "c_title6", "source": "118_11w, 9절 나항"}, {"id": "w11b-12", "course": "ehs544", "week": "11w", "topic": "CFR siting provision", "importance": 3, "why": "11회차 사전 강의", "type": "mc", "q": "Why was the CFR siting provision called a woefully underutilized policy method?", "options": ["It reaches facility siting choices that have a discriminatory purpose or effect", "It gives residents a private right to sue in federal court", "It applies only to facilities without federal funding", "It was repealed in 2025"], "answer": 0, "explain": "이 조항은 연방 재정지원 수령자가 인종ㆍ피부색ㆍ출신 국가와 관련하여 차별의 목적이나 효과를 가진 시설 부지를 선정하지 못하게 한다. 효과를 기준으로 삼으므로 저소득ㆍ유색인 지역사회에 불리한 입지를 평가하는 데 쓸 수 있고, 사적 소권이 없으므로 행정 절차를 거쳐 활용한다.", "concept": "c_title6", "source": "118_11w, 9절 마항"}, {"id": "w11b-13", "course": "ehs544", "week": "11w", "topic": "EO 14096 beneficiaries", "importance": 2, "why": "11회차 사전 강의", "type": "mc", "q": "How did Executive Order 14096 differ from Title VI in whom it protects?", "options": ["It removed race as a protected ground", "It covered only federal employees", "It added persons with disabilities and other conditions affecting health and well-being", "It covered only tribal nations"], "answer": 2, "explain": "제6편과 행정명령 12898호는 인종ㆍ피부색ㆍ출신 국가를 보호하는 반면, 행정명령 14096호는 수혜자를 장애인과 건강ㆍ복리에 영향을 주는 그 밖의 조건을 가진 사람까지 넓혔다.", "concept": "c_title6", "source": "118_11w, 9절 라항"}, {"id": "w11b-14", "course": "ehs544", "week": "11w", "topic": "Source of local power", "importance": 2, "why": "11회차 슬라이드 40", "type": "mc", "q": "Where do local governments get their power?", "options": ["Directly from the U.S. Constitution", "From the state, which must grant it", "From the federal agencies that fund them", "From the county courts"], "answer": 1, "explain": "연방정부와 주 정부는 권한을 공유하지만 지방정부는 주로부터 권한을 부여받아야 한다. 수정헌법 제10조에 따라 연방에 위임되지 않은 권한은 주에 유보되고, 지방정부의 설치도 주의 권한에 속한다.", "concept": "c_localplan", "source": "119_11w, 2절 바항 (1)"}, {"id": "w11b-15", "course": "ehs544", "week": "11w", "topic": "Types of climate action plans", "importance": 2, "why": "11회차 슬라이드 42", "type": "mc", "q": "Which type of local climate action plan focuses on building resilience to climate impacts on infrastructure, health, the economy and nature?", "options": ["Mitigation plan", "Adaptation plan", "Sustainability plan", "Emergency docket plan"], "answer": 1, "explain": "완화 계획은 온실가스 감축에 중점을 둔 가장 먼저 등장한 유형이고, 적응 계획은 기후 영향에 대한 회복력 강화에 중점을 둔다. 지속가능성 계획은 두 계획을 환경 보호, 일자리 창출, 주택 등과 통합한다.", "concept": "c_localplan", "source": "119_11w, 2절 바항 (3)"}, {"id": "w11b-16", "course": "ehs544", "week": "11w", "topic": "Fee for service and prevention", "importance": 2, "why": "11회차 슬라이드 45", "type": "mc", "q": "In the study cited in class 11, which payment pattern showed the largest improvement in diabetes care?", "options": ["A high share of fee-for-service payment", "Mostly capitated payments", "Payment only for hospital stays", "No payment for patient education or visits"], "answer": 1, "explain": "행위별 수가의 비율이 높을수록 당뇨 관리의 개선이 가장 작았고, 보상이 주로 인두제 지급으로 구성된 경우 개선이 가장 컸다. 행위별 수가제에서는 환자 교육 같은 예방 활동이 보상되지 않기 때문이다.", "concept": "c_localplan", "source": "119_11w, 2절 사항 (3)"}, {"id": "h-01", "course": "hpm570", "week": "6w", "topic": "Moving the cutoff", "importance": 3, "why": "시험 범위 · 6주차 핵심", "type": "mc", "q": "In the CAGE example, the positivity cutoff is lowered from 4 points to 2 points. Which change is correct?", "options": ["Sensitivity rises from 12.5% to 83.3%; specificity falls from 99.6% to 91.9%", "Sensitivity and specificity both rise", "Sensitivity falls and specificity rises", "Neither value changes because the test is the same"], "answer": 0, "explain": "기준선을 낮추면 양성이 늘어 민감도는 오르고 특이도는 내린다. 같은 검사라도 기준선이 바뀌면 두 값이 함께 바뀐다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 CAGE"}, {"id": "h-02", "course": "hpm570", "week": "6w", "topic": "Sensitivity calculation", "importance": 3, "why": "계산 단골 · 6주차", "type": "mc", "q": "CAGE cutoff 4: 6 true positives, 3 false positives, 42 false negatives, 678 true negatives. What is the sensitivity?", "options": ["6/48 = 12.5%", "6/9 = 66.7%", "678/681 = 99.6%", "678/720 = 94.2%"], "answer": 0, "explain": "민감도는 질병이 있는 48명 가운데 양성인 6명이다. 66.7%는 양성 예측도, 99.6%는 특이도이다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 나항"}, {"id": "h-03", "course": "hpm570", "week": "6w", "topic": "PPV and prevalence", "importance": 2, "why": "예측도와 유병률 · 6주차", "type": "mc", "q": "As the CAGE cutoff is lowered, the positive predictive value falls (66.7% at cutoff 4, 31.3% at cutoff 1). What explains the large fall?", "options": ["Most people in the sample do not have the disease, so new positives are mostly false positives", "The test becomes less sensitive", "The disease becomes rarer as the cutoff falls", "Specificity rises faster than sensitivity"], "answer": 0, "explain": "표본의 유병률이 낮아 질병이 없는 사람이 많으므로 새로 양성이 된 사람 가운데 거짓양성이 많다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 라항"}, {"id": "h-04", "course": "hpm570", "week": "6w", "topic": "Slope of the ROC curve", "importance": 3, "why": "ROC 해석 · 6주차", "type": "mc", "q": "What does the slope of the ROC curve at a given point equal?", "options": ["The likelihood ratio at that cutoff", "The prevalence of the disease", "The positive predictive value", "The area under the curve"], "answer": 0, "explain": "곡선 위 한 점의 기울기는 그 점의 우도비와 같다. 가파른 구간은 우도비가 큰 결과이다.", "concept": "h_roc", "source": "106 Diagnostic Tests, 4절 마항"}, {"id": "h-05b", "course": "hpm570", "week": "6w", "topic": "ROC area and the best cutoff", "importance": 3, "why": "수업 강조 · ROC 한계", "type": "tf", "q": "A test whose ROC area is 0.9 has its optimal cutoff at the top-left corner of the curve.", "options": ["True", "False"], "answer": 1, "explain": "면적은 두 분포의 분리 정도만 요약하고 최적점은 유병률과 결과의 가치에 따라 달라진다. 왼쪽 위 모서리 관행은 이 둘을 무시한다.", "concept": "h_roc", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-05", "course": "hpm570", "week": "7w", "topic": "Terms of the cutoff formula", "importance": 3, "why": "시험 범위 · 7주차 핵심", "type": "mc", "q": "In the positivity-cutoff formula, what does the term p(D−)/p(D+) represent?", "options": ["Prevalence (the inverse of the prior odds)", "Test performance", "The relative size of decision errors", "The area under the ROC curve"], "answer": 0, "explain": "이 항은 사전 오즈의 역수로 유병률을 표시한다. 검사 성능은 우도비로, 오류의 크기는 비용비로 반영한다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 3절"}, {"id": "h-06", "course": "hpm570", "week": "7w", "topic": "Prevalence and the LR threshold", "importance": 3, "why": "공식 해석 · 7주차", "type": "mc", "q": "Everything else equal, prevalence rises. What happens to the likelihood ratio a result needs to be called positive?", "options": ["It falls", "It rises", "It stays the same", "It becomes exactly 1"], "answer": 0, "explain": "유병률이 높으면 사전 오즈의 역수가 작아져 양성으로 지정하는 기준이 낮아진다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 사항"}, {"id": "h-07", "course": "hpm570", "week": "7w", "topic": "Cost ratio calculation", "importance": 3, "why": "계산 · 7주차", "type": "mc", "q": "Costs: TN $0, TP $700, FP $100, FN $1,000. What is the cost ratio (CTN − CFP) / (CTP − CFN)?", "options": ["1/3", "3", "−1/3", "7/10"], "answer": 0, "explain": "(0 − 100) / (700 − 1,000)에서 분자와 분모가 모두 음수이므로 1/3이다. 부호를 확인하는 것이 핵심이다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 바항"}, {"id": "h-08", "course": "hpm570", "week": "7w", "topic": "Is LR = 1 the best cutoff?", "importance": 3, "why": "수업 강조 · 7주차", "type": "tf", "q": "The optimal cutoff is always the result whose likelihood ratio equals 1.", "options": ["True", "False"], "answer": 1, "explain": "최적 절단점은 사전 오즈의 역수와 비용비의 곱으로 정해지므로 그 곱이 1과 다르면 우도비 1과 다른 곳에 있다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-09", "course": "hpm570", "week": "7w", "topic": "Classify a result", "importance": 3, "why": "계산 · 6~7주차", "type": "mc", "q": "Ferritin example: the threshold LR is 0.5882. How should the result 45-100 (LR 0.4575) and the result 18-45 (LR 3.12) be designated?", "options": ["45-100 negative; 18-45 positive", "Both positive", "Both negative", "45-100 positive; 18-45 negative"], "answer": 0, "explain": "우도비가 0.5882보다 큰 결과만 양성이다. 기대비용으로 구한 결과와 같다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 아항"}, {"id": "h-10", "course": "hpm570", "week": "7w", "topic": "Same test, different cutoff", "importance": 2, "why": "수업 강조 · 7주차", "type": "mc", "q": "Why can the same test have a different optimal cutoff in two populations?", "options": ["Prevalence and the value of the decisions differ, even if test performance is the same", "The test has a different ROC area in each population by definition", "Sensitivity is not defined across populations", "The likelihood ratio of a result changes with prevalence"], "answer": 0, "explain": "검사 성능이 같아도 유병률과 비용비가 다르면 오른쪽 값이 변한다. 우도비 순위는 유병률과 무관하다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-11", "course": "hpm570", "week": "6w", "topic": "Which prevalence goes in Bayes?", "importance": 3, "why": "시험 출제 유형", "type": "mc", "q": "A study oversamples diseased patients (67 with, 65 without disease). The population prevalence is 12.5%. Which value is used as the prior probability?", "options": ["12.5%", "50.8%", "67/65", "The average of 12.5% and 50.8%"], "answer": 0, "explain": "표본의 비율은 표집 설계가 정한 숫자이다. 표본에서는 질병 상태별 결과 분포만 얻는다.", "concept": "h_prev", "source": "106 Diagnostic Tests, 6절 나항"}, {"id": "h-12", "course": "hpm570", "week": "6w", "topic": "What the oversampled table gives", "importance": 3, "why": "2025 중간시험 2 복습 · 문제 1", "type": "mc", "q": "A table has 146 children with acute lead poisoning (ALP) and 146 without; population prevalence is 10%. What can the table legitimately provide?", "options": ["The distribution of blood lead levels within each disease group", "The prevalence of ALP", "The posterior probability of ALP directly", "The treatment threshold"], "answer": 0, "explain": "표는 질병 상태별 혈중 납 분포를 제공한다. 사후확률은 이 분포에 10% 유병률을 결합해야 나온다.", "concept": "h_prev", "source": "903 Midterm 2 review, Q1 / lecrec review session"}, {"id": "h-13", "course": "hpm570", "week": "6w", "topic": "Prevalence versus threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, prevalence falls from 10% to 5%. What changes?", "options": ["Posterior probabilities change; the 9.71% treatment threshold does not", "The treatment threshold falls", "The harm probabilities change", "Nothing changes"], "answer": 0, "explain": "유병률은 사후확률을 변화시킨다. 기준선은 치료의 이익과 해악에서 나오므로 그대로이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part B"}, {"id": "h-14", "course": "hpm570", "week": "6w", "topic": "Toxicity and the threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, EDTA toxicity falls from 5% to 2.5%. What happens to the treatment threshold?", "options": ["It falls to about 4.93%", "It stays at 9.71%", "It rises above 9.71%", "The posterior probabilities change but the threshold does not"], "answer": 0, "explain": "독성이 줄면 치료의 해악이 작아져 더 낮은 사후확률에서도 치료가 유리하다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part C"}, {"id": "h-15", "course": "hpm570", "week": "6w", "topic": "Threshold by expected harm", "importance": 3, "why": "계산 · 2025 시험", "type": "mc", "q": "Harm with EDTA: 33.5% if ALP, 5% if not. Harm without EDTA: 80% if ALP, 0% if not. At what posterior probability P of ALP are the two options equal?", "options": ["About 9.71%", "About 33.5%", "About 5%", "About 51.5%"], "answer": 0, "explain": "0.05 + 0.285P = 0.8P에서 P = 0.05/0.515로 약 9.71%이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 4"}, {"id": "h-16", "course": "hpm570", "week": "6w", "topic": "Combining two harms", "importance": 2, "why": "2025 시험 · 계산 함정", "type": "mc", "q": "A child with ALP given EDTA has a 30% risk of lead complications and a 5% risk of toxicity. Why is the chance of at least one harm not 35%?", "options": ["The same child could have both, so use 1 − 0.70 × 0.95 = 33.5%", "The risks are mutually exclusive", "Toxicity only applies to children without ALP", "Rounding error in the exam"], "answer": 0, "explain": "두 해악이 한 아이에게 함께 생길 수 있으므로 둘 다 없을 확률을 빼서 계산한다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 3"}, {"id": "h-17", "course": "hpm570", "week": "7w", "topic": "Appendectomy: which factor lowers the cutoff", "importance": 3, "why": "2025 시험 · 문제 2", "type": "mc", "q": "Older adults: appendicitis is rarer, but missing it is far deadlier. Which factor alone favors a LOWER score cutoff (more surgeries)?", "options": ["Higher mortality when appendicitis is missed (false negative)", "Lower prevalence of appendicitis", "Higher mortality from unnecessary surgery (false positive)", "Higher mortality from surgery in true cases"], "answer": 0, "explain": "놓친 환자의 사망률이 높으면 수술 기준을 낮추는 쪽이 유리하다. 나머지 세 요인은 기준을 높인다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2 Step 2"}, {"id": "h-18", "course": "hpm570", "week": "7w", "topic": "Probability threshold versus score cutoff", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "The posterior thresholds are 5.15% (younger) and 6.1% (older adults). Why can the question not give an actual score cutoff?", "options": ["Age-specific prevalence and the likelihood ratios of the scores are not given", "The thresholds are too close to each other", "Mortality rates cannot be converted to probabilities", "The score cutoff is the same as the threshold"], "answer": 0, "explain": "확률 기준선을 점수로 옮기려면 연령별 유병률과 점수의 우도비가 필요하다. 빠진 자료를 밝히는 것이 정답에 포함된다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2"}, {"id": "h-19", "course": "hpm570", "week": "7w", "topic": "What EVPI is", "importance": 3, "why": "7주차 슬라이드 · 정보의 가치", "type": "mc", "q": "What is the expected value of perfect information (EVPI)?", "options": ["An upper bound on what any test or indicator can add", "The value of the best available test", "The cost of a perfect test", "The expected harm of using no information"], "answer": 0, "explain": "완전정보 전략에서 정보 없는 최선을 뺀 값이며 어떤 검사도 이를 넘지 못한다.", "concept": "h_evpi", "source": "107 Positivity Cutoff, 5절"}, {"id": "h-20", "course": "hpm570", "week": "6w", "topic": "When a test has value", "importance": 3, "why": "6주차 요약 · 계산 연결", "type": "mc", "q": "When does a diagnostic test have value for a decision?", "options": ["When the best action differs depending on the result", "When its sensitivity is above 90%", "When its ROC area is above 0.5", "When it costs less than treatment"], "answer": 0, "explain": "모든 결과에서 같은 행동이 최적이면 검사 결과를 알아도 최선의 결정이 달라지지 않으므로 가치가 0이다.", "concept": "h_evpi", "source": "106 Diagnostic Tests, 요약과 6절"}, {"id": "h-21", "course": "hpm570", "week": "8w", "topic": "Which analysis uses QALYs", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "Which type of economic evaluation expresses outcomes as quality-adjusted life-years?", "options": ["Cost-utility analysis", "Cost-effectiveness analysis in natural units", "Cost-benefit analysis", "Cost-consequences analysis"], "answer": 0, "explain": "효용으로 보정한 QALY를 결과로 쓰는 분석이 비용효용분석이다.", "concept": "h_types", "source": "212 Basic Types, 9절"}, {"id": "h-22", "course": "hpm570", "week": "8w", "topic": "Which analysis uses money", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "In which analysis are both costs and consequences measured in monetary units?", "options": ["Cost-benefit analysis", "Cost-effectiveness analysis", "Cost-utility analysis", "Cost-minimization analysis"], "answer": 0, "explain": "비용과 결과를 모두 화폐로 재서 순편익이나 편익 대 비용의 비로 적는 것이 비용편익분석이다.", "concept": "h_types", "source": "212 Basic Types, 10절"}, {"id": "h-23", "course": "hpm570", "week": "8w", "topic": "Full versus partial evaluation", "importance": 2, "why": "8주차 읽을거리", "type": "tf", "q": "A study that reports the cost and outcomes of one program, without comparing it to an alternative, is a full economic evaluation.", "options": ["True", "False"], "answer": 1, "explain": "완전한 경제성 평가는 둘 이상의 대안을 비교하고 비용과 결과를 함께 본다. 하나만 적은 연구는 부분 평가이다.", "concept": "h_types", "source": "212 Basic Types, 6절"}, {"id": "h-24", "course": "hpm570", "week": "9w", "topic": "The colleague's error", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Biennial screening costs $25,000 for 8 QALYs; annual costs $50,000 for 9 QALYs. A colleague picks biennial for its lower average cost per QALY. What is the correct reading?", "options": ["The ICER is $25,000 per QALY; the choice depends on willingness to pay", "Biennial is always better because its average ratio is lower", "Annual is better because it has more QALYs", "Annual is dominated by biennial"], "answer": 0, "explain": "평균비는 각 사업을 따로 본 값이다. 추가 1 QALY에 추가 $25,000이 들며, 지불의사가 이보다 크면 매년 검진이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part A"}, {"id": "h-25", "course": "hpm570", "week": "9w", "topic": "Incremental NMB", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Same programs. Willingness to pay is $30,000 per QALY. What is the incremental net monetary benefit of annual versus biennial?", "options": ["+$5,000, so annual is preferred", "−$5,000, so biennial is preferred", "$0, so they tie", "+$25,000, so annual is preferred"], "answer": 0, "explain": "증분 순화폐편익은 30,000 × 1 − 25,000으로 +5,000이어서 비싼 쪽이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part B"}, {"id": "h-26", "course": "hpm570", "week": "9w", "topic": "What a ratio can hide", "importance": 2, "why": "9주차 읽을거리", "type": "tf", "q": "A ratio of $50,000 per QALY always means the program costs more and also adds more health.", "options": ["True", "False"], "answer": 1, "explain": "비용 감소를 효과 감소로 나눠도 같은 비율이 산출되므로 비율만으로는 방향을 판단할 수 없다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 12절"}, {"id": "h-27", "course": "hpm570", "week": "9w", "topic": "Spotting extended dominance", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "Costs and QALYs: A $25,000 and 8; B $50,000 and 9; C $55,000 and 9.5. The ICER of A to B is $25,000 and of B to C is $10,000. What follows?", "options": ["B is extended dominated and is removed", "A is dominated and is removed", "C is dominated and is removed", "All three stay on the frontier"], "answer": 0, "explain": "증분비가 내려가면 가운데 대안 B가 확장 지배된다. 더 비싸고 더 효과적이어도 제외 대상이다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C"}, {"id": "h-28", "course": "hpm570", "week": "9w", "topic": "Recompute after removal", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "After removing B, what is the ICER of C versus A?", "options": ["$20,000 per QALY", "$10,000 per QALY", "$25,000 per QALY", "$30,000 per QALY"], "answer": 0, "explain": "(55,000 − 25,000) / (9.5 − 8) = 20,000이다. 제외 전의 값으로 비교하면 오답이 된다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 3"}, {"id": "h-29", "course": "hpm570", "week": "9w", "topic": "The mixed strategy", "importance": 3, "why": "2025 시험 · 확장 지배 예시", "type": "mc", "q": "Give 2/3 of patients strategy C and 1/3 strategy A. What are the average QALYs and cost?", "options": ["9.0 QALYs and $45,000, which beats B", "9.5 QALYs and $55,000", "8.5 QALYs and $40,000", "9.0 QALYs and $50,000"], "answer": 0, "explain": "섞으면 B와 같은 9.0 QALY를 더 싼 $45,000에 얻으므로 B는 효율적 프론티어에 오르지 못한다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 2"}, {"id": "h-30", "course": "hpm570", "week": "9w", "topic": "Simple versus extended dominance", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "How does extended dominance differ from simple dominance?", "options": ["The option is more costly and more effective, but its ICER is higher than the next option's", "The option is more costly and less effective", "The option is cheaper and less effective", "The option has a negative ICER"], "answer": 0, "explain": "단순 지배는 더 비싸면서 효과가 적은 경우이고, 확장 지배는 더 많이 얻지만 다른 대안보다 단위당 비싸다.", "concept": "h_dom", "source": "217 Incremental CEA, 10절"}, {"id": "h-31", "course": "hpm570", "week": "9w", "topic": "Cost-saving programs", "importance": 3, "why": "9주차 읽을거리", "type": "mc", "q": "When choosing among independent programs under a budget, which program is selected whatever th
