<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00356B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>복습</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&display=swap");
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
:root{--yale:#00356B;--yale2:#286DC0;--wash:#EEF3F9;--ink:#1D2430;--ink2:#3F4A5A;--rule:#C9D4E2;
  --serif:'YaleNew','Libre Caslon Text',Georgia,Pretendard,'Malgun Gothic',serif;--head:'Yale 2024','YaleNew','Libre Caslon Text',Georgia,Pretendard,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{display:flex;min-height:100vh;background:#fff;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--yale);color:#fff}
:focus-visible{outline:2px solid var(--yale2);outline-offset:2px}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--yale);border-radius:0;padding:8px 18px;cursor:pointer;min-height:44px}
button:hover{background:var(--wash)}
button.primary{background:var(--yale);color:#fff}
button.primary:hover{background:#0a4a8f}
#side{width:230px;flex:none;background:var(--yale);color:#fff;padding:36px 22px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .t{font-family:var(--head);font-size:20px;line-height:1.3;margin-bottom:22px}
#side a{display:flex;justify-content:space-between;gap:8px;color:#c9d9ee;padding:7px 0;text-decoration:none;border-bottom:1px solid #1d4f86;cursor:pointer;font-variant-numeric:tabular-nums}
#side a.on{color:#fff;font-weight:700}
#side a.empty{color:#7f9cc4}
#side .foot{margin-top:22px;color:#c9d9ee}
#side .foot button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:0;min-height:0;font:inherit}
#app{flex:1;min-width:0;max-width:820px;padding:36px 44px 120px}
h1{font-family:var(--head);font-weight:400;color:var(--yale);font-size:24px;line-height:1.3;margin-bottom:6px;text-wrap:balance}
h2{font-family:var(--head);font-weight:400;color:var(--yale);font-size:20px;line-height:1.3;margin:0 0 8px}
.sub{color:var(--ink2);margin-bottom:20px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;background:none;color:var(--ink2)}
.tabs button.on{color:var(--yale);border-bottom-color:var(--yale);font-weight:700}
.eyebrow{color:var(--yale2);border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.q{font-weight:700;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:11px 14px;border-color:var(--rule);background:#fff}
.opt .k{flex:none;width:16px;color:var(--yale2);font-weight:700}
.opt.right{background:var(--yale);border-color:var(--yale);color:#fff}
.opt.right .k{color:#fff}
.opt.wrong{background:var(--rule);border-color:var(--ink2);color:var(--ink);text-decoration:line-through}
.opt:disabled:not(.right):not(.wrong){color:#8591a3}
.res{font-weight:700;margin-bottom:4px;color:var(--yale)}
.exp{max-width:62ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.card{border-top:2px solid var(--yale);padding:14px 0 22px;margin-bottom:8px}
.card .kor{color:var(--ink2);margin-bottom:8px}
.card .dg{overflow-x:auto;margin:10px 0 12px;scrollbar-width:thin}
.card svg{width:100%;height:auto;display:block;background:#fff;min-width:600px}
.card .one{margin-bottom:8px;max-width:60ch}
.card ul{padding-left:20px;margin:0 0 10px;max-width:62ch}
.card li{margin-bottom:3px}
.terms{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;margin:8px 0 12px}
.terms b{font-weight:400;color:var(--yale)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
th{border-top:2px solid var(--yale);background:var(--wash);color:var(--yale);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.set input{font:inherit;border:1px solid var(--rule);padding:6px 8px;border-radius:0;min-height:40px}
.src{color:var(--ink2);max-width:62ch;margin-top:18px}
@media (max-width:760px){
  body{display:block}
  #side{width:auto;height:auto;position:static;padding:14px 18px 8px;display:block}
  #side .t{margin-bottom:8px}
  #side .list{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #side .list::-webkit-scrollbar{display:none}
  #side a{border:0;padding:6px 0;flex:none}
  #side .foot{display:none}
  #app{padding:20px 18px 100px;overflow-x:hidden}
}
</style>
</head>
<body>
<nav id="side" aria-label="과목"></nav>
<main id="app"></main>
<script>
const DATA = [{"id": "w7-01", "course": "ehs544", "week": "7w", "topic": "Meaningful involvement (EPA)", "importance": 3, "why": "시험 2 범위 · 모든 회차의 기준", "type": "mc", "q": "Under EPA's definition of environmental justice, which of the following is one of the conditions of \"meaningful involvement\"?", "options": ["The public's contribution can influence the regulatory agency's decision.", "The agency announces its decision first and then explains it to the public.", "The community must first prove that it has been harmed before it may take part.", "Industry and community members receive the same number of speaking slots."], "answer": 0, "explain": "공중의 기여가 기관의 결정에 영향을 미칠 수 있어야 실질적 참여가 성립한다. 결정을 먼저 발표하고 방어하는 방식(announce and defend)은 연방 지침이 벗어나려 한 기존 방식이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-02", "course": "ehs544", "week": "7w", "topic": "Listening session vs. engagement", "importance": 3, "why": "교수 강조 · 조별 과제 연결", "type": "mc", "q": "A state agency holds a two-hour listening session on a proposed landfill expansion. Residents speak and staff take notes, but the agency gives no written response and takes no follow-up step. Which assessment matches the class discussion?", "options": ["It is meaningful engagement, because residents were able to speak at a public meeting.", "It is not meaningful engagement, because there was no agency response, follow-up, or accountability.", "It is meaningful engagement, because any public meeting satisfies Executive Order 12898.", "It is not meaningful engagement, because listening sessions are banned under 40 CFR Part 25."], "answer": 1, "explain": "청취 회의에서 의견을 듣기만 하고 응답과 후속 조치가 없으면 실질적 참여에 해당하지 않는다. 발언 기회가 있어도 결정에 영향을 미치지 못하면 참여로 인정되지 않는다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 1절 가항"}, {"id": "w7-03", "course": "ehs544", "week": "7w", "topic": "Public relations vs. participation", "importance": 3, "why": "EPA 정의 슬라이드의 핵심 구별", "type": "tf", "q": "Under EPA's framework, public relations (public information) and public participation are the same activity, because both mean giving information to the public.", "options": ["True", "False"], "answer": 1, "explain": "홍보는 공중에게 알리는 일이고 참여는 공중의 의견을 받아 결정에 반영하는 일이므로 두 개념은 같지 않다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 다항ㆍ라항"}, {"id": "w7-04", "course": "ehs544", "week": "7w", "topic": "Legal force of EPA's EJ definition", "importance": 2, "why": "교수가 법적 지위를 짚음", "type": "mc", "q": "EPA's definition of environmental justice appears only on its website and has never been put in a rule or guidance. What follows from this?", "options": ["It is binding on all federal agencies as a regulation.", "It is binding only on states that run authorized permit programs.", "It has no binding authority.", "It became binding when Executive Order 12898 was signed."], "answer": 2, "explain": "EPA의 정의는 웹사이트에만 게시되어 법적 구속력이 없다. 행정명령이 환경정의를 요구한다는 사실과 정의 문구에 효력이 있다는 판단은 별개이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-05", "course": "ehs544", "week": "7w", "topic": "EO 14096 vs. EPA definition", "importance": 3, "why": "행정명령 흐름의 출발점", "type": "mc", "q": "Compared with EPA's definition of environmental justice, what does Executive Order 14096 add?", "options": ["English proficiency as a newly protected category beside race, color, and income", "Tribal affiliation and disability, plus protection from climate risks and cumulative impacts", "Only a change in wording from \"fair\" to \"equal\" treatment, with no new groups named", "The removal of the meaningful participation element, keeping only fair treatment"], "answer": 1, "explain": "행정명령 14096호는 부족 소속, 장애, 기후 위험, 누적 영향을 정의에 추가하였다. 영어 능력은 추가된 보호 대상에 포함되지 않는다.", "concept": "c_eo", "source": "113_7w_meaningful-community-engagement, 2절 나항"}, {"id": "w7-08", "course": "ehs544", "week": "7w", "topic": "Part 25/124 are binding", "importance": 3, "why": "Grab and Go 표지 항목", "type": "tf", "q": "The statement of basis and the response to comments required in permit proceedings under 40 CFR Parts 25 and 124 are binding regulatory requirements, even if agencies may often ignore them now.", "options": ["True", "False"], "answer": 0, "explain": "Part 25와 124의 요건은 기관이 지키지 않는 일이 많아도 법적 구속력이 있는 규제 요건이다. 지침이나 권고와 구별되는 점이다.", "concept": "c_part", "source": "113_7w_meaningful-community-engagement, 2절 라항"}, {"id": "w7-09", "course": "ehs544", "week": "7w", "topic": "CERCLA liability and community engagement", "importance": 3, "why": "교수가 상생이라고 설명", "type": "mc", "q": "Why did the class describe community engagement at Superfund sites as a win-win even under the current administration?", "options": ["Executive Order 14096 still requires agencies to run engagement at every Superfund site", "CERCLA's strict, joint and several liability gives responsible private parties a reason to cooperate", "NEJAC's guidance is legally binding on the parties responsible for each contaminated site", "Congress created a mandatory community engagement office for each Superfund site"], "answer": 1, "explain": "CERCLA의 엄격책임과 연대책임은 오염을 일으킨 민간 책임자가 정화에 협력할 이유가 된다. 행정명령 14096호는 2025년에 철회되어 근거로 삼을 수 없다.", "concept": "c_cercla", "source": "113_7w_meaningful-community-engagement, 4절 다항"}, {"id": "w8-01", "course": "ehs544", "week": "8w", "topic": "Executive order trajectory", "importance": 3, "why": "슬라이드 p.4 핵심 도표", "type": "mc", "q": "Which statement correctly describes the federal executive actions on disproportionate impact?", "options": ["EO 14096 (2023) revoked EO 12898 (1994), and EO 14148 later reinstated it.", "EO 12898 (1994) came first; EO 14096 (2023) followed; in 2025 EO 14148 rescinded 14096 and EO 14173 rescinded 12898.", "EO 12898 (1994) came first; in 2025 EO 14173 rescinded 14096 and EO 14148 rescinded 12898.", "EO 14096 (2023) came first and EO 12898 (1994) followed as an amendment."], "answer": 1, "explain": "순서는 1994년 12898호, 2023년 14096호이며, 2025년에 14148호가 14096호를, 14173호가 12898호를 철회하였다. 두 철회 명령의 대상을 서로 바꾸면 오답이 된다.", "concept": "c_eo", "source": "114_8w_engagement-and-evidence-based-decision-making, 2절 가항"}, {"id": "w8-02", "course": "ehs544", "week": "8w", "topic": "Hidden but not Gone", "importance": 3, "why": "8회차 제목 슬라이드 개념", "type": "tf", "q": "When Executive Orders 12898 and 14096 were revoked, the disproportionate impact factors lost their value as evidence for decision-making.", "options": ["True", "False"], "answer": 1, "explain": "행정명령이 철회되어도 불균형 영향 요인은 의사결정의 증거로 계속 활용할 수 있다. 숨겨졌으나 사라지지 않았다는 것이 이 슬라이드의 요지이다.", "concept": "c_hbg", "source": "114_8w, 도입부 및 2절 다항"}, {"id": "w8-03", "course": "ehs544", "week": "8w", "topic": "Cross-cutting factor", "importance": 3, "why": "슬라이드 p.7 표시 항목", "type": "mc", "q": "Which factor on the \"Hidden but not Gone\" slide acts across all six disproportionate impact factors?", "options": ["Cumulative impacts", "Physical infrastructure", "Psycho-social stressors", "Unique exposure pathways"], "answer": 2, "explain": "심리사회적 스트레스 요인은 여섯 요인 모두에 작용한다. 나머지 셋은 여섯 요인에 속하는 개별 항목이다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-04", "course": "ehs544", "week": "8w", "topic": "Six disproportionate impact factors", "importance": 3, "why": "6요인 목록은 출제 1순위", "type": "mc", "q": "Which of the following is NOT one of the six disproportionate impact factors on the class 8 slide?", "options": ["Proximity and exposure", "Susceptible populations", "Participating in decision making", "Municipal property tax base"], "answer": 3, "explain": "여섯 요인은 근접성과 노출, 누적 영향, 물리적 기반시설, 취약 인구, 고유한 노출 경로, 의사결정 참여이다. 지방세 기반은 이 목록에 없다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-05", "course": "ehs544", "week": "8w", "topic": "EPA 2021 social vulnerability report", "importance": 3, "why": "조별 과제의 옥외 노동자 근거", "type": "mc", "q": "In EPA's 2021 report on climate change and social vulnerability, at 2°C of global warming, Hispanic and Latino individuals are 43% more likely to live in areas where which impact is projected to be greatest?", "options": ["Loss of labor hours in weather-exposed work", "New childhood asthma diagnoses", "Deaths from extreme temperature", "Property damage from inland flooding"], "answer": 0, "explain": "보고서에 따르면 히스패닉과 라틴계는 2°C 상승 시 노동시간이 가장 크게 줄어드는 지역에 거주할 가능성이 43% 더 높다. 천식과 극한 기온 사망 수치는 다른 영향 항목에서 나온다.", "concept": "c_epa21", "source": "114_8w, 2절 라항"}, {"id": "w8-06", "course": "ehs544", "week": "8w", "topic": "Lived experience as evidence", "importance": 3, "why": "8회차 p.10-11 원칙", "type": "mc", "q": "Which statement best matches how class 8 treats lived experience expertise and Indigenous knowledge?", "options": ["They are used only when no scientific data exist.", "They are replaced by screening tool scores once a tool is available.", "They count only if a recognized institution has documented them.", "They are forms of expertise that count as evidence alongside academic knowledge."], "answer": 3, "explain": "생활경험과 원주민 지식은 학문적 지식과 함께 의사결정의 근거가 된다. 선별 도구 점수는 이를 대체하지 못한다.", "concept": "c_lived", "source": "114_8w, 2절 마항ㆍ바항"}, {"id": "w8-07", "course": "ehs544", "week": "8w", "topic": "40 CFR Part 25 vs. Part 124", "importance": 3, "why": "슬라이드에 Grab and Go 표지", "type": "mc", "q": "Which statement correctly describes the relationship between 40 CFR Part 25 and Part 124?", "options": ["Part 25 sets EPA's permit decision procedures; Part 124 sets the general framework for public participation.", "Part 25 applies only to the Clean Air Act; Part 124 applies only to the Clean Water Act.", "Part 25 is the framework for why and how the public participates; Part 124 governs EPA's individual permit decisions.", "Part 25 governs state agencies only; Part 124 governs EPA staff only."], "answer": 2, "explain": "Part 25는 공중이 왜 어떻게 참여하는지에 관한 기본 체계이고, Part 124는 EPA의 개별 허가 결정 절차이다. 두 부의 역할을 반대로 서술한 설명은 오답이다.", "concept": "c_part", "source": "114_8w, 3절 라항ㆍ마항"}, {"id": "w8-08", "course": "ehs544", "week": "8w", "topic": "Responsiveness Summary (§25.8)", "importance": 3, "why": "청취 회의와 참여를 가르는 장치", "type": "mc", "q": "Under 40 CFR § 25.8, what must a Responsiveness Summary include?", "options": ["A count of the comments received, with the names and affiliations of every commenter", "A certification by the agency that every comment was read and considered in good faith", "The agency's final cost-benefit analysis comparing the proposed action with all alternatives", "The activities held, the significant public comments, and the agency's specific responses or reasons for rejection"], "answer": 3, "explain": "응답 요약서는 수행한 활동, 중요한 의견, 의견에 대한 기관의 구체적 응답이나 거부 이유를 기재한다. 의견 수나 참석자 명단만으로는 기관의 응답으로 인정되지 않는다.", "concept": "c_part", "source": "114_8w, 3절 라항 (5)"}, {"id": "w8-09", "course": "ehs544", "week": "8w", "topic": "Petition for review (Part 124)", "importance": 3, "why": "지역사회가 쓰는 실제 수단", "type": "mc", "q": "Under 40 CFR Part 124, who may file a petition for review of a final RCRA, UIC, NPDES, or PSD permit decision?", "options": ["Any resident of the state, whether or not they took part earlier", "Only the permit applicant", "Anyone who read the statement of basis", "A person who filed comments on the draft permit or took part in the public hearing"], "answer": 3, "explain": "허가 초안에 의견을 제출하였거나 공청회에 참여한 사람이 심사 청구를 할 수 있다. 의견 기간에 쟁점을 모두 제출하지 않으면 나중에 다투기 어렵다.", "concept": "c_part", "source": "114_8w, 3절 마항 (2)"}, {"id": "w8-11", "course": "ehs544", "week": "8w", "topic": "First state to define EJ communities", "importance": 3, "why": "8회차 중심 사례", "type": "mc", "q": "According to the class 8 discussion, Connecticut was the first state to do what?", "options": ["Adopt an environmental equity policy", "Ban new permits in environmental justice communities", "Define environmental justice communities in a statute", "Create a state environmental protection agency"], "answer": 2, "explain": "코네티컷은 환경정의 지역사회를 법률로 정의한 첫 번째 주이다. 1993년의 환경 형평 정책은 법률이 아니므로 첫 입법으로 볼 수 없다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)ㆍ(4)"}, {"id": "w8-12", "course": "ehs544", "week": "8w", "topic": "Public Act 20-6 notice rules", "importance": 3, "why": "교수가 요건을 구체적으로 설명", "type": "mc", "q": "Which requirement applies to a permit applicant under Connecticut's Public Act 20-6 (effective November 1, 2020)?", "options": ["Hold the public meeting in the state capital within 30 days of filing the application", "Obtain the municipality's written consent to the application before it is filed with the state", "Give notice in English and in any language used by 15% or more of residents within a half mile", "Publish a single notice in the legal-notice section of a newspaper with local circulation"], "answer": 2, "explain": "공고 대상 언어는 영어와 반경 0.5마일 안 주민의 15% 이상이 사용하는 언어이다. 법정 공고란에 한 번 게재하는 방식은 하트포드에서 주민이 공고를 놓친 원인이었다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-13", "course": "ehs544", "week": "8w", "topic": "Law vs. real protection", "importance": 3, "why": "교수가 반복해 짚은 사례", "type": "mc", "q": "A New Haven tank terminal signed a community benefit agreement worth $49,000 that allowed its VOC emissions to triple. What did the class use this case to show?", "options": ["Community benefit agreements are prohibited under Connecticut law.", "Benefit amounts are set by statute and cannot be negotiated.", "The state screening tool underestimates pollution burdens.", "Having a law does not by itself guarantee meaningful protection."], "answer": 3, "explain": "법의 요건을 지킨 협약도 배출 증가를 허용하였다. 법이 있어도 실질적 보호가 보장되지 않는다는 사례이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-14", "course": "ehs544", "week": "8w", "topic": "Title VI leverage in Hartford", "importance": 3, "why": "Pestana 발표의 핵심 수단", "type": "mc", "q": "According to Edith Pestana, why did the federal civil rights (Title VI) investigation in Hartford change the state agency's behavior?", "options": ["A state court issued an injunction closing the landfill.", "EPA completed a new rulemaking on landfill odors.", "The city council voted to withdraw the permit.", "An agency found to discriminate could lose federal funding."], "answer": 3, "explain": "주 기관에 압력이 된 것은 차별한 기관이 연방 자금을 잃을 수 있다는 점이다. 법원 명령이나 시의회의 철회는 이 사례의 설명에 해당하지 않는다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)"}, {"id": "w8-15", "course": "ehs544", "week": "8w", "topic": "CT EJ screening tool", "importance": 2, "why": "근거 방법의 한계", "type": "mc", "q": "What does Connecticut's environmental justice screening tool do?", "options": ["It models each resident's actual exposure dose and personal health risk.", "It automatically approves or denies permit applications based on the score.", "It ranks census tracts by indicator on a 1-to-10 scale, without modeling actual exposure.", "It publishes the names and addresses of residents who live near facilities."], "answer": 2, "explain": "선별 도구는 구역별 지표를 1에서 10으로 순위화할 뿐 실제 노출량을 모형화하지 않는다. 허가 승인의 결정 주체는 기관이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (5)"}, {"id": "w9-01", "course": "ehs544", "week": "9w", "topic": "Reversing the brownfield model", "importance": 3, "why": "9회차 통합 사례의 핵심 주장", "type": "mc", "q": "According to Suzi Ruhl, how does Mount Growmore reverse the traditional brownfield model?", "options": ["EPA designs the project first and then asks the community to approve it.", "A private developer proposes the plan and the city grants the permits.", "Government resources and authority are applied to the community's own vision.", "The state legislature decides the reuse and funds it through a bond."], "answer": 2, "explain": "전통 모델은 지역사회가 외부의 설계에 참여하는 구조이다. Mount Growmore는 정부의 자원과 권한을 지역사회의 비전에 적용한다.", "concept": "c_flip", "source": "115_9w_mount-growmore-and-resilience, 7절"}, {"id": "w9-02", "course": "ehs544", "week": "9w", "topic": "Two framings of TBLJ", "importance": 3, "why": "법 문언과 Elevate 설명의 구별", "type": "mc", "q": "In the Connecticut special act, Triple Bottom Line Justice (TBLJ) is defined as the integration of which three elements?", "options": ["Health justice, environmental justice, and economic justice", "Evidence-based practice, rule of law, and meaningful community engagement", "Assessment, vision, and recommendations", "Law, science, and finance"], "answer": 1, "explain": "특별법은 TBLJ를 근거 기반 실천, 법치, 지역사회 참여의 통합으로 정의한다. 건강, 환경, 경제 정의는 Elevate가 설명한 목표이다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 1절 가항; 115_9w, 3절 가항"}, {"id": "w9-03", "course": "ehs544", "week": "9w", "topic": "B2H core method", "importance": 3, "why": "9회차 방법론 · 특별법 정의", "type": "mc", "q": "What are the two core elements of the Brownfields to Healthfields (B2H) method described in the class 9 podcast?", "options": ["A community-led diagnosis of what is wrong and the community's vision of a healthy community", "An EPA risk ranking of the site and a cost-benefit analysis of reuse options", "A liability allocation among polluters and a numeric cleanup standard", "A state grant application and a signed agreement with a developer"], "answer": 0, "explain": "B2H는 지역사회가 주도하는 진단과 건강한 지역사회에 대한 비전으로 구성된다. EPA 위험 순위와 같은 외부 기준에서 출발하지 않는다.", "concept": "c_flip", "source": "115_9w, 3절 다항; 104_2w, 1절 나항"}, {"id": "w9-04", "course": "ehs544", "week": "9w", "topic": "CJET", "importance": 3, "why": "출연자가 새 비법으로 강조", "type": "mc", "q": "What is the main function of Civic Justice Engagement Teaching (CJET)?", "options": ["It gives residents grants that allow them to buy contaminated land from private owners.", "It produces a cumulative screening score for each census tract and posts it online.", "It gives burdened communities a rule-of-law framework to use the laws and resources meant for them.", "It is a court-approved settlement process that runs between polluters and residents."], "answer": 2, "explain": "CJET는 부담이 큰 지역사회가 자신을 위한 법과 자원을 활용하도록 법치의 체계를 교육한다. 점수 산출이나 토지 구입 지원 기능은 없다.", "concept": "c_flip", "source": "115_9w, 3절 라항"}, {"id": "w9-05", "course": "ehs544", "week": "9w", "topic": "Breaking Bread", "importance": 2, "why": "협력 설계에 참고", "type": "mc", "q": "What is the purpose of the \"Breaking Bread\" process used by Elevate and the East End NRZ?", "options": ["A one-time public hearing required by 40 CFR Part 25 before any permit is issued", "A mediation procedure for disputes that begins after a lawsuit has been filed in court", "An annual awards event that recognizes community leaders and their long-term partners", "A weekly check-in among residents, governments, business, funders and academics to keep momentum"], "answer": 3, "explain": "Breaking Bread는 여러 부문이 매주 확인 회의를 열어 추진력을 유지하는 대화 과정이다. 법이 요구하는 공청회와 다르다.", "concept": "c_flip", "source": "115_9w, 3절 마항"}, {"id": "w9-08", "course": "ehs544", "week": "9w", "topic": "Role of local government", "importance": 3, "why": "토론 질문 3", "type": "mc", "q": "How did Bill Coleman describe the City of Bridgeport's role in Mount Growmore?", "options": ["To lead the vision for the campus and choose its main uses", "To hold title to the land and design the buildings on it", "To give technical support and resources while the community sets the agenda", "To regulate EPA's cleanup schedule and review its site reports"], "answer": 2, "explain": "시는 기술적 지원과 자원을 제공하고 의제는 지역사회가 정하였다. 비전을 주도하는 일은 시의 역할이 아니었다.", "concept": "c_roles", "source": "115_9w, 5절 가항"}, {"id": "w9-09", "course": "ehs544", "week": "9w", "topic": "Start of the public response", "importance": 3, "why": "토론 질문 3의 결정 지점", "type": "mc", "q": "Which action marked the start of the formal public response at the Mount Trashmore site?", "options": ["EPA completed a full site assessment, including a review of hydrology.", "Congress amended RCRA to cover construction debris sites such as this one.", "The city and state acquired the site from the private owners responsible for the contamination.", "The legislature passed the TBLJ special act and funded a demonstration program."], "answer": 2, "explain": "시와 주가 오염을 일으킨 민간 소유자에게서 부지를 취득한 것이 공식 대응의 출발이다. 특별법은 훨씬 뒤인 2026년에 제정되었다.", "concept": "c_roles", "source": "115_9w, 1절 나항; 4절 라항"}, {"id": "w9-10", "course": "ehs544", "week": "9w", "topic": "EPA Region 1 contributions", "importance": 3, "why": "토론 질문 1과 3", "type": "mc", "q": "Which action by EPA Region 1 most directly built community capacity at Mount Growmore?", "options": ["Writing plain-language summaries and cheat sheets together with the NRZ", "Designing and constructing the campus buildings on the site", "Lobbying the state legislature for the TBLJ bill", "Taking over the operation of the East End market"], "answer": 0, "explain": "EPA는 NRZ와 함께 쉬운 말의 자료와 요약표를 작성하여 지역사회의 역량을 높였다. 건물 건설과 시장 운영은 EPA의 업무가 아니다.", "concept": "c_roles", "source": "115_9w, 4절 라항"}, {"id": "w9-11", "course": "ehs544", "week": "9w", "topic": "Noise example (lived experience)", "importance": 3, "why": "생활경험 원칙의 사례", "type": "mc", "q": "At an NRZ meeting, outsiders assumed \"noise pollution\" meant interstate highway traffic, but residents meant gunshots. What did Suzi Ruhl draw from this?", "options": ["Community concerns should be translated into the experts' definitions before they are recorded.", "Noise should be excluded from environmental analysis.", "Trust and respect come from responding to the community's own definition of its concerns, with learning running both ways.", "Traffic noise data are more reliable than residents' reports."], "answer": 2, "explain": "지역사회가 스스로 정의한 문제에 대응해야 신뢰를 얻고 양방향으로 학습할 수 있다. 전문가의 분석 체계에 맞추어 먼저 번역하는 방식은 이와 반대이다.", "concept": "c_lived", "source": "115_9w, 8절 나항"}, {"id": "w9-12", "course": "ehs544", "week": "9w", "topic": "Campus status", "importance": 2, "why": "과제에서 틀리기 쉬운 사실", "type": "tf", "q": "As of the class 9 podcast, the Mount Growmore hydroponic center and wellness center have been built and are operating.", "options": ["True", "False"], "answer": 1, "explain": "정화는 완료되었으나 수경 재배 센터와 웰니스 센터는 아직 건립되지 않았다. 사례를 인용할 때 완료된 사실과 계획 단계를 구별하여야 한다.", "concept": "c_roles", "source": "115_9w, 6절ㆍ7절"}, {"id": "c-01", "course": "ehs544", "week": "6w", "topic": "CERCLA identification", "importance": 2, "why": "중간시험 복습 문항", "type": "mc", "q": "A review item describes an abandoned hazardous waste site with no responsible owner, where arrangers and transporters of hazardous substances and current and former facility owners can be held liable for cleanup costs. Which law does it describe?", "options": ["Resource Conservation and Recovery Act (RCRA)", "Toxic Substances Control Act (TSCA)", "Emergency Planning and Community Right-to-Know Act (EPCRA)", "CERCLA (Superfund)"], "answer": 3, "explain": "통제되지 않은 폐기 부지의 정화 책임은 CERCLA가 규정한다. RCRA는 현재 진행 중인 폐기물 관리를 규율한다.", "concept": "c_cercla", "source": "112_6w_midterm-review, 2절 나항"}, {"id": "c-02", "course": "ehs544", "week": "6w", "topic": "Part 124 permit coverage", "importance": 2, "why": "6회차 허가와 8회차 참여를 연결", "type": "mc", "q": "Part 124 sets decision-making procedures for which of the following sets of EPA permits?", "options": ["RCRA, UIC, PSD, and NPDES permits", "NEPA categorical exclusion determinations only", "FOIA responses and Privacy Act notices", "Title VI complaint determinations"], "answer": 0, "explain": "Part 124는 RCRA, UIC, PSD, NPDES 허가의 결정 절차를 규정한다. 나머지 선택지는 허가에 해당하지 않는다.", "concept": "c_part", "source": "114_8w, 3절 마항; 112_6w, 3절"}, {"id": "c-03", "course": "ehs544", "week": "2w", "topic": "Final special act duties", "importance": 3, "why": "원안과 최종 법의 차이", "type": "mc", "q": "What does the final Special Act No. 26-13 (from HB 5241) require?", "options": ["A TBLJ demonstration program in every city with over 148,000 residents by January 1, 2027", "The Commissioner of Public Health convenes a working group on a B2H-related TBLJ program and reports by July 1, 2027", "A 20% ICD-10 Z code usage rate in insurance claims by 2030, with annual progress reports", "An annual cost-benefit audit of every brownfield grant the state has awarded"], "answer": 1, "explain": "최종 특별법은 공중보건국장이 소집하는 작업반과 2027년 7월 1일까지 제출할 보고서만 규정한다. 시범 사업과 Z 코드 20% 사용 목표는 원안에만 있었다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 2절 가항ㆍ나항"}, {"id": "h-01", "course": "hpm570", "week": "6w", "topic": "Moving the cutoff", "importance": 3, "why": "시험 범위 · 6주차 핵심", "type": "mc", "q": "In the CAGE example, the positivity cutoff is lowered from 4 points to 2 points. Which change is correct?", "options": ["Sensitivity rises from 12.5% to 83.3%; specificity falls from 99.6% to 91.9%", "Sensitivity and specificity both rise", "Sensitivity falls and specificity rises", "Neither value changes because the test is the same"], "answer": 0, "explain": "기준선을 낮추면 양성이 늘어 민감도는 오르고 특이도는 내린다. 같은 검사라도 기준선이 바뀌면 두 값이 함께 바뀐다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 CAGE"}, {"id": "h-02", "course": "hpm570", "week": "6w", "topic": "Sensitivity calculation", "importance": 3, "why": "계산 단골 · 6주차", "type": "mc", "q": "CAGE cutoff 4: 6 true positives, 3 false positives, 42 false negatives, 678 true negatives. What is the sensitivity?", "options": ["6/48 = 12.5%", "6/9 = 66.7%", "678/681 = 99.6%", "678/720 = 94.2%"], "answer": 0, "explain": "민감도는 질병이 있는 48명 가운데 양성인 6명이다. 66.7%는 양성 예측도, 99.6%는 특이도이다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 나항"}, {"id": "h-03", "course": "hpm570", "week": "6w", "topic": "PPV and prevalence", "importance": 2, "why": "예측도와 유병률 · 6주차", "type": "mc", "q": "As the CAGE cutoff is lowered, the positive predictive value falls (66.7% at cutoff 4, 31.3% at cutoff 1). What explains the large fall?", "options": ["Most people in the sample do not have the disease, so new positives are mostly false positives", "The test becomes less sensitive", "The disease becomes rarer as the cutoff falls", "Specificity rises faster than sensitivity"], "answer": 0, "explain": "표본의 유병률이 낮아 질병이 없는 사람이 많으므로 새로 양성이 된 사람 가운데 거짓양성이 많다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 라항"}, {"id": "h-04", "course": "hpm570", "week": "6w", "topic": "Slope of the ROC curve", "importance": 3, "why": "ROC 해석 · 6주차", "type": "mc", "q": "What does the slope of the ROC curve at a given point equal?", "options": ["The likelihood ratio at that cutoff", "The prevalence of the disease", "The positive predictive value", "The area under the curve"], "answer": 0, "explain": "곡선 위 한 점의 기울기는 그 점의 우도비와 같다. 가파른 구간은 우도비가 큰 결과이다.", "concept": "h_roc", "source": "106 Diagnostic Tests, 4절 마항"}, {"id": "h-05b", "course": "hpm570", "week": "6w", "topic": "ROC area and the best cutoff", "importance": 3, "why": "수업 강조 · ROC 한계", "type": "tf", "q": "A test whose ROC area is 0.9 has its optimal cutoff at the top-left corner of the curve.", "options": ["True", "False"], "answer": 1, "explain": "면적은 두 분포의 분리 정도만 요약하고 최적점은 유병률과 결과의 가치에 따라 달라진다. 왼쪽 위 모서리 관행은 이 둘을 무시한다.", "concept": "h_roc", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-05", "course": "hpm570", "week": "7w", "topic": "Terms of the cutoff formula", "importance": 3, "why": "시험 범위 · 7주차 핵심", "type": "mc", "q": "In the positivity-cutoff formula, what does the term p(D−)/p(D+) represent?", "options": ["Prevalence (the inverse of the prior odds)", "Test performance", "The relative size of decision errors", "The area under the ROC curve"], "answer": 0, "explain": "이 항은 사전 오즈의 역수로 유병률을 표시한다. 검사 성능은 우도비로, 오류의 크기는 비용비로 반영한다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 3절"}, {"id": "h-06", "course": "hpm570", "week": "7w", "topic": "Prevalence and the LR threshold", "importance": 3, "why": "공식 해석 · 7주차", "type": "mc", "q": "Everything else equal, prevalence rises. What happens to the likelihood ratio a result needs to be called positive?", "options": ["It falls", "It rises", "It stays the same", "It becomes exactly 1"], "answer": 0, "explain": "유병률이 높으면 사전 오즈의 역수가 작아져 양성으로 지정하는 기준이 낮아진다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 사항"}, {"id": "h-07", "course": "hpm570", "week": "7w", "topic": "Cost ratio calculation", "importance": 3, "why": "계산 · 7주차", "type": "mc", "q": "Costs: TN $0, TP $700, FP $100, FN $1,000. What is the cost ratio (CTN − CFP) / (CTP − CFN)?", "options": ["1/3", "3", "−1/3", "7/10"], "answer": 0, "explain": "(0 − 100) / (700 − 1,000)에서 분자와 분모가 모두 음수이므로 1/3이다. 부호를 확인하는 것이 핵심이다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 바항"}, {"id": "h-08", "course": "hpm570", "week": "7w", "topic": "Is LR = 1 the best cutoff?", "importance": 3, "why": "수업 강조 · 7주차", "type": "tf", "q": "The optimal cutoff is always the result whose likelihood ratio equals 1.", "options": ["True", "False"], "answer": 1, "explain": "최적 절단점은 사전 오즈의 역수와 비용비의 곱으로 정해지므로 그 곱이 1과 다르면 우도비 1과 다른 곳에 있다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-09", "course": "hpm570", "week": "7w", "topic": "Classify a result", "importance": 3, "why": "계산 · 6~7주차", "type": "mc", "q": "Ferritin example: the threshold LR is 0.5882. How should the result 45-100 (LR 0.4575) and the result 18-45 (LR 3.12) be designated?", "options": ["45-100 negative; 18-45 positive", "Both positive", "Both negative", "45-100 positive; 18-45 negative"], "answer": 0, "explain": "우도비가 0.5882보다 큰 결과만 양성이다. 기대비용으로 구한 결과와 같다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 아항"}, {"id": "h-10", "course": "hpm570", "week": "7w", "topic": "Same test, different cutoff", "importance": 2, "why": "수업 강조 · 7주차", "type": "mc", "q": "Why can the same test have a different optimal cutoff in two populations?", "options": ["Prevalence and the value of the decisions differ, even if test performance is the same", "The test has a different ROC area in each population by definition", "Sensitivity is not defined across populations", "The likelihood ratio of a result changes with prevalence"], "answer": 0, "explain": "검사 성능이 같아도 유병률과 비용비가 다르면 오른쪽 값이 변한다. 우도비 순위는 유병률과 무관하다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-11", "course": "hpm570", "week": "6w", "topic": "Which prevalence goes in Bayes?", "importance": 3, "why": "시험 출제 유형", "type": "mc", "q": "A study oversamples diseased patients (67 with, 65 without disease). The population prevalence is 12.5%. Which value is used as the prior probability?", "options": ["12.5%", "50.8%", "67/65", "The average of 12.5% and 50.8%"], "answer": 0, "explain": "표본의 비율은 표집 설계가 정한 숫자이다. 표본에서는 질병 상태별 결과 분포만 얻는다.", "concept": "h_prev", "source": "106 Diagnostic Tests, 6절 나항"}, {"id": "h-12", "course": "hpm570", "week": "6w", "topic": "What the oversampled table gives", "importance": 3, "why": "2025 중간시험 2 복습 · 문제 1", "type": "mc", "q": "A table has 146 children with acute lead poisoning (ALP) and 146 without; population prevalence is 10%. What can the table legitimately provide?", "options": ["The distribution of blood lead levels within each disease group", "The prevalence of ALP", "The posterior probability of ALP directly", "The treatment threshold"], "answer": 0, "explain": "표는 질병 상태별 혈중 납 분포를 제공한다. 사후확률은 이 분포에 10% 유병률을 결합해야 나온다.", "concept": "h_prev", "source": "903 Midterm 2 review, Q1 / lecrec review session"}, {"id": "h-13", "course": "hpm570", "week": "6w", "topic": "Prevalence versus threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, prevalence falls from 10% to 5%. What changes?", "options": ["Posterior probabilities change; the 9.71% treatment threshold does not", "The treatment threshold falls", "The harm probabilities change", "Nothing changes"], "answer": 0, "explain": "유병률은 사후확률을 변화시킨다. 기준선은 치료의 이익과 해악에서 나오므로 그대로이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part B"}, {"id": "h-14", "course": "hpm570", "week": "6w", "topic": "Toxicity and the threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, EDTA toxicity falls from 5% to 2.5%. What happens to the treatment threshold?", "options": ["It falls to about 4.93%", "It stays at 9.71%", "It rises above 9.71%", "The posterior probabilities change but the threshold does not"], "answer": 0, "explain": "독성이 줄면 치료의 해악이 작아져 더 낮은 사후확률에서도 치료가 유리하다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part C"}, {"id": "h-15", "course": "hpm570", "week": "6w", "topic": "Threshold by expected harm", "importance": 3, "why": "계산 · 2025 시험", "type": "mc", "q": "Harm with EDTA: 33.5% if ALP, 5% if not. Harm without EDTA: 80% if ALP, 0% if not. At what posterior probability P of ALP are the two options equal?", "options": ["About 9.71%", "About 33.5%", "About 5%", "About 51.5%"], "answer": 0, "explain": "0.05 + 0.285P = 0.8P에서 P = 0.05/0.515로 약 9.71%이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 4"}, {"id": "h-16", "course": "hpm570", "week": "6w", "topic": "Combining two harms", "importance": 2, "why": "2025 시험 · 계산 함정", "type": "mc", "q": "A child with ALP given EDTA has a 30% risk of lead complications and a 5% risk of toxicity. Why is the chance of at least one harm not 35%?", "options": ["The same child could have both, so use 1 − 0.70 × 0.95 = 33.5%", "The risks are mutually exclusive", "Toxicity only applies to children without ALP", "Rounding error in the exam"], "answer": 0, "explain": "두 해악이 한 아이에게 함께 생길 수 있으므로 둘 다 없을 확률을 빼서 계산한다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 3"}, {"id": "h-17", "course": "hpm570", "week": "7w", "topic": "Appendectomy: which factor lowers the cutoff", "importance": 3, "why": "2025 시험 · 문제 2", "type": "mc", "q": "Older adults: appendicitis is rarer, but missing it is far deadlier. Which factor alone favors a LOWER score cutoff (more surgeries)?", "options": ["Higher mortality when appendicitis is missed (false negative)", "Lower prevalence of appendicitis", "Higher mortality from unnecessary surgery (false positive)", "Higher mortality from surgery in true cases"], "answer": 0, "explain": "놓친 환자의 사망률이 높으면 수술 기준을 낮추는 쪽이 유리하다. 나머지 세 요인은 기준을 높인다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2 Step 2"}, {"id": "h-18", "course": "hpm570", "week": "7w", "topic": "Probability threshold versus score cutoff", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "The posterior thresholds are 5.15% (younger) and 6.1% (older adults). Why can the question not give an actual score cutoff?", "options": ["Age-specific prevalence and the likelihood ratios of the scores are not given", "The thresholds are too close to each other", "Mortality rates cannot be converted to probabilities", "The score cutoff is the same as the threshold"], "answer": 0, "explain": "확률 기준선을 점수로 옮기려면 연령별 유병률과 점수의 우도비가 필요하다. 빠진 자료를 밝히는 것이 정답에 포함된다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2"}, {"id": "h-19", "course": "hpm570", "week": "7w", "topic": "What EVPI is", "importance": 3, "why": "7주차 슬라이드 · 정보의 가치", "type": "mc", "q": "What is the expected value of perfect information (EVPI)?", "options": ["An upper bound on what any test or indicator can add", "The value of the best available test", "The cost of a perfect test", "The expected harm of using no information"], "answer": 0, "explain": "완전정보 전략에서 정보 없는 최선을 뺀 값이며 어떤 검사도 이를 넘지 못한다.", "concept": "h_evpi", "source": "107 Positivity Cutoff, 5절"}, {"id": "h-20", "course": "hpm570", "week": "6w", "topic": "When a test has value", "importance": 3, "why": "6주차 요약 · 계산 연결", "type": "mc", "q": "When does a diagnostic test have value for a decision?", "options": ["When the best action differs depending on the result", "When its sensitivity is above 90%", "When its ROC area is above 0.5", "When it costs less than treatment"], "answer": 0, "explain": "모든 결과에서 같은 행동이 최적이면 검사 결과를 알아도 최선의 결정이 달라지지 않으므로 가치가 0이다.", "concept": "h_evpi", "source": "106 Diagnostic Tests, 요약과 6절"}, {"id": "h-21", "course": "hpm570", "week": "8w", "topic": "Which analysis uses QALYs", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "Which type of economic evaluation expresses outcomes as quality-adjusted life-years?", "options": ["Cost-utility analysis", "Cost-effectiveness analysis in natural units", "Cost-benefit analysis", "Cost-consequences analysis"], "answer": 0, "explain": "효용으로 보정한 QALY를 결과로 쓰는 분석이 비용효용분석이다.", "concept": "h_types", "source": "212 Basic Types, 9절"}, {"id": "h-22", "course": "hpm570", "week": "8w", "topic": "Which analysis uses money", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "In which analysis are both costs and consequences measured in monetary units?", "options": ["Cost-benefit analysis", "Cost-effectiveness analysis", "Cost-utility analysis", "Cost-minimization analysis"], "answer": 0, "explain": "비용과 결과를 모두 화폐로 재서 순편익이나 편익 대 비용의 비로 적는 것이 비용편익분석이다.", "concept": "h_types", "source": "212 Basic Types, 10절"}, {"id": "h-23", "course": "hpm570", "week": "8w", "topic": "Full versus partial evaluation", "importance": 2, "why": "8주차 읽을거리", "type": "tf", "q": "A study that reports the cost and outcomes of one program, without comparing it to an alternative, is a full economic evaluation.", "options": ["True", "False"], "answer": 1, "explain": "완전한 경제성 평가는 둘 이상의 대안을 비교하고 비용과 결과를 함께 본다. 하나만 적은 연구는 부분 평가이다.", "concept": "h_types", "source": "212 Basic Types, 6절"}, {"id": "h-24", "course": "hpm570", "week": "9w", "topic": "The colleague's error", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Biannual screening costs $25,000 for 8 QALYs; annual costs $50,000 for 9 QALYs. A colleague picks biannual for its lower average cost per QALY. What is the correct reading?", "options": ["The ICER is $25,000 per QALY; the choice depends on willingness to pay", "Biannual is always better because its average ratio is lower", "Annual is better because it has more QALYs", "Annual is dominated by biannual"], "answer": 0, "explain": "평균비는 각 사업을 따로 본 값이다. 추가 1 QALY에 추가 $25,000이 들며, 지불의사가 이보다 크면 매년 검진이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part A"}, {"id": "h-25", "course": "hpm570", "week": "9w", "topic": "Incremental NMB", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Same programs. Willingness to pay is $30,000 per QALY. What is the incremental net monetary benefit of annual versus biannual?", "options": ["+$5,000, so annual is preferred", "−$5,000, so biannual is preferred", "$0, so they tie", "+$25,000, so annual is preferred"], "answer": 0, "explain": "증분 순화폐편익은 30,000 × 1 − 25,000으로 +5,000이어서 비싼 쪽이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part B"}, {"id": "h-26", "course": "hpm570", "week": "9w", "topic": "What a ratio can hide", "importance": 2, "why": "9주차 읽을거리", "type": "tf", "q": "A ratio of $50,000 per QALY always means the program costs more and also adds more health.", "options": ["True", "False"], "answer": 1, "explain": "비용 감소를 효과 감소로 나눠도 같은 비율이 산출되므로 비율만으로는 방향을 판단할 수 없다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 12절"}, {"id": "h-27", "course": "hpm570", "week": "9w", "topic": "Spotting extended dominance", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "Costs and QALYs: A $25,000 and 8; B $50,000 and 9; C $55,000 and 9.5. The ICER of A to B is $25,000 and of B to C is $10,000. What follows?", "options": ["B is extended dominated and is removed", "A is dominated and is removed", "C is dominated and is removed", "All three stay on the frontier"], "answer": 0, "explain": "증분비가 내려가면 가운데 대안 B가 확장 지배된다. 더 비싸고 더 효과적이어도 제외 대상이다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C"}, {"id": "h-28", "course": "hpm570", "week": "9w", "topic": "Recompute after removal", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "After removing B, what is the ICER of C versus A?", "options": ["$20,000 per QALY", "$10,000 per QALY", "$25,000 per QALY", "$30,000 per QALY"], "answer": 0, "explain": "(55,000 − 25,000) / (9.5 − 8) = 20,000이다. 제외 전의 값으로 비교하면 오답이 된다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 3"}, {"id": "h-29", "course": "hpm570", "week": "9w", "topic": "The mixed strategy", "importance": 3, "why": "2025 시험 · 확장 지배 예시", "type": "mc", "q": "Give 2/3 of patients strategy C and 1/3 strategy A. What are the average QALYs and cost?", "options": ["9.0 QALYs and $45,000, which beats B", "9.5 QALYs and $55,000", "8.5 QALYs and $40,000", "9.0 QALYs and $50,000"], "answer": 0, "explain": "섞으면 B와 같은 9.0 QALY를 더 싼 $45,000에 얻으므로 B는 효율적 프론티어에 오르지 못한다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 2"}, {"id": "h-30", "course": "hpm570", "week": "9w", "topic": "Simple versus extended dominance", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "How does extended dominance differ from simple dominance?", "options": ["The option is more costly and more effective, but its ICER is higher than the next option's", "The option is more costly and less effective", "The option is cheaper and less effective", "The option has a negative ICER"], "answer": 0, "explain": "단순 지배는 더 비싸면서 효과가 적은 경우이고, 확장 지배는 더 많이 얻지만 다른 대안보다 단위당 비싸다.", "concept": "h_dom", "source": "217 Incremental CEA, 10절"}, {"id": "h-31", "course": "hpm570", "week": "9w", "topic": "Cost-saving programs", "importance": 3, "why": "9주차 읽을거리", "type": "mc", "q": "When choosing among independent programs under a budget, which program is selected whatever the budget?", "options": ["One that saves money and adds some benefit", "One with the lowest cost", "One with the largest effect", "One with the highest ratio"], "answer": 0, "explain": "비용을 아끼면서 효과도 있는 사업은 자원을 쓰지 않으므로 예산과 무관하게 고른다.", "concept": "h_budget", "source": "217 Incremental CEA, 3절"}, {"id": "h-32", "course": "hpm570", "week": "9w", "topic": "The last program funded", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What does the cost-effectiveness ratio of the last program funded represent?", "options": ["The opportunity cost of resources, which changes with the budget", "A fixed threshold for all decisions", "The average ratio of all funded programs", "The ratio of the cheapest program"], "answer": 0, "explain": "한계 비용효과비는 예산에 따라 달라지는 값이며 고정된 기준값이 아니다.", "concept": "h_budget", "source": "217 Incremental CEA, 5절과 14절"}, {"id": "h-33", "course": "hpm570", "week": "9w", "topic": "Average versus incremental ratio", "importance": 3, "why": "9주차 읽을거리 · 반례", "type": "mc", "q": "M1 costs $100,000 for 10 QALYs. M2 costs $10,000 more and adds 0.001 QALY. What is the incremental ratio of M2?", "options": ["$10,000,000 per QALY", "$10,999 per QALY", "$1,000 per QALY", "$100,000 per QALY"], "answer": 0, "explain": "증분비는 10,000 / 0.001이다. 평균비 $10,999만 보면 M2가 유리해 보이지만 판단은 증분비로 한다.", "concept": "h_budget", "source": "217 Incremental CEA, 8절"}, {"id": "h-34", "course": "hpm570", "week": "9w", "topic": "Assumptions of the budget rule", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "The rule of funding programs in order of incremental ratio until the budget is spent assumes:", "options": ["Perfect divisibility and constant returns to scale", "Equal costs for all programs", "Mutually exclusive programs only", "A fixed willingness to pay set by law"], "answer": 0, "explain": "규모를 줄여도 비용효과가 변하지 않는다는 두 가정이 성립하지 않으면 더 복잡한 접근이 필요하다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 6절"}, {"id": "h-35", "course": "hpm570", "week": "9w", "topic": "Shadow price", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What is the shadow price implied by a budget?", "options": ["The most the decision maker is willing to pay per unit of effect, implied by the budget size", "A price found by the analysis from data", "The cost of the cheapest program", "The average cost per QALY"], "answer": 0, "explain": "잠재가격은 예산 크기가 함의하는 지불 한도이며 자료에서 구한 값이 아니다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 8절"}];

hor=\"middle\" fill=\"#1D2430\">Area 1.0 = perfect</text><text x=\"490.0\" y=\"136.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">Area 0.5 = random guess</text><rect x=\"350\" y=\"164\" width=\"280\" height=\"56\" fill=\"#EEF3F9\" stroke=\"#00356B\" stroke-width=\"3\"/><text x=\"490.0\" y=\"186.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">The curve shows every cutoff.</text><text x=\"490.0\" y=\"206.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">It does not pick the best one.</text></svg>", "points": ["곡선 위의 한 점은 한 절단점이고, 그 점의 기울기가 우도비이다.", "면적은 두 분포가 얼마나 잘 구별되는지만 요약한다."], "terms": [["ROC curve", "ROC 곡선"], ["false positive rate", "거짓양성률"], ["likelihood ratio", "우도비"]], "course": "hpm570"}, {"id": "h_formula", "title": "Optimal cutoff formula", "kor": "최적 절단점은 검사 성능, 유병률, 오류의 비용비로 정해진다", "week": "7w", "oneline": "우도비가 사전 오즈의 역수와 비용비의 곱보다 큰 결과를 양성으로 지정하면 기대 비용이 줄어든다.", "diagram": "<svg viewBox=\"0 0 640 206\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Positivity cutoff formula in three terms\" font-family=\"inherit\"><rect x=\"10\" y=\"20\" width=\"190\" height=\"92\" fill=\"#00356B\" stroke=\"#00356B\" stroke-width=\"1\"/><text x=\"105.0\" y=\"50.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">LR of the result</text><text x=\"105.0\" y=\"70.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#fff\">p(X|D+) / p(X|D−)</text><text x=\"105.0\" y=\"90.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#fff\">test performance</text><text x=\"222\" y=\"72\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"700\">></text><rect x=\"240\" y=\"20\" width=\"150\" height=\"92\" fill=\"#EEF3F9\" stroke=\"#C9D4E2\" stroke-width=\"1\"/><text x=\"315.0\" y=\"50.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">p(D−) / p(D+)</text><text x=\"315.0\" y=\"70.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">inverse prior odds</text><text x=\"315.0\" y=\"90.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">prevalence</text><text x=\"409\" y=\"72\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\" font-weight=\"700\">×</text><rect x=\"426\" y=\"20\" width=\"204\" height=\"92\" fill=\"#EEF3F9\" stroke=\"#00356B\" stroke-width=\"3\"/><text x=\"528.0\" y=\"50.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">(CTN − CFP) / (CTP − CFN)</text><text x=\"528.0\" y=\"70.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">cost ratio</text><text x=\"528.0\" y=\"90.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">net harm / net benefit</text><text x=\"20\" y=\"144\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\" font-weight=\"700\">Call the result positive when the left side is larger than the right side.</text><text x=\"20\" y=\"168\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\">Ferritin example: right side = 150/85 × 1/3 = 0.5882.</text><text x=\"20\" y=\"190\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\">Results with LR 3.12 and 41.47 are positive. Results with LR 0.13 and 0.46 are negative.</text></svg>", "points": ["유병률이 높으면 가운데 항이 작아져 양성으로 지정하는 기준이 낮아진다.", "우도비 1이 최적점이라는 근거는 없다.", "같은 검사라도 집단과 결정의 가치가 다르면 최적점이 달라진다."], "terms": [["cost ratio", "비용비"], ["prior odds", "사전 오즈"], ["posterior odds", "사후 오즈"]], "course": "hpm570"}, {"id": "h_prev", "title": "Oversampled study", "kor": "환자를 많이 모은 표본의 비율은 유병률이 아니다", "week": "6w", "oneline": "표본에서는 질병 상태별 결과 분포만 사용하고, 사전확률에는 모집단 유병률을 쓴다.", "diagram": "<svg viewBox=\"0 0 640 184\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Sample proportion versus population prevalence\" font-family=\"inherit\"><rect x=\"20\" y=\"20\" width=\"270\" height=\"92\" fill=\"#EEF3F9\" stroke=\"#C9D4E2\" stroke-width=\"1\"/><text x=\"155.0\" y=\"50.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">Study sample</text><text x=\"155.0\" y=\"70.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2 /text><text x=\"160.0\" y=\"94.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">P(ALP | lead level) falls</text><rect x=\"340\" y=\"20\" width=\"280\" height=\"100\" fill=\"#EEF3F9\" stroke=\"#00356B\" stroke-width=\"3\"/><text x=\"480.0\" y=\"54.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">Moves the threshold</text><text x=\"480.0\" y=\"74.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">EDTA toxicity 5% → 2.5%</text><text x=\"480.0\" y=\"94.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1D2430\">Threshold 9.71% → 4.93%</text><text x=\"20\" y=\"152\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\" font-weight=\"700\">Threshold P: 0.05 + 0.285P = 0.8P, so P = 0.05 / 0.515 = 9.71%.</text><text x=\"20\" y=\"176\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\">Treat when the posterior is above the threshold.</text></svg>", "points": ["유병률이 내리면 사후확률이 내려 치료 대상이 줄 수 있다.", "독성이 줄면 더 낮은 사후확률에서도 치료가 유리하다.", "확률 기준선은 점수 절단점이 아니므로 유병률과 우도비가 더 필요하다."], "terms": [["treatment threshold", "치료 임계값"], ["expected harm", "기대 해악"], ["conditionally independent", "조건부 독립"]], "course": "hpm570"}, {"id": "h_evpi", "title": "Value of information", "kor": "완전정보의 기대가치는 어떤 검사도 넘지 못하는 상한이다", "week": "7w", "oneline": "검사로 얻는 가치는 정보 없는 최선과 완전정보 사이의 일부이며, 결과에 따라 행동이 달라질 때만 생긴다.", "diagram": "<svg viewBox=\"0 0 640 256\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EVPI as an upper bound\" font-family=\"inherit\"><text x=\"20\" y=\"24\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\">Best action without information</text><rect x=\"20\" y=\"32\" width=\"200\" height=\"24\" fill=\"#C9D4E2\" stroke=\"#C9D4E2\" stroke-width=\"1\"/><text x=\"20\" y=\"84\" font-size=\"14\" text-anchor=\"start\" fill=\"#1D2430\">Strategy that uses the test</text><rect x=\"20\" y=\"92\" width=\"330\" height=\"24\" fill=\"#286DC0\" stroke=\"#286DC0\" stroke-width=\"1\"/><text x=\"20\" y=\"144\" font-size=\"14\" text-anchor=\"start\" fill   if(cur.concept)app.append(el('p',{},el('button',{onclick:()=>go(c.id,'map')},'전체 개념')));
  list.forEach(k=>{
    const n=DATA.filter(d=>d.concept===k.id).length;
    const card=el('section',{class:'card'},el('div',{class:'eyebrow'},k.week),el('h2',{},k.title),el('p',{class:'kor'},k.kor));
    if(k.diagram)card.append(el('div',{class:'dg',html:k.diagram}));
    card.append(el('p',{class:'one'},k.oneline));
    if(k.points&&k.points.length)card.append(el('ul',{},k.points.map(p=>el('li',{},p))));
    if(k.terms&&k.terms.length){const t=el('div',{class:'terms'});k.terms.forEach(([a,b])=>t.append(el('b',{},a),el('span',{},b)));card.append(t)}
    if(n)card.append(el('div',{class:'bar'},el('button',{class:'primary',onclick:()=>go(c.id,'today',k.id)},`문제 ${n}개 풀기`)));
    app.append(card)});
}
function log(app,c){
  const rows=itemsOf(c.id).map(x=>({x,s:S(x.id)})).sort((a,b)=>((b.s?b.s.wrong:-1)-(a.s?a.s.wrong:-1))||b.x.importance-a.x.importance);
  const tb=el('tbody');rows.forEach(({x,s})=>tb.append(el('tr',{},el('td',{},x.topic),el('td',{},x.week),el('td',{class:'num'},s?s.seen:0),el('td',{class:'num'},s?s.wrong:0),el('td',{class:'num'},!s?'미응시':s.due<=t0()?'오늘':Math.round((s.due-t0())/DAY)+'일 뒤'))));
  app.append(el('table',{},el('thead',{},el('tr',{},['주제','주차'].map(h=>el('th',{},h)),['푼 횟수','오답','다음 복습'].map(h=>el('th',{class:'num'},h)))),tb));
  app.append(el('div',{class:'set'},el('label',{for:'ex'},'시험일'),el('input',{id:'ex',type:'date',value:examOf(c.id),onchange:e=>{store.exams[c.id]=e.target.value;save();render()}}),
    el('span',{},`${daysLeft(c.id)}일 남음 · 간격 ${BASE.map((b,i)=>gap(c.id,i)).join('·')}일`)));
  app.append(el('p',{class:'src'},'간격을 둔 복습은 보건의료 전문직의 지식 점수를 높였고(Martinengo 2024, Cochrane 방법론 체계적 문헌고찰, 23개 연구, SMD 0.32), 시험 형식의 복습은 다시 읽기보다 장기 기억에 유리하다(Rowland 2014, g=0.50. Adesope 2017, g=0.70). 최적 간격은 시험까지 남은 기간에 비례하므로(Cepeda 2006, 2008) 시험일에 맞추어 간격을 줄인다. 틀린 문제는 같은 날 한 번 더 출제한다.'));
}
function exp(){const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'})),download:'recall-progress.json'});document.body.append(a);a.click();a.remove()}
function imp(e){const f=e.target.files[0];if(f)f.text().then(t=>{store=JSON.parse(t);save();render()})}
document.addEventListener('keydown',e=>{
  if(cur.tab!=='today'||!run||run.i>=run.q.length)return;
  if(!run.done&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(run.done&&e.key==='Enter'){const n=document.getElementById('next');if(n&&document.activeElement!==n)n.click()}
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
