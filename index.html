<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00356B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>복습</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap");
:root{--yale:#00356B;--yale2:#286DC0;--wash:#EEF3F9;--ink:#1D2430;--ink2:#3F4A5A;--rule:#C9D4E2;
  --serif:'YaleNew','Libre Caslon Text','Noto Serif KR',Georgia,serif;--head:'Yale 2024','YaleNew','Libre Caslon Text','Noto Serif KR',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{display:flex;min-height:100vh;background:#fff;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--yale);color:#fff}
:focus-visible{outline:2px solid var(--yale2);outline-offset:2px}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--yale);border-radius:0;padding:8px 18px;cursor:pointer;min-height:44px}
button:hover{background:var(--wash)}
button.primary{background:var(--yale);color:#fff}
button.primary:hover{background:#0a4a8f}
#side{width:230px;flex:none;background:var(--yale);color:#fff;padding:36px 22px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .t{font-family:var(--head);font-size:20px;line-height:1.3;margin-bottom:22px}
#side a{display:flex;justify-content:space-between;gap:8px;color:#c9d9ee;padding:7px 0;text-decoration:none;border-bottom:1px solid #1d4f86;cursor:pointer;font-variant-numeric:tabular-nums}
#side a.on{color:#fff;font-weight:700}
#side a.empty{color:#7f9cc4}
#side .foot{margin-top:22px;color:#c9d9ee}
#side .foot button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:0;min-height:0;font:inherit}
#app{flex:1;min-width:0;max-width:820px;padding:36px 44px 120px}
h1{font-family:var(--head);font-weight:400;color:var(--yale);font-size:24px;line-height:1.3;margin-bottom:6px;text-wrap:balance}
h2{font-family:var(--head);font-weight:400;color:var(--yale);font-size:20px;line-height:1.3;margin:0 0 8px}
.sub{color:var(--ink2);margin-bottom:20px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;background:none;color:var(--ink2)}
.tabs button.on{color:var(--yale);border-bottom-color:var(--yale);font-weight:700}
.eyebrow{color:var(--yale2);border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.q{font-weight:700;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:11px 14px;border-color:var(--rule);background:#fff}
.opt .k{flex:none;width:16px;color:var(--yale2);font-weight:700}
.opt.right{background:var(--yale);border-color:var(--yale);color:#fff}
.opt.right .k{color:#fff}
.opt.wrong{background:var(--rule);border-color:var(--ink2);color:var(--ink);text-decoration:line-through}
.opt:disabled:not(.right):not(.wrong){color:#8591a3}
.res{font-weight:700;margin-bottom:4px;color:var(--yale)}
.exp{max-width:62ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.card{border-top:2px solid var(--yale);padding:14px 0 22px;margin-bottom:8px}
.card .kor{color:var(--ink2);margin-bottom:8px}
.dgm{margin:14px 0 6px}
.dgm .note{color:var(--ink2);margin-top:6px}
.bx{background:var(--wash);border:1px solid var(--rule);padding:10px 12px;text-align:center}
.bx.k{background:var(--yale);border-color:var(--yale);color:#fff}
.bx .s{color:var(--ink2)}
.bx.k .s{color:#dbe5f1}
.bx .n{color:var(--yale);font-weight:700}
.bx.k .n{color:#fff}
.flow{display:flex;align-items:stretch;gap:0}
.flow .bx{flex:1 1 0;display:flex;flex-direction:column;justify-content:center}
.flow .ar{flex:none;width:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.flow .ar svg{width:22px;height:12px}
.flow .rel{flex:none;padding:0 10px;display:flex;align-items:center;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tl{border-left:1px solid var(--rule);margin-left:6px}
.tl .row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:4px 0 4px 14px;position:relative}
.tl .row::before{content:'';position:absolute;left:-4px;top:50%;width:7px;height:7px;margin-top:-4px;background:var(--yale)}
.tl .row.nod{grid-template-columns:1fr}
.tl .d{color:var(--yale);font-variant-numeric:tabular-nums}
.tl .bx{text-align:left}
.chart{max-width:480px}
.chart svg{width:100%;height:auto;display:block}
.dgm table td:first-child{color:var(--yale)}
.card .one{margin:18px 0 8px;max-width:60ch}
.card ul{padding-left:20px;margin:0 0 10px;max-width:62ch}
.card li{margin-bottom:3px}
.terms{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;margin:8px 0 12px}
.terms b{font-weight:400;color:var(--yale)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
th{border-top:2px solid var(--yale);background:var(--wash);color:var(--yale);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.set input{font:inherit;border:1px solid var(--rule);padding:6px 8px;border-radius:0;min-height:40px}
.src{color:var(--ink2);max-width:62ch;margin-top:18px}
@media (max-width:760px){
  body{display:block}
  #side{width:auto;height:auto;position:static;padding:14px 18px 8px;display:block}
  #side .t{margin-bottom:8px}
  #side .list{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #side .list::-webkit-scrollbar{display:none}
  #side a{border:0;padding:6px 0;flex:none}
  #side .foot{display:none}
  #app{padding:20px 18px 100px;overflow-x:hidden}
  .flow{flex-direction:column}
  .flow .ar{width:auto;height:28px}
  .flow .ar svg{transform:rotate(90deg)}
  .flow .rel{padding:4px 0;justify-content:center}
  .grid{grid-template-columns:1fr 1fr}
  .tl .row{grid-template-columns:52px 1fr;gap:8px}
  .dgm th,.dgm td{padding:8px 6px;overflow-wrap:anywhere}
}
</style>
</head>
<body>
<nav id="side" aria-label="과목"></nav>
<main id="app"></main>
<script>
const DATA = [{"id": "w7-01", "course": "ehs544", "week": "7w", "topic": "Meaningful involvement (EPA)", "importance": 3, "why": "시험 2 범위 · 모든 회차의 기준", "type": "mc", "q": "Under EPA's definition of environmental justice, which of the following is one of the conditions of \"meaningful involvement\"?", "options": ["The public's contribution can influence the regulatory agency's decision.", "The agency announces its decision first and then explains it to the public.", "The community must first prove that it has been harmed before it may take part.", "Industry and community members receive the same number of speaking slots."], "answer": 0, "explain": "공중의 기여가 기관의 결정에 영향을 미칠 수 있어야 실질적 참여가 성립한다. 결정을 먼저 발표하고 방어하는 방식(announce and defend)은 연방 지침이 벗어나려 한 기존 방식이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-02", "course": "ehs544", "week": "7w", "topic": "Listening session vs. engagement", "importance": 3, "why": "교수 강조 · 조별 과제 연결", "type": "mc", "q": "A state agency holds a two-hour listening session on a proposed landfill expansion. Residents speak and staff take notes, but the agency gives no written response and takes no follow-up step. Which assessment matches the class discussion?", "options": ["It is meaningful engagement, because residents were able to speak at a public meeting.", "It is not meaningful engagement, because there was no agency response, follow-up, or accountability.", "It is meaningful engagement, because any public meeting satisfies Executive Order 12898.", "It is not meaningful engagement, because listening sessions are banned under 40 CFR Part 25."], "answer": 1, "explain": "청취 회의에서 의견을 듣기만 하고 응답과 후속 조치가 없으면 실질적 참여에 해당하지 않는다. 발언 기회가 있어도 결정에 영향을 미치지 못하면 참여로 인정되지 않는다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 1절 가항"}, {"id": "w7-03", "course": "ehs544", "week": "7w", "topic": "Public relations vs. participation", "importance": 3, "why": "EPA 정의 슬라이드의 핵심 구별", "type": "tf", "q": "Under EPA's framework, public relations (public information) and public participation are the same activity, because both mean giving information to the public.", "options": ["True", "False"], "answer": 1, "explain": "홍보는 공중에게 알리는 일이고 참여는 공중의 의견을 받아 결정에 반영하는 일이므로 두 개념은 같지 않다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 다항ㆍ라항"}, {"id": "w7-04", "course": "ehs544", "week": "7w", "topic": "Legal force of EPA's EJ definition", "importance": 2, "why": "교수가 법적 지위를 짚음", "type": "mc", "q": "EPA's definition of environmental justice appears only on its website and has never been put in a rule or guidance. What follows from this?", "options": ["It is binding on all federal agencies as a regulation.", "It is binding only on states that run authorized permit programs.", "It has no binding authority.", "It became binding when Executive Order 12898 was signed."], "answer": 2, "explain": "EPA의 정의는 웹사이트에만 게시되어 법적 구속력이 없다. 행정명령이 환경정의를 요구한다는 사실과 정의 문구에 효력이 있다는 판단은 별개이다.", "concept": "c_mi", "source": "113_7w_meaningful-community-engagement, 2절 가항"}, {"id": "w7-05", "course": "ehs544", "week": "7w", "topic": "EO 14096 vs. EPA definition", "importance": 3, "why": "행정명령 흐름의 출발점", "type": "mc", "q": "Compared with EPA's definition of environmental justice, what does Executive Order 14096 add?", "options": ["English proficiency as a newly protected category beside race, color, and income", "Tribal affiliation and disability, plus protection from climate risks and cumulative impacts", "Only a change in wording from \"fair\" to \"equal\" treatment, with no new groups named", "The removal of the meaningful participation element, keeping only fair treatment"], "answer": 1, "explain": "행정명령 14096호는 부족 소속, 장애, 기후 위험, 누적 영향을 정의에 추가하였다. 영어 능력은 추가된 보호 대상에 포함되지 않는다.", "concept": "c_eo", "source": "113_7w_meaningful-community-engagement, 2절 나항"}, {"id": "w7-08", "course": "ehs544", "week": "7w", "topic": "Part 25/124 are binding", "importance": 3, "why": "Grab and Go 표지 항목", "type": "tf", "q": "The statement of basis and the response to comments required in permit proceedings under 40 CFR Parts 25 and 124 are binding regulatory requirements, even if agencies may often ignore them now.", "options": ["True", "False"], "answer": 0, "explain": "Part 25와 124의 요건은 기관이 지키지 않는 일이 많아도 법적 구속력이 있는 규제 요건이다. 지침이나 권고와 구별되는 점이다.", "concept": "c_part", "source": "113_7w_meaningful-community-engagement, 2절 라항"}, {"id": "w7-09", "course": "ehs544", "week": "7w", "topic": "CERCLA liability and community engagement", "importance": 3, "why": "교수가 상생이라고 설명", "type": "mc", "q": "Why did the class describe community engagement at Superfund sites as a win-win even under the current administration?", "options": ["Executive Order 14096 still requires agencies to run engagement at every Superfund site", "CERCLA's strict, joint and several liability gives responsible private parties a reason to cooperate", "NEJAC's guidance is legally binding on the parties responsible for each contaminated site", "Congress created a mandatory community engagement office for each Superfund site"], "answer": 1, "explain": "CERCLA의 엄격책임과 연대책임은 오염을 일으킨 민간 책임자가 정화에 협력할 이유가 된다. 행정명령 14096호는 2025년에 철회되어 근거로 삼을 수 없다.", "concept": "c_cercla", "source": "113_7w_meaningful-community-engagement, 4절 다항"}, {"id": "w8-01", "course": "ehs544", "week": "8w", "topic": "Executive order trajectory", "importance": 3, "why": "슬라이드 p.4 핵심 도표", "type": "mc", "q": "Which statement correctly describes the federal executive actions on disproportionate impact?", "options": ["EO 14096 (2023) revoked EO 12898 (1994), and EO 14148 later reinstated it.", "EO 12898 (1994) came first; EO 14096 (2023) followed; in 2025 EO 14148 rescinded 14096 and EO 14173 rescinded 12898.", "EO 12898 (1994) came first; in 2025 EO 14173 rescinded 14096 and EO 14148 rescinded 12898.", "EO 14096 (2023) came first and EO 12898 (1994) followed as an amendment."], "answer": 1, "explain": "순서는 1994년 12898호, 2023년 14096호이며, 2025년에 14148호가 14096호를, 14173호가 12898호를 철회하였다. 두 철회 명령의 대상을 서로 바꾸면 오답이 된다.", "concept": "c_eo", "source": "114_8w_engagement-and-evidence-based-decision-making, 2절 가항"}, {"id": "w8-02", "course": "ehs544", "week": "8w", "topic": "Hidden but not Gone", "importance": 3, "why": "8회차 제목 슬라이드 개념", "type": "tf", "q": "When Executive Orders 12898 and 14096 were revoked, the disproportionate impact factors lost their value as evidence for decision-making.", "options": ["True", "False"], "answer": 1, "explain": "행정명령이 철회되어도 불균형 영향 요인은 의사결정의 증거로 계속 활용할 수 있다. 숨겨졌으나 사라지지 않았다는 것이 이 슬라이드의 요지이다.", "concept": "c_hbg", "source": "114_8w, 도입부 및 2절 다항"}, {"id": "w8-03", "course": "ehs544", "week": "8w", "topic": "Cross-cutting factor", "importance": 3, "why": "슬라이드 p.7 표시 항목", "type": "mc", "q": "Which factor on the \"Hidden but not Gone\" slide acts across all six disproportionate impact factors?", "options": ["Cumulative impacts", "Physical infrastructure", "Psycho-social stressors", "Unique exposure pathways"], "answer": 2, "explain": "심리사회적 스트레스 요인은 여섯 요인 모두에 작용한다. 나머지 셋은 여섯 요인에 속하는 개별 항목이다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-04", "course": "ehs544", "week": "8w", "topic": "Six disproportionate impact factors", "importance": 3, "why": "6요인 목록은 출제 1순위", "type": "mc", "q": "Which of the following is NOT one of the six disproportionate impact factors on the class 8 slide?", "options": ["Proximity and exposure", "Susceptible populations", "Participating in decision making", "Municipal property tax base"], "answer": 3, "explain": "여섯 요인은 근접성과 노출, 누적 영향, 물리적 기반시설, 취약 인구, 고유한 노출 경로, 의사결정 참여이다. 지방세 기반은 이 목록에 없다.", "concept": "c_hbg", "source": "114_8w, 2절 다항"}, {"id": "w8-05", "course": "ehs544", "week": "8w", "topic": "EPA 2021 social vulnerability report", "importance": 3, "why": "조별 과제의 옥외 노동자 근거", "type": "mc", "q": "In EPA's 2021 report on climate change and social vulnerability, at 2°C of global warming, Hispanic and Latino individuals are 43% more likely to live in areas where which impact is projected to be greatest?", "options": ["Loss of labor hours in weather-exposed work", "New childhood asthma diagnoses", "Deaths from extreme temperature", "Property damage from inland flooding"], "answer": 0, "explain": "보고서에 따르면 히스패닉과 라틴계는 2°C 상승 시 노동시간이 가장 크게 줄어드는 지역에 거주할 가능성이 43% 더 높다. 천식과 극한 기온 사망 수치는 다른 영향 항목에서 나온다.", "concept": "c_epa21", "source": "114_8w, 2절 라항"}, {"id": "w8-06", "course": "ehs544", "week": "8w", "topic": "Lived experience as evidence", "importance": 3, "why": "8회차 p.10-11 원칙", "type": "mc", "q": "Which statement best matches how class 8 treats lived experience expertise and Indigenous knowledge?", "options": ["They are used only when no scientific data exist.", "They are replaced by screening tool scores once a tool is available.", "They count only if a recognized institution has documented them.", "They are forms of expertise that count as evidence alongside academic knowledge."], "answer": 3, "explain": "생활경험과 원주민 지식은 학문적 지식과 함께 의사결정의 근거가 된다. 선별 도구 점수는 이를 대체하지 못한다.", "concept": "c_lived", "source": "114_8w, 2절 마항ㆍ바항"}, {"id": "w8-07", "course": "ehs544", "week": "8w", "topic": "40 CFR Part 25 vs. Part 124", "importance": 3, "why": "슬라이드에 Grab and Go 표지", "type": "mc", "q": "Which statement correctly describes the relationship between 40 CFR Part 25 and Part 124?", "options": ["Part 25 sets EPA's permit decision procedures; Part 124 sets the general framework for public participation.", "Part 25 applies only to the Clean Air Act; Part 124 applies only to the Clean Water Act.", "Part 25 is the framework for why and how the public participates; Part 124 governs EPA's individual permit decisions.", "Part 25 governs state agencies only; Part 124 governs EPA staff only."], "answer": 2, "explain": "Part 25는 공중이 왜 어떻게 참여하는지에 관한 기본 체계이고, Part 124는 EPA의 개별 허가 결정 절차이다. 두 부의 역할을 반대로 서술한 설명은 오답이다.", "concept": "c_part", "source": "114_8w, 3절 라항ㆍ마항"}, {"id": "w8-08", "course": "ehs544", "week": "8w", "topic": "Responsiveness Summary (§25.8)", "importance": 3, "why": "청취 회의와 참여를 가르는 장치", "type": "mc", "q": "Under 40 CFR § 25.8, what must a Responsiveness Summary include?", "options": ["A count of the comments received, with the names and affiliations of every commenter", "A certification by the agency that every comment was read and considered in good faith", "The agency's final cost-benefit analysis comparing the proposed action with all alternatives", "The activities held, the significant public comments, and the agency's specific responses or reasons for rejection"], "answer": 3, "explain": "응답 요약서는 수행한 활동, 중요한 의견, 의견에 대한 기관의 구체적 응답이나 거부 이유를 기재한다. 의견 수나 참석자 명단만으로는 기관의 응답으로 인정되지 않는다.", "concept": "c_part", "source": "114_8w, 3절 라항 (5)"}, {"id": "w8-09", "course": "ehs544", "week": "8w", "topic": "Petition for review (Part 124)", "importance": 3, "why": "지역사회가 쓰는 실제 수단", "type": "mc", "q": "Under 40 CFR Part 124, who may file a petition for review of a final RCRA, UIC, NPDES, or PSD permit decision?", "options": ["Any resident of the state, whether or not they took part earlier", "Only the permit applicant", "Anyone who read the statement of basis", "A person who filed comments on the draft permit or took part in the public hearing"], "answer": 3, "explain": "허가 초안에 의견을 제출하였거나 공청회에 참여한 사람이 심사 청구를 할 수 있다. 의견 기간에 쟁점을 모두 제출하지 않으면 나중에 다투기 어렵다.", "concept": "c_part", "source": "114_8w, 3절 마항 (2)"}, {"id": "w8-11", "course": "ehs544", "week": "8w", "topic": "First state to define EJ communities", "importance": 3, "why": "8회차 중심 사례", "type": "mc", "q": "According to the class 8 discussion, Connecticut was the first state to do what?", "options": ["Adopt an environmental equity policy", "Ban new permits in environmental justice communities", "Define environmental justice communities in a statute", "Create a state environmental protection agency"], "answer": 2, "explain": "코네티컷은 환경정의 지역사회를 법률로 정의한 첫 번째 주이다. 1993년의 환경 형평 정책은 법률이 아니므로 첫 입법으로 볼 수 없다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)ㆍ(4)"}, {"id": "w8-12", "course": "ehs544", "week": "8w", "topic": "Public Act 20-6 notice rules", "importance": 3, "why": "교수가 요건을 구체적으로 설명", "type": "mc", "q": "Which requirement applies to a permit applicant under Connecticut's Public Act 20-6 (effective November 1, 2020)?", "options": ["Hold the public meeting in the state capital within 30 days of filing the application", "Obtain the municipality's written consent to the application before it is filed with the state", "Give notice in English and in any language used by 15% or more of residents within a half mile", "Publish a single notice in the legal-notice section of a newspaper with local circulation"], "answer": 2, "explain": "공고 대상 언어는 영어와 반경 0.5마일 안 주민의 15% 이상이 사용하는 언어이다. 법정 공고란에 한 번 게재하는 방식은 하트포드에서 주민이 공고를 놓친 원인이었다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-13", "course": "ehs544", "week": "8w", "topic": "Law vs. real protection", "importance": 3, "why": "교수가 반복해 짚은 사례", "type": "mc", "q": "A New Haven tank terminal signed a community benefit agreement worth $49,000 that allowed its VOC emissions to triple. What did the class use this case to show?", "options": ["Community benefit agreements are prohibited under Connecticut law.", "Benefit amounts are set by statute and cannot be negotiated.", "The state screening tool underestimates pollution burdens.", "Having a law does not by itself guarantee meaningful protection."], "answer": 3, "explain": "법의 요건을 지킨 협약도 배출 증가를 허용하였다. 법이 있어도 실질적 보호가 보장되지 않는다는 사례이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (4)"}, {"id": "w8-14", "course": "ehs544", "week": "8w", "topic": "Title VI leverage in Hartford", "importance": 3, "why": "Pestana 발표의 핵심 수단", "type": "mc", "q": "According to Edith Pestana, why did the federal civil rights (Title VI) investigation in Hartford change the state agency's behavior?", "options": ["A state court issued an injunction closing the landfill.", "EPA completed a new rulemaking on landfill odors.", "The city council voted to withdraw the permit.", "An agency found to discriminate could lose federal funding."], "answer": 3, "explain": "주 기관에 압력이 된 것은 차별한 기관이 연방 자금을 잃을 수 있다는 점이다. 법원 명령이나 시의회의 철회는 이 사례의 설명에 해당하지 않는다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (2)"}, {"id": "w8-15", "course": "ehs544", "week": "8w", "topic": "CT EJ screening tool", "importance": 2, "why": "근거 방법의 한계", "type": "mc", "q": "What does Connecticut's environmental justice screening tool do?", "options": ["It models each resident's actual exposure dose and personal health risk.", "It automatically approves or denies permit applications based on the score.", "It ranks census tracts by indicator on a 1-to-10 scale, without modeling actual exposure.", "It publishes the names and addresses of residents who live near facilities."], "answer": 2, "explain": "선별 도구는 구역별 지표를 1에서 10으로 순위화할 뿐 실제 노출량을 모형화하지 않는다. 허가 승인의 결정 주체는 기관이다.", "concept": "c_ct", "source": "114_8w, 4절 나항 (5)"}, {"id": "w9-01", "course": "ehs544", "week": "9w", "topic": "Reversing the brownfield model", "importance": 3, "why": "9회차 통합 사례의 핵심 주장", "type": "mc", "q": "According to Suzi Ruhl, how does Mount Growmore reverse the traditional brownfield model?", "options": ["EPA designs the project first and then asks the community to approve it.", "A private developer proposes the plan and the city grants the permits.", "Government resources and authority are applied to the community's own vision.", "The state legislature decides the reuse and funds it through a bond."], "answer": 2, "explain": "전통 모델은 지역사회가 외부의 설계에 참여하는 구조이다. Mount Growmore는 정부의 자원과 권한을 지역사회의 비전에 적용한다.", "concept": "c_flip", "source": "115_9w_mount-growmore-and-resilience, 7절"}, {"id": "w9-02", "course": "ehs544", "week": "9w", "topic": "Two framings of TBLJ", "importance": 3, "why": "법 문언과 Elevate 설명의 구별", "type": "mc", "q": "In the Connecticut special act, Triple Bottom Line Justice (TBLJ) is defined as the integration of which three elements?", "options": ["Health justice, environmental justice, and economic justice", "Evidence-based practice, rule of law, and meaningful community engagement", "Assessment, vision, and recommendations", "Law, science, and finance"], "answer": 1, "explain": "특별법은 TBLJ를 근거 기반 실천, 법치, 지역사회 참여의 통합으로 정의한다. 건강, 환경, 경제 정의는 Elevate가 설명한 목표이다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 1절 가항; 115_9w, 3절 가항"}, {"id": "w9-03", "course": "ehs544", "week": "9w", "topic": "B2H core method", "importance": 3, "why": "9회차 방법론 · 특별법 정의", "type": "mc", "q": "What are the two core elements of the Brownfields to Healthfields (B2H) method described in the class 9 podcast?", "options": ["A community-led diagnosis of what is wrong and the community's vision of a healthy community", "An EPA risk ranking of the site and a cost-benefit analysis of reuse options", "A liability allocation among polluters and a numeric cleanup standard", "A state grant application and a signed agreement with a developer"], "answer": 0, "explain": "B2H는 지역사회가 주도하는 진단과 건강한 지역사회에 대한 비전으로 구성된다. EPA 위험 순위와 같은 외부 기준에서 출발하지 않는다.", "concept": "c_flip", "source": "115_9w, 3절 다항; 104_2w, 1절 나항"}, {"id": "w9-04", "course": "ehs544", "week": "9w", "topic": "CJET", "importance": 3, "why": "출연자가 새 비법으로 강조", "type": "mc", "q": "What is the main function of Civic Justice Engagement Teaching (CJET)?", "options": ["It gives residents grants that allow them to buy contaminated land from private owners.", "It produces a cumulative screening score for each census tract and posts it online.", "It gives burdened communities a rule-of-law framework to use the laws and resources meant for them.", "It is a court-approved settlement process that runs between polluters and residents."], "answer": 2, "explain": "CJET는 부담이 큰 지역사회가 자신을 위한 법과 자원을 활용하도록 법치의 체계를 교육한다. 점수 산출이나 토지 구입 지원 기능은 없다.", "concept": "c_flip", "source": "115_9w, 3절 라항"}, {"id": "w9-05", "course": "ehs544", "week": "9w", "topic": "Breaking Bread", "importance": 2, "why": "협력 설계에 참고", "type": "mc", "q": "What is the purpose of the \"Breaking Bread\" process used by Elevate and the East End NRZ?", "options": ["A one-time public hearing required by 40 CFR Part 25 before any permit is issued", "A mediation procedure for disputes that begins after a lawsuit has been filed in court", "An annual awards event that recognizes community leaders and their long-term partners", "A weekly check-in among residents, governments, business, funders and academics to keep momentum"], "answer": 3, "explain": "Breaking Bread는 여러 부문이 매주 확인 회의를 열어 추진력을 유지하는 대화 과정이다. 법이 요구하는 공청회와 다르다.", "concept": "c_flip", "source": "115_9w, 3절 마항"}, {"id": "w9-08", "course": "ehs544", "week": "9w", "topic": "Role of local government", "importance": 3, "why": "토론 질문 3", "type": "mc", "q": "How did Bill Coleman describe the City of Bridgeport's role in Mount Growmore?", "options": ["To lead the vision for the campus and choose its main uses", "To hold title to the land and design the buildings on it", "To give technical support and resources while the community sets the agenda", "To regulate EPA's cleanup schedule and review its site reports"], "answer": 2, "explain": "시는 기술적 지원과 자원을 제공하고 의제는 지역사회가 정하였다. 비전을 주도하는 일은 시의 역할이 아니었다.", "concept": "c_roles", "source": "115_9w, 5절 가항"}, {"id": "w9-09", "course": "ehs544", "week": "9w", "topic": "Start of the public response", "importance": 3, "why": "토론 질문 3의 결정 지점", "type": "mc", "q": "Which action marked the start of the formal public response at the Mount Trashmore site?", "options": ["EPA completed a full site assessment, including a review of hydrology.", "Congress amended RCRA to cover construction debris sites such as this one.", "The city and state acquired the site from the private owners responsible for the contamination.", "The legislature passed the TBLJ special act and funded a demonstration program."], "answer": 2, "explain": "시와 주가 오염을 일으킨 민간 소유자에게서 부지를 취득한 것이 공식 대응의 출발이다. 특별법은 훨씬 뒤인 2026년에 제정되었다.", "concept": "c_roles", "source": "115_9w, 1절 나항; 4절 라항"}, {"id": "w9-10", "course": "ehs544", "week": "9w", "topic": "EPA Region 1 contributions", "importance": 3, "why": "토론 질문 1과 3", "type": "mc", "q": "Which action by EPA Region 1 most directly built community capacity at Mount Growmore?", "options": ["Writing plain-language summaries and cheat sheets together with the NRZ", "Designing and constructing the campus buildings on the site", "Lobbying the state legislature for the TBLJ bill", "Taking over the operation of the East End market"], "answer": 0, "explain": "EPA는 NRZ와 함께 쉬운 말의 자료와 요약표를 작성하여 지역사회의 역량을 높였다. 건물 건설과 시장 운영은 EPA의 업무가 아니다.", "concept": "c_roles", "source": "115_9w, 4절 라항"}, {"id": "w9-11", "course": "ehs544", "week": "9w", "topic": "Noise example (lived experience)", "importance": 3, "why": "생활경험 원칙의 사례", "type": "mc", "q": "At an NRZ meeting, outsiders assumed \"noise pollution\" meant interstate highway traffic, but residents meant gunshots. What did Suzi Ruhl draw from this?", "options": ["Community concerns should be translated into the experts' definitions before they are recorded.", "Noise should be excluded from environmental analysis.", "Trust and respect come from responding to the community's own definition of its concerns, with learning running both ways.", "Traffic noise data are more reliable than residents' reports."], "answer": 2, "explain": "지역사회가 스스로 정의한 문제에 대응해야 신뢰를 얻고 양방향으로 학습할 수 있다. 전문가의 분석 체계에 맞추어 먼저 번역하는 방식은 이와 반대이다.", "concept": "c_lived", "source": "115_9w, 8절 나항"}, {"id": "w9-12", "course": "ehs544", "week": "9w", "topic": "Campus status", "importance": 2, "why": "과제에서 틀리기 쉬운 사실", "type": "tf", "q": "As of the class 9 podcast, the Mount Growmore hydroponic center and wellness center have been built and are operating.", "options": ["True", "False"], "answer": 1, "explain": "정화는 완료되었으나 수경 재배 센터와 웰니스 센터는 아직 건립되지 않았다. 사례를 인용할 때 완료된 사실과 계획 단계를 구별하여야 한다.", "concept": "c_roles", "source": "115_9w, 6절ㆍ7절"}, {"id": "c-01", "course": "ehs544", "week": "6w", "topic": "CERCLA identification", "importance": 2, "why": "중간시험 복습 문항", "type": "mc", "q": "A review item describes an abandoned hazardous waste site with no responsible owner, where arrangers and transporters of hazardous substances and current and former facility owners can be held liable for cleanup costs. Which law does it describe?", "options": ["Resource Conservation and Recovery Act (RCRA)", "Toxic Substances Control Act (TSCA)", "Emergency Planning and Community Right-to-Know Act (EPCRA)", "CERCLA (Superfund)"], "answer": 3, "explain": "통제되지 않은 폐기 부지의 정화 책임은 CERCLA가 규정한다. RCRA는 현재 진행 중인 폐기물 관리를 규율한다.", "concept": "c_cercla", "source": "112_6w_midterm-review, 2절 나항"}, {"id": "c-02", "course": "ehs544", "week": "6w", "topic": "Part 124 permit coverage", "importance": 2, "why": "6회차 허가와 8회차 참여를 연결", "type": "mc", "q": "Part 124 sets decision-making procedures for which of the following sets of EPA permits?", "options": ["RCRA, UIC, PSD, and NPDES permits", "NEPA categorical exclusion determinations only", "FOIA responses and Privacy Act notices", "Title VI complaint determinations"], "answer": 0, "explain": "Part 124는 RCRA, UIC, PSD, NPDES 허가의 결정 절차를 규정한다. 나머지 선택지는 허가에 해당하지 않는다.", "concept": "c_part", "source": "114_8w, 3절 마항; 112_6w, 3절"}, {"id": "c-03", "course": "ehs544", "week": "2w", "topic": "Final special act duties", "importance": 3, "why": "원안과 최종 법의 차이", "type": "mc", "q": "What does the final Special Act No. 26-13 (from HB 5241) require?", "options": ["A TBLJ demonstration program in every city with over 148,000 residents by January 1, 2027", "The Commissioner of Public Health convenes a working group on a B2H-related TBLJ program and reports by July 1, 2027", "A 20% ICD-10 Z code usage rate in insurance claims by 2030, with annual progress reports", "An annual cost-benefit audit of every brownfield grant the state has awarded"], "answer": 1, "explain": "최종 특별법은 공중보건국장이 소집하는 작업반과 2027년 7월 1일까지 제출할 보고서만 규정한다. 시범 사업과 Z 코드 20% 사용 목표는 원안에만 있었다.", "concept": "c_tblj", "source": "104_2w_triple-bottom-line-justice, 2절 가항ㆍ나항"}, {"id": "h-01", "course": "hpm570", "week": "6w", "topic": "Moving the cutoff", "importance": 3, "why": "시험 범위 · 6주차 핵심", "type": "mc", "q": "In the CAGE example, the positivity cutoff is lowered from 4 points to 2 points. Which change is correct?", "options": ["Sensitivity rises from 12.5% to 83.3%; specificity falls from 99.6% to 91.9%", "Sensitivity and specificity both rise", "Sensitivity falls and specificity rises", "Neither value changes because the test is the same"], "answer": 0, "explain": "기준선을 낮추면 양성이 늘어 민감도는 오르고 특이도는 내린다. 같은 검사라도 기준선이 바뀌면 두 값이 함께 바뀐다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 CAGE"}, {"id": "h-02", "course": "hpm570", "week": "6w", "topic": "Sensitivity calculation", "importance": 3, "why": "계산 단골 · 6주차", "type": "mc", "q": "CAGE cutoff 4: 6 true positives, 3 false positives, 42 false negatives, 678 true negatives. What is the sensitivity?", "options": ["6/48 = 12.5%", "6/9 = 66.7%", "678/681 = 99.6%", "678/720 = 94.2%"], "answer": 0, "explain": "민감도는 질병이 있는 48명 가운데 양성인 6명이다. 66.7%는 양성 예측도, 99.6%는 특이도이다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 나항"}, {"id": "h-03", "course": "hpm570", "week": "6w", "topic": "PPV and prevalence", "importance": 2, "why": "예측도와 유병률 · 6주차", "type": "mc", "q": "As the CAGE cutoff is lowered, the positive predictive value falls (66.7% at cutoff 4, 31.3% at cutoff 1). What explains the large fall?", "options": ["Most people in the sample do not have the disease, so new positives are mostly false positives", "The test becomes less sensitive", "The disease becomes rarer as the cutoff falls", "Specificity rises faster than sensitivity"], "answer": 0, "explain": "표본의 유병률이 낮아 질병이 없는 사람이 많으므로 새로 양성이 된 사람 가운데 거짓양성이 많다.", "concept": "h_trade", "source": "106 Diagnostic Tests, 2절 라항"}, {"id": "h-04", "course": "hpm570", "week": "6w", "topic": "Slope of the ROC curve", "importance": 3, "why": "ROC 해석 · 6주차", "type": "mc", "q": "What does the slope of the ROC curve at a given point equal?", "options": ["The likelihood ratio at that cutoff", "The prevalence of the disease", "The positive predictive value", "The area under the curve"], "answer": 0, "explain": "곡선 위 한 점의 기울기는 그 점의 우도비와 같다. 가파른 구간은 우도비가 큰 결과이다.", "concept": "h_roc", "source": "106 Diagnostic Tests, 4절 마항"}, {"id": "h-05b", "course": "hpm570", "week": "6w", "topic": "ROC area and the best cutoff", "importance": 3, "why": "수업 강조 · ROC 한계", "type": "tf", "q": "A test whose ROC area is 0.9 has its optimal cutoff at the top-left corner of the curve.", "options": ["True", "False"], "answer": 1, "explain": "면적은 두 분포의 분리 정도만 요약하고 최적점은 유병률과 결과의 가치에 따라 달라진다. 왼쪽 위 모서리 관행은 이 둘을 무시한다.", "concept": "h_roc", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-05", "course": "hpm570", "week": "7w", "topic": "Terms of the cutoff formula", "importance": 3, "why": "시험 범위 · 7주차 핵심", "type": "mc", "q": "In the positivity-cutoff formula, what does the term p(D−)/p(D+) represent?", "options": ["Prevalence (the inverse of the prior odds)", "Test performance", "The relative size of decision errors", "The area under the ROC curve"], "answer": 0, "explain": "이 항은 사전 오즈의 역수로 유병률을 표시한다. 검사 성능은 우도비로, 오류의 크기는 비용비로 반영한다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 3절"}, {"id": "h-06", "course": "hpm570", "week": "7w", "topic": "Prevalence and the LR threshold", "importance": 3, "why": "공식 해석 · 7주차", "type": "mc", "q": "Everything else equal, prevalence rises. What happens to the likelihood ratio a result needs to be called positive?", "options": ["It falls", "It rises", "It stays the same", "It becomes exactly 1"], "answer": 0, "explain": "유병률이 높으면 사전 오즈의 역수가 작아져 양성으로 지정하는 기준이 낮아진다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 사항"}, {"id": "h-07", "course": "hpm570", "week": "7w", "topic": "Cost ratio calculation", "importance": 3, "why": "계산 · 7주차", "type": "mc", "q": "Costs: TN $0, TP $700, FP $100, FN $1,000. What is the cost ratio (CTN − CFP) / (CTP − CFN)?", "options": ["1/3", "3", "−1/3", "7/10"], "answer": 0, "explain": "(0 − 100) / (700 − 1,000)에서 분자와 분모가 모두 음수이므로 1/3이다. 부호를 확인하는 것이 핵심이다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 바항"}, {"id": "h-08", "course": "hpm570", "week": "7w", "topic": "Is LR = 1 the best cutoff?", "importance": 3, "why": "수업 강조 · 7주차", "type": "tf", "q": "The optimal cutoff is always the result whose likelihood ratio equals 1.", "options": ["True", "False"], "answer": 1, "explain": "최적 절단점은 사전 오즈의 역수와 비용비의 곱으로 정해지므로 그 곱이 1과 다르면 우도비 1과 다른 곳에 있다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-09", "course": "hpm570", "week": "7w", "topic": "Classify a result", "importance": 3, "why": "계산 · 6~7주차", "type": "mc", "q": "Ferritin example: the threshold LR is 0.5882. How should the result 45-100 (LR 0.4575) and the result 18-45 (LR 3.12) be designated?", "options": ["45-100 negative; 18-45 positive", "Both positive", "Both negative", "45-100 positive; 18-45 negative"], "answer": 0, "explain": "우도비가 0.5882보다 큰 결과만 양성이다. 기대비용으로 구한 결과와 같다.", "concept": "h_formula", "source": "106 Diagnostic Tests, 5절 아항"}, {"id": "h-10", "course": "hpm570", "week": "7w", "topic": "Same test, different cutoff", "importance": 2, "why": "수업 강조 · 7주차", "type": "mc", "q": "Why can the same test have a different optimal cutoff in two populations?", "options": ["Prevalence and the value of the decisions differ, even if test performance is the same", "The test has a different ROC area in each population by definition", "Sensitivity is not defined across populations", "The likelihood ratio of a result changes with prevalence"], "answer": 0, "explain": "검사 성능이 같아도 유병률과 비용비가 다르면 오른쪽 값이 변한다. 우도비 순위는 유병률과 무관하다.", "concept": "h_formula", "source": "107 Positivity Cutoff, 4절"}, {"id": "h-11", "course": "hpm570", "week": "6w", "topic": "Which prevalence goes in Bayes?", "importance": 3, "why": "시험 출제 유형", "type": "mc", "q": "A study oversamples diseased patients (67 with, 65 without disease). The population prevalence is 12.5%. Which value is used as the prior probability?", "options": ["12.5%", "50.8%", "67/65", "The average of 12.5% and 50.8%"], "answer": 0, "explain": "표본의 비율은 표집 설계가 정한 숫자이다. 표본에서는 질병 상태별 결과 분포만 얻는다.", "concept": "h_prev", "source": "106 Diagnostic Tests, 6절 나항"}, {"id": "h-12", "course": "hpm570", "week": "6w", "topic": "What the oversampled table gives", "importance": 3, "why": "2025 중간시험 2 복습 · 문제 1", "type": "mc", "q": "A table has 146 children with acute lead poisoning (ALP) and 146 without; population prevalence is 10%. What can the table legitimately provide?", "options": ["The distribution of blood lead levels within each disease group", "The prevalence of ALP", "The posterior probability of ALP directly", "The treatment threshold"], "answer": 0, "explain": "표는 질병 상태별 혈중 납 분포를 제공한다. 사후확률은 이 분포에 10% 유병률을 결합해야 나온다.", "concept": "h_prev", "source": "903 Midterm 2 review, Q1 / lecrec review session"}, {"id": "h-13", "course": "hpm570", "week": "6w", "topic": "Prevalence versus threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, prevalence falls from 10% to 5%. What changes?", "options": ["Posterior probabilities change; the 9.71% treatment threshold does not", "The treatment threshold falls", "The harm probabilities change", "Nothing changes"], "answer": 0, "explain": "유병률은 사후확률을 변화시킨다. 기준선은 치료의 이익과 해악에서 나오므로 그대로이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part B"}, {"id": "h-14", "course": "hpm570", "week": "6w", "topic": "Toxicity and the threshold", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "In the lead example, EDTA toxicity falls from 5% to 2.5%. What happens to the treatment threshold?", "options": ["It falls to about 4.93%", "It stays at 9.71%", "It rises above 9.71%", "The posterior probabilities change but the threshold does not"], "answer": 0, "explain": "독성이 줄면 치료의 해악이 작아져 더 낮은 사후확률에서도 치료가 유리하다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Part C"}, {"id": "h-15", "course": "hpm570", "week": "6w", "topic": "Threshold by expected harm", "importance": 3, "why": "계산 · 2025 시험", "type": "mc", "q": "Harm with EDTA: 33.5% if ALP, 5% if not. Harm without EDTA: 80% if ALP, 0% if not. At what posterior probability P of ALP are the two options equal?", "options": ["About 9.71%", "About 33.5%", "About 5%", "About 51.5%"], "answer": 0, "explain": "0.05 + 0.285P = 0.8P에서 P = 0.05/0.515로 약 9.71%이다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 4"}, {"id": "h-16", "course": "hpm570", "week": "6w", "topic": "Combining two harms", "importance": 2, "why": "2025 시험 · 계산 함정", "type": "mc", "q": "A child with ALP given EDTA has a 30% risk of lead complications and a 5% risk of toxicity. Why is the chance of at least one harm not 35%?", "options": ["The same child could have both, so use 1 − 0.70 × 0.95 = 33.5%", "The risks are mutually exclusive", "Toxicity only applies to children without ALP", "Rounding error in the exam"], "answer": 0, "explain": "두 해악이 한 아이에게 함께 생길 수 있으므로 둘 다 없을 확률을 빼서 계산한다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q1 Step 3"}, {"id": "h-17", "course": "hpm570", "week": "7w", "topic": "Appendectomy: which factor lowers the cutoff", "importance": 3, "why": "2025 시험 · 문제 2", "type": "mc", "q": "Older adults: appendicitis is rarer, but missing it is far deadlier. Which factor alone favors a LOWER score cutoff (more surgeries)?", "options": ["Higher mortality when appendicitis is missed (false negative)", "Lower prevalence of appendicitis", "Higher mortality from unnecessary surgery (false positive)", "Higher mortality from surgery in true cases"], "answer": 0, "explain": "놓친 환자의 사망률이 높으면 수술 기준을 낮추는 쪽이 유리하다. 나머지 세 요인은 기준을 높인다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2 Step 2"}, {"id": "h-18", "course": "hpm570", "week": "7w", "topic": "Probability threshold versus score cutoff", "importance": 3, "why": "2025 시험 · 반복 강조", "type": "mc", "q": "The posterior thresholds are 5.15% (younger) and 6.1% (older adults). Why can the question not give an actual score cutoff?", "options": ["Age-specific prevalence and the likelihood ratios of the scores are not given", "The thresholds are too close to each other", "Mortality rates cannot be converted to probabilities", "The score cutoff is the same as the threshold"], "answer": 0, "explain": "확률 기준선을 점수로 옮기려면 연령별 유병률과 점수의 우도비가 필요하다. 빠진 자료를 밝히는 것이 정답에 포함된다.", "concept": "h_thresh", "source": "Midterm 2 review session, Q2"}, {"id": "h-19", "course": "hpm570", "week": "7w", "topic": "What EVPI is", "importance": 3, "why": "7주차 슬라이드 · 정보의 가치", "type": "mc", "q": "What is the expected value of perfect information (EVPI)?", "options": ["An upper bound on what any test or indicator can add", "The value of the best available test", "The cost of a perfect test", "The expected harm of using no information"], "answer": 0, "explain": "완전정보 전략에서 정보 없는 최선을 뺀 값이며 어떤 검사도 이를 넘지 못한다.", "concept": "h_evpi", "source": "107 Positivity Cutoff, 5절"}, {"id": "h-20", "course": "hpm570", "week": "6w", "topic": "When a test has value", "importance": 3, "why": "6주차 요약 · 계산 연결", "type": "mc", "q": "When does a diagnostic test have value for a decision?", "options": ["When the best action differs depending on the result", "When its sensitivity is above 90%", "When its ROC area is above 0.5", "When it costs less than treatment"], "answer": 0, "explain": "모든 결과에서 같은 행동이 최적이면 검사 결과를 알아도 최선의 결정이 달라지지 않으므로 가치가 0이다.", "concept": "h_evpi", "source": "106 Diagnostic Tests, 요약과 6절"}, {"id": "h-21", "course": "hpm570", "week": "8w", "topic": "Which analysis uses QALYs", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "Which type of economic evaluation expresses outcomes as quality-adjusted life-years?", "options": ["Cost-utility analysis", "Cost-effectiveness analysis in natural units", "Cost-benefit analysis", "Cost-consequences analysis"], "answer": 0, "explain": "효용으로 보정한 QALY를 결과로 쓰는 분석이 비용효용분석이다.", "concept": "h_types", "source": "212 Basic Types, 9절"}, {"id": "h-22", "course": "hpm570", "week": "8w", "topic": "Which analysis uses money", "importance": 3, "why": "8주차 읽을거리", "type": "mc", "q": "In which analysis are both costs and consequences measured in monetary units?", "options": ["Cost-benefit analysis", "Cost-effectiveness analysis", "Cost-utility analysis", "Cost-minimization analysis"], "answer": 0, "explain": "비용과 결과를 모두 화폐로 재서 순편익이나 편익 대 비용의 비로 적는 것이 비용편익분석이다.", "concept": "h_types", "source": "212 Basic Types, 10절"}, {"id": "h-23", "course": "hpm570", "week": "8w", "topic": "Full versus partial evaluation", "importance": 2, "why": "8주차 읽을거리", "type": "tf", "q": "A study that reports the cost and outcomes of one program, without comparing it to an alternative, is a full economic evaluation.", "options": ["True", "False"], "answer": 1, "explain": "완전한 경제성 평가는 둘 이상의 대안을 비교하고 비용과 결과를 함께 본다. 하나만 적은 연구는 부분 평가이다.", "concept": "h_types", "source": "212 Basic Types, 6절"}, {"id": "h-24", "course": "hpm570", "week": "9w", "topic": "The colleague's error", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Biennial screening costs $25,000 for 8 QALYs; annual costs $50,000 for 9 QALYs. A colleague picks biennial for its lower average cost per QALY. What is the correct reading?", "options": ["The ICER is $25,000 per QALY; the choice depends on willingness to pay", "Biennial is always better because its average ratio is lower", "Annual is better because it has more QALYs", "Annual is dominated by biennial"], "answer": 0, "explain": "평균비는 각 사업을 따로 본 값이다. 추가 1 QALY에 추가 $25,000이 들며, 지불의사가 이보다 크면 매년 검진이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part A"}, {"id": "h-25", "course": "hpm570", "week": "9w", "topic": "Incremental NMB", "importance": 3, "why": "2025 시험 · 문제 3", "type": "mc", "q": "Same programs. Willingness to pay is $30,000 per QALY. What is the incremental net monetary benefit of annual versus biennial?", "options": ["+$5,000, so annual is preferred", "−$5,000, so biennial is preferred", "$0, so they tie", "+$25,000, so annual is preferred"], "answer": 0, "explain": "증분 순화폐편익은 30,000 × 1 − 25,000으로 +5,000이어서 비싼 쪽이 유리하다.", "concept": "h_icer", "source": "Midterm 2 review session, Q3 Part B"}, {"id": "h-26", "course": "hpm570", "week": "9w", "topic": "What a ratio can hide", "importance": 2, "why": "9주차 읽을거리", "type": "tf", "q": "A ratio of $50,000 per QALY always means the program costs more and also adds more health.", "options": ["True", "False"], "answer": 1, "explain": "비용 감소를 효과 감소로 나눠도 같은 비율이 산출되므로 비율만으로는 방향을 판단할 수 없다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 12절"}, {"id": "h-27", "course": "hpm570", "week": "9w", "topic": "Spotting extended dominance", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "Costs and QALYs: A $25,000 and 8; B $50,000 and 9; C $55,000 and 9.5. The ICER of A to B is $25,000 and of B to C is $10,000. What follows?", "options": ["B is extended dominated and is removed", "A is dominated and is removed", "C is dominated and is removed", "All three stay on the frontier"], "answer": 0, "explain": "증분비가 내려가면 가운데 대안 B가 확장 지배된다. 더 비싸고 더 효과적이어도 제외 대상이다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C"}, {"id": "h-28", "course": "hpm570", "week": "9w", "topic": "Recompute after removal", "importance": 3, "why": "2025 시험 · 문제 3 Part C", "type": "mc", "q": "After removing B, what is the ICER of C versus A?", "options": ["$20,000 per QALY", "$10,000 per QALY", "$25,000 per QALY", "$30,000 per QALY"], "answer": 0, "explain": "(55,000 − 25,000) / (9.5 − 8) = 20,000이다. 제외 전의 값으로 비교하면 오답이 된다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 3"}, {"id": "h-29", "course": "hpm570", "week": "9w", "topic": "The mixed strategy", "importance": 3, "why": "2025 시험 · 확장 지배 예시", "type": "mc", "q": "Give 2/3 of patients strategy C and 1/3 strategy A. What are the average QALYs and cost?", "options": ["9.0 QALYs and $45,000, which beats B", "9.5 QALYs and $55,000", "8.5 QALYs and $40,000", "9.0 QALYs and $50,000"], "answer": 0, "explain": "섞으면 B와 같은 9.0 QALY를 더 싼 $45,000에 얻으므로 B는 효율적 프론티어에 오르지 못한다.", "concept": "h_dom", "source": "Midterm 2 review session, Q3 Part C Step 2"}, {"id": "h-30", "course": "hpm570", "week": "9w", "topic": "Simple versus extended dominance", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "How does extended dominance differ from simple dominance?", "options": ["The option is more costly and more effective, but its ICER is higher than the next option's", "The option is more costly and less effective", "The option is cheaper and less effective", "The option has a negative ICER"], "answer": 0, "explain": "단순 지배는 더 비싸면서 효과가 적은 경우이고, 확장 지배는 더 많이 얻지만 다른 대안보다 단위당 비싸다.", "concept": "h_dom", "source": "217 Incremental CEA, 10절"}, {"id": "h-31", "course": "hpm570", "week": "9w", "topic": "Cost-saving programs", "importance": 3, "why": "9주차 읽을거리", "type": "mc", "q": "When choosing among independent programs under a budget, which program is selected whatever the budget?", "options": ["One that saves money and adds some benefit", "One with the lowest cost", "One with the largest effect", "One with the highest ratio"], "answer": 0, "explain": "비용을 아끼면서 효과도 있는 사업은 자원을 쓰지 않으므로 예산과 무관하게 고른다.", "concept": "h_budget", "source": "217 Incremental CEA, 3절"}, {"id": "h-32", "course": "hpm570", "week": "9w", "topic": "The last program funded", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What does the cost-effectiveness ratio of the last program funded represent?", "options": ["The opportunity cost of resources, which changes with the budget", "A fixed threshold for all decisions", "The average ratio of all funded programs", "The ratio of the cheapest program"], "answer": 0, "explain": "한계 비용효과비는 예산에 따라 달라지는 값이며 고정된 기준값이 아니다.", "concept": "h_budget", "source": "217 Incremental CEA, 5절과 14절"}, {"id": "h-33", "course": "hpm570", "week": "9w", "topic": "Average versus incremental ratio", "importance": 3, "why": "9주차 읽을거리 · 반례", "type": "mc", "q": "M1 costs $100,000 for 10 QALYs. M2 costs $10,000 more and adds 0.001 QALY. What is the incremental ratio of M2?", "options": ["$10,000,000 per QALY", "$10,999 per QALY", "$1,000 per QALY", "$100,000 per QALY"], "answer": 0, "explain": "증분비는 10,000 / 0.001이다. 평균비 $10,999만 보면 M2가 유리해 보이지만 판단은 증분비로 한다.", "concept": "h_budget", "source": "217 Incremental CEA, 8절"}, {"id": "h-34", "course": "hpm570", "week": "9w", "topic": "Assumptions of the budget rule", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "The rule of funding programs in order of incremental ratio until the budget is spent assumes:", "options": ["Perfect divisibility and constant returns to scale", "Equal costs for all programs", "Mutually exclusive programs only", "A fixed willingness to pay set by law"], "answer": 0, "explain": "규모를 줄여도 비용효과가 변하지 않는다는 두 가정이 성립하지 않으면 더 복잡한 접근이 필요하다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 6절"}, {"id": "h-35", "course": "hpm570", "week": "9w", "topic": "Shadow price", "importance": 2, "why": "9주차 읽을거리", "type": "mc", "q": "What is the shadow price implied by a budget?", "options": ["The most the decision maker is willing to pay per unit of effect, implied by the budget size", "A price found by the analysis from data", "The cost of the cheapest program", "The average cost per QALY"], "answer": 0, "explain": "잠재가격은 예산 크기가 함의하는 지불 한도이며 자료에서 구한 값이 아니다.", "concept": "h_pitfall", "source": "218 Interpreting ICERs, 8절"}, {"id": "e-01", "course": "ehs502", "week": "1w", "topic": "ORS and SGLT1", "importance": 3, "why": "1주와 4주에 반복된 공중보건 사례", "type": "mc", "q": "Why does an oral rehydration solution contain glucose as well as salt?", "options": ["Glucose and sodium are absorbed together by SGLT1, which raises water absorption", "Glucose is toxic to Vibrio cholerae and shortens the infection", "Glucose replaces the potassium lost in diarrheal stool", "Glucose slows intestinal motility and so reduces stool volume"], "answer": 0, "explain": "소장의 나트륨-포도당 공동수송체 1(SGLT1)은 나트륨과 포도당을 함께 흡수하고, 이 흡수가 물의 흡수를 증가시킨다. 경구수액염은 세균을 제거하지 못하므로 포도당의 역할은 흡수 촉진이다.", "concept": "e_ors", "source": "_wiki/104_4w 14절 바, 101_1w 4절 마"}, {"id": "e-02", "course": "ehs502", "week": "1w", "topic": "ORS and SGLT1", "importance": 3, "why": "교수가 두 회차에서 강조", "type": "tf", "q": "Oral rehydration solution cures cholera by clearing the bacteria from the gut.", "options": ["True", "False"], "answer": 1, "explain": "ORS는 콜레라균을 치료하지 못하며, 설사가 진행되는 동안 수분 손실을 보충하여 중증도와 사망을 줄인다. 회복에 필요한 시간을 확보하는 것이 ORS의 효과이다.", "concept": "e_ors", "source": "_wiki/101_1w 4절 마, 104_4w 14절 바"}, {"id": "e-03", "course": "ehs502", "week": "1w", "topic": "ORS delivery", "importance": 2, "why": "공중보건 보급 전략 사례", "type": "mc", "q": "How did Bangladesh spread the ORS recipe during 1993-1994?", "options": ["By mailing sealed ORS packets made by WHO to every household", "By printing the recipe on every letter handled by the postal system", "By requiring pharmacies to sell ORS at a fixed low price", "By adding salt and sugar to the public water supply"], "answer": 1, "explain": "방글라데시는 우체국 체계로 모든 편지에 조리법을 인쇄하여 보급하였다. 가정과 지역사회가 기억한 조리법은 기업이 공급하는 봉지보다 오래 지속되었다.", "concept": "e_ors", "source": "_wiki/101_1w 4절 마"}, {"id": "e-04", "course": "ehs502", "week": "2w", "topic": "Skin barrier lipids", "importance": 3, "why": "피부 장벽 기능의 핵심", "type": "mc", "q": "In the stratum corneum, what plays the role of the \"mortar\" between the corneocyte \"bricks\"?", "options": ["Keratin filaments inside each corneocyte", "Melanin granules transferred from melanocytes", "Lipids from lamellar bodies: ceramides, fatty acids and cholesterol", "Collagen and elastin fibers from the dermis"], "answer": 2, "explain": "각질형성세포가 분비하는 층판소체(lamellar body)의 지질이 각질세포 사이를 채우며, 세라마이드, 지방산, 콜레스테롤의 조성이 장벽 기능을 결정한다. 콜라겐과 엘라스틴은 진피의 구조 단백질이다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 나"}, {"id": "e-05", "course": "ehs502", "week": "2w", "topic": "Routes of skin exposure", "importance": 3, "why": "노출 경로의 공중보건 의미", "type": "mc", "q": "A chemical reaches deeper skin layers by passing along hair follicles, sebaceous glands and sweat ducts. Which route is this?", "options": ["Intracellular route", "Intercellular route", "Transvascular route", "Transappendageal route"], "answer": 3, "explain": "모낭, 피지샘, 땀관을 경유하는 경로는 부속기 경로(transappendageal route)이다. 세포간 경로는 각질세포 사이의 지질 기질을 경유한다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 라"}, {"id": "e-06", "course": "ehs502", "week": "2w", "topic": "Barrier repair", "importance": 2, "why": "장벽 손상 뒤 연쇄 반응", "type": "tf", "q": "When the skin barrier is breached, the granular layer releases most of its lamellar body stores within minutes.", "options": ["True", "False"], "answer": 0, "explain": "상처가 생기면 과립층이 층판소체 저장분의 80%를 몇 분 안에 분비하여 틈을 채운다. 이 반응은 경표피 수분 손실과 칼슘 기울기 소실이 촉발한다.", "concept": "e_skin", "source": "_wiki/102_2w 6절 나ㆍ라"}, {"id": "e-07", "course": "ehs502", "week": "2w", "topic": "Vitamin D pathway", "importance": 3, "why": "일광 노출 역설의 핵심 기전", "type": "mc", "q": "Where does the second hydroxylation that forms active vitamin D (1α,25(OH)2D3) take place?", "options": ["Kidney", "Liver", "Small intestine", "Skin"], "answer": 0, "explain": "비타민 D3는 간에서 25-수산화효소로 25(OH)D3가 된 뒤 신장에서 1α-수산화효소로 활성형이 된다. 부갑상선 호르몬이 신장의 이 단계를 조절한다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 마"}, {"id": "e-08", "course": "ehs502", "week": "2w", "topic": "UVA and UVB", "importance": 3, "why": "자외선 구분은 반복 출제 유형", "type": "mc", "q": "Which statement about UVA and UVB matches the lecture?", "options": ["UVA drives vitamin D synthesis in the dermis", "UVB reaches only the epidermis and drives vitamin D synthesis", "UVB breaks down dermal collagen over decades", "Both are equally available year-round at northern latitudes"], "answer": 1, "explain": "UVB는 표피까지만 침투하여 비타민 D 합성을 유발하고, UVA는 진피까지 침투하여 수십 년에 걸쳐 콜라겐과 엘라스틴을 분해한다. 북위도의 겨울에는 UVB가 거의 없다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 나"}, {"id": "e-09", "course": "ehs502", "week": "2w", "topic": "Skin type and vitamin D", "importance": 3, "why": "형평 관점의 공중보건 쟁점", "type": "mc", "q": "Estimated UVB time needed for 1,000 IU of vitamin D per day rises from about 5 minutes (skin type 1) to about 25 minutes (type 6). Why?", "options": ["Darker skin has fewer keratinocytes in the spinous layer", "Darker skin lacks 7-dehydrocholesterol", "Melanin absorbs UVB and lowers synthesis per minute of exposure", "The liver hydroxylates vitamin D more slowly in darker skin"], "answer": 2, "explain": "멜라닌이 UVB를 흡수하여 같은 노출 시간의 합성량을 줄이므로 짙은 피부일수록 더 긴 노출이 필요하다. 7-디하이드로콜레스테롤과 간의 수산화 반응은 피부색과 관계없이 동일하게 진행된다.", "concept": "e_vitd", "source": "_wiki/102_2w 12절 마(2)"}, {"id": "e-10", "course": "ehs502", "week": "2w", "topic": "Sweat rate and sodium", "importance": 3, "why": "열 손상과 전해질 보충", "type": "mc", "q": "Why does sodium loss in sweat rise when the sweat rate is high?", "options": ["High sweat rates activate sodium pumps that secrete more sodium", "Sweat glands switch from eccrine to apocrine secretion", "Aldosterone falls during heavy sweating", "The duct has less time to reabsorb sodium and chloride"], "answer": 3, "explain": "땀관은 분비 속도에 맞추어 나트륨과 염소를 재흡수하므로, 분비가 빠르면 재흡수 시간이 짧아 손실이 증가한다. 따라서 땀이 많은 활동에서는 전해질 보충이 필요하다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(2)"}, {"id": "e-11", "course": "ehs502", "week": "2w", "topic": "Sweat gland recruitment", "importance": 2, "why": "증발 냉각의 조절 순서", "type": "mc", "q": "How does the body first raise sweat output when heat load increases?", "options": ["By recruiting more sweat glands, then raising output per gland", "By raising output per gland only", "By converting sebaceous glands into sweat glands", "By lowering skin blood flow to concentrate sweat"], "answer": 0, "explain": "처음에는 많은 땀샘을 동원하여 땀의 양을 빠르게 늘리고, 그 뒤에 땀샘마다 분비량을 늘린다. 사람에게는 외분비 땀샘이 200만~400만 개 있다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(1)"}, {"id": "e-12", "course": "ehs502", "week": "2w", "topic": "Heat acclimatization", "importance": 3, "why": "적응과 가소성 주제의 사례", "type": "tf", "q": "In heat-acclimatized people, sweat ducts conserve more sodium and chloride.", "options": ["True", "False"], "answer": 0, "explain": "열에 적응한 사람은 시간당 2~3 L의 땀을 분비하면서도 땀관이 나트륨과 염소를 보존한다. 이 변화는 1주차의 적응과 가소성 주제에 해당한다.", "concept": "e_sweat", "source": "_wiki/102_2w 9절 나(2)"}, {"id": "e-13", "course": "ehs502", "week": "3w", "topic": "Ectopic fat", "importance": 3, "why": "지방조직의 질 개념", "type": "mc", "q": "Under the \"glass full\" model of subcutaneous fat, where is extra fat stored once subcutaneous capacity is reached?", "options": ["Only in brown adipose tissue", "First in visceral fat, then in ectopic sites such as liver, muscle and pancreas", "In bone marrow before any other site", "It is excreted in bile as cholesterol"], "answer": 1, "explain": "피하 저장 용량이 소진되면 지방은 먼저 내장에, 이어 간, 근육, 췌장 같은 이소성 부위에 축적된다. 이소성 지방은 이상지질혈증과 인슐린 저항성을 동반한다.", "concept": "e_fat", "source": "_wiki/103_3w 5절 나"}, {"id": "e-14", "course": "ehs502", "week": "3w", "topic": "Ectopic fat", "importance": 2, "why": "용량 모형의 근거", "type": "mc", "q": "Thiazolidinedione (TZD) diabetes drugs support the capacity model because they:", "options": ["Destroy visceral adipocytes", "Block fat absorption in the small intestine", "Induce adipocyte hyperplasia and shift fat from visceral to subcutaneous depots", "Convert white adipose tissue into muscle"], "answer": 2, "explain": "티아졸리딘디온은 지방세포 증식을 유도하여 지방을 내장에서 피하로 이동시켰다. PPAR-감마 결함이 피하 저장을 제한하여 내장과 이소성 축적을 증가시키는 것도 같은 모형의 근거이다.", "concept": "e_fat", "source": "_wiki/103_3w 5절 나"}, {"id": "e-15", "course": "ehs502", "week": "6w", "topic": "NAFLD progression", "importance": 3, "why": "간 대사 모듈의 질환 연결", "type": "mc", "q": "What is the order of progression in non-alcoholic fatty liver disease?", "options": ["Fibrosis, steatosis, steatohepatitis, insulin resistance", "Insulin resistance, steatosis, steatohepatitis, fibrosis", "Steatohepatitis, insulin resistance, fibrosis, steatosis", "Steatosis, fibrosis, insulin resistance, steatohepatitis"], "answer": 1, "explain": "진행 순서는 인슐린 저항성, 지방증(steatosis), 지방간염(steatohepatitis), 섬유화, 간경변이다. 단순 지방증이 반드시 다음 단계로 진행하는 것은 아니다.", "concept": "e_fat", "source": "_wiki/106_6w 8절 라"}, {"id": "e-16", "course": "ehs502", "week": "6w", "topic": "NAFLD progression", "importance": 3, "why": "예방 시점 판단의 근거", "type": "mc", "q": "According to the lecture, which stage of fatty liver disease is no longer reversible once established?", "options": ["Simple steatosis", "Insulin-resistant adipose tissue", "Compensated steatosis", "Fibrosis"], "answer": 3, "explain": "앞 단계의 변화는 되돌릴 수 있으나 섬유화가 고착되면 흉터 조직은 재생되지 않는다. 따라서 중재는 섬유화 이전 단계에서 효과가 크다.", "concept": "e_fat", "source": "_wiki/106_6w 8절 라"}, {"id": "e-17", "course": "ehs502", "week": "3w", "topic": "Size principle", "importance": 3, "why": "근육 모듈의 공중보건 질문", "type": "mc", "q": "Why does the lecture argue that resistance exercise matters for public health in older adults?", "options": ["Heavy efforts recruit type II fibers, which aging loses most", "Daily activities already recruit all fiber types fully", "Resistance exercise raises the number of muscle fibers formed after birth", "Type I fibers cannot adapt to any training"], "answer": 0, "explain": "걷기와 청소 같은 일상 활동에는 대부분 type I 섬유가 동원되므로 type II 섬유는 큰 힘을 내는 활동에서만 동원된다. 노화에서 주로 소실되는 운동신경이 type II이므로 저항운동이 필요하다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 나"}, {"id": "e-18", "course": "ehs502", "week": "3w", "topic": "Fiber types", "importance": 2, "why": "훈련 적응의 기초", "type": "mc", "q": "Which muscle fiber type shows the greatest plasticity, adapting toward either endurance or power with training?", "options": ["Type I", "Type IIa", "Type IIx", "Type IIb"], "answer": 1, "explain": "Type IIa는 훈련 자극에 따라 유산소 쪽이나 순발력 쪽으로 적응하여 가소성이 가장 크다. Type I은 피로에 강한 유산소 섬유이다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 가"}, {"id": "e-19", "course": "ehs502", "week": "3w", "topic": "Organophosphate poisoning", "importance": 3, "why": "직업ㆍ환경 노출과 근육 취약성", "type": "mc", "q": "How do organophosphate pesticides disrupt skeletal muscle?", "options": ["They block calcium release from the sarcoplasmic reticulum", "They destroy motor neuron cell bodies in the spinal cord", "They inhibit acetylcholinesterase, so acetylcholine builds up and muscle keeps firing", "They block glucose uptake into type I fibers"], "answer": 2, "explain": "유기인계는 아세틸콜린에스터레이스를 억제하여 아세틸콜린이 분해되지 않고 축적되므로 근육이 계속 발화하고 이완하지 못한다. 연간 사망자 대부분은 자살이므로 중재는 접근 통제와 자살 예방을 포함하여야 한다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 바"}, {"id": "e-20", "course": "ehs502", "week": "3w", "topic": "Motor units", "importance": 2, "why": "운동단위 구조", "type": "tf", "q": "For fine control such as eye movement, one motor neuron innervates thousands of muscle fibers.", "options": ["True", "False"], "answer": 1, "explain": "눈 근육처럼 정교한 조절이 필요한 곳은 운동신경과 근섬유의 비율이 일대일에 가깝다. 한 운동신경이 많은 섬유를 지배하는 구조는 큰 힘을 내는 동작에 해당한다.", "concept": "e_muscle", "source": "_wiki/103_3w 10절 나"}, {"id": "e-21", "course": "ehs502", "week": "4w", "topic": "Gastric acid and emptying", "importance": 3, "why": "위장관 모듈의 조절 원리", "type": "mc", "q": "What does a protein-rich meal do in the stomach?", "options": ["Lowers acid secretion and speeds gastric emptying", "Lowers acid secretion and slows emptying", "Has no effect on acid but speeds emptying", "Raises acid secretion and slows gastric emptying"], "answer": 3, "explain": "단백질과 펩타이드는 G 세포의 가스트린 분비를 자극하고 완충 작용으로 pH를 올려 산 분비를 높이며, 동시에 위 배출을 늦춘다. 음식이 위에 체류하는 시간이 길어져 병원체 방어가 강화된다.", "concept": "e_acid", "source": "_wiki/104_4w 10절 다, 11절 라"}, {"id": "e-22", "course": "ehs502", "week": "4w", "topic": "Gastric emptying and blood glucose", "importance": 3, "why": "위장관과 혈당 조절의 연결", "type": "mc", "q": "Why does the rate of gastric emptying matter for the post-meal rise in blood glucose?", "options": ["The small intestine can absorb glucose only as fast as the stomach delivers it", "The stomach absorbs most dietary glucose", "Gastric acid converts starch directly into glucose", "Insulin is secreted by the stomach wall"], "answer": 0, "explain": "소장은 위가 배출하는 만큼만 포도당을 흡수하므로 탄수화물이 십이지장에 도착하는 속도가 혈당 상승 속도의 상한이 된다. 지질, 단백질, 섬유가 배출을 늦추면 혈당 반응이 완만해진다.", "concept": "e_acid", "source": "_wiki/104_4w 11절 라"}, {"id": "e-23", "course": "ehs502", "week": "4w", "topic": "Intestinal phase hormones", "importance": 2, "why": "장 단계의 되먹임", "type": "mc", "q": "Which hormones released by the duodenum slow gastric emptying when acid, carbohydrate or lipid arrive?", "options": ["Insulin, glucagon and leptin", "CCK, GIP and secretin", "Gastrin, histamine and acetylcholine", "Cortisol, epinephrine and aldosterone"], "answer": 1, "explain": "십이지장에 산, 탄수화물, 지질이 도착하면 콜레시스토키닌(CCK), 위억제 펩타이드(GIP), 시크레틴이 분비되어 위 운동성과 위산 분비를 억제한다. 가스트린과 히스타민은 위산 분비를 자극하는 신호이다.", "concept": "e_acid", "source": "_wiki/104_4w 11절 라"}, {"id": "e-24", "course": "ehs502", "week": "5w", "topic": "Lipid route", "importance": 3, "why": "강의 노트의 강조 표시(★)", "type": "mc", "q": "Why can fat-soluble toxins eaten with food reach the systemic circulation without first passing through the liver?", "options": ["They are absorbed in the stomach directly into the hepatic vein", "The portal vein carries them around the liver", "Chylomicrons enter lacteals and reach the blood via the thoracic duct", "Bile carries them straight into the bloodstream"], "answer": 2, "explain": "킬로미크론은 모세혈관에 유입되지 못하고 암죽관과 림프를 거쳐 흉관에서 정맥 순환에 합류하므로 문맥과 간의 첫 처리를 우회한다. 지용성 비타민, 콜레스테롤, 지용성 독소가 모두 이 경로로 운반된다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 마"}, {"id": "e-25", "course": "ehs502", "week": "5w", "topic": "Enterohepatic circulation", "importance": 3, "why": "담즙의 경제적 재사용", "type": "mc", "q": "About what share of secreted bile is reabsorbed and returned to the liver each cycle?", "options": ["About 5%", "About 50%", "100%", "About 95%"], "answer": 3, "explain": "분비된 담즙의 95%는 회장의 능동 수송과 대장의 수동 수송으로 흡수되어 문맥을 거쳐 간으로 돌아간다. 대변으로 배설되는 5%는 콜레스테롤과 지용성 독소의 배설 경로이다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 다"}, {"id": "e-26", "course": "ehs502", "week": "5w", "topic": "Enterohepatic circulation", "importance": 2, "why": "담즙 순환의 구조", "type": "tf", "q": "Bile acids are synthesized fresh for each meal and are fully excreted afterward.", "options": ["True", "False"], "answer": 1, "explain": "담즙 풀 3 g은 하루 4~12회 순환하며 재사용되고, 새로 합성되는 양은 하루 0.2~0.6 g이다. 이 순환을 담즙의 장간 순환이라고 한다.", "concept": "e_lipid", "source": "_wiki/105_5w 2절 다"}, {"id": "e-27", "course": "ehs502", "week": "5w", "topic": "Acetaminophen toxicity", "importance": 3, "why": "해독 균형의 대표 사례", "type": "mc", "q": "What causes liver injury after an acetaminophen overdose?", "options": ["Glutathione stores are depleted, so the reactive intermediate NAPQI accumulates", "Sulfate conjugation stops completely", "The drug is excreted unchanged in bile", "Glucuronide conjugates become toxic"], "answer": 0, "explain": "과량 복용 시 글루타티온(GSH)이 고갈되어 CYP2E1이 생성한 반응성 중간체 NAPQI가 축적되어 간을 손상시킨다. 황산 포합은 이미 최대 속도이므로 추가 처리를 감당하지 못한다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 아"}, {"id": "e-28", "course": "ehs502", "week": "5w", "topic": "Phase I reactions", "importance": 3, "why": "강의 노트의 강조 표시(★)", "type": "tf", "q": "Phase I detoxification reactions always make a compound less toxic.", "options": ["True", "False"], "answer": 1, "explain": "1상 반응은 반응성이 높거나 독성이 있는 중간체를 생성할 수 있다. 천연 물질이라는 이유로 안전하다고 판단할 수 없다는 점이 강의의 강조점이다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 가"}, {"id": "e-29", "course": "ehs502", "week": "5w", "topic": "Policy response", "importance": 2, "why": "생리 지식을 정책에 적용한 사례", "type": "mc", "q": "What did the US FDA announce in January 2014 to reduce acetaminophen liver injury?", "options": ["A ban on all over-the-counter acetaminophen", "An end to prescribing combination products with more than 325 mg acetaminophen per unit", "A requirement that acetaminophen be taken with glutathione", "A limit of one bottle per purchase"], "answer": 1, "explain": "FDA는 한 단위당 아세트아미노펜 325 mg 초과 복합 처방 진통제를 더 이상 처방하지 말라고 발표하였다. 아세트아미노펜은 급성 간부전의 가장 많은 원인이다.", "concept": "e_detox", "source": "_wiki/105_5w 8절 아"}, {"id": "e-30", "course": "ehs502", "week": "6w", "topic": "Hepatic glucose output", "importance": 3, "why": "간 대사 모듈의 핵심", "type": "mc", "q": "Overnight and before breakfast, which hepatic process rises to its peak as glycogen stores fall?", "options": ["Glycogenolysis", "Glycogen synthesis", "Gluconeogenesis", "Lipogenesis"], "answer": 2, "explain": "글리코젠 분해는 빠르지만 풀이 한정되어 밤사이 감소하고, 포도당 신생합성이 증가하여 아침 식사 전에 정점을 이룬다. 포도당 신생합성은 에너지가 많이 드는 과정이다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라"}, {"id": "e-31", "course": "ehs502", "week": "6w", "topic": "Hepatic glucose output", "importance": 3, "why": "식후 대사 조절", "type": "mc", "q": "After a meal, what is the main signal that stops the liver from releasing glucose?", "options": ["Glucagon", "Cortisol", "Epinephrine", "Insulin"], "answer": 3, "explain": "식이 포도당이 공급되는 동안 간이 포도당을 생성하면 연료가 중복되므로 두 과정이 억제되어야 하며, 인슐린이 간의 포도당 방출을 차단하는 주된 신호이다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라"}, {"id": "e-32", "course": "ehs502", "week": "6w", "topic": "Gluconeogenesis substrates", "importance": 2, "why": "장기 간 대사 연결", "type": "mc", "q": "Which of these is NOT a substrate for hepatic gluconeogenesis?", "options": ["Free fatty acids", "Alanine", "Glycerol from lipolysis", "Lactate"], "answer": 0, "explain": "포도당 신생합성의 재료는 피루브산, 알라닌, 젖산, 지방분해에서 유래한 글리세롤이다. 유리지방산은 근육의 연료로 쓰이거나 간에서 VLDL 중성지방으로 재조립된다.", "concept": "e_glucose", "source": "_wiki/106_6w 4절 라, 7절 가"}];
const CONCEPTS = [{"id": "c_mi", "title": "Meaningful involvement", "kor": "실질적 참여의 4요건", "week": "7w", "oneline": "EPA는 영향을 받는 지역사회의 의견이 결정에 영향을 미칠 수 있어야 실질적 참여로 정의한다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Opportunity to take part"}, {"t": "Input can influence the decision", "k": 1}, {"t": "Concerns are considered"}, {"t": "Decision makers seek out the affected people"}], "note": "EPA: four conditions of meaningful involvement"}, {"type": "table", "head": ["", "Public relations", "Public participation"], "rows": [["What it does", "Tell the public, explain decisions", "Involve people, weigh their input"], ["Listening session with no response", "Counts", "Does not count"]]}], "points": ["홍보(public relations)는 공중에게 알리는 일이고, 참여는 의견을 받아 결정에 반영하는 일이다.", "응답과 후속 조치가 없는 청취 회의는 실질적 참여에 해당하지 않는다.", "EPA의 정의는 웹사이트에만 게시되어 법적 구속력이 없다."], "terms": [["meaningful involvement", "실질적 참여"], ["listening session", "청취 회의"], ["announce and defend", "먼저 발표하고 방어하는 방식"]], "course": "ehs544"}, {"id": "c_cercla", "title": "CERCLA and cooperation", "kor": "CERCLA와 협력의 유인", "week": "7w", "oneline": "Love Canal 주민 운동의 결과로 1980년에 제정된 CERCLA의 엄격책임과 연대책임은 책임 있는 민간이 정화에 협력할 이유가 된다.", "diagram": [{"type": "flow", "items": [{"t": "Love Canal", "s": "mothers' movement"}, {"t": "CERCLA 1980", "s": "Superfund", "k": 1}, {"t": "Win-win", "s": "liable parties have a reason to help clean up"}]}, {"type": "grid", "items": [{"t": "Current owners"}, {"t": "Former owners"}, {"t": "Arrangers"}, {"t": "Transporters"}], "note": "Liable parties. Liability is strict, joint and several."}], "points": ["책임 당사자는 현재와 과거의 소유자, 폐기물 처리를 위탁한 자, 운반자이다.", "교수는 현 행정부에서도 슈퍼펀드 사업의 지역사회 참여가 서로 이익이 된다고 설명하였다."], "terms": [["strict, joint and several liability", "엄격책임, 연대책임"], ["arranger", "폐기물 처리를 맡긴 자"]], "course": "ehs544"}, {"id": "c_eo", "title": "Executive orders", "kor": "행정명령 12898호에서 14173호까지", "week": "8w", "oneline": "1994년 12898호와 2023년 14096호는 2025년에 모두 철회되었으며, 어느 철회 명령이 어느 명령을 대상으로 하였는지가 핵  Social Vulnerability"}], "points": ["2°C 상승 시 히스패닉과 라틴계는 노동시간이 가장 크게 줄어드는 지역에 거주할 가능성이 43% 더 높다.", "천식과 극한 기온 사망 수치는 다른 영향 항목에서 나온다."], "terms": [["social vulnerability", "사회적 취약성"], ["labor hours", "노동시간"]], "course": "ehs544"}, {"id": "c_lived", "title": "Lived experience as evidence", "kor": "생활경험과 원주민 지식", "week": "8w", "oneline": "실질적 참여는 생활경험과 원주민 지식을 학문적 지식과 함께 증거로 인정하며, 지역사회가 정의한 문제에 대응해야 신뢰를 얻는다.", "diagram": [{"type": "flow", "items": [{"t": "Academic knowledge"}, {"t": "Lived experience and Indigenous knowledge"}, {"t": "Evidence for decisions", "s": "both count", "k": 1}]}, {"type": "table", "head": ["", "What they heard as \"noise\""], "rows": [["Outsiders", "Highway traffic"], ["Residents", "Gunshots"]], "note": "NRZ meeting example"}], "points": ["선별 도구 점수는 지역사회의 지식을 대체하지 못한다.", "9회차 소음 사례에서 주민이 말한 소음은 총소리였다."], "terms": [["lived experience", "생활경험"], ["bidirectional learning", "양방향 학습"]], "course": "ehs544"}, {"id": "c_part", "title": "40 CFR Part 25 and 124", "kor": "40 CFR Part 25와 Part 124", "week": "8w", "oneline": "두 부는 모두 법적 구속력이 있는 규제 요건이며, 시험에서는 두 부의 역할을 반대로 서술한 선택지가 출제된다.", "diagram": [{"type": "table", "head": ["", "40 CFR Part 25", "40 CFR Part 124"], "rows": [["Role", "Why and how the public participates", "EPA permit decision procedures"], ["Covers", "RCRA, SDWA, CWA programs", "RCRA, UIC, NPDES, PSD permits"], ["Key tool", "Responsiveness Summary (§25.8)", "Statement of basis, response to comments"], ["Appeal", "Agency answers input in writing", "Petition for review (§124.19), only if you commented"]], "note": "Both are binding regulatory requirements."}], "points": ["응답 요약서(§25.8)는 활동, 중요한 의견, 기관의 응답이나 거부 이유를 기재한다.", "심사 청구(§124.19)는 의견을 제출하였거나 공청회에 참여한 사람이 할 수 있다."], "terms": [["Responsiveness Summary", "응답 요약서"], ["petition for review", "심사 청구"], ["statement of basis", "근거 설명서"]], "course": "ehs544"}, {"id": "c_ct", "title": "Connecticut EJ law", "kor": "코네티컷 법과 보호의 한계", "week": "8w", "oneline": "코네티컷은 환경정의 지역사회를 법률로 정의한 첫 번째 주이며, 공
