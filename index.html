ide vision and design", "Community fitted into it"], ["Mount Growmore", "Community vision", "Government resources and authority applied to it"]]}, {"type": "grid", "items": [{"t": "B2H", "s": "community-led diagnosis and vision"}, {"t": "CJET", "s": "rule-of-law framework to use the laws"}, {"t": "Breaking Bread", "s": "weekly check-ins across sectors"}], "note": "Three tools that carry the flipped model"}], "points": ["B2H는 지역사회가 주도하는 진단과 비전으로 구성된다.", "CJET는 지역사회가 자신을 위한 법과 자원을 활용하도록 교육한다."], "terms": [["Brownfields to Healthfields (B2H)", "브라운필드에서 헬스필드로"], ["CJET", "시민 정의 참여 교육"], ["NRZ", "근린재활구역"]], "course": "ehs544"}, {"id": "c_roles", "title": "Mount Growmore: who did what", "kor": "주민, 시, EPA의 역할과 현재 상태", "week": "9w", "oneline": "주민의 30년 조직화가 정부의 결정을 이끌었으며, 정화는 완료되었으나 캠퍼스 건물은 계획 단계이다.", "diagram": [{"type": "timeline", "items": [{"d": "", "t": "30 years of resident marches"}, {"d": "", "t": "City and state buy the site", "s": "start of formal public response", "k": 1}, {"d": "", "t": "Debris removed, soil cleaned"}, {"d": "", "t": "EPA and city support the community"}, {"d": "", "t": "Hydroponic and wellness centers", "s": "planned only"}]}, {"type": "table", "head": ["", "Role"], "rows": [["EPA Region 1", "Plain-language guides with the NRZ, site assessment, resources aligned to community goals"], ["City of Bridgeport", "Technical support and resources; the community sets the agenda"]]}], "points": ["시와 주가 민간 소유자에게서 부지를 취득한 것이 공식 대응의 출발이다.", "시는 기술적 지원을 제공하고 의제는 지역사회가 정하였다."], "terms": [["Region 1", "EPA 제1지역사무소"], ["whole health", "전인적 건강"]], "course": "ehs544"}, {"id": "c_knot", "title": "Denials and the knot", "kor": "부정의 6단계와 얽힌 매듭 풀기", "week": "9w", "oneline": "오염 시설과 정부는 부정과 신화로 책임을 피하므로, 자료를 위해 요인, 노출 경로, 건강 영향으로 나누어 단계마다 책임을 묻는다.", "diagram": [{"type": "flow", "items": [{"t": "Hazard", "s": "stationary, mobile, ambient"}, {"t": "Exposure trajectory", "s": "pathway and route", "k": 1}, {"t": "Health impact", "s": "physical and mental"}], "note": "Untying the knot into three steps lets each step be held to account."}], "points": ["부정의 과정은 오염, 노출, 영향, 불균형 부담, 책임, 대응적 웰니스 돌봄의 부정 6단계로 전개된다.", "각 단계는 앞 단계의 부정을 전제로 하므로 오염이 부정되면 그 뒤의 단계도 인정되지 않는다.", "노출 경로는 매체 경로(pathway)와 체내 유입 경로(route)로 구성된다."], "terms": [["arc of injustice", "불의가 전개되는 부정적 과정"], ["exposure trajectory", "노출 경로"], ["cumulative impact", "누적 영향"]], "course": "ehs544"}, {"id": "c_hp2030", "title": "Healthy People 2030 as a policy method", "kor": "기후를 언급하지 않고도 사용할 수 있는 연방 로드맵", "week": "9w", "oneline": "Healthy People 2030은 기후변화를 언급하지 않지만 기후 관련 지표를 포함하므로 현 행정부에서도 사용할 수 있다.", "diagram": [{"type": "table", "head": ["Objective", "Target"], "rows": [["EH-01", "Fewer days of exposure to unhealthy air"], ["EH-03", "More people served by water meeting the Safe Drinking Water Act"], ["EH-04", "Lower blood lead levels in children aged 1 to 5"], ["EH-05", "Less risk from hazardous sites"], ["EH-06", "Fewer toxic pollutants released"]], "note": "Environmental conditions are treated as a social determinant of health."}], "points": ["보건복지부(HHS)가 1980년부터 10년마다 발표하며 2030은 다섯째 판이다.", "SDOH는 건강 형평, 건강 문해력과 함께 3개 우선 영역의 하나이다.", "Healthy People 2040의 목표 개발이 2026년에 시작되므로 건강을 넓게 보는 주체가 지금 참여하여야 한다."], "terms": [["Healthy People 2030", "보건복지부의 10년 단위 국가 건강 목표"], ["social determinants of health (SDOH)", "건강의 사회적 결정요인"], ["10 Essential Public Health Services", "공중보건 10대 필수 서비스"]], "course": "ehs544"}, {"id": "c_brfss", "title": "BRFSS as a policy opening", "kor": "주 추가 문항으로 기후 자료를 확보하는 방법", "week": "9w", "oneline": "BRFSS의 주 추가 문항은 외부 기관도 제안할 수 있고 비용도 크지 않으므로, 기후 모듈이 없는 공백을 메울 수 있는 정책 기회이다.", "diagram": [{"type": "grid", "items": [{"t": "Fixed core", "s": "every state, every year"}, {"t": "Rotating core", "s": "two sets alternating by year"}, {"t": "Emerging core", "s": "up to five late-breaking questions"}, {"t": "State-added questions", "s": "proposed by outside groups, cognitively tested", "k": 1}], "note": "CDC's 2025 module list has no climate change module."}], "points": ["BRFSS는 해마다 성인 면접 40만 건 이상을 완료하는 세계 최대의 지속 건강조사 체계이다.", "캔자스주는 2005년부터 실외 대기질, 건강, 실외 활동에 관한 환경 문항 6개를 추가하였다.", "BRFSS 정신건강 자료와 기상 자료를 결합한 PNAS 연구는 기후 스트레스 요인이 정신건강을 위협한다는 근거를 제시하였다."], "terms": [["Behavioral Risk Factor Surveillance System (BRFSS)", "행동위험요인감시체계"], ["state-added questions", "주 추가 문항"], ["cognitive testing", "인지 검사"]], "course": "ehs544"}, {"id": "c_hrsa", "title": "HRSA data and health centers", "kor": "보건센터 자료와 부족 지역 지정의 활용", "week": "9w", "oneline": "UDS, HPSA, MUA/MUP 자료로 의료 공백을 확인하고, 공중보건서비스법 제330조가 보건센터 기후 대응의 근거가 된다.", "diagram": [{"type": "table", "head": ["Source", "What it shows", "Class 9 use"], "rows": [["UDS", "Health center patients, services, outcomes, costs", "Gaps in care delivery"], ["HPSA", "Shortage of primary care, dental, mental health staff", "Keystone Pipeline EIS mitigation"], ["MUA/MUP", "Groups without access to primary care", "A directional signal for further review"]], "note": "Section 330 of the Public Health Service Act is the rule-of-law basis for health center climate work."}], "points": ["FQHC 이사회 구성원의 51%는 법률에 따라 그 센터가 진료하는 지역사회 출신이어야 한다.", "UDS 매퍼에 반영되었던 EPA NATA의 3개 지표는 이후 매퍼가 변경되면서 삭제되었다.", "Bridgeport East End는 HPSA로 지정되었으나 MUA로는 지정되지 않았으므로, 지정은 추가 검토를 요구하는 방향 신호로 읽는다."], "terms": [["Uniform Data System (UDS)", "통합자료체계"], ["Health Professional Shortage Area (HPSA)", "보건의료인력 부족 지역"], ["Medically Underserved Area/Population (MUA/MUP)", "의료 취약 지역ㆍ인구"]], "course": "ehs544"}, {"id": "c_guard", "title": "Guardrails for data", "kor": "자료를 사용할 때 함께 검토할 다섯 가지", "week": "9w", "oneline": "자료의 출처, 공백, 편향의 원천, 용도, 정책적 함의를 모두 검토하여야 코끼리의 한 부분이 아닌 전체를 볼 수 있다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Sources of data"}, {"t": "Data gaps"}, {"t": "Sources of bias"}, {"t": "Uses of data"}, {"t": "Policy implications", "k": 1}], "note": "Blind men and the elephant: one part alone misleads."}], "points": ["자료는 사람들에게 도움이 될 때에만 유용하다.", "공개 자료를 해마다 의회도서관에 제출하여 기록으로 보존하자는 제안이 좋은 정책 권고로 평가되었다."], "terms": [["guardrail considerations", "자료의 안전장치 고려사항"], ["data gaps", "자료 공백"], ["sources of bias", "편향의 원천"]], "course": "ehs544"}, {"id": "c_vbc", "title": "Value-based care", "kor": "질과 결과에 지급하는 지불 모형", "week": "10w", "oneline": "가치기반 의료는 질과 결과에 연동하여 지급하며, 근거 법률이 있어 정권이 바뀌어도 유지된다.", "diagram": [{"type": "table", "head": ["", "Fee for service", "Value-based care"], "rows": [["Pays for", "Volume and type of services", "Quality, performance, patient experience"], ["Aim", "More services billed", "Lower cost, better care, healthier populations"]], "note": "Laws: MIPPA 2008, ACA 2010, PAMA 2014, MACRA 2015. CMMI tests new models."}], "points": ["행위별 수가제는 제공된 서비스의 양과 종류에만 지급하고, 가치기반 의료는 더 낮은 비용, 개인에 대한 더 나은 진료, 인구 집단의 더 나은 건강을 목표로 한다.", "MIPPA(2008), ACA(2010), PAMA(2014), MACRA(2015)가 가치기반 프로그램의 근거 법률이고, CMMI가 새 지불 모형을 시험한다.", "측정한 것만 얻는 문제가 있으므로 당뇨병처럼 생체지표가 분명한 분야에서 개념 증명을 하나씩 쌓아야 한다."], "terms": [["value-based care (VBC)", "가치기반 의료"], ["fee for service (FFS)", "행위별 수가제"], ["cobra effect", "코브라 효과"]], "course": "ehs544"}, {"id": "c_1115", "title": "Medicaid 1115 waivers", "kor": "Medicaid 요건을 면제하여 새 방식을 시험하는 권한", "week": "10w", "oneline": "Social Security Act 제1115조에 근거하므로 대통령이 폐지할 수 없고, 오리건주가 이 면제로 기후 관련 노출을 처음 보장하였다.", "diagram": [{"type": "flow", "items": [{"t": "Social Security Act §1115", "s": "binding congressional authority"}, {"t": "HHS Secretary waives Medicaid rules", "s": "likely to promote Medicaid objectives"}, {"t": "State tests eligibility, benefits, care delivery", "k": 1}], "note": "Oregon first: air conditioners, air filters, heaters, mini-fridges, portable power (adaptation only)."}], "points": ["보건복지부 장관은 일정한 연방 Medicaid 요건을 면제할 수 있고, CMS는 제안이 Medicaid의 목적 증진에 도움이 될 가능성이 높다고 판단하여야 한다.", "오리건주는 에어컨, 공기 정화 장치, 난방기, 소형 냉장고, 휴대용 전원 장치를 보장하였으나 이는 적응 조치이며 완화를 대상으로 하는 주는 아직 없다.", "완화의 선택지로는 전기 차량 이송 계약, 에너지 효율적 기기 구매, 식물성이나 지역산 식사 같은 급여 변경이 제시되었다."], "terms": [["Section 1115 waiver", "1115 면제"], ["health-related social needs (HRSN)", "건강 관련 사회적 필요"], ["budget neutral", "예산 중립"]], "course": "ehs544"}, {"id": "c_zcode", "title": "ICD-10 Z codes", "kor": "건강에 영향을 미치는 요인을 기록하는 코드", "week": "10w", "oneline": "Z 코드의 상위 코드는 청구할 수 없으나 구체적인 하위 코드는 청구할 수 있는데도 활용률은 1.6~1.9%에 그친다.", "diagram": [{"type": "table", "head": ["Code", "Exposure", "Billable"], "rows": [["Z77.11", "Environmental pollution", "No"], ["Z77.110", "Air pollution", "Yes"], ["Z77.111", "Water pollution", "Yes"], ["Z77.112", "Soil pollution", "Yes"], ["Z77.118", "Other environmental pollution", "Yes"]], "note": "A highway with no cars: Z code use is only 1.6–1.9%."}], "points": ["SDOH 관련 Z 코드는 Z55부터 Z65까지이며 ICD-10-CM 제21장(Z00-Z99)에 속한다.", "Z77.11(환경오염 노출)은 청구할 수 없으나 대기오염 Z77.110, 수질오염 Z77.111, 토양오염 Z77.112 노출 코드는 청구할 수 있다.", "CMS 안내 자료는 SDOH 자료가 더 나은 결과에 이르는 과정을 수집, 기록, 대응, 활용, 보고의 5단계로 정리한다."], "terms": [["Z codes", "Z 코드"], ["billable code", "청구 가능 코드"], ["Local Coverage Determination (LCD)", "지역 보장 결정"]], "course": "ehs544"}, {"id": "c_reframe", "title": "Reframing the same intervention", "kor": "같은 개입을 새로 선호되는 표현으로 바꾸기", "week": "10w", "oneline": "식품 프로그램을 당뇨병 예방으로, 대기질 개입을 천식 예방과 의료비 절감으로 표현하면 같은 목표를 현 행정부에서도 추진할 수 있다.", "diagram": [{"type": "table", "head": ["Intervention", "Traditional framing", "Preferred framing"], "rows": [["Food programs", "Food insecurity", "Diabetes prevention and management"], ["Housing", "Housing equity", "Asthma and COPD prevention"], ["Transportation", "Access inequity", "Fewer missed appointments"], ["Air quality", "Environmental equity", "Asthma prevention and cost savings"]]}], "points": ["주거 개입은 주거 형평에서 천식과 COPD 예방으로, 교통 지원은 접근 불평등에서 진료 예약 불참 감소로 표현이 바뀐다.", "같은 목표를 향해 상황에 맞는 용어를 선택하는 방식은 할로윈 의상을 바꿔 입는 것에 비유되었다.", "천식은 BRFSS 자료가 초점을 두는 질환이어서 현 행정부와 협력하기 쉬운 경로이다."], "terms": [["traditional SDOH framing", "전통적인 SDOH 표현"], ["emerging preferred framing", "새로 선호되는 표현"], ["community health workers", "지역사회 보건요원"]], "course": "ehs544"}, {"id": "c_art3", "title": "Article III and judicial review", "kor": "제3조의 법원 체계와 사법심사", "week": "11w", "oneline": "연방법원은 네 가지 사건 유형만 심리하고, 사법심사 권한은 헌법 문언이 아닌 마버리 판결에서 확립되었다.", "diagram": [{"type": "table", "head": ["Federal", "Number", "State counterpart"], "rows": [["Supreme Court", "1", "State supreme court"], ["Courts of Appeals", "13", "State appellate courts"], ["District Courts", "94", "State trial courts"]], "note": "Marbury v. Madison (1803): it is the duty of the judicial department to say what the law is."}], "points": ["제3조는 연방대법원을 설치하고 하급 연방법원의 설치를 의회에 맡기며, 연방 법관은 선량하게 행동하는 동안 직위를 유지하므로 사실상 종신직이다.", "연방법원은 대법원 1개, 항소법원 13개, 지방법원 94개로 이루어지고, 주 법원도 같은 3단계를 따른다.", "마버리 대 매디슨(1803)은 법이 무엇인지 말하는 것이 사법부의 고유한 영역이자 의무라고 판시하였고, 주 법관도 헌법에 구속된다."], "terms": [["judicial review", "사법심사"], ["good behavior tenure", "선량한 행동 동안의 재직(사실상 종신직)"], ["appellate jurisdiction", "상소심 관할"]], "course": "ehs544"}, {"id": "c_standing", "title": "Standing and redressability", "kor": "원고적격의 세 요건과 구제 가능성", "week": "11w", "oneline": "Juliana 사건과 Lighthiser 사건은 손해를 인정받고도 국가 기후 계획을 명할 수 없다는 이유로 구제 가능성에서 막혔다.", "diagram": [{"type": "flow", "items": [{"t": "Injury-in-fact", "s": "concrete, particularized, actual or imminent"}, {"t": "Traceable", "s": "caused by the defendant's conduct"}, {"t": "Redressable", "s": "a favorable decision can fix it", "k": 1}], "note": "Juliana and Lighthiser failed at redressability; Held v. Montana won under the state constitution."}], "points": ["연방법원에서 청구하려면 원고는 구체적이고 개별적인 사실상의 손해, 피고의 행위로 소급할 수 있는 인과관계, 유리한 판결로 구제될 가능성을 증명하여야 한다.", "Massachusetts v. EPA(2007)는 해수면 상승처럼 주에 미친 구체적 손해를 인정하여 기후 소송의 원고적격에 관한 기념비적 선례가 되었다.", "Held v. Montana에서 몬태나주 대법원은 주 헌법의 깨끗하고 건강한 환경에 대한 권리를 근거로 원고적격을 인정하고, 온실가스 분석을 금지한 법률을 위헌으로 판단하였다."], "terms": [["injury-in-fact", "사실상의 손해"], ["traceability", "인과관계(소급 가능성)"], ["redressability", "구제 가능성"]], "course": "ehs544"}, {"id": "c_apa706", "title": "APA arbitrary-or-capricious review", "kor": "행정절차법 자의ㆍ변덕 심사와 Loper Bright", "week": "11w", "oneline": "법원은 기관이 관련 요소를 모두 고려하고 합리적으로 설명하였는지 심사하며, Loper Bright 뒤에는 법률을 독자적으로 해석한다.", "diagram": [{"type": "table", "head": ["Factor", "Question for the court"], "rows": [["Relevant factors", "Did the agency overlook an important aspect?"], ["Reasoned explanation", "Is the logic clear and consistent with the evidence?"], ["Substantial evidence", "Is there a rational link between facts and choice?"], ["Authorized factors", "Did the agency rely on factors Congress did not intend?"]], "note": "Loper Bright ended Chevron deference: courts interpret statutes independently."}], "points": ["행정절차법 제706조(2)(A)는 자의적이고 변덕스럽거나 재량을 남용하였거나 법에 맞지 않는 행정작용을 법원이 무효로 하도록 지시한다.", "심사 요소는 관련된 모든 요소의 고려, 합리적인 설명, 실질적 증거, 법이 허용하지 않은 요소에 의존하지 않았는지의 네 가지이다.", "Loper Bright 판결은 40년 된 셰브런 존중을 폐기하고, 법원이 기관의 해석을 맹목적으로 존중하지 말고 의회의 의사를 실현하도록 법률을 독자적으로 해석하게 하였다."], "terms": [["arbitrary or capricious", "자의ㆍ변덕"], ["Chevron deference", "셰브런 존중"], ["preliminary injunction", "예비적 금지명령"]], "course": "ehs544"}, {"id": "c_title6", "title": "Title VI and the CFR siting provision", "kor": "민권법 제6편의 한계와 시설 입지 조항", "week": "11w", "oneline": "Sandoval 판결로 차별적 영향을 다투는 사적 소권이 막혔으나, 효과를 기준으로 삼는 입지 조항은 행정 절차로 쓸 수 있다.", "diagram": [{"type": "table", "head": ["Authority", "Type", "Reach"], "rows": [["Title VI (1964)", "Statute (binding)", "Race, color, national origin"], ["EO 12898 (1994)", "Executive order", "Similar to Title VI; later revoked"], ["EO 14096", "Executive order", "Adds disability and other conditions"], ["CFR siting provision", "Regulation (binding)", "Siting with discriminatory purpose or effect"]], "note": "Sandoval (2001): no private right of action for disparate-impact rules."}], "points": ["민권법 제6편은 연방 재정지원을 받는 프로그램에서 인종ㆍ피부색ㆍ출신 국가를 이유로 한 차별을 금지하고, 재정지원의 수령이 그 보호를 작동시킨다.", "Alexander v. Sandoval(2001)은 차별적 영향을 금지하는 기관 규칙이 사적 소권을 만들지 않는다고 판시하였고, 그 결과 EPA 같은 기관에 진정을 제기하는 방식이 주된 구제 수단이 되었다.", "연방규칙의 입지 조항은 차별의 목적이나 효과를 가진 시설 부지 선택을 금지하며, 크게 활용되지 못하는 정책 수단으로 평가되었다."], "terms": [["private right of action", "사적 소권"], ["disparate impact", "차별적 영향"], ["facility siting", "시설 입지"]], "course": "ehs544"}, {"id": "c_localplan", "title": "State and local climate action", "kor": "주와 지방정부의 기후 정책 수단", "week": "11w", "oneline": "지방정부는 주가 준 권한만 가지며, 기후 행동 계획은 완화ㆍ적응ㆍ지속가능성 계획의 세 유형으로 나뉜다.", "diagram": [{"type": "table", "head": ["Plan type", "Focus"], "rows": [["Mitigation", "Cutting greenhouse gas emissions (the first type)"], ["Adaptation", "Resilience of infrastructure, health, economy, nature"], ["Sustainability", "Both, plus jobs, transport safety, housing"]], "note": "Local governments hold only the powers the state grants them."}], "points": ["연방정부와 주 정부는 권한을 공유하지만 지방정부는 주로부터 권한을 부여받아야 하고, 지방정부는 토지 이용과 건조 환경에 관한 강력한 수단을 보유한다.", "완화 계획은 온실가스 감축에 중점을 둔 가장 먼저 등장한 유형이고, 적응 계획은 기후 영향에 대한 회복력 강화에, 지속가능성 계획은 두 계획을 일자리ㆍ주택 등과 통합하는 데 중점을 둔다.", "행위별 수가제에서는 환자 교육 같은 예방 활동이 보상되지 않으므로, 농촌 보건 전환 사업의 가치기반 의료 약정 같은 기둥이 예방의 저해 요인을 극복하는 데 쓰인다."], "terms": [["mitigation plan", "완화 계획"], ["adaptation plan", "적응 계획"], ["Rural Health Transformation Program (RHTP)", "농촌 보건 전환 사업"]], "course": "ehs544"}, {"id": "h_trade", "title": "Cutoff trade-off", "kor": "절단점을 옮기면 민감도와 특이도가 반대로 움직인다", "week": "6w", "oneline": "검사 결과는 연속값이므로 양성 기준선을 어디에 두는지에 따라 두 오류가 맞바뀐다.", "diagram": [{"type": "table", "head": ["Positive if score ≥", "1", "2", "3", "4"], "rows": [["Sensitivity (%)", "93.8", "83.3", "54.2", "12.5"], ["Specificity (%)", "85.5", "91.9", "96.9", "99.6"]], "note": "CAGE, 729 people (Castells 2005). Lower cutoff: sensitivity rises, specificity falls."}], "points": ["기준선을 낮추면 양성이 늘어 민감도가 오르고 특이도가 내린다.", "유병률이 낮은 표본에서는 거짓양성이 많아 양성 예측도가 크게 내린다."], "terms": [["sensitivity", "민감도"], ["specificity", "특이도"], ["positivity cutoff", "양성 판정 절단점"], ["PPV", "양성 예측도"]], "course": "hpm570"}, {"id": "h_roc", "title": "ROC curve", "kor": "ROC 곡선은 모든 절단점의 성능을 보이지만 최적점은 정하지 않는다", "week": "6w", "oneline": "곡선은 절단점마다 민감도와 거짓양성률을 이은 것이며, 어느 점이 최선인지는 유병률과 결과의 가치가 정한다.", "diagram": [{"type": "chart", "h": 0.9, "x": "False positive rate", "y": "Sensitivity", "line": true, "points": [{"x": 0, "y": 0}, {"x": 0.004, "y": 0.125, "l": "cutoff 4"}, {"x": 0.031, "y": 0.542, "l": "cutoff 3"}, {"x": 0.081, "y": 0.833, "l": "cutoff 2"}, {"x": 0.145, "y": 0.938, "l": "cutoff 1", "pos": "t"}, {"x": 1, "y": 1}], "note": "CAGE data. The curve shows every cutoff; it does not pick the best one."}, {"type": "grid", "items": [{"t": "Slope at a point", "s": "likelihood ratio of that result", "k": 1}, {"t": "Area 1.0", "s": "perfect test"}, {"t": "Area 0.5", "s": "random guess"}]}], "points": ["곡선 위의 한 점은 한 절단점이고, 그 점의 기울기가 우도비이다.", "면적은 두 분포가 얼마나 잘 구별되는지만 요약한다."], "terms": [["ROC curve", "ROC 곡선"], ["false positive rate", "거짓양성률"], ["likelihood ratio", "우도비"]], "course": "hpm570"}, {"id": "h_formula", "title": "Optimal cutoff formula", "kor": "최적 절단점은 검사 성능, 유병률, 오류의 비용비로 정해진다", "week": "7w", "oneline": "우도비가 사전 오즈의 역수와 비용비의 곱보다 큰 결과를 양성으로 지정하면 기대 비용이 줄어든다.", "diagram": [{"type": "flow", "rel": ["is larger than", "×"], "items": [{"t": "p(X|D+) / p(X|D−)", "s": "likelihood ratio of the result", "k": 1}, {"t": "p(D−) / p(D+)", "s": "inverse prior odds"}, {"t": "(CTN − CFP) / (CTP − CFN)", "s": "cost ratio"}], "note": "Call the result positive when the left side is larger. Ferritin example: 150/85 × 1/3 = 0.5882."}], "points": ["유병률이 높으면 가운데 항이 작아져 양성으로 지정하는 기준이 낮아진다.", "우도비 1이 최적점이라는 근거는 없다.", "같은 검사라도 집단과 결정의 가치가 다르면 최적점이 달라진다."], "terms": [["cost ratio", "비용비"], ["prior odds", "사전 오즈"], ["posterior odds", "사후 오즈"]], "course": "hpm570"}, {"id": "h_prev", "title": "Oversampled study", "kor": "환자를 많이 모은 표본의 비율은 유병률이 아니다", "week": "6w", "oneline": "표본에서는 질병 상태별 결과 분포만 사용하고, 사전확률에는 모집단 유병률을 쓴다.", "diagram": [{"type": "table", "head": ["", "Study sample", "Population"], "rows": [["Disease share", "67 of 132 (oversampled)", "12.5% stated prevalence"], ["Use in Bayes", "P(result | disease status) only", "The prior"]], "note": "Lead poisoning exam: 146 and 146 in the sample, population prevalence 10%."}], "points": ["표본의 질병 비율은 표집 설계가 정한 숫자이다.", "사후확률을 구할 때 모집단 유병률을 사전확률로 적용한다."], "terms": [["oversampling", "과대표집"], ["prevalence", "유병률"], ["posterior probability", "사후확률"]], "course": "hpm570"}, {"id": "h_thresh", "title": "Treatment threshold", "kor": "유병률은 사후확률을 바꾸고 해악은 치료 기준선을 바꾼다", "week": "6w", "oneline": "치료 기준선은 치료의 이익과 해악의 균형에서 나오므로 유병률이 변해도 그대로이다.", "diagram": [{"type": "table", "head": ["Change", "What moves", "Example"], "rows": [["Prevalence 10% → 5%", "The posterior", "Posterior probability falls"], ["EDTA toxicity 5% → 2.5%", "The treatment threshold", "9.71% → 4.93%"]], "note": "Threshold: 0.05 + 0.285P = 0.8P, so P = 9.71%. Treat when the posterior is above the threshold."}], "points": ["유병률이 내리면 사후확률이 내려 치료 대상이 줄 수 있다.", "독성이 줄면 더 낮은 사후확률에서도 치료가 유리하다.", "확률 기준선은 점수 절단점이 아니므로 유병률과 우도비가 더 필요하다."], "terms": [["treatment threshold", "치료 임계값"], ["expected harm", "기대 해악"], ["conditionally independent", "조건부 독립"]], "course": "hpm570"}, {"id": "h_evpi", "title": "Value of information", "kor": "완전정보의 기대가치는 어떤 검사도 넘지 못하는 상한이다", "week": "7w", "oneline": "검사로 얻는 가치는 정보 없는 최선과 완전정보 사이의 일부이며, 결과에 따라 행동이 달라질 때만 생긴다.", "diagram": [{"type": "flow", "items": [{"t": "Best action without information"}, {"t": "Strategy that uses the test"}, {"t": "Perfect information", "k": 1}], "note": "EVPI = perfect information − best action without information."}], "points": ["EVPI는 완전정보 전략에서 정보 없는 최선을 뺀 값이다.", "모든 결과에서 같은 행동이 최적이면 검사의 가치는 0이다."], "terms": [["EVPI", "완전정보의 기대가치"], ["value of information", "정보의 가치"]], "course": "hpm570"}, {"id": "h_types", "title": "CEA, CUA and CBA", "kor": "세 분석은 결과를 측정하는 단위가 다르다", "week": "8w", "oneline": "결과를 자연 단위로 측정하면 비용효과분석, QALY로 측정하면 비용효용분석, 화폐로 측정하면 비용편익분석이다.", "diagram": [{"type": "table", "head": ["", "CEA", "CUA", "CBA"], "rows": [["Outcome unit", "Natural units (life-years)", "QALY", "Money"], ["Result", "Cost per unit of effect", "Cost per QALY gained", "Net benefit or benefit/cost ratio"]], "note": "Full evaluations compare costs and outcomes of at least two alternatives."}], "points": ["대안과 비교하지 않고 비용과 결과만 적은 연구는 부분 평가이다."], "terms": [[" "course": "hpm570"}, {"id": "h_equity", "title": "The cost of equity", "kor": "분할을 막으면 지배된 대안이 돌아온다", "week": "9w", "oneline": "분할 시행을 허용하지 않으면 지배된 L3나 C1이 다시 선택되고 총효과가 줄어들므로, 형평 제약의 비용을 포기한 효과로 나타낼 수 있다.", "diagram": [{"type": "table", "head": ["Budget", "Partial allowed", "All or nothing"], "rows": [["$600", "B1, F2, K3/M3 50/50 · 34.5", "B1, F2, L3 · 34"], ["$850", "D1/B1 75/25, F2, M3 · 41.75", "C1, F2, M3 · 40"]], "note": "The effect given up is the price of equity."}], "points": ["분할 시행은 수학적으로 최적이지만 같은 집단의 환자가 서로 다른 강도의 치료를 받게 된다.", "$600에서는 총효과가 34.5에서 34로, $850에서는 41.75에서 40으로 줄어든다."], "terms": [["fractional implementation", "분할 시행"], ["integer constraint", "정수 제약"]], "course": "hpm570"}, {"id": "h_oregon", "title": "Where to draw the line: Oregon", "kor": "비용효과분석만으로는 선을 그을 수 없다", "week": "9w", "oneline": "비용효과분석은 지출 규모를 정하지 못하므로 지불의사를 따로 정하여야 하고, 오리건의 첫 순위 목록은 직관과 가치에 부딪혀 철회되었다.", "diagram": [{"type": "timeline", "items": [{"d": "1987", "t": "Coby Howard dies after a failed fundraising appeal"}, {"d": "1989", "t": "Legislature creates the Health Services Commission", "s": "rank services for the whole covered population"}, {"d": "", "t": "First list ranked by cost-effectiveness", "s": "TMJ splints above emergency appendectomy", "k": 1}, {"d": "", "t": "Revised three times in three years", "s": "approved list made no explicit reference to cost"}]}], "points": ["리그 표에 필요 인원과 누적 비용의 열을 추가하면 예산에 도달하는 위치에 선을 그을 수 있다.", "첫 목록의 순위는 인구 수준의 달러당 편익 총량을 비교한 결과였다.", "구조의 규칙(rule of rescue)에 따라 특정 개인의 생명은 통계적 생명보다 큰 반응을 일으킨다."], "terms": [["maximum willingness to pay", "최대 지불의사"], ["league table", "리그 표"], ["rule of rescue", "구조의 규칙"]], "course": "hpm570"}, {"id": "h_hiv", "title": "Lessons from HIV policy models", "kor": "HIV 정책 분석 네 편이 남긴 원칙", "week": "9w", "oneline": "선별사업은 그 선별이 유발하는 치료보다 비용효과적일 수 없고, 새 비교 대상이 추가되면 기존 대안의 ICER가 달라진다.", "diagram": [{"type": "table", "head": ["", "Cost up", "Cost down"], "rows": [["Health up", "Evaluate C/E ratio", "Yes"], ["Health down", "No", "Evaluate C/E ratio (Quadrant III)"]], "note": "Generic versus branded ART fell in Quadrant III; 0.4% of 2002–2007 CEA papers described such interventions."}], "points": ["정례 HIV 선별의 ICER는 유병률이 약 1%를 초과하면 검사 비용과 관계없이 거의 같은 값으로 수렴하였다.", "복제 ART를 비교에 넣자 상표 ART의 ICER는 $25,200에서 $114,800/QALY로 높아졌다.", "PEPFAR 삭감 분석에서 $2.3 billion을 1,500만 손실 생존연수로 나눈 $153는 암묵적 교환비율을 드러내었다."], "terms": [["portable insight", "이전 가능한 통찰"], ["Quadrant III (southwest quadrant)", "남서 사분면"], ["implicit rate of exchange", "암묵적 교환비율"]], "course": "hpm570"}, {"id": "h_markov", "title": "Markov model structure", "kor": "Markov 모형의 상태와 이행", "week": "10w", "oneline": "건강 상태는 유한하고 상호배타적이며 전체를 포괄하고, 다음 주기의 이행확률은 현재 상태에만 의존한다.", "diagram": [{"type": "grid", "items": [{"t": "Finite"}, {"t": "Mutually exclusive"}, {"t": "Collectively exhaustive"}, {"t": "Reflect prognosis, cost, quality of life"}, {"t": "Next transition depends only on the current state", "k": 1}], "note": "Absorbing: Dead returns to itself with 1.0. Tunnel: Pre-op → Op → Post Op 1, 2, 3."}], "points": ["사건이 반복되는 만성질환을 결정나무로 모형화하면 가지가 주기마다 곱절로 늘어난다.", "무기억 성질 때문에 예후에 영향을 미치는 과거 이력은 상태의 정의에 포함하여야 한다.", "흡수 상태는 자기 자신으로 돌아오는 확률이 1.0이고, 터널 상태는 정해진 순서에 따라 한 주기만 머무는 상태이다."], "terms": [["Markovian assumption (memoryless property)", "Markov 가정(무기억 성질)"], ["absorbing state", "흡수 상태"], ["tunnel state", "터널 상태"]], "course": "hpm570"}, {"id": "h_matrix", "title": "Transition matrix and steady state", "kor": "이행확률행렬과 장기 정상상태", "week": "10w", "oneline": "1단계 행렬을 거듭 곱하면 n단계 행렬을 얻고, 주기가 충분히 반복되면 초기 상태의 영향이 사라진다.", "diagram": [{"type": "table", "head": ["P¹", "Well", "Sick"], "rows": [["Well", ".8", ".2"], ["Sick", ".5", ".5"]]}, {"type": "table", "head": ["P² = P¹ × P¹", "Well", "Sick"], "rows": [["Well", ".74", ".26"], ["Sick", ".65", ".35"]], "note": "Long run: Danny is sick 28.6% of the time, whatever the starting state."}], "points": ["Danny의 P¹은 Well 행이 .8과 .2, Sick 행이 .5와 .5이고, P²는 Well 행이 .74와 .26, Sick 행이 .65와 .35이다.", "건강한 상태에서 2주 뒤 건강할 확률 .74는 .8 × .8과 .2 × .5를 더한 값이다.", "장기 확률은 각 상태에 머무는 시간의 비율이며 Danny가 Sick에 머무는 비율은 28.6%이다."], "terms": [["transition probability matrix", "이행확률행렬"], ["steady state (equilibrium)", "정상상태(평형)"], ["MMULT", "엑셀 행렬 곱셈 함수"]], "course": "hpm570"}, {"id": "h_interv", "title": "Intervention and long-run time sick", "kor": "개입이 장기 감염 비율에 미치는 영향", "week": "10w", "oneline": "감염 발생을 50% 줄이면 Sick 비율은 28.6%에서 16.7%로, 회복을 50% 빠르게 하면 21.1%로 줄어 어느 쪽도 절반이 되지 않는다.", "diagram": [{"type": "table", "head": ["Scenario", "P(W→S)", "P(S→W)", "Time sick"], "rows": [["Baseline", ".2", ".5", "28.6%"], ["Incidence −50%", ".1", ".5", "16.7%"], ["Recovery +50%", ".2", ".75", "21.1%"]], "note": "Time sick = P(W→S) / (P(W→S) + P(S→W))."}], "points": ["2상태 연쇄에서 Sick 비율은 P_WS / (P_WS + P_SW)이다.", "감염 확률을 .2에서 .1로 낮추면 분자와 분모가 함께 줄어 비율은 절반보다 적게 줄어든다.", "회복확률을 .5에서 .75로 높이면 분모만 커지므로 감소 폭이 더 작다."], "terms": [["incidence of infection", "감염 발생"], ["recovery", "회복"], ["proportion of time spent in a state", "상태에 머무는 시간의 비율"]], "course": "hpm570"}, {"id": "h_cohort", "title": "Evaluating a Markov model", "kor": "코호트 모사와 몬테카를로 모사", "week": "10w", "oneline": "코호트 모사는 가상 코호트를 주기마다 재분배하여 점추정치를 주고, 몬테카를로 모사는 한 사람씩 난수로 이행시켜 분산까지 준다.", "diagram": [{"type": "table", "head": ["Strategy", "LE", "QALE", "Cost", "$/QALY"], "rows": [["Do Nothing", "2.62", "2.02", "$5,953", "–"], ["Drug A", "2.88", "2.29", "$8,939", "dom"], ["Drug B", "2.45", "2.40", "$9,183", "$8,500"], ["Drug C", "4.28", "2.57", "$22,773", "$79,941"]], "note": "Drug B has lower LE than doing nothing but higher QALE."}], "points": ["흡수 상태가 있으면 장기 확률이 모두 사망이므로 기대여명, 질보정 기대여명, 기대비용을 따로 계산한다.", "기대여명은 각 상태의 환자-주기를 더하여 시작 인원으로 나눈 값이며, 마지막 주기를 읽으면 가장 오래 산 사람의 수명이 된다.", "Well–Sick–Dead 예제에서 Drug A는 지배되고, 증분 비용효과비는 Drug B가 $8,500/QALY, Drug C가 $79,941/QALY이다."], "terms": [["cohort simulation", "코호트 모사"], ["Monte Carlo simulation", "몬테카를로 모사"], ["patient-cycles", "환자-주기"]], "course": "hpm570"}, {"id": "e_ors", "title": "ORS and sodium-glucose cotransport", "kor": "경구수액염과 SGLT1", "week": "1w, 4w", "oneline": "SGLT1의 나트륨ㆍ포도당 공동 흡수가 물 흡수를 증가시키므로 경구수액염이 설사 중 탈수를 방지한다.", "diagram": [{"type": "flow", "items": [{"t": "Glucose + Na+ in lumen"}, {"t": "SGLT1 on enterocyte", "s": "cotransport", "k": 1}, {"t": "Water follows"}, {"t": "Dehydration slowed"}], "note": "ORS does not kill Vibrio cholerae."}, {"type": "timeline", "items": [{"d": "1978", "t": "Lancet", "s": "Na-glucose coupling called a major advance"}, {"d": "1993-94", "t": "Bangladesh", "s": "Recipe stamped on every letter"}]}], "points": ["경구수액염은 세균을 제거하지 못하고 회복 시간을 확보한다.", "조리법을 기억한 가정과 지역사회의 보급이 기업의 봉지 공급보다 오래 지속되었다."], "terms": [["oral rehydration solution (ORS)", "경구수액염"], ["sodium-glucose cotransporter 1 (SGLT1)", "나트륨-포도당 공동수송체 1"]], "course": "ehs502"}, {"id": "e_skin", "title": "Skin barrier and routes of entry", "kor": "피부 장벽과 노출 경로", "week": "2w", "oneline": "각질층은 각질세포 사이를 층판소체의 지질이 채운 구조이며, 물질은 세포내, 세포간, 부속기의 3가지 경로로 피부에 접근한다.", "diagram": [{"type": "grid", "items": [{"t": "Intracellular", "s": "through corneocytes"}, {"t": "Intercellular", "s": "through lipid matrix"}, {"t": "Transappendageal", "s": "follicles, sebaceous glands, sweat ducts"}], "numbered": true, "note": "Three routes into the skin"}, {"type": "flow", "items": [{"t": "Barrier breach"}, {"t": "Water loss, Ca2+ gradient lost"}, {"t": "Lamellar bodies released", "s": "80% within minutes", "k": 1}, {"t": "Lipids refilled"}]}], "points": ["층판소체의 지질은 세라마이드, 지방산, 콜레스테롤로 구성된다.", "피지와 땀이 합쳐진 산성 보호막은 상재 미생물총에 유리하고 병원체를 억제한다."], "terms": [["lamellar body", "층판소체"], ["transappendageal route", "부속기 경로"], ["transepidermal water loss", "경표피 수분 손실"]], "course": "ehs502"}, {"id": "e_vitd", "title": "Vitamin D synthesis", "kor": "비타민 D의 합성 경로", "week": "2w", "oneline": "UVB가 피부의 7-디하이드로콜레스테롤을 광분해하여 합성이 시작되고, 간과 신장에서 차례로 수산화되어 활성형이 된다.", "diagram": [{"type": "flow", "items": [{"t": "Skin", "s": "UVB + 7-dehydrocholesterol"}, {"t": "Liver", "s": "25-OHase: 25(OH)D3"}, {"t": "Kidney", "s": "1α-OHase: active form", "k": 1}, {"t": "Gut and bone", "s": "Ca and P absorption"}]}, {"type": "table", "head": ["", "Skin type 1", "Skin type 6"], "rows": [["UVB minutes for 1,000 IU/day", "5.05", "25.25"]], "note": "Melanin absorbs UVB."}], "points": ["UVB는 표피까지만 침투하고 UVA는 진피의 콜라겐과 엘라스틴을 분해한다.", "짙은 피부일수록 같은 합성량에 더 긴 노출이 필요하다."], "terms": [["7-dehydrocholesterol", "7-디하이드로콜레스테롤"], ["parathyroid hormone (PTH)", "부갑상선 호르몬"]], "course": "ehs502"}, {"id": "e_sweat", "title": "Evaporative cooling and heat acclimation", "kor": "증발 냉각과 열 적응", "week": "2w", "oneline": "땀의 증발은 가장 효율적인 열 방출 기전이며, 분비가 빠를수록 나트륨 손실이 증가한다.", "diagram": [{"type": "flow", "items": [{"t": "Recruit more glands"}, {"t": "Raise output per gland"}, {"t": "Less time to reabsorb", "s": "more Na+ and Cl- lost", "k": 1}]}, {"type": "table", "head": ["", "Not acclimatized", "Acclimatized"], "rows": [["Sweat output", "Lower", "2-3 L per hour"], ["Duct Na+ and Cl-", "Less conserved", "Conserved"]]}], "points": ["정상 피부 온도에서 물의 기화열은 580 cal/g이다.", "땀의 항균 펩타이드인 더름시딘은 땀이 많아질수록 증가한다."], "terms": [["heat of vaporization", "기화열"], ["eccrine sweat gland", "외분비 땀샘"], ["acclimatization", "순응"]], "course": "ehs502"}, {"id": "e_fat", "title": "Fat storage capacity and fatty liver", "kor": "지방 저장 용량과 지방간", "week": "3w, 6w", "oneline": "피하 저장 용량이 소진되면 지방이 내장과 간 같은 이소성 부위에 축적되고, 간에서는 지방증에서 섬유화로 진행할 수 있다.", "diagram": [{"type": "flow", "items": [{"t": "Subcutaneous fat", "s": "capacity reached"}, {"t": "Visceral fat"}, {"t": "Ectopic fat", "s": "liver, muscle, pancreas", "k": 1}]}, {"type": "flow", "items": [{"t": "Insulin resistance"}, {"t": "Steatosis"}, {"t": "Steatohepatitis"}, {"t": "Fibrosis", "s": "scar does not regenerate", "k": 1}], "note": "Simple steatosis does not always progress."}], "points": ["티아졸리딘디온은 지방세포 증식을 유도하여 지방을 내장에서 피하로 이동시켰다.", "앞 단계의 지방간은 회복될 수 있으나 고착된 섬유화는 회복되지 않는다."], "terms": [["ectopic fat", "이소성 지방"], ["steatosis", "지방증"], ["steatohepatitis", "지방간염"]], "course": "ehs502"}, {"id": "e_muscle", "title": "Fiber types t-prepared countries respond best", "US (1st) and UK (2nd) on the index did poorly; Korea did far better"], ["Regime or party ideology decides success", "Political identity had only a passing relationship; speed after the third death mattered"], ["Americans were especially disobedient", "Mobility and mask data match or beat comparable countries; leaders underestimated trust"], ["A single-payer system covers everything", "Canada's long-term care sat outside it: 81% of deaths linked to this sector"]], "note": "Wallace-Wells, Kavanagh, Fafard"}, {"type": "flow", "items": [{"t": "Resources and infrastructure", "s": "what indexes measure"}, {"t": "Political mobilization", "s": "leaders, trust, coordination", "k": 1}, {"t": "Speed and compliance", "s": "early action, public acceptance"}, {"t": "Outcomes", "s": "cases and deaths"}], "rel": ["must be", "produces", "shapes"]}], "points": ["GHS Index 같은 준비도 지표에는 정치적 역량이 포함되지 않아, 이 지표로 실제 성과를 예측할 수 없었습니다.", "한국과 대만의 지도자는 시민이 제약을 감내하리라고 신뢰하고 빠르게 대응하였으나, 미국의 지도자에게는 그러한 신뢰가 거의 없었습니다.", "캐나다는 정부 간 조정 기구와 과학에 대한 신뢰를 바탕으로 시민의 순응을 확보하였으나, 단일지불자 체계가 포괄하지 않는 장기요양 부문에서는 실패하였습니다."], "terms": [["Political capacity", "정치적 역량"], ["Global Health Security Index", "세계 보건안보 지수"], ["Intergovernmental coordination", "정부 간 조정"], ["Long-term care", "장기요양"], ["Syndemic", "신데믹"]], "course": "pubh510"}, {"id": "p_democracy", "title": "Democracy and COVID outcomes", "kor": "민주주의와 팬데믹 사망의 관계를 어떻게 해석할지는 어떤 결과 자료를 선택하고 어떻게 분석하는지에 따라 달라집니다.", "week": "1w", "oneline": "Kavanagh and Singh은 민주주의가 팬데믹에서 이로운지를 개념 수준에서 검토하고, 확진 수를 비교하면 내생성 문제가 발생한다고 지적합니다. Jain et al.은 초과사망을 결과지표로 민주주의와 사망의 관계를 검증하여, 민주주의 구성 지수 가운데 심의 지수만 유의한 연관이 있음을 확인하였습니다.", "diagram": [{"type": "flow", "items": [{"t": "Confirmed cases", "s": "depend on testing and transparency"}, {"t": "Endogeneity problem", "s": "few cases: reality or hidden?", "k": 1}, {"t": "Excess mortality", "s": "all-cause deaths minus expected"}, {"t": "Association with democracy", "s": "observational, not causal"}], "rel": ["is flawed by", "avoided by", "tested in"]}, {"type": "table", "head": ["Model (Jain et al.)", "Change in excess deaths per 100,000"], "rows": [["V-Dem LDI, +1 point (adjusted)", "-2.18"], ["Adding case rate", "-2.59 (larger)"], ["Adding vaccination", "-2.05 (smaller, still significant)"], ["Deliberative index only", "-1.60 (other four components not significant)"]], "note": "Figures from the note's Results section."}], "points": ["민주주의가 건강에 이로운 기제로 유인, 정보, 책임성, 결사의 네 가지가 제시되지만 팬데믹에서는 시간 지평이 짧아 책임성이 약해질 수 있습니다.", "확진 수는 투명성과 얽히므로 초과사망이 더 적절한 결과지표입니다.", "Jain et al.의 결과는 관찰 연구의 횡단 분석에서 얻은 것이므로 인과관계의 근거로 인용할 수 없습니다."], "terms": [["Excess mortality", "초과사망"], ["Endogeneity", "내생성"], ["Deliberative Component Index", "심의 지수"], ["Cross-sectional analysis", "횡단 분석"]], "course": "pubh510"}, {"id": "p_neg_pos", "title": "Negative vs positive rights", "kor": "소극적 권리는 건강에 대한 위협에서 사람을 보호하는 권리이고, 적극적 권리는 자원 제공을 요구하여 건강을 증진하는 권리입니다.", "week": "2w", "oneline": "자연권은 소극적 권리로 해를 입히지 않을 것을 요구하고, 인권은 적극적 권리로 정부가 재화와 서비스를 제공할 것을 요구합니다. 적극적 권리의 실제 크기는 범위와 깊이에 따라 정해집니다.", "diagram": [{"type": "table", "head": ["", "Negative right (natural)", "Positive right (human)"], "rows": [["Meaning", "Protection from threats", "Promotion of health and well-being"], ["Government role", "Prevent harm", "Provide goods and services"], ["Examples", "Helmet law, plain packaging, trans fat cap", "Treatment without ability to pay"], ["Justifies", "Protection", "Payment"]], "note": "Negative = no harm; positive = resources must be supplied."}, {"type": "grid", "numbered": false, "items": [{"t": "Scope: how many services"}, {"t": "Depth: how much coverage per service"}], "note": "Together they set the real size of a positive right."}], "points": ["소극적 권리는 헬멧 의무, 무늬 없는 담배 포장, 트랜스지방 상한처럼 위협을 막는 규제로 실현됩니다.", "적극적 권리는 돈이 없어도 진료를 받을 권리처럼 누군가 비용을 부담하여야 하므로 책임자가 자원을 제공하여야 합니다.", "적극적 권리에서 범위는 대상 서비스의 수이고 깊이는 서비스마다 보장하는 정도입니다."], "terms": [["negative right", "소극적 권리"], ["positive right", "적극적 권리"], ["protection vs promotion", "보호 대 증진"], ["scope", "범위"], ["depth", "깊이"]], "course": "pubh510"}, {"id": "p_tiers", "title": "Three tiers of positive rights", "kor": "적극적 권리는 의료 접근, 의료, 건강의 세 단계로 확장되며 단계가 높을수록 구현하는 나라가 줄어듭니다.", "week": "2w", "oneline": "Forman의 3단계는 의료 접근권(약 140개국), 의료에 대한 권리(약 40개국), 건강에 대한 권리(극소수)입니다. 미국의 암묵적 권리는 EMTALA처럼 제한적이고 분절되어 있습니다.", "diagram": [{"type": "flow", "items": [{"t": "Access to care", "s": "about 140 countries; no screening out by ability to pay"}, {"t": "Right to health care", "s": "about 40 countries; content and quality of care"}, {"t": "Right to health", "s": "very few; includes social determinants", "k": 1}], "rel": ["adds quality", "adds social determinants"]}, {"type": "table", "head": ["US program", "Why it falls short of a right"], "rows": [["Medicare", "Eligibility depends on Medicare-taxed work years"], ["Medicaid", "Some states impose work requirements"], ["Veterans Affairs", "Only service-connected conditions"], ["EMTALA", "Ends when the patient is stabilized"]], "note": "EMTALA is the closest to a genuine right."}], "points": ["의료 접근권은 지불 능력을 이유로 환자를 배제하지 못하게 하지만 돌봄의 질은 보장하지 않습니다.", "의료에 대한 권리는 돌봄의 내용과 질을 정하며 Palm et al.의 환자 권리 목록이 이에 해당합니다.", "건강에 대한 권리는 사회적 결정요인까지 포함하는데 부처 분절과 비용 때문에 거의 구현되지 않습니다."], "terms": [["right of access to health care", "의료 접근권"], ["right to health care", "의료에 대한 권리"], ["right to health", "건강에 대한 권리"], ["social determinants of health", "건강의 사회적 결정요인"], ["EMTALA", "응급의료법"]], "course": "pubh510"}, {"id": "p_duties", "title": "Responsibility and duties", "kor": "권리를 실제로 집행하려면 책임질 행위자와 시민의 의무를 함께 정하여야 합니다.", "week": "2w", "oneline": "사회제도는 어떤 가치를 배분할지와 누구에게 책임을 지정할지를 함께 정하며, 책임이 여러 주체에 분산되면 권리를 집행할 수 없게 됩니다. 시민의 의무에는 세금, 본인부담금, 행동 책임이 있으며 외부효과가 있는 행동일수록 그 행동에 대한 벌칙을 정당화하기 쉽습니다.", "diagram": [{"type": "flow", "items": [{"t": "Allocation value", "s": "what is a just distribution"}, {"t": "Responsibility", "s": "who must make it happen", "k": 1}, {"t": "Diffused to many", "s": "no one accountable"}], "rel": ["assigns", "if spread widely"]}, {"type": "grid", "numbered": true, "items": [{"t": "Pay taxes"}, {"t": "Cost-sharing or premiums"}, {"t": "Behavioral responsibility (e.g., smoker surcharge)"}], "note": "Three types of duties that come with a right."}], "points": ["책임질 주체가 분명하지 않으면 도덕적 주장이 분산되어 권리를 사실상 집행할 수 없으므로, 책임 지정의 출발점은 정부입니다.", "의무의 유형은 세금 납부, 본인부담금이나 보험료, 행동 책임의 세 가지입니다.", "정책 은유는 부분적 비교이므로 의료는 어떤 면에서만 권리와 같습니다."], "terms": [["diffused responsibility", "책임의 분산"], ["cost-sharing", "본인부담금"], ["spillover harm", "외부효과"], ["policy metaphor", "정책 은유"]], "course": "pubh510"}, {"id": "p_market_fit", "title": "Which care fits the market", "kor": "시장은 급하지 않고 빈번하며 표준화되고 정보가 풍부한 의료에 잘 맞습니다.", "week": "2w", "oneline": "당뇨병 일차의료와 안경은 시장 선택에 맞고, 골절이 의심되는 상황과 새로 진단된 암은 맞지 않습니다. 긴급성, 인지 손상, 정서적 부담, 희귀성이 있으면 소비자가 제공자를 합리적으로 비교할 수 없어 시장이 작동하지 않습니다.", "diagram": [{"type": "table", "head": ["Scenario", "Fit with market", "Main reason"], "rows": [["Diabetes primary care", "Best", "Many providers, not urgent, rich quality data"], ["Glasses and eye exam", "Good", "Standardized, out-of-pocket, low cost of error"], ["Possible broken arm", "Worst", "Urgency and pain impair judgment"], ["New cancer", "Poor", "Fear blocks rational comparison"]], "note": "Works when non-urgent, frequent, chronic, standardized, data-rich."}], "points": ["당뇨병 관리는 제공자가 많고 급하지 않고 질 자료가 풍부하며 생활양식 적합성이 중요해 시장에 맞습니다.", "골절이 의심되는 환자는 긴급성과 통증 때문에, 새로 암을 진단받은 환자는 공포 때문에 제공자를 합리적으로 비교하기 어렵습니다.", "만성 질환 돌봄에서 환자와 제공자의 관계가 오래 지속되면 돌봄의 질은 높아지지만 전환 비용이 발생하여 선택이 제약됩니다."], "terms": [["comparison shopping", "비교 구매"], ["switching costs", "전환 비용"], ["standardized product", "표준화된 제품"], ["comparative quality data", "비교 질 자료"]], "course": "pubh510"}, {"id": "p_market_gov", "title": "Choice and government role", "kor": "선택의 장점은 정부가 경쟁과 정보와 최소 기준을 보장할 때에만 실현됩니다.", "week": "2w", "oneline": "선택에는 고유한 미덕, 역량 부여, 형평 보호의 세 가지 장점이 기대되고, 이 장점이 실현되도록 정부는 최소 기준을 설정하고 경쟁을 유지하며 비교 정보를 생산하는 세 가지 역할을 수행합니다.", "diagram": [{"type": "table", "head": ["Anticipated virtue", "Core idea"], "rows": [["Choice as its own virtue", "Good regardless of outcomes; protects autonomy and dignity"], ["Choice as empowerment", "More authority over decisions about one's own life"], ["Choice as equity protection", "Leave poor care for a better provider"]], "note": "Third virtue needs several providers."}, {"type": "flow", "items": [{"t": "Minimum standards", "s": "remove deadly options"}, {"t": "Antitrust", "s": "keep several providers", "k": 1}, {"t": "Comparative information", "s": "quality and price"}], "rel": ["then", "then"]}], "points": ["선택이 형평을 보호하려면 소비자가 질 낮은 제공자를 떠나 다른 제공자를 이용할 수 있어야 하고, 이를 위해서는 여러 제공자가 있어야 하므로 합병 방지가 필요합니다.", "수평 합병은 병원끼리의 결합이고 수직 합병은 병원이 의사 진료소를 사들이는 것입니다.", "비교 질 정보는 오랫동안 부족하여 2015년에도 의사 질 자료를 찾은 사람이 약 25%에 그쳤습니다."], "terms": [["well-informed consumer", "정보를 갖춘 소비자"], ["antitrust", "반독점"], ["horizontal merger", "수평 합병"], ["vertical merger", "수직 합병"], ["price transparency", "가격 투명성"]], "course": "pubh510"}, {"id": "p_bounded", "title": "Bounded rationality, cost-sharing", "kor": "시간과 정보와 재정이 부족한 소비자에게는 좋은 제공자를 선택하는 일이 구조적으로 더 어렵습니다.", "week": "2w", "oneline": "제한된 합리성은 동기나 지능과 무관하게 정보 비용과 시간 부족 때문에 합리성이 제한되는 상태를 의미합니다. 미국에서는 공제액이 커서 이러한 제약에 재정적 제약이 추가되므로, 시장에서 얻는 이익이 소비자 사이에 불평등하게 배분됩니다.", "diagram": [{"type": "flow", "items": [{"t": "Less time and costlier information", "s": "two jobs; harder to find quality data"}, {"t": "Higher cost-sharing", "s": "financial constraint added"}, {"t": "Unequal benefit from choice", "s": "unequal health outcomes", "k": 1}], "rel": ["plus", "leads to"]}, {"type": "table", "head": ["", "US", "Most other countries"], "rows": [["Response to high costs", "Deductibles and cost-sharing", "Global budgets"]], "note": "Same problem, different mechanism."}], "points": ["저소득 가구는 여가 시간이 고소득 가구의 약 절반이어서 제공자를 조사할 시간이 적습니다.", "대졸 이상은 고졸 이하보다 의사 질 정보를 찾을 가능성이 약 50% 높습니다.", "다른 나라가 총액 예산으로 대응한 반면 미국은 공제액과 본인부담금을 키웠고, 그 결과 적시 진료 접근이 억제되었습니다."], "terms": [["bounded rationality", "제한된 합리성"], ["deductible", "공제액"], ["global budget", "총액 예산"], ["high-deductible health plan", "저보험료 고공제 건강보험"]], "course": "pubh510"}, {"id": "p_prof_obligation", "title": "Professional obligations", "kor": "전문직 지위는 역량과 윤리에 관하여 사회와 맺은 계약이며, 전문직의 의무는 세 단계로 나뉩니다.", "week": "3w", "oneline": "전문직이라는 지위는 역량, 고객의 검증, 권위, 윤리적 기대가 있다는 신호이며 사회 계약에 근거합니다. 다만 개별 환자에 대한 의무와 사회에 대한 의무는 충돌할 수 있습니다.", "diagram": [{"type": "table", "head": ["Signal", "What it means", "Example in the lecture"], "rows": [["Competence and expertise", "Proven skill from training; peers run the exam", "Board certification"], ["Paid-client validation", "Clients keep paying for the service", "Psychic with continuing callers"], ["Authority", "Granted by the association and its members", "Association of professional psychics"], ["Ethical expectations", "Conduct norms toward clients", "Confidentiality, honesty about limits, disclosure"]], "note": "Four signals of professional status (lecture 4)"}, {"type": "flow", "items": [{"t": "Intrapersonal", "s": "Internal motives and behaviour"}, {"t": "Interpersonal", "s": "Dyadic duty to the client", "k": 1}, {"t": "Societal", "s": "Broader duty beyond the dyad", "k": 1}], "rel": ["tension", "tension"]}], "points": ["스스로 전문직이라고 주장하는 것은 역량과 전문성, 대가를 지불하는 고객이 검증한 경험, 권위, 윤리적 기대라는 4가지를 갖추었다는 신호입니다.", "Hall et al.은 전문직의 의무를 개인 내적, 대인, 사회적 단계로 나누며, 강의에서는 대인 의무와 사회적 의무의 상충이 학기 내내 반복되는 주제라고 설명하였습니다.", "해를 전혀 끼치지 않는다는 기대는 문자 그대로는 실현할 수 없으므로, 불가피한 해가 발생하면 환자는 해 자체와 신뢰 상실이라는 이중의 피해를 입습니다. 한편 청지기 책임은 불필요한 진료를 제공하지 않을 책임을 의미합니다."], "terms": [["Social contract", "사회 계약"], ["Intrapersonal, interpersonal, societal", "개인 내적, 대인, 사회적 단계"], ["Stewardship", "청지기 책임"], ["Agent for patient", "환자의 대리인"], ["Board certification", "전문의 자격"]], "course": "pubh510"}, {"id": "p_ebm_guidelines", "title": "Guidelines and their limits", "kor": "지침은 필요하지만 충분하지 않으며, 근거가 부족하고 지침 준수율이 낮아 진료의 질이 제한됩니다.", "week": "3w", "oneline": "높은 근거 기준을 충족하는 진료는 30~40%에 그치고, 임상의는 지침을 평균 54.5%만 준수합니다. 반면 지역 이해당사자를 포괄하는 다면적 이행을 거치면 임상의의 진료 방식이 변화합니다.", "diagram": [{"type": "flow", "items": [{"t": "Best evidence", "s": "Only 30-40% of care meets a high standard"}, {"t": "Guideline issued", "s": "Many, inconsistent, outdated"}, {"t": "Professional autonomy", "s": "Guideline treated as an option", "k": 1}, {"t": "Adherence", "s": "About 54.5% on average"}], "rel": ["written into", "filtered by", "results in"]}, {"type": "grid", "numbered": false, "items": [{"t": "Multiplicity"}, {"t": "Inconsistency"}, {"t": "Outdated"}, {"t": "Limited MD understanding"}], "note": "Four limits of guidelines"}], "points": ["근거 기반이 아닌 진료가 많은 이유는 기술 변화, 허가 외 처방, 수술과 시술 개입입니다.", "지침은 여러 개가 있어 서로 일치하지 않고 내용이 낡았으며, 의사가 지침을 이해하는 정도도 제한적이라는 한계가 있습니다.", "Timmermans and Mauck은 의사가 자율적으로 판단하는 전문직이라는 전제 때문에 지침 준수가 약해진다고 보고, 해결책으로 협력적이고 다면적인 접근을 제안합니다."], "terms": [["Off-label prescribing", "허가 외 처방"], ["Evidence-based medicine", "근거 기반 의학"], ["Multifaceted implementation", "다면적 이행"], ["Cookbook medicine", "요리책 의학"]], "course": "pubh510"}, {"id": "p_system_trust_wellbeing", "title": "Systems view and well-being", "kor": "Lesser et al.은 전문직업성을 개인의 성품으로 보지 않고 조직과 환경이 뒷받침하는 행동으로 봅니다.", "week": "3w", "oneline": "Lesser et al.은 전문직업성을 관찰 가능한 행동으로 보고, 개인의 역량과 함께 조직 환경도 개선하여야 한다고 주장합니다. 한편 Rotenstein et al.은 의료 인력 전체의 안녕을 높이는 방안을 검토하였고, Nature 편집진은 사설에서 과학에 대한 신뢰가 집단과 주제에 따라 다르게 변화하였다고 분석하였습니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Will to act"}, {"t": "Measurement"}, {"t": "Redesign of work units"}, {"t": "Examine income inequality (fair wages)"}], "note": "Rotenstein et al.: four requirements for workforce well-being"}, {"type": "table", "head": ["Source", "Main claim", "Implication"], "rows": [["Lesser et al.", "Professional behaviour depends on context", "Change context as well as individuals"], ["Rotenstein et al.", "Shifting tasks only moves burden", "Reduce or automate total workload"], ["Nature editorial", "Trust is mixed, not collapsed", "Measure and respond to specific concerns"]], "note": ""}], "points": ["Lesser et al.은 체계 관점에서 개인의 역량을 강화하는 것과 함께 지불 방식, 문화, 리더십 같은 조직ㆍ외부 여건도 조정하여야 한다고 봅니다.", "Rotenstein et al.은 행동할 의지, 측정, 업무 단위 재설계, 소득 불평등 검토의 4가지 요건을 제시하며 업무 이전만으로는 부족하다고 봅니다.", "Nature 편집진은 사설에서 과학에 대한 신뢰가 전반적으로 붕괴하지는 않았고, 지지 정당에 따른 특정 집단과 백신 같은 특정 주제에서 하락하고 있다고 판단합니다."], "terms": [["Complex adaptive system", "복잡적응계"], ["Burn-out", "소진"], ["Work redesign", "업무 재설계"], ["Public trust", "공적 신뢰"]], "course": "pubh510"}, {"id": "p_social_capital", "title": "Bonding, bridging, linking", "kor": "사회자본은 결속, 가교 연결, 정치ㆍ제도 연결의 세 형태로 나뉘며, 사회자본이 형성되면 건강 결과가 개선되고 정책 효과도 높아집니다.", "week": "3w", "oneline": "결속은 집단 내부의 신뢰와 규범을, 가교 연결은 다른 집단과 맺는 약한 연결을, 정치ㆍ제도 연결은 결정권자에게 미치는 영향력을 의미합니다. 정치ㆍ제도 연결은 의지와 장치가 있어야 작동합니다.", "diagram": [{"type": "table", "head": ["Form", "Connects", "Case", "Limit or harm"], "rows": [["Bonding", "People inside a group", "IMAGE: Sisters for Life groups", "Exclusivity; harmful norms; care costs"], ["Bridging", "Two bonded groups (weak ties)", "SRH doctors linked with HIV doctors", "Needs bonded groups to exist"], ["Linking", "Communities and decision makers", "Treatment Action Campaign", "Needs systems and will; stalls at bridging"]], "note": "Ogden et al."}, {"type": "flow", "items": [{"t": "Step 1: Bonding", "s": "Group network"}, {"t": "Step 2: Bridging", "s": "Action network"}, {"t": "Step 3: Linking", "s": "Policy network", "k": 1}], "rel": ["then", "then"]}], "points": ["결속이 강한 집단에서는 건강에 도움이 되는 규범이 확산되지만, 집단이 배타적으로 되고 건강에 해로운 규범도 확산될 수 있습니다.", "가교 연결이 형성되면 약한 연결을 거쳐 규범과 지식이 다른 집단에 전달되며, 가교 연결은 결속된 집단이 있어야 성립합니다.", "정치ㆍ제도 연결은 자원을 배분하는 결정권자와 맺는 수직 연결이며, 정치ㆍ제도 연결이 없으면 사회자본의 형성 과정이 가교 단계에서 멈춥니다."], "terms": [["Bonding", "결속"], ["Bridging", "가교 연결"], ["Linking", "정치ㆍ제도 연결"], ["Weak ties", "약한 연결"], ["Exclusivity", "배타성"]], "course": "pubh510"}, {"id": "p_community_participation", "title": "Connectedness and participation", "kor": "공동체가 촘촘할수록 구성원의 참여가 증가하여 건강에 영향을 미치며, 그 효과는 공동체에 장기간 노출될수록 커집니다.", "week": "3w", "oneline": "공동체는 지리, 선택, 귀속, 공유 경험, 전통의 5개 계열로 나뉘지만, 건강에는 공동체의 유형보다 촘촘함이 더 중요합니다. 또한 공동체에 짧게 노출되면 효과가 작으므로 노출 기간과 장기성도 건강 효과를 결정하는 요인입니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Geographic (place)"}, {"t": "Affiliative (choice)"}, {"t": "Ascriptive (perception)"}, {"t": "Shared experience (suffering)"}, {"t": "Legacies (tradition)"}], "note": "Five families of community definitions"}, {"type": "flow", "items": [{"t": "Tight connectedness", "s": "Shared norms and understanding"}, {"t": "Participation", "s": "Uses available programs", "k": 1}, {"t": "Health outcomes", "s": "Effect grows with long exposure"}], "rel": ["leads to", "leads to"]}], "points": ["연결성이 높은 공동체의 구성원은 이용 가능한 자원과 공공 사업을 더 잘 활용하므로, 공동체가 건강에 영향을 미치는 주요 작용 원리는 참여입니다.", "Umberson and Montez는 사회관계가 건강에 미치는 효과에는 단기 효과와 장기 효과가 모두 있으며, 이 효과가 아동기 경험과 세대 간 효과로 누적된다고 봅니다.", "근속 기간이 짧거나 이주한 지 얼마 되지 않은 사람에게는 공동체와 고용주가 적게 투자하므로 그 사람이 얻는 건강 이익도 줄어듭니다."], "terms": [["Connectedness", "연결성"], ["Participation", "참여"], ["Longitudinality", "장기성"], ["Ascriptive community", "귀속 공동체"], ["Cumulative disadvantage", "누적 불이익"]], "course": "pubh510"}, {"id": "p_community_power", "title": "Community power", "kor": "지역사회 권력은 구조적 불형평을 시정하는 수단이며, 보건부서는 내부와 외부 양쪽에서 협력하여야 합니다.", "week": "3w", "oneline": "Iton et al.은 개인 행동에 중점을 두는 전략을 기술관료적(technocratic) 접근이라고 비판하고, 정책 개혁과 지역사회 권력을 중심에 두어야 한다고 주장합니다. 이에 따라 보건부서는 내부와 외부에서 동시에 활동하는 inside-outside 전략으로 권력 형성 조직과 협력합니다.", "diagram": [{"type": "table", "head": ["", "Independent strategy", "Coalition strategy"], "rows": [["Public stance", "Agency and CBO approach decision makers separately", "Agency and CBO present a united front"], ["Message", "Agency: use limited taxes well; CBO: community need", "We identified what the community needs; give resources"], ["Coordination", "Quiet, possibly secret", "Open"]], "note": "Iton et al. 2026, inside-outside strategies"}, {"type": "flow", "items": [{"t": "Technocratic", "s": "Behaviour, genes, access to care"}, {"t": "Democratic", "s": "Policy reform plus community power", "k": 1}, {"t": "Funding shift", "s": "Longer grants to power-building groups"}], "rel": ["replaced by", "implies"]}], "points": ["지역사회 권력은 조직된 지역사회 구성원들이 민주적 구조를 거쳐 의제를 정하고 결정권자에게 책임을 묻는 능력을 의미합니다.", "독립 전략에서는 보건부서와 지역사회 기반 조직이 결정권자에게 각자 접근하면서 의제를 비공개로 조율하고, 연합 전략에서는 두 주체가 공개적으로 연합하여 통일된 전선을 형성합니다.", "지역사회 권력의 형성이 항상 이롭지는 않아서, 구성원이 갈등과 소진을 겪거나 역량이 작은 지역사회가 오히려 피해를 입었다는 연구도 보고됩니다."], "terms": [["Community power", "지역사회 권력"], ["Technocratic approach", "기술관료적 접근"], ["Independent strategy", "독립 전략"], ["Coalition strategy", "연합 전략"], ["Community-based organization", "지역사회 기반 조직"]], "course": "pubh510"}, {"id": "p_gumas_components", "title": "Primary care components (Gumas)", "kor": "Gumas 등은 첫 접점(first contact), 진료 연속성(continuity), 진료 포괄성(comprehensiveness), 진료 조정(coordination)의 4가지 구성요소를 기준으로 각국의 일차의료를 비교하며, 미국은 접근과 연속성에서 뒤처집니다.", "week": "4w", "oneline": "Gumas 등은 Commonwealth Fund 브리프에서 10개국의 일차의료를 4가지 구성요소로 비교합니다. 이 비교에서 미국은 접근과 연속성에서 특히 뒤처지고, 사회적 필요 선별에서는 앞섭니다.", "diagram": [{"type": "table", "head": ["Component", "What Gumas et al. found for the US"], "rows": [["First contact", "Fewest home visits (29%; Germany and Netherlands 100%)"], ["Continuity", "43% with a regular doctor for 5+ years (Netherlands 76%)"], ["Comprehensiveness", "Social-needs screening 32% (with Germany), but referral to social services is hard everywhere"], ["Coordination", "Fragmented system makes coordination complex"]], "note": "High-quality primary care = these four components."}], "points": ["미국에서 같은 의사를 5년 이상 유지한 성인은 43%로 가장 낮은 편이며, 이는 고용에 연계된 보험이 직장을 옮길 때 바뀌기 때문입니다.", "환자의 사회적 필요를 선별하는 의사의 비율은 미국과 독일이 약 3분의 1로 앞서지만, 모든 나라에서 절반을 초과하는 의사가 환자를 사회서비스와 연결하는 데 어려움을 겪습니다.", "왕진을 한다고 답한 의사의 비율은 미국이 29%로 가장 낮고 독일과 네덜란드는 100%이며, 독일에서는 법률이 의사에게 왕진 의무를 부과합니다."], "terms": [["First contact", "첫 접점"], ["Continuity of care", "진료 연속성"], ["Comprehensiveness of care", "진료 포괄성"], ["Coordination of care", "진료 조정"], ["Home visits", "왕진"]], "course": "pubh510"}, {"id": "p_five_dimensions", "title": "Five dimensions of access", "kor": "접근은 5개 차원으로 나누어 측정하며, 집단과 나라마다 지배적인 장벽이 다르므로 정책도 해당 집단과 나라의 지배적 장벽을 대상으로 설계하여야 합니다.", "week": "4w", "oneline": "Penchansky와 Thomas의 5개 차원은 가용성(availability), 지리적 접근성(accessibility), 경제적 부담 가능성(affordability), 특수 필요에의 적응(accommodation), 수용성(acceptability)입니다. 이 가운데 어느 차원이 접근을 가장 크게 가로막는지는 집단과 나라에 따라 다릅니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Availability: enough providers"}, {"t": "Accessibility: distance"}, {"t": "Affordability: cost"}, {"t": "Accommodation: fit to special needs"}, {"t": "Acceptability: access patients want"}], "note": "All five start with A. Dominant barrier: US financial, Canada organizational, Colombia acceptability."}], "points": ["수용성은 환자가 원하는 형태의 접근을 의미하며, 전문간호사(NP)와 진료보조인력(PA)이 의사와 동등한 질의 일차의료를 제공한다는 근거가 있어도 환자가 의사를 선호하는 것이 대표 사례입니다.", "PAHO 자료에 따르면 충족되지 않은 의료 필요의 주된 원인이 캐나다는 조직 문제, 콜롬비아는 수용성, 미국은 재정 장벽이어서, 같은 정책을 시행하여도 세 나라에서 같은 효과를 기대할 수 없습니다.", "선별검사 접근에서는 수용성이 특징적인 차원이며, 이주민이 선별검사를 받아들이는지에는 문화 감수성과 의료인과 맺은 관계가 크게 작용합니다."], "terms": [["Availability", "가용성"], ["Accessibility", "지리적 접근성"], ["Affordability", "경제적 부담 가능성"], ["Accommodation", "특수 필요에의 적응"], ["Acceptability", "수용성"]], "course": "pubh510"}, {"id": "p_beyond_insurance", "title": "Beyond insurance", "kor": "보험 확대만으로는 접근 격차가 해소되지 않으므로, 강의에서는 새로 제기된 4개 차원을 기준으로 미국의 접근을 다시 평가합니다.", "week": "4w", "oneline": "ACA 시행 이후에도 소득과 인종에 따른 접근 격차가 해소되지 않아 제공자 관계의 지속기간, 보험 보장의 신뢰성, 건강의 사회적 결정요인 대응, 만성질환자와 맺는 지속적 소통이라는 4개 차원이 새로 제기되었습니다.", "diagram": [{"type": "table", "head": ["Emergent dimension", "US grade"], "rows": [["Duration of provider relationships", "C"], ["Reliable insurance coverage", "F"], ["Addressing social determinants", "B+ (screening) / B (referral)"], ["Ongoing communication when chronically ill", "A-"]], "note": "Insurance explains only 10-25% of income gaps in perceived quality (Sommers)."}], "points": ["King 등은 조직 장벽과 교통 장벽에서 나타나는 격차 가운데 보험으로 설명되지 않는 비율이 크다고 보고, Sommers 등은 소득에 따른 격차 가운데 보험으로 설명되는 비율이 10-25%라고 봅니다.", "강의에서는 미국에 관계 지속기간 C, 보험 보장의 신뢰성 F, 사회적 필요 선별 B+와 의뢰 B, 만성질환자 소통 A-의 등급을 부여하였습니다.", "예상 비용 때문에 진료를 미룬 비율이 보험이 있는 사람(약 20%)에서 무보험자(약 3.5%)보다 높은 것은 보험이 무엇을 보장하는지 불확실하기 때문입니다."], "terms": [["Reliable insurance coverage", "보험 보장의 신뢰성"], ["Duration of provider relationships", "제공자 관계의 지속기간"], ["Social determinants of health", "건강의 사회적 결정요인"], ["Underinsurance", "불충분한 보장"]], "course": "pubh510"}, {"id": "p_targeting_universal", "title": "Targeted versus universal policy", "kor": "선별 정책은 공공 재원의 수익이 높고, 보편 정책은 행정비용과 자격 절벽과 낙인과 정치적 지지에서 이점이 있습니다.", "week": "4w", "oneline": "접근 부족은 저소득층에서 가장 크므로 정책을 설계할 때에는 저소득층에 중점을 두되, 기준선을 어디에 그을지와 선별에 드는 비용을 함께 검토하여야 합니다.", "diagram": [{"type": "table", "head": ["", "Targeted", "Universal"], "rows": [["Return on public dollars", "Higher (barriers bind more)", "Lower per dollar"], ["Administration", "Eligibility screening costs", "Lower administrative cost"], ["Coverage stability", "Eligibility cliff risk", "Stable"], ["Middle class", "Excluded above the cutoff", "Protected"], ["Stigma and support", "More stigma, narrower support", "Less stigma, broader support"]], "note": "Cutoff is clear for financial risk (bottom quintile) but blurry for health need."}], "points": ["저소득층에 중점을 두는 근거는 건강 필요가 더 크다는 점과 비용 장벽에 더 민감하다는 점입니다.", "재정 위험은 최하위 5분위에 집중되어 기준선을 분명하게 그을 수 있지만, 건강 부담은 소득이 높아질수록 서서히 낮아져 기준선을 정하기 어렵습니다.", "보편 정책의 이점은 행정비용 절감, 중산층 보호, 보장과 비용의 안정, 정치적 지지, 낙인 감소입니다."], "terms": [["Targeted policy", "선별 정책"], ["Universal policy", "보편 정책"], ["Eligibility cliff", "자격 절벽"], ["Administrative burden", "행정 부담"]], "course": "pubh510"}, {"id": "p_provision_vs_coverage", "title": "Provision vs. coverage", "kor": "서비스 직접 제공과 비용 보장은 이점과 시작 속도와 도달의 한계가 서로 다릅니다.", "week": "4w", "oneline": "지역보건센터는 서비스를 직접 제공하고 Medicaid는 소득 기준으로 보험료를 대신 냅니다. 지역보건센터는 Medicaid 재원에 크게 의존하여 성장하였습니다.", "diagram": [{"type": "table", "head": ["", "Provide services (CHCs)", "Cover costs (Medicaid)"], "rows": [["Strength", "Provider mix, co-location, practice norms", "Cost-sharing adjustment steers use"], ["Start-up speed", "Slow: ~50 years to reach the 1967 goal", "Fast: 4 million (1966) to ~20 million (1974)"], ["Limit in reaching people", "Geographic variation by state", "Stigma lowers enrollment (60-65%)"]], "note": "CHC growth relied on Medicaid revenue."}], "points": ["서비스를 직접 제공하면 제공자 구성, 같은 장소 진료, 진료 규범을 정할 수 있고, 비용을 보장하면 본인부담을 조정하여 환자의 이용을 유도할 수 있습니다.", "Medicaid는 빠르게 확대되었으나, 지역보건센터가 목표(센터 1,000곳, 환자 2,500만 명)에 도달하는 데에는 거의 50년이 걸렸습니다.", "센터는 예방 서비스와 고가치 진료에서 다른 제공자보다 우수하지만 도달 범위는 주마다 다릅니다."], "terms": [["Community health center", "지역보건센터"], ["Means-tested insurance", "소득 기준 보험"], ["Cost sharing", "본인부담"], ["Co-location", "같은 장소 진료"]], "course": "pubh510"}, {"id": "p_stigma_contracting", "title": "Medicaid stigma, contracting", "kor": "Medicaid의 낙인은 등록률을 낮추는 주된 원인이며, 주가 민간 보험사와 계약하는 주된 근거는 낙인 감소입니다.", "week": "4w", "oneline": "Medicaid에는 적격자의 약 60-65%만 등록하며, 낙인에는 의존이라는 낙인과 집단 밖 낙인이 있습니다. 주들은 낙인을 줄이려고 민간 관리의료 계획과 계약하였으나, 이러한 계약이 오히려 Medicaid에 대한 지지를 낮출 수 있다는 경고도 있습니다.", "diagram": [{"type": "flow", "items": [{"t": "Stigma", "s": "Lowers Medicaid enrollment", "k": 1}, {"t": "Contract with private plans", "s": "Same insurance as everyone"}, {"t": "Quality and access", "s": "Pay for performance, SDOH requirements"}], "rel": ["leads states to", "adds secondary aims"]}, {"type": "table", "head": ["Stigma type", "Reading", "Mechanism"], "rows": [["Stigma of dependency", "Sparer", "Welfare charity image, low fees, physician boycott"], ["Out-group stigma", "Haeder and Moynihan", "Racial resentment raises support for burdensome rules"]]}], "points": ["Sparer는 낙인찍힌 자선 급여라는 이미지와 낮은 수가 때문에 개업의가 Medicaid를 기피하였다고 설명하고, Haeder와 Moynihan은 인종적 반감이 높은 응답자일수록 부담을 부과하는 규칙을 더 지지한다는 관계를 확인하였습니다.", "민간 계약의 주된 근거는 낙인 감소이고, 질 향상과 접근 개선(사회적 결정요인 요건)은 보조적 근거입니다.", "Grogan과 Park은 이름 바꾸기와 계약이 혼란을 키워 지지를 낮출 수 있다고 보며 Medicaid라는 이름을 감추지 말라고 권고합니다."], "terms": [["Stigma of dependency", "의존이라는 낙인"], ["Out-group stigma", "집단 밖 낙인"], ["Managed care organization", "관리의료기관"], ["Burden tolerance", "행정 부담 수용도"]], "course": "pubh510"}, {"id": "p_continuum", "title": "Quality continuum and policy focus", "kor": "의료의 질은 하나의 연속체이며 구간마다 정책 목표가 다릅니다.", "week": "5w", "oneline": "질과 안전은 왼쪽 꼬리(비안전 진료), 가운데(일반 진료), 오른쪽 꼬리(우수 진료)로 나뉩니다. 세 구간 모두 정책 중점으로 정당화할 수 있어서 어디에 집중할지가 쟁점입니다.", "diagram": [{"type": "table", "head": ["Zone", "Care type", "Policy goal", "Why focus here"], "rows": [["Left tail", "Unsafe care", "Never events", "Do no harm"], ["Middle", "Typical care", "Always events", "Largest population"], ["Right tail", "Exemplary care", "Norm-changing actions", "Unequal access to the best"]], "note": "All three zones are defensible policy focuses"}], "points": ["왼쪽 꼬리는 발생해서는 안 되는 사건(never events), 가운데는 항상 이루어져야 하는 진료 요소(always events), 오른쪽 꼬리는 규범 변화 행동(norm-changing actions)을 목표로 합니다.", "가운데 구간은 가장 크므로 평균 질을 조금만 높여도 가장 많은 사람에게 영향이 미칩니다.", "우수 진료에 대한 접근은 소득과 학력이 높고 연결망이 좋은 환자에게 편중되어 있습니다."], "terms": [["Quality continuum", "질 연속체"], ["Never events", "발생해서는 안 되는 사건"], ["Always events", "항상 이루어져야 하는 진료 요소"], ["Norm-changing actions", "규범 변화 행동"]], "course": "pubh510"}, {"id": "p_preventable_harm", "title": "Preventable vs total harm", "kor": "위해의 약 절반은 현재 지식으로 예방할 수 없어서 위해 제로는 불가능합니다.", "week": "5w", "oneline": "Panagioti 등은 예방 가능한 위해가 환자의 6%, 전체 위해가 12%라고 추정합니다. 예방할 수 없는 위해도 환자의 신뢰를 크게 떨어뜨립니다.", "diagram": [{"type": "table", "head": ["Setting", "Preventable harm", "All harm"], "rows": [["ICU", "18%", "34%"], ["Surgery", "10%", "20%"], ["Hospital (general)", "5%", "10%"], ["Emergency department", "3%", "5%"], ["Primary care", "3%", "7%"], ["Obstetrics", "2%", "4%"]], "note": "Preventable harm is about half of all harm"}], "points": ["중환자실의 예방 가능한 위해는 18%로 가장 높고 산과는 2%로 가장 낮으며, 환자가 더 아프고 시간에 민감한 환경일수록 높습니다.", "오류를 모두 없애도 유해 사건의 절반이 남으므로 모든 위해를 없애는 목표는 불가능합니다.", "실수가 아닌 문제를 겪은 환자도 신뢰가 크게 떨어지므로 예방 불가능한 사건을 겪은 환자를 어떻게 도울지는 아직 해결되지 않은 쟁점입니다."], "terms": [["Preventable harm", "예방 가능한 위해"], ["Adverse event", "유해 사건"], ["Zero harm", "위해 제로"], ["Non-preventable event", "예방할 수 없는 사건"]], "course": "pubh510"}, {"id": "p_typical_care", "title": "Typical care", "kor": "일반 진료에서는 환자 경험만 일관되게 개선되었고 임상 질의 개선은 고르지 않았습니다.", "week": "5w", "oneline": "일반 진료의 질은 지침 충족, 낭비적 진료의 회피, 환자 중심 진료의 3개 차원으로 측정합니다. Levine 등은 2002-2013년에 환자 경험만 일관되게 개선되었다고 봅니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Meeting guidelines: little change"}, {"t": "Avoiding wasteful care: flat"}, {"t": "Patient-centered care: steady gain"}], "note": "Levine et al., 2002-2013"}], "points": ["지침 충족은 낮은 수준에서 약간만 변하였고, 낭비적 진료의 회피는 거의 변하지 않았습니다.", "세 차원 가운데 환자 중심 진료만 일관되게 개선되었으며, 의사 소통 점수는 약 55%에서 63% 가까이 올랐습니다.", "Park과 Wadhera는 고가치 진료가 소득이 높을수록 많지만 일부 저가치 진료(항생제)도 고소득 집단에서 많다는 결과를 확인하였습니다."], "terms": [["Textbook quality", "지침 충족"], ["Low-value care", "저가치 진료"], ["Patient-centered care", "환자 중심 진료"], ["Patient experience", "환자 경험"]], "course": "pubh510"}, {"id": "p_prof_limits", "title": "Limits of professionalism", "kor": "질 개선을 전문직에 위임한 방식은 예방 가능한 위해를 줄였으나, 임상의의 소진 때문에 이 방식에 더 의존하기는 어렵습니다.", "week": "5w", "oneline": "전문직 위임은 예방 가능한 위해를 25-30% 줄였으나 정체되었습니다. Yang과 Sage는 기술적 개입을 계속 추가하는 채우기(filling) 방식이 임상의의 소진을 키웠다고 지적합니다.", "diagram": [{"type": "flow", "items": [{"t": "Preventable errors cut 25-30%", "s": "professional mandate"}, {"t": "Errors are about half of harm", "s": "Panagioti"}, {"t": "All adverse events fall 12-15%", "s": "about 85% untouched", "k": 1}], "rel": ["times", "gives"]}, {"type": "flow", "items": [{"t": "Add metrics and paperwork", "s": "filling"}, {"t": "Burnout rises", "s": "time and attention consumed"}, {"t": "Care quality worsens", "s": "2-3x for burned-out clinicians", "k": 1}], "rel": ["leads to", "leads to"]}], "points": ["오류가 전체 유해 사건의 절반이므로 오류 25-30% 감소는 전체 위해의 12-15% 감소에 그칩니다.", "소진율의 국가 간 편차가 크므로 소진의 원인은 구조적이라고 판단할 수 있으며, 소진된 임상의가 질 악화를 보고할 가능성은 소진되지 않은 임상의의 2-3배입니다.", "개별로는 합리적인 개혁도 누적되면 임상의의 시간과 주의를 소모하여 체계 변화 없이 소진만 늘립니다."], "terms": [["Burnout", "소진"], ["Filling vs bridging", "채우기와 다리 놓기"], ["Crossing the Quality Chasm", "질의 간극 보고서"], ["Professional mandate", "전문직 위임"]], "course": "pubh510"}, {"id": "p_public_reporting", "title": "Public reporting: three versions", "kor": "공개 보고는 세 유형이 있으며 위험 선택과 낮은 공개율이 한계입니다.", "week": "5w", "oneline": "공개 보고는 전체 성과, 제공자별 성과, 개별 공개의 세 유형입니다. 질 개선과 선택에 관한 연구에서는 부정적 결과가 보고되지 않았으나, 의도하지 않은 결과에 관한 연구에서는 부정적 결과를 보고한 연구가 많습니다.", "diagram": [{"type": "table", "head": ["Version", "Audience", "Mechanism", "Evidence"], "rows": [["Aggregate performance", "Public, policymakers", "Know risk and be careful", "Quality reports some; safety rare"], ["Provider performance", "Consumers, purchasers", "Avoid low performers; reputation", "Quality and choice positive; unintended effects 68% negative"], ["Individual disclosure", "Harmed patient", "Switch, caution, legal remedy, reconciliation", "Only 30-40% disclosed"]], "note": ""}], "points": ["제공자별 보고에 관한 문헌 62편 가운데 의도하지 않은 결과를 검토한 연구의 68%가 부정적 결과를 보고하였습니다.", "강의에서는 매사추세츠 심장수술 사망률이 2010년 이후 다시 오른 현상을 고위험 환자를 피하는 위험 선택으로 설명합니다.", "법으로 개별 공개를 의무화한 곳에서도 실제 공개율은 30-40%에 그치며, 이러한 낮은 공개율은 의료분쟁 책임만으로는 설명되지 않습니다."], "terms": [["Aggregate performance", "전체 성과"], ["Provider performance", "제공자별 성과"], ["Individual disclosure", "개별 공개"], ["Cream skimming", "위험 선택"]], "course": "pubh510"}, {"id": "p_rights_safety", "title": "Rights-based approach to safety", "kor": "권리 기반 접근은 규범적으로 설득력이 있으나 시행이 불완전하고 불균등합니다.", "week": "5w", "oneline": "WHO는 건강권에서 안전할 권리를 도출하고 2024년 환자안전권리헌장을 발표하였습니다. 헌장의 권리 가운데 알 권리와 불만 제기 권리에만 효과에 관한 근거가 일부 있습니다.", "diagram": [{"type": "flow", "items": [{"t": "Right to health (UN framework)"}, {"t": "Health care itself can harm"}, {"t": "Right to safety", "s": "WHO Charter 2024", "k": 1}, {"t": "Uneven use", "s": "favors higher income and education"}], "rel": ["plus", "implies", "in practice"]}], "points": ["WHO는 자문 기구라 권리를 집행할 수 없고 회원국에 권고할 수 있을 뿐입니다.", "알 권리의 실제 혜택은 소득과 학력이 높은 환자에게 편중되므로, 이 권리가 기존 안전 격차를 확대하는 역설이 생길 수 있습니다.", "불만 제기 권리는 시행 비용이 많이 들지 않아 베트남 같은 저소득 국가에서도 도입되었으나 안전 개선 효과의 근거는 매우 제한적입니다."], "terms": [["Right to know", "알 권리"], ["Duty of candor", "솔직 의무"], ["Patient Safety Rights Charter", "환자안전권리헌장"], ["Right to complain", "불만 제기 권리"]], "course": "pubh510"}, {"id": "p_price_admin", "title": "Prices and admin costs", "kor": "강의에서는 미국이 의료비 지출의 이상치인 원인을 과도한 가격과 행정비용으로 설명합니다.", "week": "6w", "oneline": "미국은 GDP의 약 18%를 의료에 지출하는 이상치이며, 낭비 추정에서 가장 큰 영역은 행정 복잡성과 가격 실패입니다. Cutler는 낭비를 잘못 배분된 치료, 높은 가격, 과도한 행정비용, 부정과 남용으로 나눕니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Misallocated treatments"}, {"t": "High prices"}, {"t": "Excessive administrative costs"}, {"t": "Fraud and abuse"}], "note": "Cutler's four forms of waste"}, {"type": "table", "head": ["2010 measure", "US", "Canada"], "rows": [["Central administration, % of hospital costs", "15.51", "7.40"], ["Hospital administration, % of hospital costs", "25.32", "12.42"], ["Hospital administration per capita (PPP $)", "667", "158"]], "note": "Eight-nation hospital administrative costs"}], "points": ["Cutler는 약값 차이가 가장 두드러진 국제 가격 차이이며 의사와 병원도 미국에서 더 많이 지급받는다고 설명합니다.", "Shrank 등의 낭비 추정은 연 7,600억에서 9,350억 달러이고 행정 복잡성이 2,656억 달러로 가장 큽니다.", "8개국 병원 행정비용 비교에서 미국은 병원 비용의 25.32%로 캐나다의 12.42%보다 약 두 배이며, 강의에서는 그 원인을 보험자가 여러 곳인 구조로 설명합니다."], "terms": [["administrative complexity", "행정 복잡성"], ["pricing failure", "가격 실패"], ["misallocated treatments", "잘못 배분된 치료"], ["single payer", "단일 지불자"], ["outlier", "이상치"]], "course": "pubh510"}, {"id": "p_myths", "title": "Five spending myths", "kor": "기술, 임종기 진료, 사회서비스, 환자 기대, 정부 보험은 미국의 초과 지출을 설명하지 못하는 통념입니다.", "week": "6w", "oneline": "강의에서는 공개 토론에서 자주 제기되는 다섯 가지 설명을 국가 간 비교 자료로 하나씩 검증합니다. 각 통념마다 반례가 되는 나라나 수치가 있어 설명력이 약합니다.", "diagram": [{"type": "table", "head": ["Misconception", "Test used in class", "Result"], "rows": [["Love of technology", "MRI and CT density vs spending", "Japan has more machines but spends about 7% of GDP vs about 18%"], ["End-of-life care", "Share of spending in last year or last 3 years", "US is among the lowest of the compared countries"], ["Social programs inadequate", "Social vs health spending by country", "Ireland, Japan, Canada, Australia, New Zealand spend like the US on social services but only about 7 to 9.5% on health"], ["Patients expect too much", "Belief that medicine can cure almost any illness", "US 34%, Canada 27%, Germany 11%; Canada spends less than both"], ["Too much government insurance", "Per-enrollee growth 2008 to 2021", "Private fastest, Medicare slower, Medicaid slowest"]], "note": "Each misconception is tested against cross-country data"}], "points": ["기술 선호가 원인이라는 통념은 일본이 미국보다 MRI와 CT 장비가 많은데도 GDP의 약 7%만 지출한다는 점으로 반증됩니다.", "환자 기대가 원인이라는 통념은, 현대 의학이 거의 모든 질병을 치료할 수 있다고 믿는 비율이 미국 34%, 캐나다 27%, 독일 11%인데도 캐나다가 독일보다 적게 지출한다는 점으로 반증됩니다.", "정부 보험이 원인이라는 통념은 2008년부터 2021년까지 가입자 1인당 지출이 민간 보험에서 가장 빠르게 증가하였다는 점으로 반증됩니다."], "terms": [["misconception", "통념"], ["end-of-life care", "임종기 진료"], ["social services", "사회서비스"], ["per-enrollee spending", "가입자 1인당 지출"]], "course": "pubh510"}, {"id": "p_cost_burden", "title": "Who bears high costs", "kor": "의료비가 상승하면 그 부담이 저소득층에 집중되며, 비용을 줄이려는 개입은 임종기 인구보다 지속 고비용 인구를 대상으로 하여야 합니다.", "week": "6w", "oneline": "Cutler는 의료비 상승이 소득 정체와 결합하여 불평등을 키운다고 논증합니다. Aldridge는 고비용 인구를 세 경과로 나누어 어느 집단에 개입하여야 비용이 줄어드는지 분석합니다.", "diagram": [{"type": "flow", "items": [{"t": "Medical costs rise", "s": "while incomes stagnate"}, {"t": "Behavioral response", "s": "drugs vs food and rent"}, {"t": "Three channels", "s": "fewer privately insured, public rationing, other programs crowded out", "k": 1}, {"t": "Wider disparities", "s": "low-income households lose most"}], "rel": ["+ stagnant income", "leads to", "through"]}, {"type": "grid", "numbered": false, "items": [{"t": "End of life: 11%"}, {"t": "Discrete high-cost event: 49%"}, {"t": "Persistently high cost: 40%"}], "note": "Aldridge: composition of the top 5% of spenders; persistent group is the main target"}], "points": ["의료비가 오르면 저소득 가구는 약 구입과 식비 지출 가운데 하나를 선택하는 방식으로 대응합니다.", "Cutler는 의료비 상승이 저소득층에 부담을 주는 경로로 민간보험 가입 감소, 공공 프로그램의 진료 제한, 다른 사회 프로그램 재원 감소의 세 가지를 제시합니다.", "상위 5% 지출자 중 임종기는 11%, 개별 고비용 사건은 49%, 지속 고비용은 40%이며 지속 고비용 집단이 표적 개입의 핵심입니다."], "terms": [["behavioral response", "행동 반응"], ["crowding out", "다른 지출의 밀려남"], ["regressive", "역진적"], ["persistently high costs", "지속 고비용"], ["targeted intervention", "표적 개입"]], "course": "pubh510"}, {"id": "p_price_volume", "title": "Price and volume control", "kor": "가격 협상의 효과는 이용량 통제나 예산 상한이 함께 시행되는지에 달려 있습니다.", "week": "6w", "oneline": "지출은 가격과 이용량의 곱이므로 가격만 낮추면 제공자가 이용량을 늘려 수입을 보전합니다. 프랑스, 독일, 일본은 모두 행위별수가를 유지하되 가격과 이용량을 서로 다른 방식으로 관리합니다.", "diagram": [{"type": "flow", "items": [{"t": "Cut price 20%", "s": "fee schedule or negotiation"}, {"t": "Provider raises volume", "s": "protects income", "k": 1}, {"t": "Spending falls less than expected", "s": "unless capped"}], "rel": ["causes", "offsets"]}, {"type": "table", "head": ["Country", "Price", "Volume"], "rows": [["France", "Negotiated aggressively", "Little control"], ["Germany", "Fee schedule negotiated within budget", "Budget caps; physician associations enforce volume"], ["Japan", "Single national fee schedule", "Billable volume and provider types set in the same document"]], "note": "Gusmano et al."}], "points": ["프랑스는 가격을 공격적으로 협상하지만 이용량 통제가 적습니다.", "독일은 질병금고와 의사 단체에 예산 상한을 두어 의사 단체가 이용량을 간접적으로 통제하게 합니다.", "일본은 수가를 정하는 문서에 청구 가능한 제공량과 서비스를 제공할 수 있는 기관의 조건을 함께 정하여 가격과 이용량을 함께 관리합니다."], "terms": [["fee-for-service", "행위별수가"], ["fee schedule", "수가표"], ["volume control", "이용량 통제"], ["budget cap", "예산 상한"], ["supplier-induced demand", "공급자 유발 수요"]], "course": "pubh510"}, {"id": "p_policy_choice", "title": "Cost-containment choices", "kor": "비용 억제 정책은 네 가지 목표로 분류되고, 각국의 정책 선택은 역사적 유산과 촉발 사건과 정책 규범의 변화에 따라 달라지며, 효과를 평가한 근거가 없는 정책군이 많습니다.", "week": "6w", "oneline": "Stadhouders 등은 정책을 예산, 가격 통제, 이용량 통제, 시장 지향 정책으로 나누고 41개 정책군 중 21개에서 평가를 찾지 못하였습니다. 질 높은 근거가 있는 정책은 본인부담, 관리의료 경쟁, 참조가격제, 제네릭 대체, 불법행위법 개혁입니다.", "diagram": [{"type": "table", "head": ["Primary goal", "Policy approaches classified"], "rows": [["Budgeting", "174"], ["Price controls", "331"], ["Volume controls", "762"], ["Market oriented policies", "990"]], "note": "Stadhouders classification of 2,250 approaches, 41 subgroups"}, {"type": "table", "head": ["Factor", "Example from class"], "rows": [["Historical legacies", "France, Japan, Germany lean on price controls; Canada and UK on volume controls; Netherlands, Switzerland, US on market oriented policies"], ["Catalytic events", "Insulin price rise leads to 2022 Inflation Reduction Act"], ["Changing policy norms", "Three reform waves: universal access, cost containment, then market-based reform"]], "note": "What shapes choices for cost constraints"}], "points": ["정책 선택을 결정하는 요인은 역사적 유산, 촉발 사건, 국제적으로 변하는 정책 규범입니다.", "평가가 없다는 사실은 근거가 아직 확보되지 않았음을 의미하므로, 효과가 없다는 평가 결과와 구별하여야 합니다.", "본인부담은 환자에게 비용을 이전하고 필요한 진료까지 줄일 수 있어 저소득층 접근에 부담이 됩니다."], "terms": [["historical legacies", "역사적 유산"], ["catalytic events", "촉발 사건"], ["reference pricing", "참조가격제"], ["cost sharing", "본인부담"], ["cost shifting", "비용 전가"]], "course": "pubh510"}, {"id": "p_vbp_pooling", "title": "Value-based care, pooled budgets", "kor": "가치 기반 구매와 예산 통합과 전국 지침은 재정 구조와 조직 통합과 지역 이행에 따라 결과가 달라지며 의료비 증가율을 낮춘다는 증거는 약합니다.", "week": "6w", "oneline": "Farahati는 미국의 다수 지불자 계약과 캐나다의 공적 재정과 인구 계획을 비교하되 인과 효과는 추정하지 않습니다. Stokes는 예산 통합의 전체 효과가 없다는 결과를, Conefrey는 전국 지침에 대한 지역 정책의 일치율이 낮다는 결과를 보고합니다.", "diagram": [{"type": "table", "head": ["", "United States", "Canada"], "rows": [["Financing", "Many payers; Medicare, Medicaid, commercial", "Provincial public plans"], ["Main tools", "Shared savings, bundled payments, pay-for-performance, capitation", "Population-level planning, outcome-based funding, quality-based procedures"], ["Coverage gaps noted", "Penalties concentrated in safety-net hospitals", "Extended benefits such as drugs and dental"], ["Caution", "System indicators are not causal effects of programs", "Same caution applies"]], "note": "Farahati et al."}, {"type": "table", "head": ["Study", "Question", "Finding"], "rows": [["Stokes (Better Care Fund)", "Does pooling health and social care budgets cut hospital use?", "No overall effect on 7 indicators; multimorbid patients' bed-days rose 0.164 days more"], ["Conefrey (EBI programme)", "Do local policies follow national de-adoption guidance?", "49% matched overall; 72% for do-not-do, 43% for restricted access"]], "note": "Why implementation matters"}], "points": ["미국은 공유절감, 묶음지불, 성과연동지불로 제공자의 유인을 조정하고 캐나다는 공적 재정과 인구 단위 계획을 사용합니다.", "Better Care Fund는 7개 병원 지표 모두에서 전체 효과가 없었고 여러 질환을 함께 앓는 환자의 재원일수가 조금 늘었습니다.", "잉글랜드 근거기반개입 프로그램에서 지역 정책의 49%만 국가 권고와 일치하였습니다."], "terms": [["value-based purchasing", "가치 기반 구매"], ["pooled budget", "통합 예산"], ["multimorbidity", "복합이환"], ["de-adoption", "진료 중단"], ["commissioning", "의료서비스 구매"]], "course": "pubh510"}, {"id": "p_fineberg_barriers", "title": "Fineberg's obstacles to prevention", "kor": "예방의 12가지 장애요인 가운데 세 가지는 모든 국가에 공통이고 네 가지는 미국에서 특히 강합니다.", "week": "7w", "oneline": "Fineberg는 예방이 원칙으로는 환영받지만 실천 단계에서는 저항에 부딪히는 이유를 12가지로 정리하였습니다. 강의에서는 이 12가지 가운데 어느 요인이 모든 국가에 공통이고 어느 요인이 미국에서 특히 강한지를 구분하였습니다.", "diagram": [{"type": "table", "head": ["Group", "Obstacles discussed in the lecture", "Why it matters"], "rows": [["Consistent in every country", "Long time delay; success is invisible; changing circumstances", "Apply to public and private systems alike"], ["Especially strong in the US", "Corporate campaign financing; individualism; low salience of invisible threats; choice and high social mobility", "US campaigns last about 18 months vs. about 2; collective benefit is a weak argument"]], "note": "Fineberg lists 12 obstacles in total; the lecture sorted these seven by country pattern."}, {"type": "flow", "items": [{"t": "Benefit appears after 5-10+ years"}, {"t": "Average US enrollment is 2.5 years"}, {"t": "Insurer invests only in ~3-year payoffs", "k": 1}, {"t": "Later benefit goes to the next insurer"}], "rel": ["but", "so", "because"]}], "points": ["모든 국가에 공통인 요인은 긴 시간 지연, 성공이 보이지 않음, 변화하는 상황에 대한 지속적 적응입니다.", "미국에서 특히 강한 요인은 기업의 선거자금, 개인주의, 보이지 않는 위협의 낮은 현저성, 선택 중시와 높은 사회적 이동성입니다.", "미국인이 같은 건강보험에 가입하는 기간이 평균 2.5년이므로 보험자는 약 3년 안에 편익이 나타나는 개입에만 투자할 유인이 있습니다."], "terms": [["long time delay", "긴 시간 지연"], ["success is invisible", "성공이 보이지 않음"], ["changing circumstances", "변화하는 상황"], ["low salience", "낮은 현저성"], ["failing to internalize the benefits", "편익을 내부화하지 못함"]], "course": "pubh510"}, {"id": "p_prevention_value", "title": "Judging the value of prevention", "kor": "예방 개입은 대부분 비용 대비 효과적이지만 비용을 절감하지는 않으며, 치료에는 요구하지 않는 순절감을 예방에만 요구하는 기준은 이중 잣대입니다.", "week": "7w", "oneline": "예방 격언 때문에 사람들은 예방으로 순절감을 얻을 것이라고 과장되게 기대합니다. 그러나 NHS의 검토 결과와 고혈압 관리, 금연 사례에 비추어 보면 예방도 치료처럼 건강 개선과 비용만큼의 가치를 기준으로 평가하여야 합니다.", "diagram": [{"type": "table", "head": ["NHS 2017 review of 200 interventions", "Count", "Share"], "rows": [["Saved money", "30", "15%"], ["Cost-effective but not cost-saving", "150", "75%"], ["Neither improved health nor saved money", "about 20", "10%"]], "note": "A must-save-money test would classify the 150 as failures."}, {"type": "flow", "items": [{"t": "Smoking falls"}, {"t": "Smokers die quickly, so people live longer", "k": 1}, {"t": "More years of care use"}, {"t": "Health spending rises, but so do health and working years"}], "rel": ["leads to", "so", "while"]}], "points": ["NHS가 검토한 200개 개입 가운데 30개(15퍼센트)만 비용을 절감하였고 150개(75퍼센트)는 비용 대비 효과적이었으나 절감하지는 않았습니다.", "고혈압 관리는 40년분의 약값을 지출한 뒤에야 사건을 예방하고, 예방 대상 사건은 환자가 빠르게 적은 비용으로 사망하는 경우가 많아 의료체계의 비용이 줄지 않습니다.", "흡연이 감소하면 사람들이 더 오래 생존하여 의료비가 증가하지만, 사람들이 건강한 상태로 계속 일할 수 있어 큰 사회적 편익이 발생합니다."], "terms": [["cost-effective", "비용 대비 효과적"], ["cost-saving", "비용 절감"], ["double standard", "이중 잣대"], ["net financial return", "순재정이익"]], "course": "pubh510"}, {"id": "p_prevention_equity", "title": "Prevention and inequity", "kor": "예방 개입의 효과는 집단에 따라 달라지며, 미국의 코로나19 피해는 사회경제 구조, 불균등하게 분포한 유행 이전의 나쁜 건강, 공중보건 투자 감소가 함께 작용한 결과입니다.", "week": "7w", "oneline": "공공 교육 캠페인은 교육 수준이 높은 집단에서만 큰 효과를 거두어 격차를 키우고, 유해 제품에 대한 조세는 소득이 낮은 집단에 가장 큰 건강 편익을 가져옵니다. Galea는 팬데믹 피해가 사회경제 구조, 유행 이전의 나쁜 건강, 공중보건 투자 감소에서 비롯되었다고 설명합니다.", "diagram": [{"type": "table", "head": ["", "Public education", "Taxation"], "rows": [["Who benefits most", "Higher-education groups (high uptake)", "Low-income households"], ["Who changes little", "Lower-education groups", "High-income payers (just pay the tax)"], ["Example", "Smoking falls among college graduates, barely among high school or less", "200% sales tax on a harmful product"], ["Side effect", "SES disparity widens", "Some consumption moves to the black market"]], "note": "Both create disparities, but in different directions and with different evaluations."}, {"type": "grid", "numbered": true, "items": [{"t": "Social and economic structures (working from home depended on income)"}, {"t": "Poor pre-pandemic health, unevenly distributed"}, {"t": "Decades of reduced investment in public health"}], "note": "Galea's three conditions behind the US failure."}], "points": ["금연 캠페인 이후 대졸 이상 집단의 흡연율은 크게 감소하였으나 고졸 이하 집단은 거의 변하지 않았습니다.", "유해 제품에 조세를 부과하면 가격이 상승하여 저소득 가구는 유해 행동을 지속할 여력이 없으므로 가장 큰 건강 편익을 얻고, 고소득자는 행동을 바꾸지 않습니다.", "건강보험이 없거나 보험 가입이 불안정한 사람은 기저질환을 모른 채 고위험군에 속해 있었고, 이처럼 발견되지 않은 만성질환은 경제적 취약 집단과 인종적 소수 집단에 집중되었습니다."], "terms": [["differential take up", "집단별 수용 정도 차이"], ["social and economic structures", "사회경제 구조"], ["health equity", "건강 형평"], ["comorbidities", "기저질환"], ["MAHA", "Make America Healthy Again"]], "course": "pubh510"}, {"id": "p_uspstf_screening", "title": "USPSTF grades and screening", "kor": "A와 B 등급은 본인부담 없는 보장의 하한이고, 선별검사가 확대되면 질병 여부가 확정되지 않은 대기 환자가 발생할 수 있습니다.", "week": "7w", "oneline": "USPSTF는 과학적 효과만 평가하고, ACA는 A와 B 등급 서비스를 본인부담 없이 보장하도록 정합니다. 선별검사가 확대되면 정상도 질병도 아닌 중간 상태의 대기 환자가 생길 수 있습니다.", "diagram": [{"type": "table", "head": ["Grade", "Meaning", "Coverage under PPACA"], "rows": [["A", "High certainty of substantial net benefit", "Covered with no cost sharing"], ["B", "Moderate net benefit (high or moderate certainty)", "Covered with no cost sharing"], ["C", "Small net benefit; selective offer", "Not mandated; patient may share cost; insurers may cover"], ["D", "No net benefit or harm outweighs benefit; discourage", "Not mandated; not prohibited"], ["I", "Evidence insufficient", "Not mandated; not prohibited"]], "note": "A and B are a floor, not a ceiling (Siu)."}, {"type": "flow", "items": [{"t": "Positive newborn screen"}, {"t": "Repeat testing", "k": 1}, {"t": "Over 90%: false positive"}, {"t": "Under 1%: clear disease"}, {"t": "Rest: inconclusive, patients-in-waiting"}], "rel": ["then", "most often", "rarely", "otherwise"]}], "points": ["C 등급은 작은 순편익을 인정하는 선택적 권고이고 D 등급은 사용을 억제하라는 권고이며 I는 근거 불충분의 선언입니다.", "A와 B 등급의 보장은 하한이므로 지불자는 재량으로, 입법자는 입법으로 다른 등급의 서비스도 보장할 수 있습니다.", "신생아 선별검사의 재검사에서 90퍼센트가 넘는 사례는 위양성으로 확인되고 1퍼센트 미만만 분명한 질병이며, 질병 여부가 확정되지 않은 가족은 예방 조치를 줄이기 어렵습니다."], "terms": [["USPSTF", "미국 예방서비스 태스크포스"], ["cost sharing", "본인부담"], ["patients-in-waiting", "대기 환자"], ["false positive", "위양성"], ["floor, not ceiling", "하한이지 상한이 아님"]], "course": "pubh510"}, {"id": "p_policy_silos", "title": "Policy silos, social needs", "kor": "정부는 전문 분야별로 부처와 위원회를 나누어 두므로, 건강의 사회적 결정요인에 관한 정책을 각 부처가 별도로 결정합니다.", "week": "7w", "oneline": "Artiga와 Hinton은 보건의료 외에 다섯 범주의 건강 관련 사회적 필요를 구분하였습니다. 전문화와 예산 경쟁 때문에 범주마다 정책 담당자가 분리되어 있으며, 일차의료 의사가 사회서비스를 조정하는 비율은 국가마다 크게 다릅니다.", "diagram": [{"type": "grid", "numbered": true, "items": [{"t": "Economic stability"}, {"t": "Physical environment"}, {"t": "Education"}, {"t": "Food"}, {"t": "Community and social context"}], "note": "Artiga and Hinton's five categories of health-related social needs; health care is a separate policy area."}, {"type": "flow", "items": [{"t": "Ministries and committees divide work by expertise"}, {"t": "Each competes for limited annual budgets", "k": 1}, {"t": "Different vocabulary, programs kept private"}, {"t": "Policy silos: little cross-category contact"}], "rel": ["and", "so",   const b=el('div',{class:'opts'});

function ans(x,i){
  if(run.done)return;run.done=true;
  const ok=i===x.answer;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const j=+b.dataset.i;if(j===x.answer)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  if(!run.asked.has(x.id)){
    run.asked.add(x.id);
    const s=S(x.id)||{box:-1,seen:0,wrong:0};s.seen++;
    s.lastOk=ok;if(ok){s.box=Math.min(BASE.length-1,s.box+1);run.ok++}else{s.box=0;s.wrong++;s.lastWrong=Date.now();run.miss.add(x.id);run.q.splice(Math.min(run.q.length,run.i+4),0,x.id)}
    if(s.box<0)s.box=0;s.due=t0()+gap(x.course,s.box)*DAY;store.items[x.id]=s;save();
  }
  const fb=document.getElementById('fb');

  const cc=CONCEPTS.find(k=>k.id===x.concept), last=run.i===run.q.length-1;
  fb.append(el('div',{class:'bar'},el('button',{id:'next',class:'primary',onclick:nxt},last?'결과':'다음'),cc?el('button',{onclick:()=>go(cur.course,'map',cc.id)},'개념 보기'):''));
